<meta charset="utf-8">
<title>Retail e PPI sull'oro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: banco del trader. Prossima release e quanto muove, cosa funziona, il grafico di oggi coi livelli, il simulatore dei pips. */
:root{
  --bg:#f4f3ef; --panel:#ffffff; --ink:#17191c; --ink2:#3b4047; --mute:#6b7178; --line:#e1dfd8; --grid:#ecebe6;
  --accent:#9c6a12; --soft:#eeece6; --up:#1d7f54; --down:#bf3b35;
  --good:#1d7f54; --warn:#9a6a00; --bad:#bf3b35;
  --f-disp:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --f-body:"Public Sans",ui-sans-serif,system-ui,sans-serif; --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111316; --panel:#1a1d21; --ink:#eeebe4; --ink2:#c9c6bf; --mute:#979ca3; --line:#2c3036; --grid:#23272c;
  --accent:#e3ab48; --soft:#22262b; --up:#4cc58c; --down:#f2716a;
  --good:#4cc58c; --warn:#e3ab48; --bad:#f2716a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111316; --panel:#1a1d21; --ink:#eeebe4; --ink2:#c9c6bf; --mute:#979ca3; --line:#2c3036; --grid:#23272c;
  --accent:#e3ab48; --soft:#22262b; --up:#4cc58c; --down:#f2716a;
  --good:#4cc58c; --warn:#e3ab48; --bad:#f2716a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:920px;margin:0 auto;padding-block:24px 56px;display:grid;gap:34px}
h1,h2{font-family:var(--f-disp);margin:0;text-wrap:balance}
h1{font-weight:800;font-size:clamp(28px,6vw,42px);line-height:1.06;letter-spacing:-.01em}
h2{font-weight:700;font-size:clamp(20px,3.4vw,25px);line-height:1.15}
p{margin:0}
.eyebrow{font:600 12px/1 var(--f-num);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.lead{color:var(--ink2);max-width:64ch}
.small{font-size:13.5px;color:var(--mute)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header,section{display:grid;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px;min-width:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* il trade, in ordine di tempo */
.tl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.tl{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ts{border-top:3px solid var(--line);padding-top:8px;display:grid;gap:2px;min-width:0}
.ts.hl{border-top-color:var(--accent)}
.ts span{font:600 13px var(--f-num);color:var(--mute)}
.ts b{font-size:17px}
.ts em{font-style:normal;font-size:13.5px;color:var(--ink2)}
.odds{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.waffle{display:grid;grid-template-columns:repeat(10,18px);gap:4px}
.waffle i{width:18px;height:18px;border-radius:4px;background:var(--bad);opacity:.7}
.waffle i.y{background:var(--good);opacity:1}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.pay div{background:var(--bg);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.pay span{font-size:13px;color:var(--mute)}
.pay b{font:700 22px/1.2 var(--f-num);font-variant-numeric:tabular-nums}
.g{color:var(--good)} .r{color:var(--bad)}

/* campi numerici */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.fields label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.fields input,.fields select{font:500 15px var(--f-num);width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;padding:6px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.chip b{font-family:var(--f-num)}
.chip.big{font-size:16px;padding:9px 13px;border-color:var(--accent)}
.chip.big b{font-size:18px}
.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:12px/1.4 var(--f-num);padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%)}

/* simulatore */
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{font:600 13.5px var(--f-body);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);cursor:pointer}
.presets button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sim{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:720px){.sim{grid-template-columns:1fr}}
.sliders{display:grid;gap:14px}
.sl{display:grid;gap:4px}
.sl .top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.sl .top b{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sl input[type=range]{width:100%;accent-color:var(--accent)}
.sl em{font-style:normal;font-size:12.5px;color:var(--mute)}
.out{background:var(--bg);border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.out .big{font:800 44px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.out .band{font:600 14px var(--f-num);color:var(--ink2)}
.out .mult{font:500 13px var(--f-num);color:var(--mute)}
.can{display:grid;gap:6px;margin-top:4px}
.can div{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;font-size:14px;color:var(--ink2)}
.can i{font-style:normal;font-weight:700}
footer{color:var(--mute);font-size:12.5px;max-width:72ch}
.yt{border-collapse:collapse;width:100%;font-size:14px;min-width:320px}
.yt th,.yt td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.yt th{font:600 11.5px var(--f-num);letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.yt td{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.yt .bar{display:inline-block;width:70px;height:8px;border-radius:4px;background:var(--grid);margin-right:8px;vertical-align:middle;overflow:hidden}
.yt .bar i{display:block;height:100%;background:var(--accent)}
/* minimal: un numero grande, una riga, un grafico */
.wrap{gap:44px}
.hero{display:grid;gap:14px}
.hero .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .when{font:600 14px var(--f-num);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.hero .cd{font:600 14px var(--f-num);color:var(--mute)}
.hero .big{font:800 clamp(64px,17vw,112px)/.9 var(--f-disp);letter-spacing:-.02em}
.hero .why{color:var(--ink2);font-size:15.5px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:3px;align-content:start}
.kpi b{font:700 clamp(24px,5.4vw,32px)/1.05 var(--f-num);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--mute);line-height:1.3}
@media (max-width:560px){.kpis{grid-template-columns:1fr}.kpi{grid-template-columns:auto 1fr;align-items:center;gap:12px}.kpi b{min-width:96px}}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:600 13px var(--f-num);color:var(--ink2)}
.flow span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.flow i{color:var(--mute);font-style:normal}
.sec{display:grid;gap:12px}
.sec .lead1{font:700 clamp(22px,4.6vw,28px)/1.15 var(--f-disp)}
.one{font-size:15px;color:var(--ink2)}
.one b{color:var(--ink)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px}
.strip button{flex:none;min-width:60px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 7px;font:600 11.5px var(--f-num);color:var(--mute);cursor:pointer;display:grid;gap:1px;text-align:center}
.strip button b{font-size:13.5px;color:var(--ink)}
.strip button.w b{color:var(--good)} .strip button.l b{color:var(--bad)}
.strip button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.state{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.state b.ok,.state b.hot{font:800 30px/1 var(--f-disp)}
.state .ok{color:var(--good)} .state .hot{color:var(--bad)}
.state span{font-size:14px;color:var(--ink2)}
details.mt5 summary,details.more summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14.5px}
details.more{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.more[open]{display:grid;gap:12px}
/* la volatilità nel tempo */
.vleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink2)}
.vleg i{display:inline-block;width:16px;height:2.5px;border-radius:2px;vertical-align:middle;margin-right:6px}
.vleg i.box{height:10px;width:12px;background:var(--bad);opacity:.25}
.vleg i.dot{width:7px;height:7px;border-radius:50%;background:var(--ink2);opacity:.6}
.facts{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14.5px;color:var(--ink2)}
.facts b{color:var(--ink)}
.h3{font:700 19px/1.2 var(--f-disp);margin:8px 0 0}
.cbar{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;background:var(--panel)}
.cbar i{display:block;height:100%}
.cbar .in,.cleg .in{background:var(--accent)} .cbar .su,.cleg .su{background:var(--ink2)} .cbar .giu,.cleg .giu{background:var(--line)}
.cleg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13.5px;color:var(--ink2)}
.cleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cleg b{font-family:var(--f-num);color:var(--ink)}
.rpbar{display:flex;gap:8px;align-items:stretch;min-width:0}
.rpbar select{font:600 14px var(--f-num);padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink)}
.rpbar .strip{flex:1;min-width:0}
.rpctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rpctl>button{font:700 14px var(--f-body);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.rpctl>button.play{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.yrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px}
.yrs button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 2px;display:grid;gap:3px;justify-items:center;cursor:pointer;font:600 11px var(--f-num);color:var(--mute)}
.yrs button i{display:block;width:70%;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--good) var(--p),var(--line) var(--p))}
.yrs button b{font-size:12px;color:var(--ink)}
.yrs button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.next{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:720px){.next{grid-template-columns:1fr}}
.when b{display:block;font:700 26px/1.15 var(--f-disp)}
.when .cd{font:600 15px var(--f-num);color:var(--accent);margin-top:4px}
.titles{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.titles span{font:600 12px/1 var(--f-body);padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.verdict{display:grid;gap:10px}
.vrow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:baseline;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.vrow:last-child{border-bottom:0;padding-bottom:0}
.vrow span{font-size:13px;color:var(--mute)}
.vrow b{font:700 20px/1.2 var(--f-num)}
.vrow em{font-style:normal;font-size:13px;color:var(--ink2);display:block}
.gauge{width:100%;height:auto;display:block}
.cap{font:600 12.5px var(--f-num);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
</style>
<div class="wrap">
<section class="hero" id="hero" aria-label="Prossima release"></section>

<section class="sec" aria-labelledby="h-ex">
  <h2 id="h-ex">Le ultime release</h2>
  <p class="one">Quanto si sono mosse, contro la stima fatta <b>prima</b>. Tocca una release.</p>
  <div class="strip" id="strip" role="group" aria-label="Scegli una release"></div>
  <div class="panel" id="prec"></div>
</section>

<section class="sec" aria-labelledby="h-day">
  <h2 id="h-day">Oggi: fin dove arriva l'oro</h2>
  <div class="panel" id="oggi"></div>
</section>

<details class="more" id="simbox"><summary>Per capire: perché Retail e PPI fanno più pips di prima</summary><div id="sim"></div></details>

<footer id="foot"></footer>
</div>
<script>
const D = __DATA__;
// ---------- comuni ai due siti
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SVGNS = "http://www.w3.org/2000/svg";
const mk = (t, a, txt) => { const e = document.createElementNS(SVGNS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
const it0 = x => Math.round(x).toLocaleString("it-IT");
const it2 = x => x.toLocaleString("it-IT", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const dec = (v, d = 2) => v.toFixed(d).replace(".", ",");
const pct = v => Math.round(v * 100) + "%";
const sgnR = v => (v > 0 ? "+" : v < 0 ? "−" : "") + dec(Math.abs(v)) + "R";
const pm = e => "±" + Math.round((Math.exp(e) - 1) * 100) + "%";
const pipsTxt = d => (d > 0 ? "+" : d < 0 ? "−" : "±") + it0(Math.abs(d) * 10);
const median = a => { const b = a.filter(v => v != null && !isNaN(v)).sort((x, y) => x - y), m = b.length >> 1; return b.length ? (b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2) : null; };
const pOne = (k, n) => { const z = (k - .5 - n / 2) / Math.sqrt(n / 4), t = 1 / (1 + .3275911 * z / Math.SQRT2), e = t * (.254829592 + t * (-.284496736 + t * (1.421413741 + t * (-1.453152027 + t * 1.061405429)))) * Math.exp(-z * z / 2); return z > 0 ? e / 2 : 1 - e / 2; };


// ---------- oggi: candele con i livelli sopra (H-X28, metodo scelto)
function oggi(LV, el) {
  const G = LV && LV.giorno, O = G && G.oggi;
  if (!el) return;
  if (!O || !O.candele || !O.candele.length) { el.innerHTML = `<p class="small">Livelli del giorno non disponibili.</p>`; return; }
  const Q = G.metodi[G.scelto]["2023-26"];
  const key = r => r.tb + "|" + (r.ub ?? "") + "|" + (r.pb ?? "");
  const T = new Map(O.tabella.map(r => [key(r), r])), TA = new Map(O.tabella_A.map(r => [r.tb, r]));
  const start = new Date(new Date(O.inizio + "T00:00:00Z").getTime() - 2 * 3600e3), end = new Date(start.getTime() + 24 * 3600e3);
  const rome = (d, o) => d.toLocaleString("it-IT", {timeZone: "Europe/Rome", ...o});
  const hhmm = k => rome(new Date(start.getTime() + (k + 1) * 3600e3), {hour: "2-digit", minute: "2-digit"});
  function levels(k, H, L, P) {
    const sc = O.apertura / 100 * O.S_pct, tb = Math.floor(k / O.fascia_ore);
    const used = (H - L) / sc, pos = H > L ? (P - L) / (H - L) : .5;
    const ub = used < .5 ? 0 : used < 1 ? 1 : 2, pb = pos < 1 / 3 ? 0 : pos < 2 / 3 ? 1 : 2;
    const kk = O.metodo === "A" ? tb + "||" : O.metodo === "B" ? tb + "|" + ub + "|" : tb + "|" + ub + "|" + pb;
    const r = T.get(kk), a = TA.get(tb), s = r && r.n >= O.min_n ? r : a;
    const mu = r && r.nu >= O.min_n ? r.mu : a.mu, mv = r && r.nv >= O.min_n ? r.mv : a.mv;
    return {su90: H + s.qu * sc, giu90: L - s.qv * sc, suT: H + mu * sc, giuT: L - mv * sc, pu: s.pu, pv: s.pv};
  }
  el.innerHTML = `
    <div class="chips" id="lvChips"></div>
    <div class="chart" id="lvChart"></div>
    <p class="small" id="lvNote"></p>
    <details class="mt5"><summary>Usa i prezzi del tuo MT5</summary><div class="fields">
      <label>Prezzo adesso<input id="lvP" type="number" step="0.01" inputmode="decimal" value="${O.prezzo.toFixed(2)}"></label>
      <label>Massimo di oggi<input id="lvH" type="number" step="0.01" inputmode="decimal" value="${O.massimo.toFixed(2)}"></label>
      <label>Minimo di oggi<input id="lvL" type="number" step="0.01" inputmode="decimal" value="${O.minimo.toFixed(2)}"></label>
      <label>Ora (Italia)<select id="lvK">${Array.from({length: 24}, (_, k) => `<option value="${k}"${k === O.k ? " selected" : ""}>dopo le ${hhmm(k)}</option>`).join("")}</select></label>
    </div></details>`;
  const $ = id => el.querySelector("#" + id);
  const draw = () => {
    const P = +$("lvP").value, H = +$("lvH").value, L = +$("lvL").value, k = +$("lvK").value;
    if (![P, H, L].every(x => isFinite(x) && x > 0) || H < L || P > H + 1e-9 || P < L - 1e-9) {
      $("lvChips").innerHTML = `<span class="chip">Controlla i numeri: il prezzo deve stare fra il minimo e il massimo di oggi.</span>`; return; }
    const v = levels(k, H, L, P);
    $("lvChips").innerHTML = `<span class="chip">↑ nuovo massimo oggi <b>${pct(v.pu)}</b></span><span class="chip">↓ nuovo minimo oggi <b>${pct(v.pv)}</b></span>`;
    chart($("lvChart"), {P, H, L}, v);
    $("lvNote").innerHTML = `Oltre il "9 su 10" l'oro va solo 1 giorno su 10 (nel 2023–26 ha tenuto ${Math.round(Q.cop90_su * 100)} volte su 100). Usalo per take profit e stop. Aggiornato alle ${rome(new Date(new Date(O.ultima_candela_utc.replace(" ", "T")).getTime() + 3600e3), {hour: "2-digit", minute: "2-digit"})}.`;
  };
  function chart(host, s, v) {
    // candele una dopo l'altra come in MT5/TradingView: niente buchi per la notte o il weekend
    const W = Math.max(320, Math.min(900, host.clientWidth || 640)), narrow = W < 520, H = narrow ? 360 : 400, Lm = narrow ? 40 : 46, R = narrow ? 118 : 170, T = 12, B = 26;
    const C = O.candele.map(c => ({t: new Date(c[0]).getTime(), o: c[1], h: c[2], l: c[3], c: c[4]}));
    const lastEnd = C[C.length - 1].t + 3600e3, friday = new Date(start.getTime() + 2 * 3600e3).getUTCDay() === 5;
    const dayEnd = start.getTime() + (friday ? 23 : 24) * 3600e3, futuro = Math.max(0, Math.round((dayEnd - lastEnd) / 3600e3));
    const slots = C.length + futuro, x = i => Lm + (i + .5) / slots * (W - Lm - R), xe = i => Lm + i / slots * (W - Lm - R);
    const iOggi = Math.max(0, C.findIndex(c => c.t >= start.getTime())), iNow = C.length;
    const lo0 = Math.min(...C.map(c => c.l), v.giu90, v.giuT, s.L), hi0 = Math.max(...C.map(c => c.h), v.su90, v.suT, s.H), pad = (hi0 - lo0) * .04;
    const lo = lo0 - pad, hi = hi0 + pad, y = p => T + (hi - p) / (hi - lo) * (H - T - B);
    const svg = mk("svg", {viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Candele H1 di ieri e di oggi con i livelli fino a fine giornata"});
    const step = [1, 2, 5, 10, 20, 25, 50, 100].find(st => (hi - lo) / st <= 6) || 100;
    for (let p = Math.ceil(lo / step) * step; p <= hi; p += step) {
      svg.append(mk("line", {x1: Lm, x2: W - R, y1: y(p), y2: y(p), stroke: css("--grid")}));

// ---------- quanto era precisa la stima della candela, release per release (stessa regola del sito, solo dati di prima)
function bandTest(evs, N) {
  const q = (a, p) => { const s = a.slice().sort((x, y) => x - y), i = (s.length - 1) * p, f = Math.floor(i); return s[f] + (s[Math.min(f + 1, s.length - 1)] - s[f]) * (i - f); };
  const P = [];
  evs.forEach((e, i) => { if (i < N) return; const prev = evs.slice(i - N, i).map(x => x.pct);
    const lo = q(prev, .25) / 100 * e.px * 10, md = q(prev, .5) / 100 * e.px * 10, hi = q(prev, .75) / 100 * e.px * 10;
    P.push({t: e.t, y: e.y, v: e.pips, lo, md, hi, in: e.pips >= lo && e.pips <= hi}); });
  const last = evs.slice(-N).map(x => x.pct);

  const since = y0 => { const g = P.filter(p => p.y >= y0); return {n: g.length, k: g.filter(p => p.in).length, sopra: g.filter(p => p.v > p.hi).length, sotto: g.filter(p => p.v < p.lo).length}; };
  return {P, next, since};
}

  const B = bandTest(evs, N), P = B.P, nx = B.next(price), rc = B.since(2023), ok = rc.n && rc.k / rc.n >= .4 && rc.k / rc.n <= .6;
  const per = perAnno(P), tot = {n: P.length, k: P.filter(p => p.in).length};
  host.innerHTML = `
    <div class="chips"><span class="chip big">Prossima ${name}: <b>${it0(nx.md)} pips</b> · metà delle volte <b>${it0(nx.lo)}–${it0(nx.hi)}</b></span></div>

      tip.hidden = false; tip.style.left = Math.min(r.width - 90, Math.max(90, x(p.t) * r.width / W)) + "px"; tip.style.top = (y(p.v) * r.height / H) + "px"; };
    svg.addEventListener("pointermove", show); svg.addEventListener("pointerdown", show);
    svg.addEventListener("pointerleave", () => { tip.hidden = true; hl.setAttribute("opacity", 0); });
    ch.innerHTML = ""; ch.append(svg, tip);
  };
  draw(); let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(draw, 150); });
}


// ---------- quante volte la candela è caduta dentro la stima, più grande o più piccola
function contaBar(P) {
  const n = P.length, k = P.filter(p => p.in).length, su = P.filter(p => p.v > p.hi).length, giu = n - k - su, w = v => (100 * v / n).toFixed(1) + "%";
  const d10 = v => Math.round(10 * v / n);
  return `<div class="cbar" role="img" aria-label="Dentro ${k}, più grande ${su}, più piccola ${giu} su ${n}">
      <i class="giu" style="width:${w(giu)}"></i><i class="in" style="width:${w(k)}"></i><i class="su" style="width:${w(su)}"></i></div>
    <div class="cleg"><span><i class="giu"></i>più piccola <b>${d10(giu)} su 10</b></span><span><i class="in"></i>dentro <b>${d10(k)} su 10</b></span><span><i class="su"></i>più grande <b>${d10(su)} su 10</b></span></div>`;
}
