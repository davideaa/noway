<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-labelledby="t d">
  <title id="t">Confronto dei due concept di marchio</title>
  <desc id="d">A sinistra il concept Plateau, a destra il concept Profondità, ciascuno grande e piccolo.</desc>
  <rect width="820" height="300" fill="#080b0e"/>
  <text x="32" y="44" fill="#939fa9" font-family="'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="1.5">A · PLATEAU</text>
  <text x="420" y="44" fill="#c8fa72" font-family="'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="1.5">B · PROFONDITÀ (CONSIGLIATO)</text>
  <g transform="translate(32 70) scale(4)">
    <path d="M5 29 H27" fill="none" stroke="#939fa9" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M5 25 L14.5 8 H27" fill="none" stroke="#c8fa72" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(420 70) scale(4)">
    <path fill="#c8fa72" d="M3 4.8 L27 7.7 L27 8.9 L3 9.2 Z M3 13.8 L27 10.86 L27 12.06 L3 18.2 Z M3 22.8 L27 14.02 L27 15.22 L3 27.2 Z"/>
  </g>
  <g transform="translate(200 90)"><path d="M5 29 H27" fill="none" stroke="#939fa9" stroke-width="1.6" stroke-linecap="round"/><path d="M5 25 L14.5 8 H27" fill="none" stroke="#c8fa72" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(200 140) scale(.5)"><path d="M5 29 H27" fill="none" stroke="#939fa9" stroke-width="1.6" stroke-linecap="round"/><path d="M5 25 L14.5 8 H27" fill="none" stroke="#c8fa72" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(600 90)"><path fill="#c8fa72" d="M3 4.8 L27 7.7 L27 8.9 L3 9.2 Z M3 13.8 L27 10.86 L27 12.06 L3 18.2 Z M3 22.8 L27 14.02 L27 15.22 L3 27.2 Z"/></g>
  <g transform="translate(600 140)"><path fill="#c8fa72" d="M2.5 2.8 L13.5 4.06 L13.5 5.06 L2.5 5.2 Z M2.5 6.8 L13.5 5.81 L13.5 6.81 L2.5 9.2 Z M2.5 10.8 L13.5 7.55 L13.5 8.55 L2.5 13.2 Z"/></g>
  <text x="32" y="236" fill="#939fa9" font-family="'DejaVu Sans', sans-serif" font-size="13">Sale e si appiattisce: «un plateau, non un picco».</text>
  <text x="32" y="256" fill="#939fa9" font-family="'DejaVu Sans', sans-serif" font-size="13">Legge come grafico; parente stretto delle icone.</text>
  <text x="420" y="236" fill="#939fa9" font-family="'DejaVu Sans', sans-serif" font-size="13">Tre traiettorie (tre strategie) che entrano in profondità.</text>
  <text x="420" y="256" fill="#939fa9" font-family="'DejaVu Sans', sans-serif" font-size="13">È la scena 3D e il movimento del sito, in un segno.</text>
</svg>
