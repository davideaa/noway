<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Portfolio Algo Manager</title>
  <desc id="d">Marchio a tre traiettorie lime su fondo quasi nero, con il nome provvisorio e il sottotitolo: strategie algoritmiche sull'oro, metodo e rischio.</desc>
  <defs>
    <radialGradient id="alone" cx="0.76" cy="0.08" r="0.62" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#3c5727" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#1b2820" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#080b0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="filo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8fa72" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#c8fa72" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#c8fa72" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c8fa72" stop-opacity="0"/>
    </linearGradient>
    <pattern id="reticolo" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#252e34" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#080b0e"/>
  <rect width="1200" height="630" fill="url(#reticolo)" opacity="0.55"/>
  <rect width="1200" height="630" fill="url(#alone)"/>
  <rect x="0" y="0" width="1200" height="1" fill="url(#filo)"/>

  <!-- marchio Profondità, griglia 32 ingrandita 4,5 volte -->
  <g transform="translate(96 108) scale(4.5)">
    <path fill="#c8fa72" d="M3 4.8 L27 7.7 L27 8.9 L3 9.2 Z M3 13.8 L27 10.86 L27 12.06 L3 18.2 Z M3 22.8 L27 14.02 L27 15.22 L3 27.2 Z"/>
  </g>

  <!-- eyebrow -->
  <text x="96" y="312" fill="#939fa9" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="500" letter-spacing="2.4"><tspan fill="#c8fa72">01</tspan>  —  PORTAFOGLIO DI STRATEGIE ALGORITMICHE</text>

  <!-- nome provvisorio -->
  <text x="92" y="400" fill="#f1f4ee" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="84" font-weight="500" letter-spacing="-3.8">Portfolio Algo Manager</text>

  <!-- sottotitolo -->
  <text x="96" y="458" fill="#818e94" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="500" letter-spacing="-0.6">Strategie algoritmiche sull'oro (XAUUSD): metodo e rischio.</text>

  <!-- piede -->
  <rect x="96" y="540" width="1008" height="1" fill="#252e34"/>
  <text x="96" y="578" fill="#939fa9" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="16" letter-spacing="1.6">BACKTEST, NON RISULTATI REALI</text>
  <text x="1104" y="578" text-anchor="end" fill="#939fa9" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="16" letter-spacing="1.6">CRITERI DICHIARATI PRIMA DEL TEST</text>
</svg>
