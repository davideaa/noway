<script>const P = { EP: 2, DAY: 1, CAP: 0, NEXT: ['Cosa il PIL', 'non misura'], FONTE: 'DATI: EUROSTAT 2025 · ISTAT (SOMMERSO 2023, DEBITO 2025)' };</script>
<script src="serie.js"></script>
<script>
// Puntata 2 — «Il PIL: cosa misura». Fonti in p2-fonti.md (Eurostat nama_10_gdp 2025; Istat economia non osservata 2023; Istat notifica aprile 2026).
const ORDER = ['num', 'hook', 'ieri', 'def', 'grano', 'farina', 'pane', 'somma', 'giusto', 'tre', 'italia', 'sorpresa', 'istat', 'serve', 'casa', 'fine', 'cta', 'end'];

// spiga di grano
function wheat(cx, by, s, k) { if (k <= 0) return; x.save(); x.translate(cx, by); x.scale(s, s); x.globalAlpha *= k;
  x.strokeStyle = '#d9b25c'; x.lineWidth = 7; x.lineCap = 'round';
  for (const [dx, h, ang] of [[-34, 230, -0.18], [0, 270, 0], [34, 230, 0.18]]) {
    x.save(); x.rotate(ang); x.beginPath(); x.moveTo(dx * 0.3, 0); x.lineTo(dx * 0.3, -h); x.stroke();
    for (let j = 0; j < 6; j++) { const yy = -h + 20 + j * 26; for (const sd of [-1, 1]) { x.save(); x.translate(dx * 0.3 + sd * 12, yy); x.rotate(sd * 0.5);
      const g = x.createLinearGradient(0, -16, 0, 16); g.addColorStop(0, '#f2d27e'); g.addColorStop(1, '#a8812f'); x.fillStyle = g;
      x.beginPath(); x.ellipse(0, 0, 10, 19, 0, 0, 7); x.fill(); x.restore(); } }
    x.restore(); }
  x.restore(); }
function check(cx, cy, r, k, col = C.lime) { if (k <= 0) return; x.save(); x.strokeStyle = col; x.lineWidth = 14; x.lineCap = 'round'; x.lineJoin = 'round';
  const a = oC(clamp(k * 2)), b = oC(clamp(k * 2 - 1)); x.beginPath(); x.moveTo(cx - r, cy); x.lineTo(cx - r + r * 0.7 * a, cy + r * 0.7 * a);
  if (b > 0) x.lineTo(cx - r * 0.3 + r * 1.3 * b, cy + r * 0.7 - r * 1.5 * b); x.stroke(); x.restore(); }

function sHook(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.07); const d = b - a, half = a + d * 0.5;
  phrase(t, a + 0.05, [['Il pane che compri', C.ink], ['conta nel PIL.', C.lime]], 340, { size: 92, out: half - 0.1 });
  phrase(t, half, [['La farina', C.ink], ['con cui è fatto, no.', C.red]], 340, { size: 92 });
  const k1 = oC(seg(t, a + 0.3, a + 0.8)), k2 = oC(seg(t, a + 0.5, a + 1.0));
  glow(300, 1100, 260, '200,250,114', 0.18 * k1); loaf(300, 1220, 0.95, k1, 'PANE');
  glow(790, 1100, 240, '255,90,78', 0.12 * seg(t, half + 0.3, half + 0.8)); sack(790, 1240, 0.75, k2, 'FARINA');
  tap(300, 1120, t, a + 1.2); check(300, 1360, 40, seg(t, a + 1.3, a + 1.8));
  cross(790, 1360, 40, seg(t, half + 0.6, half + 1.1));
  txt('nel PIL', 300, 1450, { fam: 'mono', size: 26, weight: 600, color: C.lime, alpha: oC(seg(t, a + 1.5, a + 1.9)), ls: 2 });
  txt('non si somma', 790, 1450, { fam: 'mono', size: 26, weight: 600, color: C.red, alpha: oC(seg(t, half + 0.9, half + 1.3)), ls: 2 });
  x.restore(); finish(t); }

function sIeri(t, a, b) { bg(); x.save(); const d = b - a, half = a + d * 0.45, ko = ioC(seg(t, half, half + 0.9));
  phrase(t, a + 0.05, [['Ieri: il giro dei soldi.', C.muted]], 320, { size: 76, out: half - 0.15 });
  phrase(t, half + 0.1, [['Oggi: il numero', C.ink], ['che lo misura.', C.lime]], 320, { size: 92 });
  x.save(); x.globalAlpha = 1 - ko; circuit(t, { flowsAll: true, scale: lerp(0.8, 0.3, ko) }); x.restore();
  const kc = oB(seg(t, half + 0.5, half + 1.1));
  if (kc > 0) { x.save(); x.translate(540, 1000); x.scale(clamp(kc, 0, 1.2), clamp(kc, 0, 1.2)); glow(0, 0, 420, '200,250,114', 0.22);
    glass(0, 0, 640, 360, 48, 1); txt('PIL', 0, -30, { size: 190, weight: 800, color: C.lime, ls: -6 });
    txt('tutto il giro · in un numero', 0, 110, { fam: 'mono', size: 26, weight: 600, color: C.muted, ls: 1 }); x.restore(); }
  x.restore(); finish(t); }

function sDef(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04); const d = b - a;
  mono('P · I · L', 540, 290, t, a, { size: 30, color: C.lime, ls: 8 });
  phrase(t, a + 0.05, [['Il valore di ciò che', C.ink], ['un Paese produce', C.ink], ['in un anno.', C.lime]], 400, { size: 80 });
  const R = [['P', 'Prodotto', 'beni e servizi'], ['I', 'Interno', 'dentro i confini'], ['L', 'Lordo', 'senza togliere l’usura delle macchine']];
  R.forEach(([l, w, sub], i) => { const k = oC(seg(t, a + 0.6 + i * 0.35, a + 1.0 + i * 0.35)), y = 790 + i * 190; if (k <= 0) return;
    x.save(); x.translate((1 - k) * 60, 0); glass(540, y, 860, 160, 28, k);
    txt(l, 190, y, { size: 96, weight: 800, color: C.lime, alpha: k }); txt(w, 270, y - 22, { size: 54, weight: 800, align: 'left', alpha: k });
    txt(sub, 270, y + 38, { fam: 'mono', size: 23, weight: 500, color: C.muted, align: 'left', alpha: k }); x.restore(); });
  const kf = seg(t, a + d * 0.66, a + d * 0.66 + 0.45); if (kf > 0) { glow(540, 1390, 300, '200,250,114', 0.2 * kf); glassPill(540, 1390, 'solo i prodotti FINALI', kf, C.lime, 46); }
  x.restore(); finish(t); }

// la filiera: tre righe (grano, farina, pane) che restano in scena fino a «giusto»
const ROWS = [['grano', 'contadino → mulino', 1, wheat], ['farina', 'mulino → fornaio', 2, (cx, by, s, k) => sack(cx, by - 10, s * 0.78, k, 'FARINA')], ['pane', 'fornaio → te', 4, (cx, by, s, k) => loaf(cx, by - 30, s * 0.95, k, 'PANE')]];
function rows(t, o = {}) { const { ghost = [], grain3 = 0, y0 = 640, gap = 260 } = o;
  ROWS.forEach(([key, who, eur, draw], i) => { const st = S(key), k = oC(seg(t, st + 0.1, st + 0.6)), y = y0 + i * gap; if (k <= 0) return;
    const g = ghost.includes(key) ? 0.25 : 1, hot = t < S(ORDER[ORDER.indexOf(key) + 1]) && t >= st;
    x.save(); x.globalAlpha = g; glass(540, y, 900, 220, 36, k); if (hot) { x.save(); x.strokeStyle = C.lime; x.lineWidth = 3; rr(90, y - 110, 900, 220, 36); x.stroke(); x.restore(); }
    draw(230, y + 85, 0.55, k);
    txt(key.toUpperCase(), 380, y - 34, { size: 50, weight: 800, align: 'left', alpha: k, color: hot ? C.lime : C.ink });
    txt(who, 380, y + 30, { fam: 'mono', size: 25, weight: 600, align: 'left', color: C.muted, alpha: k });
    const kp = oB(seg(t, st + 0.9, st + 1.3)); if (kp > 0) { x.save(); x.translate(880, y); x.scale(clamp(kp, 0, 1.2), clamp(kp, 0, 1.2)); txt(eur + ' €', 0, 0, { size: 76, weight: 800, color: hot ? C.lime : C.ink }); x.restore(); }
    if (hot) { const kc = seg(t, st + 0.5, st + 1.3); if (kc > 0 && kc < 1) coin(lerp(1000, 880, oC(kc)), y - Math.sin(Math.PI * kc) * 80, 44, 1, '200,250,114', '€'); }
    if (grain3 > 0) { const kg = oB(seg(grain3, i * 0.2, i * 0.2 + 0.4)); if (kg > 0) { glow(730, y, 90, '255,90,78', 0.35 * clamp(kg)); wheat(730, y + 50, 0.33 * clamp(kg, 0, 1.2), 1); } }
    x.restore(); });
}
function sFiliera(t, a, b, key) { bg(); x.save(); const T = { grano: [['Il grano', C.ink]], farina: [['La farina', C.ink]], pane: [['Il pane', C.ink]] };
  mono('LA FILIERA DEL PANE', 540, 290, t, S('grano'), { size: 26, color: C.lime });
  phrase(t, a + 0.05, T[key], 380, { size: 92 });
  rows(t); x.restore(); finish(t); }
function sSomma(t, a, b) { bg('50,24,22', 0.5); x.save(); const d = b - a;
  phrase(t, a + 0.05, [['Sommando tutto:', C.ink], ['7 €?', C.red]], 300, { size: 88 });
  rows(t, { y0: 640, grain3: seg(t, a + d * 0.45, a + d * 0.95) });
  const kg = seg(t, a + d * 0.8, a + d * 0.8 + 0.4); if (kg > 0) glassPill(540, 1450, 'il grano contato 3 volte', kg, C.red, 42);
  x.restore(); finish(t); }
function sGiusto(t, a, b) { bg(); x.save(); const d = b - a;
  phrase(t, a + 0.05, [['Il PIL conta', C.ink], ['solo il pane: 4 €', C.lime]], 300, { size: 88 });
  const U = 150, base = 1380, L = [['contadino', 1, 0.5, 0.45], ['mulino', 1, 0.75, 0.6], ['fornaio', 2, 1, 0.75]];
  let acc = 0; L.forEach(([who, v, al, f], i) => { const k = ioC(seg(t, a + f * d, a + f * d + 0.45)); if (k <= 0) { acc += v; return; }
    const y1 = base - acc * U, h = v * U * k; x.save(); x.fillStyle = `rgba(200,250,114,${al})`; rr(400, y1 - h, 280, h - 6, 14); x.fill(); x.restore();
    txt('+' + v + ' €', 540, y1 - h / 2, { size: 56, weight: 800, color: '#15200C', alpha: k > 0.6 ? 1 : 0 });
    txt(who, 360, y1 - v * U / 2, { fam: 'mono', size: 26, weight: 600, color: C.muted, align: 'right', alpha: oC(k) }); acc += v; });
  const kv = oC(seg(t, a + 0.92 * d - 0.3, a + 0.92 * d)); x.save(); x.globalAlpha = kv; x.strokeStyle = C.lime; x.lineWidth = 4;
  x.beginPath(); x.moveTo(720, base - 6); x.lineTo(750, base - 6); x.lineTo(750, base - 4 * U); x.lineTo(720, base - 4 * U); x.stroke(); x.restore();
  txt('valore', 780, base - 2 * U - 40, { fam: 'mono', size: 26, weight: 600, color: C.lime, align: 'left', alpha: kv }); txt('aggiunto', 780, base - 2 * U, { fam: 'mono', size: 26, weight: 600, color: C.lime, align: 'left', alpha: kv });
  txt('= 4 €', 780, base - 2 * U + 50, { size: 50, weight: 800, color: C.lime, align: 'left', alpha: kv });
  x.save(); x.strokeStyle = 'rgba(241,244,238,0.3)'; x.lineWidth = 3; x.beginPath(); x.moveTo(300, base); x.lineTo(780, base); x.stroke(); x.restore();
  x.restore(); finish(t); }
function sTre(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04); const d = b - a;
  phrase(t, a + 0.05, [['Tre modi,', C.ink], ['stesso totale.', C.lime]], 320, { size: 92 });
  const Cc = [['PRODUZIONE', 'cosa si produce', 230], ['SPESA', 'cosa si spende', 540], ['REDDITI', 'cosa si guadagna', 850]], base = 1330, Hh = 640;
  Cc.forEach(([lab, sub, cx], i) => { const ki = oC(seg(t, a + 0.4 + i * 0.3, a + 0.8 + i * 0.3)); if (ki <= 0) return; const lv = ioC(seg(t, a + 0.8 + i * 0.3, a + d * 0.75));
    glass(cx, base - Hh / 2, 230, Hh, 30, ki);
    x.save(); x.beginPath(); x.roundRect(cx - 115, base - Hh, 230, Hh, 30); x.clip(); const top = base - Hh * lv + Math.sin(t * 3 + i) * 6 * (1 - lv);
    const g = x.createLinearGradient(0, top, 0, base); g.addColorStop(0, 'rgba(200,250,114,0.75)'); g.addColorStop(1, 'rgba(200,250,114,0.25)'); x.fillStyle = g; x.fillRect(cx - 115, top, 230, base - top); x.restore();
    txt(lab, cx, base + 50, { fam: 'mono', size: 25, weight: 600, color: C.ink, alpha: ki, ls: 1 }); txt(sub, cx, base + 88, { fam: 'mono', size: 20, weight: 500, color: C.muted, alpha: ki }); });
  const ke = oC(seg(t, a + d * 0.75, a + d * 0.75 + 0.35)); for (const ex of [385, 695]) txt('=', ex, base - Hh / 2, { size: 90, weight: 800, color: C.lime, alpha: ke });
  x.restore(); finish(t); }
// contachilometri: cifre che rotolano fino al valore
function odo(s, cx, cy, size, t, a, col = C.lime) { const cw = tw('0', size), dw = tw('.', size); let wsum = 0; for (const ch of s) wsum += /\d/.test(ch) ? cw : tw(ch, size);
  let px = cx - wsum / 2; x.save(); x.beginPath(); x.rect(cx - wsum / 2 - 20, cy - size * 0.62, wsum + 40, size * 1.2); x.clip(); let di = 0;
  for (const ch of s) { if (/\d/.test(ch)) { const k = ioC(seg(t, a + di * 0.12, a + 0.9 + di * 0.12)), v = (+ch + 10 * 2) * k;
      for (let n = Math.floor(v) - 1; n <= Math.floor(v) + 1; n++) txt(String(((n % 10) + 10) % 10), px + cw / 2, cy + (n - v) * size * 1.05, { size, weight: 800, color: col, ls: -4 });
      px += cw; di++; } else { txt(ch, px + tw(ch, size) / 2, cy, { size, weight: 800, color: col }); px += tw(ch, size); } }
  x.restore(); }
function sItalia(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.06); const d = b - a;
  phrase(t, a + 0.05, [['Italia, 2025', C.ink]], 360, { size: 96 });
  const k = oC(seg(t, a + 0.3, a + 0.6)); x.save(); x.globalAlpha = k; odo('€2.265', 470, 820, 190, t, a + 0.4); txt('mld', 900, 850, { size: 80, weight: 800, color: C.lime }); x.restore();
  mono('PIL A PREZZI CORRENTI · EUROSTAT', 540, 980, t, a + d * 0.4, { size: 26 });
  const Cc = [230, 540, 850]; Cc.forEach((cx, i) => { const kk = oC(seg(t, a + 0.6 + i * 0.15, a + 1.0 + i * 0.15)); glass(cx, 1230, 200, 220, 30, kk);
    x.save(); x.beginPath(); x.roundRect(cx - 100, 1120, 200, 220, 30); x.clip(); x.fillStyle = 'rgba(200,250,114,0.55)'; x.fillRect(cx - 100, 1340 - 220 * kk, 200, 220); x.restore();
    txt(['PRODUZIONE', 'SPESA', 'REDDITI'][i], cx, 1385, { fam: 'mono', size: 22, weight: 600, color: C.muted, alpha: kk }); txt('2.265', cx, 1230, { size: 48, weight: 800, color: '#15200C', alpha: kk }); });
  x.restore(); finish(t); }
function sSorpresa(t, a, b) { bg('50,24,22', 0.7); x.save(); zoom(t, a, b, 1.05); const d = b - a;
  phrase(t, a + 0.05, [['Dentro c’è', C.ink], ['una sorpresa.', C.red]], 330, { size: 96 });
  mono('REGOLAMENTI UE · NEL PIL DI OGNI PAESE', 540, 600, t, a + d * 0.25, { size: 24, color: C.red });
  const L = [['STUPEFACENTI', 0.62], ['PROSTITUZIONE', 0.74], ['CONTRABBANDO DI SIGARETTE', 0.86]];
  L.forEach(([s, f], i) => { const k = oB(seg(t, a + f * d - 0.25, a + f * d + 0.2)); if (k <= 0) return; const y = 760 + i * 200;
    x.save(); x.translate(540, y); x.scale(clamp(k, 0, 1.15), clamp(k, 0, 1.15)); x.translate(-540, -y); glow(540, y, 300, '255,90,78', 0.12);
    glass(540, y, 820, 150, 30, 1, '255,170,160'); txt(s, 540, y + 2, { fam: 'mono', size: 38, weight: 600, color: C.ink, ls: 3 }); x.restore(); });
  x.restore(); finish(t); }
function sIstat(t, a, b) { bg(); x.save(); const d = b - a, sw = a + d * 0.42, k2 = oC(seg(t, sw, sw + 0.4));
  const k1 = oC(seg(t, a + 0.1, a + 0.5)) * (1 - k2);
  txt('€20 mld', 540, 380, { size: 150, weight: 800, color: C.red, alpha: k1, blur: (1 - oC(seg(t, a + 0.1, a + 0.5))) * 12 });
  txt('ATTIVITÀ ILLEGALI · 0,9% DEL PIL', 540, 500, { fam: 'mono', size: 26, weight: 600, color: C.muted, alpha: k1, ls: 2 });
  txt('€217 mld', 540, 380, { size: 150, weight: 800, color: C.amber, alpha: k2, blur: (1 - k2) * 12 });
  txt('SOMMERSO + ILLEGALE · 10,2% DEL PIL', 540, 500, { fam: 'mono', size: 26, weight: 600, color: C.muted, alpha: k2, ls: 2 });
  for (let i = 0; i < 10; i++) { const cx = 220 + (i % 5) * 160, cy = 860 + Math.floor(i / 5) * 230, k = oC(seg(t, a + 0.3 + i * 0.06, a + 0.7 + i * 0.06)), dark = i === 9 ? oC(seg(t, sw + 0.5, sw + 1.0)) : 0;
    if (dark > 0) glow(cx, cy, 130, '245,165,36', 0.35 * dark); coin(cx, cy - (1 - k) * 60, 72, k, dark > 0.5 ? '245,165,36' : '200,250,114', '€');
    if (dark > 0) { x.save(); x.globalAlpha = dark; x.strokeStyle = C.amber; x.lineWidth = 4; x.beginPath(); x.ellipse(cx, cy, 82, 30, 0, 0, 7); x.stroke(); x.restore(); } }
  const kt = oC(seg(t, sw + 1.0, sw + 1.4)); txt('1 euro su 10', 540, 1320, { size: 78, weight: 800, color: C.amber, alpha: kt });
  mono('ISTAT · ECONOMIA NON OSSERVATA · ANNO 2023', 540, 1420, t, a + 0.6, { size: 22 });
  x.restore(); finish(t); }
function sServe(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04); const d = b - a;
  phrase(t, a + 0.05, [['Perché ti serve?', C.ink]], 320, { size: 92 });
  const kh = oB(seg(t, a + d * 0.2, a + d * 0.2 + 0.5)); if (kh > 0) { x.save(); x.translate(540, 560); x.rotate(-0.03); x.scale(clamp(kh, 0, 1.1), clamp(kh, 0, 1.1));
    glass(0, 0, 760, 150, 24, 1); txt('«Debito al 137%»', 0, 4, { size: 64, weight: 800, color: C.ink }); x.restore(); }
  const kf = oC(seg(t, a + d * 0.55, a + d * 0.55 + 0.5)), kl = ioC(seg(t, a + d * 0.6, a + d * 0.6 + 0.5)), kr = oB(seg(t, a + d * 0.8, a + d * 0.8 + 0.4));
  txt('debito pubblico', 540, 780, { fam: 'mono', size: 26, weight: 600, color: C.muted, alpha: kf }); txt('€3.096 mld', 540, 850, { size: 84, weight: 800, alpha: kf });
  x.save(); x.strokeStyle = C.ink; x.lineWidth = 6; x.lineCap = 'round'; x.beginPath(); x.moveTo(540 - 330 * kl, 930); x.lineTo(540 + 330 * kl, 930); x.stroke(); x.restore();
  txt('€2.265 mld', 540, 1010, { size: 84, weight: 800, color: C.lime, alpha: kl }); txt('PIL', 540, 1080, { fam: 'mono', size: 26, weight: 600, color: C.lime, alpha: kl, ls: 3 });
  if (kr > 0) { x.save(); x.translate(540, 1270); x.scale(clamp(kr, 0, 1.2), clamp(kr, 0, 1.2)); glow(0, 0, 260, '200,250,114', 0.22); txt('= 137%', 0, 0, { size: 130, weight: 800, color: C.lime }); x.restore(); }
  mono('ISTAT · NOTIFICA APRILE 2026 · DATI 2025', 540, 1420, t, a + d * 0.6, { size: 22 });
  x.restore(); finish(t); }
function sCasa(t, a, b) { bg('30,44,26'); x.save(); const d = b - a;
  phrase(t, a + 0.05, [['Cosa ti porti a casa?', C.muted]], 300, { size: 70, out: a + 0.3 * d });
  phrase(t, a + 0.32 * d, [['Conta solo ciò che', C.ink], ['arriva alla fine.', C.lime]], 300, { size: 88 });
  const kg = seg(t, a + 0.45 * d, a + 0.45 * d + 0.6); x.save(); rows(t, { ghost: kg > 0.5 ? ['grano', 'farina'] : [], y0: 700, gap: 250 }); x.restore();
  if (kg > 0) { glow(540, 1200, 360, '200,250,114', 0.22 * kg); check(690, 1200, 34, kg); }
  x.restore(); finish(t); }

serie({ hook: sHook, ieri: sIeri, def: sDef, grano: (t, a, b) => sFiliera(t, a, b, 'grano'), farina: (t, a, b) => sFiliera(t, a, b, 'farina'), pane: (t, a, b) => sFiliera(t, a, b, 'pane'),
  somma: sSomma, giusto: sGiusto, tre: sTre, italia: sItalia, sorpresa: sSorpresa, istat: sIstat, serve: sServe, casa: sCasa }, ORDER, ['hook', 'def', 'somma', 'sorpresa', 'casa']);
</script></body></html>
