<script>
/* Puntata 27 — «Interesse semplice e composto» (martedi 10/11/2026, lezione 2 di 5, capitolo 2). Numeri SOLO da p27-fonti.md:
   apertura: indagine Banca d'Italia 2020 (QEF 588), 100 euro al 2% per 5 anni, solo circa 1 su 4 (indice FK4 0,23); risposta giusta poco piu di 110 (110,41; la domanda facile: 100 al 2% per 1 anno = 102);
   esempio INVENTATO (etichetta ambra a schermo): 1.000 euro al 5%, semplice +50 l'anno -> 1.500 a 10 anni, composto 1.628,89 (circa +129 = 128,89), a 30 anni semplice 2.500 e composto 4.321,94 (a schermo «oltre 4.300»),
   tempo x3 e differenza x14 (14,1); regola del 72: 72/5 = circa 14 anni (esatto 14,21; e' un'approssimazione). Niente riga delle fonti nel video, niente Einstein, niente «il 23% non sa».
   Immagine nuova del composto: i gradini di una scala (ogni anno il gradino e' piu alto del precedente) che si staccano dalla scala a gradini uguali del semplice; poi i due grafici si allargano a 30 anni.
   Aggancio ai numeri con WA: unione di TUTTE le forme (lettere e cifre) ordinate per tempo, si prende la n-esima; '=5' = parola uguale a «5» (senza prendere «50»). */
const ORDER = ['num', 'hook', 'domanda', 'semplice', 'composto', 'trenta', 'settantadue', 'limite', 'casa', 'fine', 'cta', 'end'];
const Y2 = 345 + 92 * 1.12; /* seconda riga del titolo a size 92 */

const WA = (k, ws, n = 1, f = 0.5) => { (window.ANCH = window.ANCH || {})[k + '|' + ws.join('/') + '|' + n] = [k, ws, n];
  const L = ((window.WORDS || {})[k]) || [];
  const m = L.filter(([p]) => ws.some((w) => (w[0] === '=' ? _nw(p) === _nw(w.slice(1)) : _nw(p).startsWith(_nw(w))))).sort((u, v) => u[1] - v[1]);
  if (m.length >= n) return m[n - 1][1];

const lab = (t, s, px, py, a0, o = {}) => txt(s, px, py, { fam: 'mono', size: 26, weight: 600, color: C.muted, ls: 2, alpha: oC(seg(t, a0, a0 + 0.35)), ...o });

const tok = (t, t0, s, px, py, o = {}) => { const k = oC(seg(t, t0, t0 + 0.35)); txt(s, px, py + (1 - k) * 40, { size: 120, weight: 800, ls: -2, ...o, alpha: k * (o.alpha ?? 1), blur: (1 - k) * 14 }); };
function dashLine(x0, y0, x1, y1, col, w = 3, dash = [10, 10], a = 1) { if (a <= 0) return; x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.lineWidth = w; x.setLineDash(dash); x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); x.restore(); }

  x.beginPath(); x.arc(cx, cy - s * 0.42, s * 0.26, 0, 7); x.fill(); x.stroke();
  x.beginPath(); x.arc(cx, cy + s * 0.66, s * 0.55, Math.PI * 1.12, Math.PI * 1.88); x.stroke(); x.restore(); }

/* ================= HOOK: la domanda in tre pezzi (capitale, tasso, durata), poi quattro persone e una sola si accende ================= */
function sHook(t, a, b) { bg('30,44,26', 0.8); x.save(); zoom(t, a, b, 1.05);

  const kt = oC(seg(t, Math.max(a + 0.02, t20 - 0.15), t20 + 0.25)); txt('NEL 2020', 540, 330, { fam: 'mono', size: 34, weight: 700, color: C.lime, ls: 6, alpha: kt, blur: (1 - kt) * 8 });
  [['CAPITALE', '100 €', 210, tCap], ['TASSO', '2 %', 540, tTas], ['DURATA', '5 anni', 870, tDur]].forEach(([l, v, cx, tt]) => { const k = seg(t, tt - 0.2, tt + 0.4); if (k <= 0) return;
    x.save(); x.globalAlpha = clamp(k * 2); const s = lerp(0.85, 1, oB(clamp(k))); x.translate(cx, 560); x.scale(s, s); x.translate(-cx, -560);
    glass(cx, 560, 290, 140, 34, 1); txt(v, cx, 562, { size: 76, weight: 800, color: cx === 540 ? C.amber : C.ink, ls: -1 }); x.restore(); lab(t, l, cx, 465, tt - 0.1, { size: 24 }); });
  phrase(t, tQu - 0.15, [['quanto avrai?', C.amber]], 790, { size: 112 });
  [240, 440, 640, 840].forEach((cx, i) => { const k = oC(seg(t, tSo - 0.1 + i * 0.08, tSo + 0.35 + i * 0.08)), lit = i === 0 ? oC(seg(t, tUno - 0.05, tUno + 0.25)) : 0; person(cx, 1040, 150, lit, k); });
  phrase(t, tQ4 - 0.44, [['circa 1 su 4', C.lime]], 1270, { size: 124 });

/* ================= DOMANDA: una riga degli anni; il pallino si ferma a 1 (la domanda facile) e poi corre fino a 5 ================= */
function lerpCol(k) { const c0 = [241, 244, 238], c1 = [200, 250, 114]; return `rgb(${c0.map((v, i) => Math.round(lerp(v, c1[i], k))).join(',')})`; }
function sDomanda(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04);

  phrase(t, a + 0.05, [['Prima la facile,', C.ink]], 345, { size: 92 });
  phrase(t, t5 - 0.1, [['poi 5 anni.', C.lime]], Y2, { size: 92 });
  const x0 = 150, x1 = 930, Xp = (n) => x0 + (x1 - x0) * n / 5, ty = 1010;
  const p1 = ioC(seg(t, tFa - 0.2, tAn + 0.15)), p2 = ioC(seg(t, t5 - 0.25, t110 + 0.2)), yr = p1 + p2 * 4;
  const val = Math.round(100 * Math.pow(1.02, yr)), done = oC(seg(t, t110 + 0.1, t110 + 0.5));

  x.save(); x.strokeStyle = 'rgba(241,244,238,0.3)'; x.lineWidth = 6; x.lineCap = 'round'; x.beginPath(); x.moveTo(x0, ty); x.lineTo(x1, ty); x.stroke();
  x.strokeStyle = C.lime; x.lineWidth = 8; x.beginPath(); x.moveTo(x0, ty); x.lineTo(Xp(yr), ty); x.stroke(); x.restore();
  for (let i = 0; i <= 5; i++) { x.strokeStyle = 'rgba(241,244,238,0.45)'; x.lineWidth = 4; x.beginPath(); x.moveTo(Xp(i), ty - 14); x.lineTo(Xp(i), ty + 14); x.stroke(); txt(String(i), Xp(i), ty + 58, { fam: 'mono', size: 28, weight: 600, color: yr >= i - 0.01 ? C.lime : C.muted }); }

  const kp = seg(t, tPo - 0.15, tPo + 0.45); if (kp > 0) glassPill(540, 1310, 'poco più di 110 €', kp, C.amber, 48);
  x.restore(); finish(t); }

/* ================= grafico condiviso: scala a gradini uguali (semplice) e scala a gradini sempre piu alti (composto); a 30 anni diventano linee ================= */
const simpleF = (n) => 1000 + 50 * n, compF = (n) => 1000 * Math.pow(1.05, n);
function stairPts(f, p, X, Yp) { const pts = [[X(0), Yp(f(0))]], full = Math.floor(p);
  for (let i = 0; i < full; i++) pts.push([X(i + 1), Yp(f(i))], [X(i + 1), Yp(f(i + 1))]);
  const u = p - full; if (u > 0.001) { const h = Math.min(1, u * 2), r = clamp(u * 2 - 1); pts.push([X(full + h), Yp(f(full))]); if (r > 0) pts.push([X(full + 1), Yp(lerp(f(full), f(full + 1), r))]); }
  return pts; }
function linePts(f, p, X, Yp) { const pts = []; for (let n = 0; n < p; n += 0.25) pts.push([X(n), Yp(f(n))]); pts.push([X(p), Yp(f(p))]); return pts; }
function strokePts(pts, col, w, a, gl) { if (pts.length < 2 || a <= 0.01) return; x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.lineWidth = w; x.lineJoin = 'round'; x.lineCap = 'round'; if (gl) { x.shadowColor = gl; x.shadowBlur = 20; }
  x.beginPath(); pts.forEach(([px, py], i) => (i ? x.lineTo(px, py) : x.moveTo(px, py))); x.stroke(); x.restore(); }
function chart(t, o) { const { N, Y, yb, yt = 620, x0 = 130, x1 = 930, pS = 0, pC = 0, aS = 1, aC = 1, ln = 0, tk = 1, capLab = 1 } = o;
  const X = (n) => x0 + (x1 - x0) * n / N, Yp = (v) => yb - (yb - yt) * (v - 1000) / (Y - 1000);
  x.save(); x.strokeStyle = 'rgba(241,244,238,0.28)'; x.lineWidth = 3; x.beginPath(); x.moveTo(x0 - 10, yb); x.lineTo(x1 + 10, yb); x.stroke(); x.restore();
  const tickA = tk * (1 - ln), tickB = tk * ln;
  [[0, 5, 10], [0, 10, 20, 30]].forEach((set, si) => { const al = si ? tickB : tickA; if (al <= 0.01) return; set.forEach((n) => txt(n === set[set.length - 1] ? n + ' ANNI' : String(n), n === set[set.length - 1] ? X(n) - 10 : X(n), yb + 38, { fam: 'mono', size: 24, weight: 600, color: C.muted, alpha: al })); });
  if (capLab > 0) txt('LA BASE È IL CAPITALE: 1.000 €', 540, yb + 82, { fam: 'mono', size: 22, weight: 600, color: C.muted, ls: 1, alpha: capLab });
  [[1 - ln, stairPts], [ln, linePts]].forEach(([al, fn]) => { if (al <= 0.01) return;
    if (pC > 0.01 && aC > 0) { const cs = fn(compF, pC, X, Yp), ss = fn(simpleF, pC, X, Yp);
      x.save(); x.globalAlpha *= al * 0.2 * aC; x.fillStyle = C.amber; x.beginPath(); cs.forEach(([px, py], i) => (i ? x.lineTo(px, py) : x.moveTo(px, py))); for (let i = ss.length - 1; i >= 0; i--) x.lineTo(ss[i][0], ss[i][1]); x.closePath(); x.fill(); x.restore(); }
    if (pS > 0.01) strokePts(fn(simpleF, pS, X, Yp), C.lime, 7, al * aS, 'rgba(200,250,114,0.5)');
    if (pC > 0.01) strokePts(fn(compF, pC, X, Yp), C.amber, 8, al * aC, 'rgba(245,165,36,0.6)'); });
  if (pS > 0.01) { x.save(); x.globalAlpha *= aS; x.fillStyle = C.lime; x.beginPath(); x.arc(X(pS), Yp(simpleF(pS)), 11, 0, 7); x.fill(); x.restore(); }
  if (pC > 0.01) { x.save(); x.globalAlpha *= aC; x.fillStyle = C.amber; x.beginPath(); x.arc(X(pC), Yp(compF(pC)), 12, 0, 7); x.fill(); x.restore(); }
  return { X, Yp }; }
const CH10 = { N: 10, Y: 1700, yb: 1200 };

/* ================= SEMPLICE: una scala a gradini tutti uguali (+50 l'anno) ================= */
function sSemplice(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04);
  const tMi = WA('semplice', ['1000', 'mille'], 1, 0.05), t5 = WA('semplice', ['=5', 'cinque'], 1, 0.15), t50 = WA('semplice', ['=50', 'cinquanta'], 1, 0.5), t10 = WA('semplice', ['=10', 'dieci'], 1, 0.78), t15 = WA('semplice', ['1500', 'millecinquecento'], 1, 0.88);
  phrase(t, tMi - 0.1, [['1.000 €', C.ink]], 345, { size: 92 });

  const { X, Yp } = chart(t, { ...CH10, pS: p, aS: 1, capLab: kc, tk: kc });

  const kp = seg(t, t50 - 0.15, t50 + 0.45); if (kp > 0) glassPill(540, 1365, '+50 € ogni anno', kp, C.lime, 46);

/* ================= COMPOSTO: i gradini si staccano dalla scala del semplice, ognuno piu alto del precedente ================= */
function sComposto(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04);
  const tAg = WA('composto', ['aggiungono'], 1, 0.12), tPr = WA('composto', ['producono'], 1, 0.28), tVo = WA('composto', ['volta'], 1, 0.4), t10 = WA('composto', ['=10', 'dieci'], 1, 0.58), t1629 = WA('composto', ['1629', '1628', 'milleseicento'], 1, 0.7), t129 = WA('composto', ['=129', 'centoventinove'], 1, 0.88);

    x.save(); x.globalAlpha = clamp(k * 2); const s = lerp(0.85, 1, oB(clamp(k))); x.translate(cx, 1320); x.scale(s, s); x.translate(-cx, -1320); glass(cx, 1320, 420, 190, 36, 1);
    txt(l, cx, 1268, { fam: 'mono', size: 26, weight: 600, color: C.muted, ls: 3 }); txt(v, cx, 1346, { size: 110, weight: 800, color: col, ls: -2 }); x.restore(); });

/* ================= SETTANTADUE: 72 : 5, e un quadrante a 14 tacche che si accende fino al raddoppio ================= */
function sSettantadue(t, a, b) { bg('30,44,26', 0.8); x.save(); zoom(t, a, b, 1.04);
  const tRe = WA('settantadue', ['regola'], 1, 0.1), t72 = WA('settantadue', ['=72', 'settantadue'], 1, 0.2), tTa = WA('settantadue', ['tasso'], 1, 0.3), t5 = WA('settantadue', ['=5', 'cinque'], 1, 0.46), t14 = WA('settantadue', ['=14', 'quattordici'], 1, 0.68), tAp = WA('settantadue', ['approssim', 'unapprossim'], 1, 0.88);
  phrase(t, a + 0.05, [['Quando raddoppi?', C.ink]], 345, { size: 92 });
  const fs = 150, ey = 630, parts = ['72', ' ÷ ', '5', ' ≈ ', '14'], ws = parts.map((s) => tw(s, fs, 800, 'Manrope', -3)), tot = ws.reduce((q, v) => q + v, 0);
  let cx = 540 - tot / 2; const cs = [];
  parts.forEach((s, i) => { cs.push(cx + ws[i] / 2); cx += ws[i]; });
  tok(t, t72 - 0.1, '72', cs[0], ey, { size: fs, color: C.ink, ls: -3 }); tok(t, tTa - 0.1, '÷', cs[1], ey, { size: fs, color: C.muted, ls: -3 });
  tok(t, t5 - 0.1, '5', cs[2], ey, { size: fs, color: C.lime, ls: -3 }); tok(t, t14 - 0.15, '≈', cs[3], ey, { size: fs, color: C.muted, ls: -3 }); tok(t, t14 - 0.1, '14', cs[4], ey, { size: fs, color: C.amber, ls: -3 });
  lab(t, 'TASSO', cs[2], ey + 105, t5, { size: 24, color: C.lime }); lab(t, 'ANNI', cs[4], ey + 105, t14, { size: 24, color: C.amber });
  const CX = 540, CY = 1050, R = 180, W = 46, t0 = Math.min(t5, t14 - 0.4), d = Math.max(0.045, (t14 + 0.25 - t0 - 0.2) / 14), kd = oC(seg(t, t0 - 0.5, t0 - 0.1));
  let filled = 0;
  for (let i = 0; i < 14; i++) { const a0 = -Math.PI / 2 + i * Math.PI * 2 / 14 + 0.035, a1 = a0 + Math.PI * 2 / 14 - 0.07, k = oC(seg(t, t0 + i * d, t0 + i * d + 0.2)); filled += k;
    x.save(); x.globalAlpha = Math.max(kd, 0.0001); x.lineWidth = W; x.lineCap = 'butt'; x.strokeStyle = 'rgba(241,244,238,0.1)'; x.beginPath(); x.arc(CX, CY, R, a0, a1); x.stroke();
    if (k > 0) { x.globalAlpha = k; x.strokeStyle = i === 13 ? C.amber : C.lime; x.beginPath(); x.arc(CX, CY, R, a0, a1); x.stroke(); } x.restore(); }
  const kx = oB(seg(t, t0 + 13 * d + 0.1, t0 + 13 * d + 0.55)), cnt = Math.round(filled);
  if (kd > 0 && kx < 0.99) txt(String(cnt), CX, CY - 4, { size: 130, weight: 800, color: C.muted, alpha: kd * (1 - clamp(kx * 3)) });
  if (kx > 0) { x.save(); x.translate(CX, CY - 10); x.scale(clamp(kx, 0, 1.15), clamp(kx, 0, 1.15)); glow(0, 0, 160, '200,250,114', 0.25); txt('×2', 0, 0, { size: 150, weight: 800, color: C.lime, ls: -3 }); x.restore(); lab(t, 'IL CAPITALE', CX, CY + 92, t0 + 13 * d + 0.3, { size: 24, color: C.ink }); }
  tag(t, a, 1330);
  const kp = seg(t, tAp - 0.15, tAp + 0.45); if (kp > 0) glassPill(540, 1410, 'è un’approssimazione', kp, C.amber, 40);
  x.restore(); finish(t); }

/* ================= LIMITE: tre cose che mancano nell'esempio, poi la curva si specchia: vale anche per i debiti ================= */
function sLimite(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04);
  const tCi = WA('limite', ['cifre'], 1, 0.03), tIn = WA('limite', ['inflazione'], 1, 0.14), tSp = WA('limite', ['spese'], 1, 0.26), tGa = WA('limite', ['garantisce'], 1, 0.4), t5 = WA('limite', ['=5', 'cinque'], 1, 0.48), t30 = WA('limite', ['=30', 'trent'], 1, 0.58),
    tSt = WA('limite', ['stesso'], 1, 0.7), tDe = WA('limite', ['debiti'], 1, 0.86);
  const kOut = oC(seg(t, tSt - 0.55, tSt - 0.15));
  x.save(); x.globalAlpha *= 1 - kOut; x.translate(0, 70 * kOut);
  phrase(t, Math.max(a + 0.02, tCi - 0.1), [['Solo cifre', C.ink], ['di esempio.', C.amber]], 345, { size: 92 });
  [['senza inflazione', tIn, 650], ['senza spese', tSp, 770]].forEach(([s, tt, py]) => { const k = seg(t, tt - 0.2, tt + 0.4); if (k > 0) glassPill(540, py, s, k, C.ink, 46); });
  const kg = seg(t, tGa - 0.2, tGa + 0.4); if (kg > 0) glassPill(540, 920, 'nessuna garanzia', kg, C.amber, 46);
  const w1 = tw('5%', 120, 800, 'Manrope', -2), w2 = tw('per 30 anni', 120, 800, 'Manrope', -2), gp = 36, x1 = 540 - (w1 + gp + w2) / 2;
  tok(t, t5 - 0.1, '5%', x1 + w1 / 2, 1110, { color: C.lime }); tok(t, t30 - 0.1, 'per 30 anni', x1 + w1 + gp + w2 / 2, 1110, { color: C.ink });
  x.restore();
  /* gruppo B: la stessa curva, sopra l'asse risparmi e sotto debiti */
  phrase(t, tSt - 0.1, [['Stesso meccanismo,', C.ink]], 345, { size: 92 });
  phrase(t, tSt + 0.5, [['anche per i debiti.', C.red]], Y2, { size: 92 });
  const ax = 1010, x0 = 130, x1b = 930, SC = 100, Xn = (n) => x0 + (x1b - x0) * n / 30, f = (n) => SC * (Math.pow(1.05, n) - 1);
  const pU = ioC(seg(t, tSt - 0.1, tSt + 1.3)) * 30, pD = ioC(seg(t, tDe - 0.1, tDe + 1.0)) * 30;
  if (pU > 0) { x.save(); x.strokeStyle = 'rgba(241,244,238,0.3)'; x.lineWidth = 3; x.beginPath(); x.moveTo(x0 - 10, ax); x.lineTo(x1b + 10, ax); x.stroke(); x.restore(); }
  const mk = (sg, p) => { const pts = []; for (let n = 0; n < p; n += 0.25) pts.push([Xn(n), ax - sg * f(n)]); pts.push([Xn(p), ax - sg * f(p)]); return pts; };
  if (pU > 0.01) { strokePts(mk(1, pU), C.lime, 8, 0.9, 'rgba(200,250,114,0.5)'); }
  if (pD > 0.01) { strokePts(mk(-1, pD), C.red, 8, 1, 'rgba(255,90,78,0.55)'); }
  lab(t, 'RISPARMI', 969, ax - f(30) - 40, tSt + 1.2, { color: C.lime, size: 28, align: 'right' }); lab(t, 'DEBITI', 969, ax + f(30) + 46, tDe + 0.9, { color: C.red, size: 28, align: 'right' });
  tag(t, a);
  x.restore(); finish(t); }

/* ================= CASA: due corsie a passi: uguali per il semplice, sempre piu lunghi per il composto ================= */
function sCasa(t, a, b) { bg('30,44,26', 0.8); x.save(); zoom(t, a, b, 1.04);
  const tSe = WA('casa', ['semplice'], 1, 0.22), tCo = WA('casa', ['composto'], 1, 0.46), tDi = WA('casa', ['differenza'], 1, 0.74);
  phrase(t, a + 0.05, [['Cosa ti porti a casa?', C.muted]], 345, { size: 70, out: tSe - 0.55 });
  phrase(t, tSe - 0.25, [['Semplice: passo fisso', C.lime]], 345, { size: 80 });
  phrase(t, tCo - 0.25, [['Composto: sempre più lungo', C.amber]], 345 + 80 * 1.12, { size: 80 });
  const x0 = 130, dt = 0.05, SC = 0.25, y1 = 850, y2 = 1020, hh = 84;
  lab(t, 'SEMPLICE', x0, y1 - 62, tSe, { color: C.lime, size: 26, align: 'left' }); lab(t, 'COMPOSTO', x0, y2 - 62, tCo, { color: C.amber, size: 26, align: 'left' });
  let xs = x0, xc = x0;
  for (let i = 0; i < 30; i++) { const ws = 50 * SC, wc = 50 * Math.pow(1.05, i) * SC;
    const k1 = oC(seg(t, tSe + i * dt, tSe + i * dt + 0.22)), k2 = oC(seg(t, tCo + i * dt, tCo + i * dt + 0.22));
    if (k1 > 0) { x.save(); x.globalAlpha = k1; x.fillStyle = i % 2 ? 'rgba(200,250,114,0.95)' : 'rgba(200,250,114,0.6)'; rr(xs, y1 - hh / 2, ws - 1.5, hh, 3); x.fill(); x.restore(); }
    if (k2 > 0) { x.save(); x.globalAlpha = k2; x.fillStyle = i % 2 ? 'rgba(245,165,36,0.95)' : 'rgba(245,165,36,0.6)'; rr(xc, y2 - hh / 2, wc - 1.5, hh, 3); x.fill(); x.restore(); }
    xs += ws; xc += wc; }
  const xe1 = x0 + 30 * 50 * SC, kb = oC(seg(t, tDi - 0.1, tDi + 0.5));
  if (kb > 0) { dashLine(xe1, y1 + hh / 2 + 6, xe1, y2 - hh / 2 - 6, C.ink, 3, [6, 8], kb); dashLine(xe1, y2 + hh / 2 + 6, xe1, 1140, C.ink, 3, [6, 8], kb);
    const be = lerp(xe1, xc, oC(seg(t, tDi, tDi + 0.7))); x.save(); x.globalAlpha = kb; x.strokeStyle = C.amber; x.lineWidth = 6; x.lineCap = 'round'; x.beginPath(); x.moveTo(xe1, 1140); x.lineTo(be, 1140); x.moveTo(be, 1124); x.lineTo(be, 1156); x.moveTo(xe1, 1124); x.lineTo(xe1, 1156); x.stroke(); x.restore();
    lab(t, 'LA DIFFERENZA SI ALLARGA', (xe1 + xc) / 2 + 40, 1202, tDi + 0.2, { color: C.amber, size: 24 }); }
  tag(t, a, 1300);
  x.restore(); finish(t); }

serie({ hook: sHook, domanda: sDomanda, semplice: sSemplice, composto: sComposto, trenta: sTrenta, settantadue: sSettantadue, limite: sLimite, casa: sCasa },
  ORDER, ['composto', 'trenta']);
</script></body></html>
