/* ================= LIVELLO: barre annuali, solo il 2022 rompe la linea ================= */
const BV = [['2019', 1825.154, '1.825'], ['2020', 1665.979, '1.666'], ['2021', 1819.503, '1.820'], ['2022', 1908.758, '1.909']], BX = [210, 420, 630, 840], bh = (v) => (v - 1550) * 2.0;
function sLiv(t, a, b) { bg(); x.save();
  phrase(t, a + 0.05, [['Il livello del 2019', C.ink], ['torna solo nel 2022.', C.lime]], 345, { size: 92 });
  const tL = WT('livello', 'livello', 1, 0.3), tS = WT('livello', 'supera', 1, 2.4), base = 1290, yL = base - bh(BV[0][1]);
  BV.forEach(([yr, v, lab], i) => { const k = i < 3 ? ioC(seg(t, a + 0.1 + i * 0.15, a + 0.7 + i * 0.15)) : oB(seg(t, tS - 0.15, tS + 0.55), 1.4), h = bh(v) * Math.max(0, k);
    if (k <= 0) return; const over = i === 3, g = x.createLinearGradient(0, base - h, 0, base);
    g.addColorStop(0, over ? 'rgba(200,250,114,0.9)' : i === 1 ? 'rgba(255,90,78,0.7)' : 'rgba(241,244,238,0.55)'); g.addColorStop(1, over ? 'rgba(200,250,114,0.3)' : 'rgba(241,244,238,0.15)');
    if (over) glow(BX[i], base - h, 160, '200,250,114', 0.25 * clamp(k)); x.fillStyle = g; rr(BX[i] - 75, base - h, 150, h, 14); x.fill();
    txt(lab, BX[i], base - h + 32, { size: 32, weight: 800, color: '#0b0d0c', alpha: clamp(k) > 0.95 ? 1 : 0 });
    txt(yr, BX[i], base + 42, { fam: 'mono', size: 28, weight: 600, color: over ? C.lime : C.muted, ls: 2, alpha: clamp(k) });
    x.save(); x.strokeStyle = '#050607'; x.lineWidth = 6; x.beginPath(); x.moveTo(BX[i] - 80, base - 22); x.lineTo(BX[i] - 25, base - 34); x.lineTo(BX[i] + 25, base - 22); x.lineTo(BX[i] + 80, base - 34); x.stroke(); x.restore(); });
  const kd = oC(seg(t, tL - 0.2, tL + 0.4)); dashLine(130, yL, 950, yL, C.ink, 3, [12, 10], kd * (0.6 + 0.4 * seg(t, tL, tL + 0.3)));

  const kb = seg(t, tS + 0.15, tS + 0.7); if (kb > 0 && kb < 1) { x.save(); x.strokeStyle = `rgba(200,250,114,${1 - kb})`; x.lineWidth = 4; x.beginPath(); x.ellipse(BX[3], yL, 80 + 120 * oC(kb), 18 + 30 * oC(kb), 0, 0, 7); x.stroke(); x.restore(); }
  txt('+4,6% sul 2019', BX[3] - 20, base - bh(BV[3][1]) - 34, { fam: 'mono', size: 26, weight: 600, color: C.lime, alpha: oC(seg(t, tS + 0.5, tS + 0.9)), ls: 1 });
  mono('MLD € · VALORI CONCATENATI 2020 · ASSE TAGLIATO', 540, 1405, t, a + 0.4, { size: 22 });
  x.restore(); finish(t); }

/* ================= ORE + PESO: due provette, poi la media che appiattisce ================= */
function tube(cx, base, h, w, lvl, k, c, t, slosh, label) { if (k <= 0) return; glass(cx, base - h / 2, w, h, 32, k);
  x.save(); x.globalAlpha *= k; x.beginPath(); x.roundRect(cx - w / 2 + 6, base - h + 6, w - 12, h - 12, 26); x.clip();
  const top = base - h * lvl, g = x.createLinearGradient(0, top, 0, base); g.addColorStop(0, rgba(c, 0.85)); g.addColorStop(1, rgba(c, 0.25)); x.fillStyle = g;
  x.beginPath(); x.moveTo(cx - w / 2, base); for (let px = cx - w / 2; px <= cx + w / 2; px += 8) x.lineTo(px, top + Math.sin(px * 0.05 + t * 7) * 9 * slosh); x.lineTo(cx + w / 2, base); x.closePath(); x.fill(); x.restore();
  if (lvl < 0.999) dashLine(cx - w / 2 - 12, base - h, cx + w / 2 + 12, base - h, 'rgba(241,244,238,0.6)', 2, [6, 6], k);
  txt(label, cx, base + 44, { fam: 'mono', size: 26, weight: 600, color: C.muted, alpha: k, ls: 2 }); }
const TB = { base: 1300, h: 560, w: 210 };
function oreTube(t, lvlK, slosh) { tube(360, TB.base, TB.h, TB.w, lerp(1, 0.882, lvlK), 1, mix(RGB.lime, RGB.red, lvlK), t, slosh, 'ORE LAVORATE'); }
function sOre(t, a, b) { bg('50,24,22', 0.45); x.save();
  phrase(t, a + 0.05, [['Il PIL non dice', C.ink], ['chi ha perso di più.', C.red]], 345, { size: 92 });
  const tN = WT('ore', 'numero', 1, 0.7), tO = WT('ore', 'ore', 1, 4.5), tC = WT('ore', 'calano', 1, 5.2), tQ = WT('ore', 'quasi', 1, 5.9);
  const kc = oC(seg(t, tN - 0.1, tN + 0.3)) * (1 - oC(seg(t, tO - 0.5, tO - 0.1)));
  if (kc > 0) { glassPill(540, 900, 'PIL 2020: −8,7%', kc, C.ink, 50); txt('?', 540, 1060, { size: 120, weight: 800, color: C.red, alpha: kc * oC(seg(t, tN + 0.8, tN + 1.2)) }); }
  const kt = oC(seg(t, tO - 0.2, tO + 0.3)), kd = ioC(seg(t, tC, tC + 1.2)), sl = kd > 0 && kd < 1 ? 1 : Math.max(0, 1 - (t - tC - 1.2) * 1.5) * (t > tC ? 1 : 0);
  x.save(); x.globalAlpha = kt; oreTube(t, kd, sl); x.restore();
  const kq = seg(t, tQ - 0.1, tQ + 0.4); if (kq > 0) { x.save(); const s = lerp(0.7, 1, oB(kq)); x.translate(360, 680); x.scale(s, s); txt('quasi −12%', 0, 0, { size: 50, weight: 800, color: C.red, alpha: clamp(kq * 2) }); x.restore(); }
  mono('EUROSTAT · CONTI NAZIONALI · 2020 SUL 2019', 540, 1420, t, tO, { size: 22 });
  x.restore(); finish(t); }
const BARS = [-3, -1, -6, -24, -2, -4, -1, -31, -5, -2, -18, -3, -1, -7, -27, -2], BMEAN = BARS.reduce((s, v) => s + v, 0) / BARS.length;
function sPeso(t, a, b) { bg('50,24,22', 0.45); x.save();
  const tOc = WT('peso', 'occupati', 1, 0.7), tSo = WT('peso', 'solo', 1, 1.0), tM = WT('peso', 'media', 1, 2.8), tCd = WT('peso', 'caduto', 1, 4.8), tP = WT('peso', 'peso', 1, 5.5);
  const kOut = oC(seg(t, tM - 0.2, tM + 0.3));
  phrase(t, a - 5, [['Il PIL non dice', C.ink], ['chi ha perso di più.', C.red]], 345, { size: 92, out: tM - 0.25 }); /* stesso titolo della scena ore: già in scena */
  phrase(t, tM + 0.05, [['La media nasconde', C.ink], ['chi cade più giù.', C.red]], 345, { size: 92 });
  if (kOut < 1) { x.save(); x.globalAlpha = 1 - kOut; x.translate(0, kOut * 40);
    oreTube(t, 1, 0); txt('quasi −12%', 360, 680, { size: 50, weight: 800, color: C.red });
    const ko = oC(seg(t, tOc - 0.2, tOc + 0.3)), kd = ioC(seg(t, tSo, tSo + 0.8));
    x.save(); x.globalAlpha *= ko; tube(720, TB.base, TB.h, TB.w, lerp(1, 0.98, kd), 1, RGB.lime, t, kd > 0 && kd < 1 ? 0.6 : 0, 'OCCUPATI'); x.restore();
    const ks = seg(t, tSo + 0.3, tSo + 0.7); if (ks > 0) { x.save(); const s = lerp(0.7, 1, oB(ks)); x.translate(720, 680); x.scale(s, s); txt('solo −2%', 0, 0, { size: 50, weight: 800, color: C.lime, alpha: clamp(ks * 2) }); x.restore(); }
    x.restore(); }
  const tB0 = tM + 0.25, kIn = oC(seg(t, tB0, tB0 + 0.4)); if (kIn > 0) { const z0 = 720, sc = 18, myy = z0 - BMEAN * sc, ku = ioC(seg(t, tCd - 0.3, tCd + 0.6)), kp = seg(t, tP - 0.1, tP + 0.4);
    x.save(); x.globalAlpha = kIn; x.strokeStyle = 'rgba(241,244,238,0.35)'; x.lineWidth = 3; x.beginPath(); x.moveTo(195, z0); x.lineTo(935, z0); x.stroke();
    BARS.forEach((v, i) => { const bx = 205 + i * 46, real = -v * sc, h = lerp(-BMEAN * sc, real, ku) * oC(seg(t, tB0 + i * 0.03, tB0 + 0.4 + i * 0.03)), deep = v < BMEAN * 1.5;
      const c = deep ? mix(RGB.grey, RGB.red, ku) : mix(RGB.grey, [241, 244, 238], ku * 0.4); if (deep && kp > 0) glow(bx + 16, z0 + h, 70, '255,90,78', 0.45 * kp * (0.7 + 0.3 * Math.sin(t * 8)));
      x.fillStyle = rgba(c, deep ? 0.85 : 0.5); rr(bx, z0, 32, Math.max(2, h), 8); x.fill(); });
    const kmv = 1; dashLine(195, myy, 935, myy, 'rgba(241,244,238,0.85)', 4, [14, 8], kmv);
    txt('MEDIA', 185, myy, { fam: 'mono', size: 24, weight: 600, color: C.ink, align: 'right', ls: 2 });
    x.restore();
    mono('ESEMPIO ILLUSTRATIVO', 540, 1420, t, tM + 0.3, { size: 22 }); }
  x.restore(); finish(t); }

/* ================= CASA: una palla che rimbalza ma non torna su ================= */
const CQ = [[200, 456.566], [370, 430.561], [540, 376.798], [710, 430.208], [880, 430.208 * 1.003]], cyq = (v) => 1180 - (v - 370) * 5.2, CP = CQ.map(([px, v]) => [px, cyq(v)]);
function sCasa(t, a, b) { bg('30,44,26'); x.save(); const d = b - a;
  const tRb = WT('casa', 'rimbalzo', 1, 2.4), tRp = WT('casa', 'ripresa', 1, 4.1);
  phrase(t, a + 0.05, [['Cosa ti porti a casa?', C.muted]], 345, { size: 70, out: tRb - 0.55 });
  phrase(t, tRb - 0.3, [['Un rimbalzo', C.ink], ['non è una ripresa.', C.lime]], 345, { size: 92 });
  const kc = oC(seg(t, a + 0.2, a + 0.7)); x.save(); x.globalAlpha = kc;
  dashLine(160, CP[0][1], 930, CP[0][1], 'rgba(200,250,114,0.6)', 3, [10, 10]);
  txt('LIVELLO FINE 2019', 160, CP[0][1] - 30, { fam: 'mono', size: 24, weight: 600, color: C.lime, align: 'left', ls: 2 });
  x.strokeStyle = 'rgba(241,244,238,0.35)'; x.lineWidth = 6; x.lineCap = 'round'; x.lineJoin = 'round'; x.beginPath(); CP.forEach((p, i) => (i ? x.lineTo(...p) : x.moveTo(...p))); x.stroke();
  const u = 4 * ioC(seg(t, a + 0.5, Math.max(a + 2.0, tRb + 0.6))), si = Math.min(3, Math.floor(u)), f = u - si, [ax0, ay0] = CP[si], [bx0, by0] = CP[si + 1];
  const hop = Math.sin(Math.PI * f) * (si === 2 ? 120 : 60), bx = lerp(ax0, bx0, f), by = lerp(ay0, by0, f) - hop - 24;
  x.strokeStyle = C.lime; x.lineWidth = 8; x.beginPath(); x.moveTo(...CP[0]); for (let i = 1; i <= si; i++) x.lineTo(...CP[i]); x.lineTo(lerp(ax0, bx0, f), lerp(ay0, by0, f)); x.stroke();
  glow(bx, by, 80, '200,250,114', 0.35); x.fillStyle = C.lime; x.beginPath(); x.arc(bx, by, 22, 0, 7); x.fill();
  x.restore();
  const kg = seg(t, tRb + 0.6, tRb + 1.1); if (kg > 0) { const gx = CP[4][0], y0 = CP[0][1] + 6, y1 = CP[4][1] - 50; x.save(); x.globalAlpha = oC(kg); x.strokeStyle = C.red; x.lineWidth = 3; x.beginPath(); x.moveTo(gx - 14, y0); x.lineTo(gx + 14, y0); x.moveTo(gx, y0); x.lineTo(gx, y1); x.moveTo(gx - 14, y1); x.lineTo(gx + 14, y1); x.stroke(); x.restore(); }
  glassPill(540, 1340, 'rimbalzo ≠ ripresa', seg(t, tRp - 0.2, tRp + 0.3), C.lime, 50);
  x.restore(); finish(t); }

serie({ hook: sHook, lockdown: sLock, fabbriche: sFab, circuito: sCirc, consumi: sConsumi, reale: sReale, trimestre: sTrim, rimbalzo: sRimb,
