<script>
// Puntata 1 (v2) — «Il circuito dell'economia». Dati: Eurostat nama_10_gdp, Italia 2025 (l1-fonti.md).
// Struttura fissa delle puntate: numero gigante → gancio → dove siamo / perché serve → spiegazione → caso → cosa ti porti a casa → «oggi è …, lezione N di 5» → like/commento/segui → firma col numero.
// Ogni scena parte quando la voce inizia la sua frase (window.CUES da cues.json).
const S = (k) => ((window.CUES || {})[k] || [0, 1])[0], E = (k) => ((window.CUES || {})[k] || [0, 1])[1];
const EP = 1, DAY = 0; // numero della puntata e giorno della settimana (0 = lunedì)
const ORDER = ['num', 'hook', 'dove', 'perche', 'fam', 'imp', 'stato', 'banche', 'estero', 'pil', 'torta', 'export', 'inceppa', 'recess', 'mercati', 'casa', 'fine', 'cta', 'end'];
const zoom = (t, a, b, z0 = 1.06) => { const z = lerp(z0, 1, oC(seg(t, a, b))); x.translate(540, 1000); x.scale(z, z); x.translate(-540, -1000); };

// ---------- il circuito ----------
const N = { fam: [290, 700, 'FAMIGLIE'], imp: [790, 700, 'IMPRESE'], stato: [170, 1100, 'STATO'], banche: [910, 1100, 'BANCHE'], estero: [540, 1290, 'ESTERO'] };
function icon(k, cx, cy, col) {
  x.save(); x.strokeStyle = col; x.fillStyle = col; x.lineWidth = 5; x.lineCap = 'round'; x.lineJoin = 'round';
  if (k === 'fam') { for (const [dx, r] of [[-22, 16], [20, 13]]) { x.beginPath(); x.arc(cx + dx, cy - 18, r, 0, 7); x.stroke(); x.beginPath(); x.arc(cx + dx, cy + 26, r * 1.5, Math.PI, 0); x.stroke(); } }
  if (k === 'imp') { x.beginPath(); x.moveTo(cx - 40, cy + 30); x.lineTo(cx - 40, cy - 5); x.lineTo(cx - 15, cy + 8); x.lineTo(cx - 15, cy - 5); x.lineTo(cx + 10, cy + 8); x.lineTo(cx + 10, cy - 30); x.lineTo(cx + 40, cy - 30); x.lineTo(cx + 40, cy + 30); x.closePath(); x.stroke(); }
  if (k === 'stato') { x.beginPath(); x.moveTo(cx - 44, cy - 14); x.lineTo(cx, cy - 40); x.lineTo(cx + 44, cy - 14); x.closePath(); x.stroke(); for (const dx of [-28, 0, 28]) { x.beginPath(); x.moveTo(cx + dx, cy - 6); x.lineTo(cx + dx, cy + 26); x.stroke(); } x.beginPath(); x.moveTo(cx - 46, cy + 34); x.lineTo(cx + 46, cy + 34); x.stroke(); }
  if (k === 'banche') { x.beginPath(); x.roundRect(cx - 42, cy - 28, 84, 60, 10); x.stroke(); txt('€', cx, cy + 2, { size: 46, weight: 800, color: col }); }
  if (k === 'estero') { x.beginPath(); x.arc(cx, cy, 36, 0, 7); x.stroke(); x.beginPath(); x.ellipse(cx, cy, 16, 36, 0, 0, 7); x.stroke(); x.beginPath(); x.moveTo(cx - 36, cy); x.lineTo(cx + 36, cy); x.stroke(); }
  x.restore();
}
function node(k, kIn, hot) {
  if (kIn <= 0) return; const [cx, cy, lab] = N[k]; const s = lerp(0.7, 1, oB(clamp(kIn)));
  x.save(); x.translate(cx, cy); x.scale(s, s); x.translate(-cx, -cy);
  if (hot > 0) glow(cx, cy, 190, '200,250,114', 0.28 * hot);
  glass(cx, cy, 190, 190, 95, clamp(kIn * 2));
  if (hot > 0) { x.save(); x.globalAlpha = hot; x.strokeStyle = C.lime; x.lineWidth = 4; x.beginPath(); x.arc(cx, cy, 97, 0, 7); x.stroke(); x.restore(); }
  icon(k, cx, cy, hot > 0.5 ? C.lime : C.ink);
  txt(lab, cx, cy + 128, { fam: 'mono', size: 26, weight: 600, color: hot > 0.5 ? C.lime : C.muted, ls: 3, alpha: clamp(kIn * 2) });
  x.restore();
}
// flussi: [da, a, etichetta, chiave di inizio, ritardo, curvatura]
const FL = [['imp', 'fam', 'stipendi', 'fam', 1.6, -0.25], ['fam', 'imp', 'spesa', 'fam', 3.6, -0.25],
  ['fam', 'stato', 'tasse', 'stato', 1.0, 0.2], ['stato', 'fam', 'servizi · pensioni', 'stato', 2.4, 0.2],
  ['fam', 'banche', 'risparmi', 'banche', 1.0, 0.18], ['banche', 'imp', 'prestiti', 'banche', 3.0, -0.3],
  ['estero', 'imp', 'import', 'estero', 1.2, -0.25], ['imp', 'estero', 'export', 'estero', 3.2, -0.25]];
function curve(a, b, bend) { const [x0, y0] = N[a], [x1, y1] = N[b]; const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, dx = x1 - x0, dy = y1 - y0;
  const cx = mx - dy * bend, cy = my + dx * bend; const r = 110; const L0 = Math.hypot(cx - x0, cy - y0), L1 = Math.hypot(x1 - cx, y1 - cy);
  return { p0: [x0 + (cx - x0) / L0 * r, y0 + (cy - y0) / L0 * r], c: [cx, cy], p1: [x1 - (x1 - cx) / L1 * r, y1 - (y1 - cy) / L1 * r] }; }
const qp = (q, u) => [ (1 - u) * (1 - u) * q.p0[0] + 2 * (1 - u) * u * q.c[0] + u * u * q.p1[0], (1 - u) * (1 - u) * q.p0[1] + 2 * (1 - u) * u * q.c[1] + u * u * q.p1[1] ];
function circuit(t, o = {}) {
  const { speed = 1, jam = 0, scale = 1, hotKey = null, nodesIn = null, flowsAll = false } = o;
  x.save(); x.translate(540, 1000); x.scale(scale, scale); x.translate(-540, -1000);
  FL.forEach(([a, b, lab, key, d, bend], i) => {
    const st = S(key) + d, k = flowsAll ? 1 : oC(seg(t, st, st + 0.6)); if (k <= 0) return;
    const q = curve(a, b, bend), recent = !flowsAll && t < st + 3.5, isJam = jam > 0 && i === 1;
    const col = isJam ? `rgba(255,90,78,${0.5 + 0.5 * jam})` : recent ? C.lime : 'rgba(241,244,238,0.45)';
    x.save(); x.globalAlpha = k; x.strokeStyle = col; x.lineWidth = recent ? 4 : 2.5; x.setLineDash([2, 10]); x.beginPath(); x.moveTo(...q.p0); x.quadraticCurveTo(...q.c, ...q.p1); x.stroke(); x.setLineDash([]);
    // freccia
    const e = qp(q, 0.97), e2 = qp(q, 0.9), ang = Math.atan2(e[1] - e2[1], e[0] - e2[0]); x.fillStyle = col; x.beginPath(); x.moveTo(e[0] + Math.cos(ang) * 14, e[1] + Math.sin(ang) * 14); x.lineTo(e[0] + Math.cos(ang + 2.5) * 16, e[1] + Math.sin(ang + 2.5) * 16); x.lineTo(e[0] + Math.cos(ang - 2.5) * 16, e[1] + Math.sin(ang - 2.5) * 16); x.closePath(); x.fill();
    // monete che scorrono (la velocità si «inceppa»)
    const sp = speed * (isJam ? 1 - 0.9 * jam : 1);
    for (let j = 0; j < 3; j++) { const u = ((t - st) * 0.45 * sp + j / 3) % 1; if (u < 0) continue; const [px, py] = qp(q, u); x.fillStyle = col; x.beginPath(); x.arc(px, py, recent ? 9 : 6, 0, 7); x.fill(); if (recent) glow(px, py, 30, isJam ? '255,90,78' : '200,250,114', 0.35); }
    const m = qp(q, 0.5); txt(lab, m[0], m[1] - 24, { fam: 'mono', size: 27, weight: 600, color: col, alpha: k * (recent || flowsAll ? 1 : 0.7), ls: 1 });
    if (isJam && jam > 0.3) { x.save(); x.strokeStyle = C.red; x.lineWidth = 10; x.lineCap = 'round'; const [jx, jy] = qp(q, 0.5); const r = 26 * jam; x.beginPath(); x.moveTo(jx - r, jy - r + 26); x.lineTo(jx + r, jy + r + 26); x.moveTo(jx + r, jy - r + 26); x.lineTo(jx - r, jy + r + 26); x.stroke(); x.restore(); }
    x.restore();
  });
  Object.keys(N).forEach((k, i) => node(k, nodesIn ? nodesIn[i] : 1, hotKey === k ? 1 : 0));
  x.restore();
}

// ---------- scene ----------
function sHook(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.08);
  phrase(t, a + 0.05, [['Ogni euro che spendi', C.ink], ['è lo stipendio', C.lime], ['di qualcun altro.', C.lime]], 360, { size: 92 });
  const k1 = oC(seg(t, a + 0.3, a + 0.8)); glass(300, 1080, 220, 220, 110, k1); txt('TU', 300, 1084, { size: 56, weight: 800, alpha: k1 });
  const k2 = oC(seg(t, a + 0.5, a + 1.0)); glass(780, 1080, 220, 220, 110, k2); txt('QUALCUNO', 780, 1084, { fam: 'mono', size: 26, weight: 600, color: C.muted, alpha: k2, ls: 2 });
  tap(300, 1080, t, a + 1.1);
  const kc = seg(t, a + 1.2, a + 2.4); if (kc > 0 && kc < 1) { const px = lerp(300, 780, ioC(kc)), py = 1080 - Math.sin(Math.PI * kc) * 180; coin(px, py, 60, 1, '200,250,114', '€'); }
  if (kc >= 1) { glow(780, 1080, 200, '200,250,114', 0.25); txt('+ 1 €', 780, 1230, { size: 48, weight: 800, color: C.lime, alpha: oC(seg(t, a + 2.4, a + 2.7)) }); }
  x.restore(); finish(t); }
function sIntro(t, a, b) { bg(); x.save();
  mono('LEZIONE 1 · COME GIRA L’ECONOMIA', 540, 300, t, a, { size: 24, color: C.lime });
  phrase(t, a + 0.1, [['Il circuito', C.ink], ['in cinque pezzi.', C.lime]], 400, { size: 92 });
  const d = b - a, ks = Object.keys(N).map((_, i) => seg(t, a + 0.6 + i * d * 0.12, a + 1.0 + i * d * 0.12));
  circuit(t, { nodesIn: ks });
  x.restore(); finish(t); }
const HEAD = { fam: ['1 · Le famiglie', 'lavorano → stipendio → spesa'],
  imp: ['2 · Le imprese', 'vendono · pagano · investono'], stato: ['3 · Lo Stato', 'tasse ↔ scuole, sanità, pensioni'],
  banche: ['4 · Le banche', 'risparmi → prestiti'], estero: ['5 · L’estero', 'energia, tecnologia ↔ macchinari, moda, cibo'] };
function sCirc(t, a, b, key) { bg(); x.save();
  const [h, sub] = HEAD[key]; phrase(t, a + 0.05, [[h, C.ink]], 330, { size: 84 });
  txt(typed(sub, t, a + 0.3, 40), 540, 430, { fam: 'mono', size: 26, weight: 600, color: C.lime, ls: 1 });
  circuit(t, { hotKey: key });
  if (key === 'imp') { const k = oC(seg(t, a + 1.4, a + 2.0)); if (k > 0) { const [cx, cy] = N.imp; x.save(); x.globalAlpha = k; x.strokeStyle = C.lime; x.lineWidth = 4; x.beginPath(); x.arc(cx + 120, cy - 120, 46, 0.3, Math.PI * 1.7); x.stroke(); x.restore(); txt('investimenti', cx + 120, cy - 190, { fam: 'mono', size: 22, weight: 600, color: C.lime, alpha: k }); } }
  x.restore(); finish(t); }
function sPil(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.06);
  phrase(t, a + 0.05, [['Quanto pesa', C.ink], ['ogni pezzo?', C.ink]], 380, { size: 96 });
  const k = oC(seg(t, lerp(a, b, 0.35), lerp(a, b, 0.35) + 0.4)), v = 2265 * ioC(seg(t, lerp(a, b, 0.35), lerp(a, b, 0.85)));
  txt('€' + Math.round(v).toLocaleString('it-IT') + ' mld', 540, 860, { size: 170, weight: 800, color: C.lime, alpha: k, blur: (1 - k) * 12, ls: -4 });
  mono('PIL ITALIA 2025 · EUROSTAT', 540, 1000, t, lerp(a, b, 0.5), { size: 26 });
  for (let i = 0; i < 9; i++) { const kk = oC(seg(t, lerp(a, b, 0.4) + i * 0.05, lerp(a, b, 0.4) + i * 0.05 + 0.4)); coin(540, 1360 - i * 24 - (1 - kk) * 50, 160, kk, '200,250,114', '€'); }
  x.restore(); finish(t); }
function sTorta(t, a, b) { bg(); x.save();
  phrase(t, a + 0.05, [['Dove va il PIL', C.ink]], 330, { size: 88 });
  const SEG = [['CONSUMI', 57.7, C.lime, 0.0], ['INVESTIMENTI', 22.0, C.ink, 0.42], ['STATO', 18.1, C.muted, 0.68]], d = b - a, cx = 540, cy = 900, R = 260;
  let acc = -Math.PI / 2;
  SEG.forEach(([lab, v, col, f]) => { const k = ioC(seg(t, a + f * d, a + f * d + 0.9)), ang = (v / 100) * Math.PI * 2;
    if (k > 0) { x.save(); x.strokeStyle = col; x.lineWidth = 80; x.beginPath(); x.arc(cx, cy, R, acc, acc + ang * k); x.stroke(); x.restore();
      const mid = acc + ang / 2, lx = clamp(cx + Math.cos(mid) * (R + 170), 150, 930), ly = cy + Math.sin(mid) * (R + 150);
      txt(lab, lx, ly - 20, { fam: 'mono', size: 24, weight: 600, color: col, alpha: oC(seg(t, a + f * d + 0.5, a + f * d + 0.9)) });
      txt(String(v).replace('.', ',') + '%', lx, ly + 22, { size: 54, weight: 800, color: col, alpha: oC(seg(t, a + f * d + 0.5, a + f * d + 0.9)) }); }
    acc += ang; });
  const cur = SEG.filter(([, , , f]) => t >= a + f * d).pop() || SEG[0];
  txt(cur[0] === 'CONSUMI' ? '≈ 6 su 10' : cur[0] === 'INVESTIMENTI' ? '≈ 2 su 10' : '≈ 2 su 10', cx, cy, { size: 64, weight: 800, color: cur[2] });
  txt('€ di PIL', cx, cy + 60, { fam: 'mono', size: 22, weight: 600, color: C.muted });
  mono('ITALIA 2025 · EUROSTAT · LA PARTE MANCANTE: SCORTE E SALDO CON L’ESTERO', 540, 1420, t, a + 0.5, { size: 18 });
  x.restore(); finish(t); }
function sExport(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.05);
  phrase(t, a + 0.05, [['Vendiamo all’estero', C.ink], ['quasi un terzo.', C.lime]], 360, { size: 92 });
  const k = ioC(seg(t, a + 0.8, a + 2.2)); x.save(); x.strokeStyle = 'rgba(241,244,238,0.35)'; x.lineWidth = 3; rr(120, 820, 840, 120, 20); x.stroke(); x.restore();
  x.fillStyle = C.lime; rr(126, 826, 828 * 0.316 * k, 108, 16); x.fill();
  txt('PIL = 100%', 820, 880, { fam: 'mono', size: 26, weight: 600, color: C.muted, alpha: oC(seg(t, a + 0.4, a + 0.8)) });
  txt(Math.round(31.6 * k) + '%', 126 + 828 * 0.316 * k / 2, 880, { size: 54, weight: 800, color: '#15200C', alpha: k > 0.25 ? 1 : 0 });
  mono('EXPORT ITALIA 2025 · EUROSTAT', 540, 990, t, a + 1.4, { size: 24 });
  for (let i = 0; i < 6; i++) { const kk = oC(seg(t, a + 1.0 + i * 0.12, a + 1.4 + i * 0.12)), px = lerp(200, 880, ((t - a) * 0.12 + i / 6) % 1); x.save(); x.globalAlpha = kk; rr(px - 60, 1200, 120, 70, 6); x.fillStyle = i % 2 ? '#1c2a12' : '#151a17'; x.fill(); x.strokeStyle = C.lime; x.lineWidth = 2; x.stroke(); for (let r2 = 0; r2 < 4; r2++) { x.fillStyle = 'rgba(200,250,114,0.3)'; x.fillRect(px - 50 + r2 * 26, 1210, 4, 50); } x.restore(); }
  x.save(); x.strokeStyle = 'rgba(241,244,238,0.25)'; x.lineWidth = 3; x.beginPath(); x.moveTo(120, 1290); x.lineTo(960, 1290); x.stroke(); x.restore();
  x.restore(); finish(t); }
function sIncep(t, a, b) { bg('50,24,22', 0.6); x.save();
  phrase(t, a + 0.05, [['Se un pezzo', C.ink], ['si inceppa…', C.red]], 330, { size: 88 });
  circuit(t, { flowsAll: true, jam: oC(seg(t, lerp(a, b, 0.45), lerp(a, b, 0.8))), speed: 1 - 0.6 * seg(t, lerp(a, b, 0.5), b) });
  x.restore(); finish(t); }
function sRecess(t, a, b) { bg('50,24,22', 0.7); x.save();
  const L = [['le famiglie spendono meno', 0.0], ['le imprese vendono meno', 0.22], ['assumono meno', 0.42], ['gli stipendi calano', 0.6]], d = b - a;
  L.forEach(([s, f], i) => { const k = seg(t, a + f * d, a + f * d + 0.4); glassPill(540, 420 + i * 190, s, k, C.ink, 42);
    if (i < 3) { const ka = oC(seg(t, a + f * d + 0.3, a + f * d + 0.6)); x.save(); x.globalAlpha = ka; x.strokeStyle = C.red; x.lineWidth = 5; x.beginPath(); x.moveTo(540, 470 + i * 190); x.lineTo(540, 560 + i * 190); x.stroke(); x.beginPath(); x.moveTo(540, 562 + i * 190); x.lineTo(526, 544 + i * 190); x.moveTo(540, 562 + i * 190); x.lineTo(554, 544 + i * 190); x.stroke(); x.restore(); } });
  const kr = seg(t, a + 0.78 * d, a + 0.78 * d + 0.4); if (kr > 0) { glow(540, 1260, 300, '255,90,78', 0.25 * kr); glassPill(540, 1260, 'RECESSIONE', kr, C.red, 64); }
  x.restore(); finish(t); }
function sMercati(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04);
  phrase(t, a + 0.05, [['I mercati guardano', C.ink], ['ogni giorno', C.lime]], 340, { size: 88 });
  const kc = oC(seg(t, a + 0.4, a + 0.9)); glass(540, 920, 820, 520, 40, kc);
  mono('CALENDARIO MACRO', 540, 720, t, a + 0.6, { size: 24, color: C.lime });
  const R2 = [['Vendite al dettaglio', 'CONSUMI'], ['Fiducia dei consumatori', 'CONSUMI'], ['Prestiti bancari', 'CREDITO']];
  R2.forEach(([s, tag], i) => { const k = oC(seg(t, a + 1.0 + i * 0.5, a + 1.4 + i * 0.5)), y = 820 + i * 120; if (k <= 0) return;
    txt(s, 190 + (1 - k) * 20, y, { size: 40, weight: 700, align: 'left', alpha: k }); txt(tag, 890, y, { fam: 'mono', size: 20, weight: 600, color: C.muted, align: 'right', alpha: k, ls: 2 });
    x.save(); x.globalAlpha = k * 0.25; x.fillStyle = C.ink; x.fillRect(190, y + 50, 700, 2); x.restore(); });
  tap(820, 940, t, a + 2.4);
  x.restore(); finish(t); }
function sCasa(t, a, b) { bg('30,44,26'); x.save();
  const d = b - a;
  phrase(t, a + 0.05, [['Cosa ti porti a casa?', C.muted]], 320, { size: 70, out: a + 0.28 * d });
  phrase(t, a + 0.3 * d, [['È un giro di soldi.', C.ink], ['E tu ci sei dentro.', C.lime]], 320, { size: 92 });
  circuit(t, { flowsAll: true, scale: 0.78, hotKey: 'fam' });
  x.restore(); finish(t); }
function sNext(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04);
  mono('PROSSIMA LEZIONE', 540, 600, t, a, { size: 26, color: C.lime });
  phrase(t, a + 0.1, [['Il PIL:', C.ink], ['cosa misura davvero.', C.ink], ['E cosa no.', C.lime]], 720, { size: 92 });
  x.restore(); finish(t); }
function sEnd(t, a) { bg();
  txt(typed('@macro.algo.desk', t, a + 0.1, 28), 540, 820, { size: 66, weight: 800, color: C.ink, ls: -1 });
  txt('Dalla teoria alla realtà · Lezione 1', 540, 905, { size: 36, weight: 500, color: C.muted, alpha: oC(seg(t, a + 0.6, a + 1.0)) });
  const kp = oC(seg(t, a + 0.8, a + 1.2)), kf = seg(t, a + 1.5, a + 1.85);
  if (kp > 0) { const on = kf > 0.25, w = on ? 320 : 260, s = (kf > 0 ? 1 + 0.08 * Math.sin(Math.PI * kf) : 1) * lerp(0.85, 1, kp);
    x.save(); x.translate(540, 1035); x.scale(s, s); x.globalAlpha = kp; rr(-w / 2, -48, w, 96, 48);

    txt(on ? 'Segui già' : 'Segui', 0, 2, { size: 40, weight: 700, color: on ? '#15200C' : C.ink }); x.restore(); }
  tap(560, 1040, t, a + 1.5);
  txt('CONTENUTO EDUCATIVO · NON È CONSULENZA FINANZIARIA', 540, 1300, { fam: 'mono', size: 20, weight: 500, color: '#6C756F', ls: 2, alpha: oC(seg(t, a + 1.0, a + 1.4)) });
  txt('DATI: EUROSTAT · CONTI NAZIONALI ITALIA 2025', 540, 1340, { fam: 'mono', size: 20, weight: 500, color: '#6C756F', ls: 2, alpha: oC(seg(t, a + 1.0, a + 1.4)) });

// ---------- scene nuove della struttura fissa ----------
function sNum(t, a, b) { bg('30,44,26'); x.save();
  const k = oC(seg(t, 0, 0.5)), ko = ioC(seg(t, b - 0.45, b));
  const s = lerp(1.25, 1, k) * lerp(1, 0.25, ko), y = lerp(960, 330, ko);
  glow(540, y, 520 * s, '200,250,114', 0.25 * k * (1 - ko));
  x.save(); x.translate(540, y); x.scale(s, s); txt(String(EP), 0, 0, { size: 820, weight: 800, color: C.ink, alpha: k * (1 - ko * 0.9), blur: (1 - k) * 20, ls: -30 }); x.restore();
  txt('DALLA TEORIA ALLA REALTÀ', 540, 1380, { fam: 'mono', size: 30, weight: 600, color: C.lime, ls: 6, alpha: k * (1 - ko) });
  x.restore(); finish(t); }
const CAPS = ['Come gira l’economia', 'Soldi e banche', 'Inflazione', 'Banche centrali', 'Stato e tasse', 'Mercati finanziari', 'Macro e mercati', 'Europa e geopolitica', 'Aziende e bilanci', 'Investire', 'Trading', 'Portafoglio'];
function sDove(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.05);
  mono('IL PERCORSO', 540, 300, t, a, { size: 26, color: C.lime });
