<script>const P = { EP: 3, DAY: 2, CAP: 0, NEXT: ['PIL nominale', 'e PIL reale'], FONTE: 'DATI: ISTAT (USO DEL TEMPO 2023, REDDITI 2024, BES 2025) · MEF' };</script>
<script src="serie.js"></script>
<script>
/* Puntata 3 — «Cosa il PIL non misura». Numeri a schermo solo da p3-fonti.md.
   Kennedy 18/3/1968 University of Kansas (prodotto nazionale lordo); Istat Uso del tempo 2023 (donne 4 h 21 min, uomini 1 h 54 min);
   Istat stima 2014 (lavoro non pagato > 1/3 del PIL); Istat redditi 2024 (S80/S20 circa 5); BES dal 2010, 152 indicatori, 12 domini;
   legge 163/2016: 12 indicatori nei documenti di bilancio; MEF: primo paese UE e G7. */
const ORDER = ['num', 'hook', 'ponte', 'kennedy', 'citazione', 'gratis', 'ore', 'terzo', 'diviso', 'quinti', 'benessere', 'legge', 'primo', 'casa', 'fine', 'cta', 'end'];

/* WA: come WT ma prova più grafie della stessa parola (Whisper: «l'Istat» → «listat», «G7» / «gi») */
const WA = (k, ws, n, ris) => { for (const w of ws) { const v = WT(k, w, n, NaN); if (!isNaN(v)) return v; } return S(k) + ris; };
const hash = (n) => { const r = Math.sin(n * 12.9898 + 4.1) * 43758.5453; return r - Math.floor(r); };

/* ================= IL PONTE (hook + ponte) ================= */
const BX0 = 110, BX1 = 690, DECK = 900, FLOOR = 1270, NSEG = 8, SW = (BX1 - BX0) / NSEG, PIERS = [255, 400, 545];
const RUB = [...Array(NSEG).keys()].map((i) => ({ x: BX0 + SW * (i + 0.5) + (hash(i) - 0.5) * 60, ang: (hash(i + 9) - 0.5) * 1.1, y: FLOOR - 17 - (i % 3 === 1 ? 24 : 0), d: Math.abs(i - 3.5) * 0.05 }));
function piece(cx, cy, ang, tint, a, w = SW - 6, h = 32) { if (a <= 0) return; x.save(); x.translate(cx, cy); x.rotate(ang); x.globalAlpha *= a;
  x.fillStyle = `rgba(${tint},0.16)`; rr(-w / 2, -h / 2, w, h, 6); x.fill(); glass(0, 0, w, h, 6, 1, tint);
  x.strokeStyle = `rgba(${tint},0.75)`; x.lineWidth = 2; rr(-w / 2, -h / 2, w, h, 6); x.stroke(); x.restore(); }
function banks(k) { if (k <= 0) return; x.save(); x.globalAlpha *= k;
  for (const [xa, xb] of [[50, BX0], [BX1, 750]]) { x.fillStyle = metal(xa, 0, xb, 0, true); x.fillRect(xa, DECK - 16, xb - xa, FLOOR - DECK + 26); x.fillStyle = 'rgba(200,250,114,0.4)'; x.fillRect(xa, DECK - 16, xb - xa, 3); }
  x.fillStyle = 'rgba(241,244,238,0.14)'; x.fillRect(50, FLOOR, 700, 3); x.restore(); }
function fallState(i, t, tc) { const r = RUB[i], x0 = BX0 + SW * (i + 0.5), dt = t - tc - r.d; if (dt <= 0) return { px: x0, py: DECK, ang: 0, down: 0 };
  const py = Math.min(r.y, DECK + 0.5 * 2600 * dt * dt), u = clamp((py - DECK) / (r.y - DECK)); return { px: lerp(x0, r.x, u), py, ang: r.ang * u, down: u }; }
function oldBridge(t, tc, o = {}) { const { k = 1, grey = 0 } = o; if (k <= 0) return;
  const tint = (u) => (grey > 0 ? '150,158,152' : u > 0.95 ? '255,90,78' : '200,250,114'), ga = grey > 0 ? 0.5 : 1;
  PIERS.forEach((px, j) => { const dt = t - tc - 0.08 * j, u = dt <= 0 ? 0 : ioC(clamp(dt / 0.45)), hp = lerp(FLOOR - DECK - 16, 44, u);
    piece(px, FLOOR - hp / 2, u * (j - 1) * 0.15, tint(u), k * ga, 26, hp); });
  for (let i = 0; i < NSEG; i++) { const fixed = i === 0 || i === NSEG - 1, s = fixed ? { px: BX0 + SW * (i + 0.5), py: DECK, ang: 0, down: 0 } : fallState(i, t, tc);
    piece(s.px, s.py, s.ang, fixed ? '200,250,114' : tint(s.down), k * (fixed ? 1 : ga)); }
  /* polvere all'impatto */
  if (!grey) for (let i = 1; i < NSEG - 1; i++) { const r = RUB[i], tl = tc + r.d + Math.sqrt(2 * (r.y - DECK) / 2600), u = seg(t, tl, tl + 0.9); if (u <= 0 || u >= 1) continue;
    for (let j = 0; j < 4; j++) { const ang = -Math.PI * (0.15 + 0.7 * hash(i * 7 + j)), d = 30 + 70 * oC(u);
      x.fillStyle = `rgba(139,149,143,${0.4 * (1 - u)})`; x.beginPath(); x.arc(r.x + Math.cos(ang) * d, FLOOR - 10 + Math.sin(ang) * d * 0.6, 6 + 10 * u, 0, 7); x.fill(); } }
}
const archY = (u) => 1090 - 580 * u * (1 - u);
function newArch(k) { if (k <= 0) return; x.save(); x.strokeStyle = 'rgba(200,250,114,0.85)'; x.lineWidth = 6; x.lineCap = 'round'; x.beginPath();
  for (let i = 0; i <= 60 * k; i++) { const u = i / 60; i ? x.lineTo(BX0 + 580 * u, archY(u)) : x.moveTo(BX0, archY(0)); } x.stroke(); x.restore(); }
/* colonnina del PIL accanto al ponte */
function pilCol(level, k, up = 0) { if (k <= 0) return; const cx = 900, top = 700, bot = 1250, w = 110;
  if (up > 0) glow(cx, bot - (bot - top) * level, 160, '200,250,114', 0.25 * up);
  glass(cx, (top + bot) / 2, w, bot - top, 40, k);
  x.save(); x.globalAlpha *= k; x.beginPath(); x.roundRect(cx - w / 2, top, w, bot - top, 40); x.clip(); const ty = bot - (bot - top) * level;
  const g = x.createLinearGradient(0, ty, 0, bot); g.addColorStop(0, 'rgba(200,250,114,0.85)'); g.addColorStop(1, 'rgba(200,250,114,0.25)'); x.fillStyle = g; x.fillRect(cx - w / 2, ty, w, bot - ty); x.restore();
  if (up > 0) { const ty2 = bot - (bot - top) * level - 30 - 6 * Math.sin(up * 20); x.save(); x.globalAlpha *= up; x.fillStyle = C.lime; x.beginPath(); x.moveTo(cx, ty2 - 18); x.lineTo(cx + 18, ty2 + 8); x.lineTo(cx - 18, ty2 + 8); x.closePath(); x.fill(); x.restore(); }
  txt('PIL', cx, 1300, { fam: 'mono', size: 30, weight: 600, color: C.lime, alpha: k, ls: 3 }); }

function sHook(t, a, b) { bg('50,24,22', 0.6); x.save();
  const tc = WT('hook', 'crolla', 1, 1.0) - 0.05, tp = WT('hook', 'prodotto', 1, 2.8), tn = WT('hook', 'nessuno', 1, 4.5);
  phrase(t, a + 0.05, [['Crolla un ponte,', C.ink]], 345, { size: 92 });
  phrase(t, tp - 0.1, [['il PIL sale.', C.lime]], 448, { size: 92 });
  const kb = oC(seg(t, a + 0.1, a + 0.6)), sh = t > tc && t < tc + 0.6 ? (1 - (t - tc) / 0.6) * 9 * Math.sin((t - tc) * 70) : 0;
  x.save(); x.translate(sh, 0); banks(kb); oldBridge(t, tc, { k: kb }); x.restore();
  if (t > tc) glow(400, FLOOR - 30, 300, '255,90,78', 0.18 * oC(seg(t, tc + 0.3, tc + 0.8)));
  const ku = seg(t, tp, tp + 1.4); pilCol(lerp(0.3, 0.62, ioC(ku)), oC(seg(t, a + 0.3, a + 0.8)), ku > 0 && ku < 1 ? 1 : 0);
  glassPill(540, 1405, 'nessuno sta meglio', seg(t, tn - 0.1, tn + 0.35), C.red, 44);
  x.restore(); finish(t); }

function sPonte(t, a, b) { bg(); x.save();
  const tr0 = WT('ponte', 'ricostruire', 1, 0.3), tr1 = WT('ponte', 'conta', 1, 2.1) + 0.2, tpe = WT('ponte', 'perso', 1, 3.4), tso = WT('ponte', 'sottratto', 1, 4.5);
  phrase(t, a + 0.05, [['Ricostruire', C.ink], ['si paga: conta.', C.lime]], 345, { size: 92 });
  banks(1); oldBridge(t, -100, { grey: 1 });
  /* l'ombra grigia: le macerie restano, mai tolte dal conto */
  const kp = oC(seg(t, tpe - 0.1, tpe + 0.3)); if (kp > 0) { glow(400, FLOOR - 25, 260, '200,205,200', 0.14 * kp);
    txt('IL PONTE PERSO', 400, 1322, { fam: 'mono', size: 26, weight: 600, color: C.muted, alpha: kp, ls: 3 }); }
  newArch(oC(seg(t, tr0 - 0.2, tr0 + 0.4)));
  let lv = 0.62; const n = NSEG - 2, step = (tr1 - tr0 - 0.3) / n;
  for (let j = 0; j < n; j++) { const i = j + 1, cx = BX0 + SW * (i + 0.5), tl = tr0 + 0.3 + j * step, kf = seg(t, tl - 0.3, tl);
    if (kf > 0) { const u = (cx - BX0) / 580; x.save(); x.globalAlpha = oC(kf); x.strokeStyle = 'rgba(200,250,114,0.5)'; x.lineWidth = 3; x.beginPath(); x.moveTo(cx, archY(u)); x.lineTo(cx, DECK + 16); x.stroke(); x.restore();
      piece(cx, lerp(620, DECK, ioC(kf)), 0, '200,250,114', oC(kf)); }
    const ke = seg(t, tl, tl + 0.9); if (ke > 0 && ke < 1) txt('+ €', cx, DECK - 60 - 50 * oC(ke), { size: 40, weight: 800, color: C.lime, alpha: 1 - ke * ke });
    const kc = seg(t, tl, tl + 0.45); if (kc > 0 && kc < 1) { const q = oC(kc); coin(lerp(cx, 900, q), lerp(DECK - 30, 700 + 550 * (1 - lv), q) - Math.sin(Math.PI * q) * 90, 26, 1, '200,250,114', '€'); }
    lv += 0.045 * oC(seg(t, tl + 0.35, tl + 0.6)); }
  const ku = seg(t, tr0 + 0.3, tr1 + 0.6); pilCol(lv, 1, ku > 0 && ku < 1 ? 1 : 0);
  /* la sottrazione che non avviene */
  const ka = oC(seg(t, tso - 0.4, tso + 0.1)); if (ka > 0) { const q = { p0: [470, 1225], c: [800, 1190], p1: [845, 1140] };
    x.save(); x.strokeStyle = 'rgba(255,90,78,0.85)'; x.lineWidth = 4; x.setLineDash([10, 10]); x.beginPath();
    for (let i = 0; i <= 40 * ka; i++) { const u = i / 40, px = (1 - u) * (1 - u) * q.p0[0] + 2 * u * (1 - u) * q.c[0] + u * u * q.p1[0], py = (1 - u) * (1 - u) * q.p0[1] + 2 * u * (1 - u) * q.c[1] + u * u * q.p1[1]; i ? x.lineTo(px, py) : x.moveTo(px, py); }
    x.stroke(); x.restore(); cross(668, 1196, 24, seg(t, tso, tso + 0.4)); }
  glassPill(540, 1408, 'non viene sottratto', seg(t, tso, tso + 0.4), C.red, 42);
  x.restore(); finish(t); }

/* ================= KENNEDY ================= */
function factory(cx, by, s, k, t) { if (k <= 0) return; x.save(); x.translate(cx, by); x.scale(s, s); x.globalAlpha *= k;
  for (let j = 0; j < 6; j++) { const u = (t * 0.5 + j / 6) % 1, sx = (j % 2 ? 47 : -38) + u * 30, sy = -255 - u * 110; x.fillStyle = `rgba(139,149,143,${0.35 * (1 - u)})`; x.beginPath(); x.arc(sx, sy, 16 + u * 24, 0, 7); x.fill(); }
  x.fillStyle = metal(-130, 0, 130, 0, true); rr(-55, -250, 34, 170, 4); x.fill(); rr(30, -230, 34, 150, 4); x.fill();
  x.beginPath(); x.moveTo(-130, 0); x.lineTo(-130, -110); x.lineTo(-70, -80); x.lineTo(-70, -110); x.lineTo(-10, -80); x.lineTo(-10, -110); x.lineTo(50, -80); x.lineTo(130, -80); x.lineTo(130, 0); x.closePath(); x.fill();
  x.strokeStyle = 'rgba(255,90,78,0.6)'; x.lineWidth = 3; x.stroke();
  x.fillStyle = 'rgba(245,165,36,0.55)'; for (const wx of [-100, -40, 20, 80]) { rr(wx, -50, 30, 26, 4); x.fill(); }
  x.restore(); }
function ambulance(cx, by, s, k, t) { if (k <= 0) return; x.save(); x.translate(cx, by); x.scale(s, s); x.globalAlpha *= k;
  x.fillStyle = metal(-150, 0, 150, 0); rr(-60, -170, 210, 140, 14); x.fill(); rr(-150, -120, 100, 90, 14); x.fill();
  x.fillStyle = 'rgba(20,30,40,0.85)'; rr(-135, -108, 60, 40, 6); x.fill();
  x.fillStyle = C.red; x.fillRect(-150, -62, 300, 12); x.fillRect(35, -140, 20, 66); x.fillRect(12, -117, 66, 20);
  const on = Math.sin(t * 18) > 0; x.fillStyle = on ? C.red : '#3a1714'; rr(-10, -190, 40, 20, 6); x.fill(); if (on) glow(10, -180, 60, '255,90,78', 0.5);
  for (const wx of [-95, 95]) { x.fillStyle = '#0a0c0b'; x.beginPath(); x.arc(wx, -28, 30, 0, 7); x.fill(); x.strokeStyle = '#3a423d'; x.lineWidth = 7; x.stroke(); }
  x.restore(); }
const qb = (p0, c, p1, u) => [(1 - u) * (1 - u) * p0[0] + 2 * u * (1 - u) * c[0] + u * u * p1[0], (1 - u) * (1 - u) * p0[1] + 2 * u * (1 - u) * c[1] + u * u * p1[1]];
/* il contatore con le cose che entrano: usato in kennedy e all'inizio di citazione (tempi tutti della scena kennedy) */
function kStuff(t) { const a = S('kennedy'), tpr = WT('kennedy', 'prodotto', 1, 2.4), ti = WA('kennedy', ['linquin', 'inquin'], 1, 4.1) - 0.15, ta = WT('kennedy', 'ambulanz', 1, 5.2) - 0.4;
  const kbx = oC(seg(t, a + 0.3, a + 0.8)), fin = [ti + 1.1, ta + 1.0];
  glass(540, 990, 520, 300, 34, kbx); x.save(); x.globalAlpha *= kbx; x.fillStyle = '#020302'; rr(460, 833, 160, 14, 7); x.fill(); x.strokeStyle = 'rgba(200,250,114,0.6)'; x.lineWidth = 2; x.stroke(); x.restore();
  mono('PRODOTTO NAZIONALE LORDO', 540, 892, t, tpr - 0.1, { size: 26, color: C.lime, ls: 2 });
  const lv = 0.3 + 0.3 * oC(seg(t, fin[0], fin[0] + 0.4)) + 0.3 * oC(seg(t, fin[1], fin[1] + 0.4));
  x.save(); x.globalAlpha *= kbx; x.fillStyle = 'rgba(241,244,238,0.1)'; rr(320, 1090, 440, 16, 8); x.fill(); x.fillStyle = C.lime; rr(320, 1090, 440 * lv, 16, 8); x.fill(); x.restore();
  [['+ inquinamento', fin[0], 960], ['+ ambulanze', fin[1], 1028]].forEach(([s, t0, yy]) => { const kk = oC(seg(t, t0, t0 + 0.35)); txt(s, 330 + (1 - kk) * 30, yy, { fam: 'mono', size: 32, weight: 600, color: C.red, align: 'left', alpha: kk }); });
  /* fabbrica e ambulanza: compaiono sulla parola, poi volano nella fessura */
  [[ti, 190, [120, 700], (cx, by, s, k) => factory(cx, by, s, k, t), 'inquinamento'], [ta, 890, [960, 700], (cx, by, s, k) => ambulance(cx, by, s, k, t), 'ambulanze']].forEach(([t0, ox, ctl, draw, lab], i) => {
    const kin = oC(seg(t, t0, t0 + 0.35)), kfly = ioC(seg(t, t0 + (i ? 0.45 : 0.5), fin[i])); if (kin <= 0 || kfly >= 1) return;
    const sx = i ? lerp(1180, ox, kin) : ox, [px, py] = qb([sx, 1250], ctl, [540, 832], kfly), s = lerp(0.8, 0.12, kfly);
    txt(lab, ox, 1400, { fam: 'mono', size: 28, weight: 600, color: C.muted, alpha: kin * (1 - kfly * 3), ls: 2 });
    draw(px, py + 90 * s, s, i ? 1 : kin); });
}
function sKennedy(t, a, b) { bg(); x.save();
  phrase(t, a + 0.05, [['Conta tutto,', C.ink], ['anche i danni.', C.red]], 345, { size: 92 });
  mono('ROBERT KENNEDY', 540, 600, t, WT('kennedy', 'robert', 1, 0) + 0.05, { size: 28, color: C.ink, ls: 4 });
  mono('1968 · UNIVERSITY OF KANSAS', 540, 650, t, WT('kennedy', 'nel', 1, 0.7) + 0.05, { size: 26, color: C.muted, ls: 3 });
  kStuff(t); x.restore(); finish(t); }

function sCitazione(t, a, b) { bg('30,44,26', 0.8); x.save();
  const te = WT('citazione', 'eccetto', 1, 1.0), ko = ioC(seg(t, a, te + 0.25));
  if (ko < 1) { x.save(); x.globalAlpha = 1 - ko; x.translate(540, lerp(990, 1260, ko)); x.scale(lerp(1, 0.55, ko), lerp(1, 0.55, ko)); x.translate(-540, -990); kStuff(t); x.restore(); }
  const L = [['«Misura tutto,', C.ink, WT('citazione', 'misura', 1, 0.3)], ['eccetto ciò che rende', C.ink, te], ['la vita degna', C.lime, WT('citazione', 'la', 1, 2.4)], ['di essere vissuta.»', C.lime, WT('citazione', 'di', 1, 3.4)]];
  const qs = Math.min(86, Math.floor(86 * 940 / Math.max(...L.map(([s]) => tw(s, 86)))));
  L.forEach(([s, col, t0], i) => { const y = 520 + i * qs * 1.15; if (i >= 2) glow(540, y, 380, '200,250,114', 0.08 * oC(seg(t, t0, t0 + 0.6))); phrase(t, t0 - 0.08, [[s, col]], y, { size: qs, st: 0.17 }); });
  const tv = WT('citazione', 'vita', 1, 2.8), kh = seg(t, tv, tv + 0.5);
  if (kh > 0) { const beat = 1 + 0.06 * Math.max(0, Math.sin((t - tv) * 7)); glow(540, 1110, 200, '200,250,114', 0.2 * kh);
    x.save(); x.globalAlpha = oC(kh); x.translate(540, 1110); x.scale(beat * oB(kh), beat * oB(kh)); x.strokeStyle = C.lime; x.lineWidth = 7; x.lineJoin = 'round'; heart(0, 0, 58, false); x.restore(); }
  mono('ROBERT KENNEDY · 18 MARZO 1968', 540, 1300, t, tv + 0.2, { size: 26, color: C.muted, ls: 3 });
  txt('traduzione nostra', 540, 1350, { fam: 'mono', size: 24, weight: 500, color: '#6C756F', alpha: oC(seg(t, tv + 0.6, tv + 1.0)), ls: 1 });
  x.restore(); finish(t); }

/* ================= CASA E CURA ================= */
function pot(cx, cy, col) { x.save(); x.strokeStyle = col; x.lineWidth = 6; x.lineCap = 'round'; x.lineJoin = 'round';
  rr(cx - 55, cy - 20, 110, 70, 14); x.stroke(); x.beginPath(); x.moveTo(cx - 70, cy - 20); x.lineTo(cx + 70, cy - 20); x.stroke();
  x.beginPath(); x.moveTo(cx - 55, cy); x.lineTo(cx - 75, cy); x.moveTo(cx + 55, cy); x.lineTo(cx + 75, cy); x.stroke();
  for (const dx of [-25, 0, 25]) { x.beginPath(); x.moveTo(cx + dx, cy - 35); x.bezierCurveTo(cx + dx - 12, cy - 50, cx + dx + 12, cy - 62, cx + dx, cy - 78); x.stroke(); } x.restore(); }
function washer(cx, cy, col, t) { x.save(); x.strokeStyle = col; x.lineWidth = 6; rr(cx - 55, cy - 65, 110, 125, 14); x.stroke(); x.beginPath(); x.moveTo(cx - 55, cy - 38); x.lineTo(cx + 55, cy - 38); x.stroke();
  x.beginPath(); x.arc(cx, cy + 12, 32, 0, 7); x.stroke(); x.lineWidth = 4; x.beginPath(); x.arc(cx, cy + 12, 18, t * 6, t * 6 + 3.5); x.stroke(); x.restore(); }
function heartPlus(cx, cy, col) { x.save(); x.strokeStyle = col; x.lineWidth = 6; x.lineJoin = 'round'; heart(cx, cy, 50, false);
  x.lineCap = 'round'; x.beginPath(); x.moveTo(cx, cy - 22); x.lineTo(cx, cy + 10); x.moveTo(cx - 16, cy - 6); x.lineTo(cx + 16, cy - 6); x.stroke(); x.restore(); }
function sGratis(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.03);
  const tsp = WT('gratis', 'sparisce', 1, 1.4), tca = WT('gratis', 'casa', 1, 2.8), tcu = WT('gratis', 'cura', 1, 3.8), tne = WT('gratis', 'nessuno', 1, 4.5), tpa = WT('gratis', 'paga', 1, 5.2);
  phrase(t, a + 0.05, [['Il lavoro', C.ink], ['che sparisce.', C.amber]], 345, { size: 92 });
  /* il contatore: un posto vuoto che si svuota sulla parola «sparisce» */
  const kb = oC(seg(t, a + 0.2, a + 0.6)); glass(540, 625, 460, 130, 30, kb); txt('PIL', 430, 628, { size: 72, weight: 800, color: C.lime, alpha: kb });
  const kv = seg(t, tsp, tsp + 0.6); x.save(); x.globalAlpha = kb * (1 - kv); x.strokeStyle = C.amber; x.lineWidth = 3; x.setLineDash([8, 8]); rr(585, 595 + 120 * oC(kv), 130, 60, 12); x.stroke(); x.restore();
  const CARDS = [['CUCINA', 220, tca - 0.05, (cx, cy) => pot(cx, cy, C.ink)], ['PULIZIE', 540, tca + 0.15, (cx, cy) => washer(cx, cy, C.ink, t)], ['CURA', 860, tcu - 0.05, (cx, cy) => heartPlus(cx, cy, C.ink)]];
  CARDS.forEach(([lab, cx, t0, draw], i) => { const k = oB(seg(t, t0, t0 + 0.45)); if (k <= 0) return; const s = clamp(k, 0, 1.15);
    x.save(); x.translate(cx, 970); x.scale(s, s); x.translate(-cx, -970); glass(cx, 970, 220, 260, 30, 1); draw(cx, 945); txt(lab, cx, 1065, { fam: 'mono', size: 24, weight: 600, color: C.muted, ls: 2 }); x.restore();
    /* cartellino del prezzo, vuoto */
    const kt = oC(seg(t, tne + i * 0.12, tne + i * 0.12 + 0.4)); if (kt <= 0) return; const sw = Math.sin((t - tne) * 5 + i) * 0.12 * Math.exp(-(t - tne) * 1.2);

    if (kf <= 0) { if (kbal < 1 || t < te) { x.save(); x.fillStyle = 'rgba(200,250,114,0.9)'; rr(sx - 22, sy - 22, 44, 44, 10); x.fill(); x.restore(); } continue; }
    const [px, py] = qb([sx, sy], [lerp(sx, cx, 0.5), Math.min(sy, cy) - 160], [cx, cy], kf);
    if (kf < 1) { x.save(); x.globalAlpha = 1 - kf; x.fillStyle = 'rgba(200,250,114,0.9)'; rr(px - 22, py - 22, 44, 44, 10); x.fill(); x.restore(); }
    x.save(); x.globalAlpha = oC(kf); glass(px, py, 88, 88, 16, 1, '200,250,114'); ico(i, px, py, kg > 0.5 ? C.lime : C.ink); x.restore(); }
  const ks = oB(seg(t, tl, tl + 0.4)); if (ks > 0) { x.save(); x.translate(DOC[0], 1195); x.rotate(-0.06); x.scale(lerp(1.8, 1, clamp(ks, 0, 1)), lerp(1.8, 1, clamp(ks, 0, 1))); x.globalAlpha = clamp(ks * 2);
    x.strokeStyle = C.amber; x.lineWidth = 5; rr(-200, -40, 400, 80, 12); x.stroke(); txt('LEGGE 163/2016', 0, 2, { size: 44, weight: 800, color: C.amber, ls: 1 }); x.restore(); }
  mono('12 INDICATORI DI BENESSERE', 540, 1335, t, te + 0.3, { size: 26, color: C.lime });
  mono('LEGGE 4 AGOSTO 2016, N. 163 · MEF', 540, 1395, t, tl + 0.3, { size: 22 });
  x.restore(); finish(t); }

/* ================= PRIMO: UE e G7 ================= */
const UE = [410, 950, 280], G7 = [715, 950, 225], ITA = [590, 930];
const DOTS = (() => { const out = []; let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const inC = (p, c, m) => Math.hypot(p[0] - c[0], p[1] - c[1]) < c[2] - m, far = (p) => out.every((q) => Math.hypot(p[0] - q.p[0], p[1] - q.p[1]) > 56) && Math.hypot(p[0] - ITA[0], p[1] - ITA[1]) > 80 && !(Math.abs(p[0] - ITA[0]) < 80 && p[1] > ITA[1] && p[1] < ITA[1] + 90);
  const want = [['ue', 24], ['g7', 4], ['both', 2]]; for (const [g, n] of want) { let c = 0, tries = 0; while (c < n && tries++ < 20000) { const p = [100 + r() * 880, 640 + r() * 620];
    const a = inC(p, UE, 30), bb = inC(p, G7, 30), ao = !inC(p, UE, -30), bo = !inC(p, G7, -30);
    if ((g === 'ue' && a && bo) || (g === 'g7' && bb && ao) || (g === 'both' && a && bb)) if (far(p)) { out.push({ p, g, d: r() }); c++; } } } return out; })();
function sPrimo(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.03);
  const tI = WA('primo', ['litalia', 'italia'], 1, 0.3), tp = WT('primo', 'primo', 1, 1.7) - 0.1, tu = WA('primo', ['dellunion', 'unione'], 1, 2.4), tg = WT('primo', 'g', 1, 3.8), tf = WT('primo', 'farlo', 1, 4.8);
  phrase(t, a + 0.05, [['L’Italia,', C.ink]], 345, { size: 92 });
  phrase(t, tp, [['la prima a farlo.', C.lime]], 448, { size: 92 });
  [[UE, tu, 'UNIONE EUROPEA', 330], [G7, tg, 'G7', 790]].forEach(([c, t0, lab, lx]) => { const k = oC(seg(t, t0 - 0.05, t0 + 0.6)); if (k <= 0) return;
    x.save(); x.strokeStyle = 'rgba(241,244,238,0.5)'; x.lineWidth = 3; x.fillStyle = 'rgba(241,244,238,0.035)'; x.beginPath(); x.arc(c[0], c[1], c[2], -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); x.stroke(); x.globalAlpha = k; x.beginPath(); x.arc(c[0], c[1], c[2], 0, 7); x.fill(); x.restore();
    txt(lab, lx, 1290, { fam: 'mono', size: 26, weight: 600, color: C.muted, alpha: k, ls: 3 }); });
  DOTS.forEach(({ p, g, d }) => { const t0 = g === 'g7' ? tg : tu, k = oB(seg(t, t0 + 0.1 + d * 0.5, t0 + 0.4 + d * 0.5)); if (k <= 0) return; x.fillStyle = 'rgba(139,149,143,0.75)'; x.beginPath(); x.arc(p[0], p[1], 11 * clamp(k, 0, 1.2), 0, 7); x.fill(); });
  const ki = oB(seg(t, tI, tI + 0.4)), kl = seg(t, tp, tp + 0.5); if (ki > 0) { if (kl > 0) { glow(ITA[0], ITA[1], 170, '200,250,114', 0.35 * kl);
      for (let j = 0; j < 2; j++) { const u = ((t - tp) * 0.8 + j * 0.5) % 1; if (t > tp) { x.save(); x.strokeStyle = `rgba(200,250,114,${0.6 * (1 - u)})`; x.lineWidth = 3; x.beginPath(); x.arc(ITA[0], ITA[1], 24 + 90 * u, 0, 7); x.stroke(); x.restore(); } } }
    x.fillStyle = kl > 0.3 ? C.lime : C.ink; x.beginPath(); x.arc(ITA[0], ITA[1], 20 * clamp(ki, 0, 1.3), 0, 7); x.fill();
    txt('ITALIA', ITA[0], ITA[1] + 52, { fam: 'mono', size: 26, weight: 600, color: kl > 0.3 ? C.lime : C.ink, alpha: clamp(ki), ls: 3 }); }
  glassPill(540, 1395, 'primo paese UE e G7 · MEF', seg(t, tf - 0.1, tf + 0.3), C.lime, 40);
  x.restore(); finish(t); }

/* ================= CASA: crescita e benessere si separano ================= */
function sCasa(t, a, b) { bg('30,44,26'); x.save();
  const tcr = WT('casa', 'crescita', 1, 2.1) - 0.1, tbe = WT('casa', 'benessere', 1, 2.8) - 0.1, tn = WT('casa', 'non', 1, 3.1) - 0.05;
  phrase(t, a + 0.05, [['Cosa ti porti a casa?', C.muted]], 345, { size: 70, out: tcr - 0.3 });
  phrase(t, tcr, [['Crescita e benessere', C.ink]], 345, { size: 92 });
  phrase(t, tn, [['non sono la stessa cosa.', C.lime]], 448, { size: 92 });
  const ks = ioC(seg(t, tn, tn + 1.0)), yC = lerp(900, 680, ks), yB = lerp(1010, 1230, ks);
  const kc = seg(t, tcr, tcr + 0.4), kb = seg(t, tbe, tbe + 0.4), wC = tw('crescita', 46, 700) + 90, wB = tw('benessere', 46, 700) + 90;
  /* le due linee: insieme fino al bivio, poi ognuna verso la sua etichetta */
  const kl = oC(seg(t, a + 0.2, tcr + 0.4)); x.save(); x.lineWidth = 6; x.lineCap = 'round';
  const fork = [500, 955], start = [110, 955];
  x.strokeStyle = 'rgba(241,244,238,0.6)'; x.beginPath(); x.moveTo(...start); x.lineTo(lerp(start[0], fork[0], kl), 955); x.stroke();
  if (kc > 0) { x.strokeStyle = C.lime; x.beginPath(); x.moveTo(fork[0], 950); x.bezierCurveTo(fork[0] + 120, 950, 820 - wC / 2 - 120, yC, 820 - wC / 2 - 8, yC); x.stroke(); }
  if (kb > 0) { x.strokeStyle = C.amber; x.beginPath(); x.moveTo(fork[0], 960); x.bezierCurveTo(fork[0] + 120, 960, 820 - wB / 2 - 120, yB, 820 - wB / 2 - 8, yB); x.stroke(); }
  x.restore();
  glassPill(820, yC, 'crescita', kc, C.lime, 46); glassPill(820, yB, 'benessere', kb, C.amber, 46);
  const kne = oB(seg(t, tn + 0.5, tn + 0.9)); if (kne > 0) { x.save(); x.translate(820, 955); x.scale(clamp(kne, 0, 1.2), clamp(kne, 0, 1.2)); glow(0, 0, 120, '255,90,78', 0.25); txt('≠', 0, 0, { size: 110, weight: 800, color: C.red }); x.restore(); }
  x.restore(); finish(t); }

serie({ hook: sHook, ponte: sPonte, kennedy: sKennedy, citazione: sCitazione, gratis: sGratis, ore: sOre, terzo: sTerzo, diviso: sDiviso, quinti: sQuinti,
  benessere: sBenessere, legge: sLegge, primo: sPrimo, casa: sCasa }, ORDER, ['hook', 'kennedy', 'gratis', 'diviso', 'benessere', 'casa']);
