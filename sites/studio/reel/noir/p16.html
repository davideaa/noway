<script>
/* Puntata 16 — «La disoccupazione» (lezione 1 di 5). Numeri SOLO da p16-fonti.md:
   agosto 2026, destagionalizzato, PROVVISORIO (Istat, CS 01/10/2026): tasso di disoccupazione 6,2% (Tabella 1), disoccupati 1.591 mila;
   15-24 anni (Tabella 4, Prospetto 5): tasso 20,3% sulle forze di lavoro; incidenza sulla popolazione 4,3%;
   occupazione 17,0% e inattività 78,7% della popolazione 15-24 (17,0 + 4,3 + 78,7 = 100), quindi forze di lavoro = 21,3% dei giovani.
   Definizioni (Tabella 2): disoccupato = almeno un'azione di ricerca nelle 4 settimane + disponibile entro 2 settimane; occupato = almeno un'ora pagata.
   Divano, telefono, zaino: esempi illustrativi senza cifre. Esempio del tasso (100 nelle forze di lavoro, 10 cercano, 5 smettono:
   10% → 5/95 = 5,3%) = «Esempi didattici» di p16-fonti.md, scritto a schermo come ESEMPIO · CIFRE INVENTATE.
   Barre dei giovani in scala: stessa larghezza = 100% della propria base; la base «chi lavora o cerca» è il 21,3% di tutti i giovani.
   Niente righe di fonte a schermo (Davide, 16/10/2026). Colori: occupato lime, disoccupato rosso, inattivo ambra. */
const ORDER = ['num', 'hook', 'telefono', 'annuncio', 'inattivo', 'zaino', 'conto', 'smette', 'agosto', 'giovani', 'tutti', 'casa', 'fine', 'cta', 'end'];
const Y2 = 345 + 92 * 1.12, Y3 = 345 + 2 * 92 * 1.12; /* seconda e terza riga del titolo */
/* parola con più grafie possibili (apostrofi: «l'Istat» → «listat», «un'ora» → «unora»): prova in ordine, poi la riserva */
const WA = (k, ws, n, ris) => { for (const w of ws) { const v = WT(k, w, n, NaN); if (!isNaN(v)) return v; } return S(k) + ris; };
const swapK = (t, t0) => [1 - oC(seg(t, t0 - 0.3, t0 - 0.05)), oC(seg(t, t0, t0 + 0.3))];
const rnd = (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const RGB = { lime: '200,250,114', red: '255,90,78', amber: '245,165,36', ink: '241,244,238' };
function ring(cx, cy, r0, t, t0, rgb = RGB.lime, d = 0.6, gr = 60) { const k = seg(t, t0, t0 + d); if (k <= 0 || k >= 1) return; x.save(); x.strokeStyle = `rgba(${rgb},${1 - k})`; x.lineWidth = 4; x.beginPath(); x.arc(cx, cy, r0 + gr * oC(k), 0, 7); x.stroke(); x.restore(); }
/* etichetta di vetro (mono), bordo colorato */
function tagPill(cx, cy, label, k, col, size = 28) { if (k <= 0) return; const w = tw(label, size, 600, 'mono', 2) + 56, h = 64, s = lerp(0.8, 1, oB(clamp(k)));
  x.save(); x.translate(cx, cy); x.scale(s, s); x.translate(-cx, -cy); glass(cx, cy, w, h, 32, clamp(k * 2));
  x.save(); x.globalAlpha *= clamp(k * 2); x.strokeStyle = col; x.lineWidth = 3; rr(cx - w / 2, cy - h / 2, w, h, 32); x.stroke(); x.restore();
  txt(label, cx, cy + 2, { fam: 'mono', size, weight: 600, color: col, ls: 2, alpha: clamp(k * 2) }); x.restore(); }
function pillSwap(cx, cy, A, B, kIn, t, tS) { const [o, i] = swapK(t, tS); tagPill(cx, cy, A[0], kIn * o, A[1]); tagPill(cx, cy, B[0], i * kIn, B[1]); }
const count = (v, d = 1) => v.toFixed(d).replace('.', ',');

/* ================= IL DIVANO (hook, telefono, inattivo, casa): due sagome stilizzate ================= */
const TU = 360, AM = 720; /* centri delle due sagome */
function sofa(k, bounce = 0) { if (k <= 0) return; x.save(); x.globalAlpha *= clamp(k * 1.6); x.translate(0, (1 - oC(k)) * 50);
  const sq = 1 - 0.03 * Math.sin(Math.PI * clamp(bounce));
  x.translate(540, 1240); x.scale(1, sq); x.translate(-540, -1240);
  x.fillStyle = metal(150, 0, 930, 0, true); rr(150, 960, 780, 170, 44); x.fill(); x.strokeStyle = 'rgba(200,250,114,0.25)'; x.lineWidth = 2.5; rr(150, 960, 780, 170, 44); x.stroke();
  x.fillStyle = 'rgba(241,244,238,0.05)'; rr(540 - 2, 980, 4, 130, 2); x.fill();
  x.fillStyle = '#1b211d'; rr(165, 1105, 750, 92, 24); x.fill(); x.strokeStyle = 'rgba(241,244,238,0.18)'; x.lineWidth = 2; rr(165, 1105, 750, 92, 24); x.stroke();
  for (const ax of [105, 875]) { x.fillStyle = metal(ax, 0, ax + 100, 0, true); rr(ax, 1030, 100, 175, 36); x.fill(); x.strokeStyle = 'rgba(241,244,238,0.16)'; rr(ax, 1030, 100, 175, 36); x.stroke(); }
  x.fillStyle = '#0d100e'; for (const lx of [175, 881]) { rr(lx, 1197, 24, 42, 6); x.fill(); }
  x.restore();
  x.save(); x.globalAlpha *= clamp(k * 1.6); x.strokeStyle = 'rgba(241,244,238,0.25)'; x.lineWidth = 3; x.beginPath(); x.moveTo(90, 1256); x.lineTo(990, 1256); x.stroke(); x.restore(); }
/* sagoma seduta: o.lit = schermo acceso, o.dim = attenuata, o.no = croce sul telefono */
function person(cx, k, o = {}) { const { lit = 0, dim = 0, bob = 0 } = o; if (k <= 0) return;
  const s = lerp(0.82, 1, oB(clamp(k)));
  x.save(); x.translate(cx, 1160); x.scale(s, s); x.translate(-cx, -1160 + (1 - clamp(k)) * 30 - 6 * Math.sin(Math.PI * clamp(bob)));
  x.globalAlpha *= clamp(k * 2) * (1 - 0.4 * dim);
  const body = '#222a25', edge = 'rgba(241,244,238,0.75)';
  x.lineWidth = 4; x.strokeStyle = edge; x.fillStyle = body;
  rr(cx - 54, 1150, 40, 96, 14); x.fill(); x.stroke(); rr(cx + 14, 1150, 40, 96, 14); x.fill(); x.stroke();
  rr(cx - 64, 1098, 128, 58, 20); x.fill(); x.stroke();
  rr(cx - 68, 988, 136, 140, [58, 58, 14, 14]); x.fill(); x.stroke();
  x.beginPath(); x.arc(cx, 935, 42, 0, 7); x.fill(); x.stroke();
  /* braccia verso il telefono */
  x.lineCap = 'round'; x.strokeStyle = edge; x.lineWidth = 30; x.beginPath(); x.moveTo(cx - 52, 1018); x.lineTo(cx - 30, 1084); x.moveTo(cx + 52, 1018); x.lineTo(cx + 30, 1084); x.stroke();
  x.strokeStyle = body; x.lineWidth = 22; x.stroke();
  /* telefono */
  if (lit > 0) glow(cx, 1070, 150, RGB.lime, 0.45 * lit);
  x.fillStyle = '#07090a'; rr(cx - 24, 1032, 48, 76, 9); x.fill(); x.strokeStyle = 'rgba(241,244,238,0.6)'; x.lineWidth = 3; x.stroke();
  if (lit > 0) { x.save(); x.globalAlpha *= lit; const g = x.createLinearGradient(0, 1038, 0, 1102); g.addColorStop(0, '#E4FFB5'); g.addColorStop(1, '#9ED64A'); x.fillStyle = g; rr(cx - 19, 1037, 38, 66, 6); x.fill(); x.restore(); }
  x.fillStyle = body; x.strokeStyle = edge; x.lineWidth = 3; for (const hx of [-26, 26]) { x.beginPath(); x.arc(cx + hx, 1090, 13, 0, 7); x.fill(); x.stroke(); }
  x.restore(); }
function names(k, hot = [0, 0]) { txt('TU', TU, 1300, { fam: 'mono', size: 26, weight: 600, color: hot[0] ? C.ink : C.muted, ls: 3, alpha: k });
  txt('IL TUO AMICO', AM, 1300, { fam: 'mono', size: 26, weight: 600, color: hot[1] ? C.ink : C.muted, ls: 3, alpha: k }); }
/* nuvoletta del pensiero con la valigetta: «un lavoro lo vorresti» */
function wish(k) { if (k <= 0) return; const cx = 168, cy = 925, s = lerp(0.5, 1, oB(clamp(k)));
  x.save(); x.globalAlpha *= clamp(k * 2);
  for (const [px, py, r] of [[296, 905, 7], [268, 914, 10]]) { x.fillStyle = 'rgba(241,244,238,0.85)'; x.beginPath(); x.arc(px, py, r, 0, 7); x.fill(); }
  x.translate(cx, cy); x.scale(s, s); glass(0, 0, 124, 124, 62, 1); x.strokeStyle = 'rgba(245,165,36,0.9)'; x.lineWidth = 3; x.beginPath(); x.arc(0, 0, 61, 0, 7); x.stroke();
  x.strokeStyle = C.amber; x.lineWidth = 5; x.lineJoin = 'round'; rr(-30, -14, 60, 40, 7); x.stroke(); rr(-11, -25, 22, 11, 4); x.stroke(); x.beginPath(); x.moveTo(-30, 0); x.lineTo(30, 0); x.stroke();
  x.restore(); }

function sHook(t, a, b) { bg('34,44,30', 0.8); x.save(); zoom(t, a, b, 1.06);
  const tDi = WT('hook', 'disoccupato', 1, 1.9), tNo = WT('hook', 'non', 1, 1.4), tTu = WT('hook', 'tu', 1, 2.5), tAm = WT('hook', 'amico', 1, 3.1),
    tDv = WT('hook', 'divano', 1, 3.6), tSe = WT('hook', 'senza', 2, 3.9), tTt = WT('hook', 'tutti', 1, 4.6);
  phrase(t, a + 0.02, [['Senza lavoro,', C.ink]], 345, { size: 92 });
  phrase(t, tNo - 0.1, [['ma non disoccupato.', C.lime]], Y2, { size: 92 });
  sofa(oC(seg(t, a, a + 0.5)), seg(t, tDv, tDv + 0.45));
  person(TU, seg(t, tTu - 0.25, tTu + 0.3), { bob: seg(t, tDv, tDv + 0.45) });
  person(AM, seg(t, tAm - 0.3, tAm + 0.25), { bob: seg(t, tDv + 0.05, tDv + 0.5) });
  txt('TU', TU, 1300, { fam: 'mono', size: 26, weight: 600, color: C.ink, ls: 3, alpha: oC(seg(t, tTu, tTu + 0.3)) });
  txt('IL TUO AMICO', AM, 1300, { fam: 'mono', size: 26, weight: 600, color: C.ink, ls: 3, alpha: oC(seg(t, tAm, tAm + 0.3)) });
  tagPill(TU, 800, 'SENZA LAVORO', seg(t, tSe - 0.1, tSe + 0.3), C.ink);
  tagPill(AM, 800, 'SENZA LAVORO', seg(t, tTt - 0.1, tTt + 0.3), C.ink);
  void tDi; x.restore(); finish(t); }

function sTelefono(t, a, b) { bg('34,44,30', 0.8); x.save();
  const tIs = WA('telefono', ['listat', 'istat'], 1, 0.4), tSo = WT('telefono', 'solo', 1, 0.8), tDi = WT('telefono', 'disoccupato', 1, 1.4),
    tDf = WT('telefono', 'differenza', 1, 2.1), tTe = WT('telefono', 'telefono', 1, 2.9);
  /* alla fine la camera entra nel telefono dell'amico (solo il divano, i titoli restano fermi): la scena dopo parte da lì */
  const kz = ioC(seg(t, b - 0.42, b)); x.save(); if (kz > 0) { x.beginPath(); x.rect(0, 560, W, H - 560); x.clip(); } x.translate(AM, 1070); x.scale(1 + 1.6 * kz, 1 + 1.6 * kz); x.translate(-AM, -1070);
  sofa(1); const dimTu = oC(seg(t, tSo, tSo + 0.4));
  person(TU, 1, { dim: dimTu * 0.6 }); person(AM, 1, { lit: oC(seg(t, tTe - 0.1, tTe + 0.3)) });
  ring(AM, 1070, 50, t, tTe + 0.05, RGB.lime, 0.7, 70); ring(AM, 1070, 50, t, tTe + 0.35, RGB.lime, 0.7, 70);
  names(1, [0, 1]);
  tagPill(TU, 800, 'SENZA LAVORO', 1 - 0.35 * dimTu, C.ink);
  pillSwap(AM, 800, ['SENZA LAVORO', C.ink], ['DISOCCUPATO', C.red], 1, t, tDi + 0.1);
  x.restore();
  if (kz > 0) { x.fillStyle = `rgba(5,6,7,${0.9 * kz})`; x.fillRect(0, 560, W, H - 560); }
  phrase(t, tIs - 0.1, [['Per l’Istat solo lui', C.ink]], 345, { size: 92, out: tDf - 0.35 });
  phrase(t, tDi - 0.1, [['è disoccupato.', C.red]], Y2, { size: 92, out: tDf - 0.35 });
  phrase(t, tDf - 0.05, [['La differenza:', C.ink]], 345, { size: 92 });
  phrase(t, tTe - 0.1, [['il telefono.', C.lime]], Y2, { size: 92 });
  x.restore(); finish(t); }

/* ================= ANNUNCIO: il telefono da vicino e le settimane ================= */
const WK = (i) => i < 4 ? 110 + i * 139 : 696 + (i - 4) * 139; /* bordo sinistro delle celle: 4 passate, 2 future */
function weeks(t, o) { const { kIn, past, act, fut, lab1, lab2, now } = o; if (kIn <= 0) return; x.save(); x.globalAlpha *= kIn;
  for (let i = 0; i < 6; i++) { const cx = WK(i), on = i < 4 ? clamp(past * 4 - i) : clamp(fut * 2 - (i - 4)), rgb = i < 4 ? RGB.red : RGB.lime;
    x.fillStyle = 'rgba(241,244,238,0.06)'; rr(cx, 615, 125, 70, 14); x.fill(); x.strokeStyle = 'rgba(241,244,238,0.28)'; x.lineWidth = 2; x.stroke();
    if (on > 0) { x.save(); x.globalAlpha *= oC(on); x.fillStyle = `rgba(${rgb},0.22)`; rr(cx, 615, 125, 70, 14); x.fill(); x.strokeStyle = `rgb(${rgb})`; x.lineWidth = 3; x.stroke(); x.restore(); } }
  /* l'azione di ricerca: un segno di spunta nella terza settimana */
  if (act > 0) { x.save(); x.strokeStyle = C.red; x.lineWidth = 7; x.lineCap = 'round'; x.lineJoin = 'round'; const cx = WK(2) + 62, k1 = clamp(act * 2), k2 = clamp(act * 2 - 1);
    x.beginPath(); x.moveTo(cx - 22, 650); x.lineTo(cx - 22 + 14 * k1, 650 + 14 * k1); if (k2 > 0) x.lineTo(cx - 8 + 32 * k2, 664 - 32 * k2); x.stroke(); x.restore(); }
  txt('ULTIME 4 SETTIMANE', (WK(0) + WK(3) + 125) / 2, 584, { fam: 'mono', size: 24, weight: 600, color: C.red, ls: 2, alpha: lab1 });
  txt('ENTRO 2 SETTIMANE', (WK(4) + WK(5) + 125) / 2, 584, { fam: 'mono', size: 22, weight: 600, color: C.lime, ls: 1, alpha: lab2 });
  if (now > 0) { x.save(); x.globalAlpha *= now; x.fillStyle = C.ink; rr(672, 600, 4, 100, 2); x.fill(); x.restore(); txt('OGGI', 674, 730, { fam: 'mono', size: 24, weight: 600, color: C.ink, ls: 2, alpha: now }); }
  x.restore(); }
function bigPhone(t, k, o) { const { card, sent, tTap } = o; if (k <= 0) return; const cx = lerp(AM, 540, ioC(k)), cy = lerp(1070, 1120, ioC(k)), s = lerp(0.13, 1, ioC(k));
  x.save(); x.translate(cx, cy); x.scale(s, s);
  glow(0, 0, 420, RGB.lime, 0.10);
  x.fillStyle = '#0B0E0C'; rr(-190, -310, 380, 620, 54); x.fill(); x.strokeStyle = 'rgba(241,244,238,0.5)'; x.lineWidth = 4; x.stroke();
  x.fillStyle = '#101512'; rr(-172, -292, 344, 584, 40); x.fill();
  x.fillStyle = '#050607'; rr(-48, -280, 96, 22, 11); x.fill();
  txt('ANNUNCI DI LAVORO', -150, -228, { fam: 'mono', size: 22, weight: 600, color: C.muted, align: 'left', ls: 1 });
  /* l'annuncio che scorre dentro */
  if (card > 0) { const dy = (1 - oC(card)) * 120; x.save(); x.globalAlpha *= clamp(card * 2); x.translate(0, dy);
    x.fillStyle = 'rgba(241,244,238,0.07)'; rr(-152, -190, 304, 300, 26); x.fill(); x.strokeStyle = 'rgba(241,244,238,0.3)'; x.lineWidth = 2; x.stroke();
    x.strokeStyle = C.lime; x.lineWidth = 5; x.lineJoin = 'round'; rr(-34, -150, 68, 46, 8); x.stroke(); rr(-13, -163, 26, 13, 4); x.stroke(); x.beginPath(); x.moveTo(-34, -132); x.lineTo(34, -132); x.stroke();
    txt('CERCASI PERSONALE', 0, -64, { size: 26, weight: 800, color: C.ink });
    x.fillStyle = 'rgba(241,244,238,0.22)'; for (const [yy, ww] of [[-16, 220], [16, 250], [48, 160]]) { rr(-ww / 2, yy, ww, 12, 6); x.fill(); }
    x.restore(); }
  /* il tasto: «RISPONDI» → «INVIATO» */
  const kb = clamp(card * 2); if (kb > 0) { x.save(); x.globalAlpha *= kb; const press = t >= tTap ? 1 - 0.06 * Math.sin(Math.PI * clamp((t - tTap) / 0.2)) : 1; x.scale(press, press);
    if (sent < 0.5) { x.fillStyle = C.lime; rr(-125, 150, 250, 78, 39); x.fill(); txt('RISPONDI', 0, 191, { size: 32, weight: 800, color: '#15200C' }); }
    else { x.fillStyle = 'rgba(200,250,114,0.12)'; rr(-125, 150, 250, 78, 39); x.fill(); x.strokeStyle = C.lime; x.lineWidth = 3; x.stroke();
      txt('INVIATO', -16, 191, { size: 32, weight: 800, color: C.lime }); x.strokeStyle = C.lime; x.lineWidth = 6; x.lineCap = 'round'; x.lineJoin = 'round'; x.beginPath(); x.moveTo(68, 190); x.lineTo(80, 202); x.lineTo(102, 178); x.stroke(); }
    x.restore(); }
  x.restore(); }
function sAnnuncio(t, a, b) { bg('34,44,30', 0.7); x.save();
  const tUl = WT('annuncio', 'ultime', 1, 0.2), tSt = WT('annuncio', 'settimane', 1, 1.2), tLu = WT('annuncio', 'lui', 1, 1.5), tRi = WT('annuncio', 'risposto', 1, 2.0),
    tAn = WT('annuncio', 'annuncio', 1, 2.7), tPo = WT('annuncio', 'potrebbe', 1, 3.8), tCo = WT('annuncio', 'cominciare', 1, 4.2), tEn = WT('annuncio', 'entro', 1, 4.6);
  phrase(t, Math.max(a + 0.05, tUl - 0.1), [['Ha cercato lavoro', C.ink]], 345, { size: 92 });
  phrase(t, tPo - 0.1, [['e può iniziare.', C.lime]], Y2, { size: 92 });
  const kP = seg(t, a, a + 0.55);
  weeks(t, { kIn: oC(seg(t, a + 0.15, a + 0.5)), past: seg(t, tUl, tSt + 0.3), act: seg(t, tRi + 0.25, tRi + 0.6), fut: seg(t, tEn - 0.1, tEn + 0.6),
    lab1: oC(seg(t, tUl, tUl + 0.4)), lab2: oC(seg(t, tEn, tEn + 0.4)), now: oC(seg(t, tCo - 0.2, tCo + 0.2)) });
  const tTap = tRi + 0.05;
  bigPhone(t, kP, { card: seg(t, Math.min(tLu, tRi - 0.4) - 0.2, Math.min(tLu, tRi - 0.4) + 0.3), sent: t >= tTap + 0.18 ? 1 : 0, tTap });
  tap(540, 1311, t, tTap);
  ring(540, 1311, 40, t, tAn, RGB.lime, 0.6, 40); void b;
  x.restore(); finish(t); }

function sInattivo(t, a, b) { bg('44,38,22', 0.75); x.save(); zoom(t, a, b, 1.05);
  const tTu = WT('inattivo', 'tu', 1, 0.05), tNo = WT('inattivo', 'non', 1, 0.6), tCe = WT('inattivo', 'cercato', 1, 0.9), tIn = WT('inattivo', 'inattivo', 1, 1.8),
    tAn = WT('inattivo', 'anche', 1, 2.4), tVo = WT('inattivo', 'vorresti', 1, 3.2);
  phrase(t, Math.max(a + 0.02, tTu - 0.05), [['Tu non hai cercato:', C.ink]], 345, { size: 92 });
  phrase(t, tIn - 0.15, [['sei inattivo,', C.amber]], Y2, { size: 92 });
  phrase(t, tAn - 0.1, [['anche se lo vorresti.', C.ink]], Y3, { size: 80 });
  const kS = oC(seg(t, a, a + 0.35));
  x.save(); x.globalAlpha *= kS; sofa(1);
  person(TU, 1, {}); person(AM, 1, { lit: 0.8, dim: 0.5 });
  /* il tuo telefono resta spento: nessuna ricerca */
  cross(TU, 1070, 24, seg(t, tCe - 0.1, tCe + 0.35));
  names(1, [1, 0]);
  pillSwap(TU, 800, ['SENZA LAVORO', C.ink], ['INATTIVO', C.amber], 1, t, tIn);
  tagPill(AM, 800, 'DISOCCUPATO', 0.65, C.red);
  wish(seg(t, tVo - 0.25, tVo + 0.3));
  x.restore(); void tNo;
  x.restore(); finish(t); }

/* ================= ZAINO: la settimana di 168 ore, ne basta una ================= */
const ZG = { x0: 148, cw: 100, gx: 14, y0: 620, ch: 13, gy: 3, day: 3, hour: 17 };
const zCell = (d, h) => [ZG.x0 + d * (ZG.cw + ZG.gx), ZG.y0 + h * (ZG.ch + ZG.gy)];
function rider(cx, k, walk, t) { if (k <= 0) return; x.save(); x.globalAlpha *= clamp(k * 2);
  const st = clamp(walk * 3) * (1 - seg(walk, 0.8, 1)), ph = walk * 9, sw = Math.sin(ph) * 26 * st, bobY = Math.abs(Math.sin(ph)) * 5 * st, fy = 1335;
  x.translate(cx, -bobY);
  const edge = 'rgba(241,244,238,0.8)', body = '#222a25';
  x.lineCap = 'round'; x.strokeStyle = edge; x.lineWidth = 26; x.beginPath(); x.moveTo(-6, 1250); x.lineTo(-6 + sw, fy - 8); x.moveTo(6, 1250); x.lineTo(6 - sw, fy - 8); x.stroke();
  x.strokeStyle = body; x.lineWidth = 18; x.stroke();
  /* zaino cubico delle consegne */
  x.fillStyle = '#121714'; rr(-112, 1132, 92, 100, 12); x.fill(); x.strokeStyle = C.lime; x.lineWidth = 4; x.stroke();
  x.strokeStyle = 'rgba(200,250,114,0.7)'; x.lineWidth = 3; x.beginPath(); x.moveTo(-96, 1170); x.lineTo(-36, 1170); x.stroke();
  x.fillStyle = body; x.strokeStyle = edge; x.lineWidth = 4; rr(-34, 1150, 68, 108, 24); x.fill(); x.stroke();
  x.beginPath(); x.arc(4, 1112, 30, 0, 7); x.fill(); x.stroke();

  x.strokeStyle = C.lime; x.lineWidth = 7; x.stroke(); x.lineCap = 'round'; x.lineWidth = 16; x.beginPath(); x.moveTo(cx + r * 0.72, cy + r * 0.72); x.lineTo(cx + r * 1.35, cy + r * 1.35); x.stroke(); x.restore(); }

      txt('SENZA LAVORO TUTTI E DUE', 540, 1398, { fam: 'mono', size: 26, weight: 600, color: C.ink, ls: 2, alpha: kb }); }
    x.restore(); }
