<script>
/* Puntata 11 — «Il ciclo economico» (lunedì, lezione 1 di 5). Numeri SOLO da p11-fonti.md:
   Pil trimestrale Istat 2026M10 (appendice): 106 trimestri 2000-I → 2026-II, 34 in calo sul trimestre prima (circa uno su tre;
   il 2007-III è 471,9 = 471,9 arrotondato ma è un calo: episodio 2007-III→IV della Tabella 2);
   tre cali: 2008-I → 2009-II −7,6% · 2011-I → 2013-I −5,4% · 2019-II → 2020-II −18,1% (in un anno); linea disegnata come indice 2000 = 100;
   2000-I → 2019-IV, deviazione standard della variazione trimestrale: consumi delle famiglie 0,48 · investimenti 1,96 · beni durevoli 2,55
   (fonti: investimenti circa 4 volte i consumi, durevoli oltre 5 volte); 2008-I → 2009-II: investimenti −12,7% · consumi delle famiglie −2,7% · Pil −7,6%;
   punti di svolta annunciati fino a circa 30 mesi dopo (area euro). Onde di «fasi», «dopo», «prossimo», «casa» = illustrazioni («ESEMPIO · NON IN SCALA»),
   la tendenza è quasi piatta (non è l'Italia). Niente parola «recessione» a schermo (è la puntata di domani). */
const ORDER = ['num', 'hook', 'fasi', 'trimestri', 'cali', 'duemilaventi', 'frigo', 'durevoli', 'investimenti', 'dopo', 'prossimo', 'casa', 'fine', 'cta', 'end'];
const Y2 = 345 + 92 * 1.12; /* seconda riga del titolo */
const WA = (k, ws, n, ris) => { for (const w of ws) { const v = WT(k, w, n, NaN); if (!isNaN(v)) return v; } return S(k) + ris; };

const RGB = { lime: [200, 250, 114], red: [255, 90, 78], grey: [139, 149, 143], amber: [245, 165, 36], ink: [241, 244, 238] };
const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function dashLine(x0, y0, x1, y1, col, w = 3, dash = [10, 10], a = 1) { if (a <= 0) return; x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.lineWidth = w; x.setLineDash(dash); x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); x.restore(); }
function dot(cx, cy, r, col, k = 1, g = null) { if (k <= 0) return; if (g) glow(cx, cy, r * 5, g, 0.35 * k); x.save(); x.globalAlpha *= clamp(k); x.fillStyle = col; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); x.strokeStyle = '#050607'; x.lineWidth = 3; x.stroke(); x.restore(); }
/* testo che entra con un piccolo rimbalzo */
function popTxt(s, px, py, k, o = {}) { if (k <= 0) return; x.save(); const sc = lerp(0.7, 1, oB(clamp(k))); x.translate(px, py); x.scale(sc, sc); txt(s, 0, 0, { size: 50, weight: 800, ...o, alpha: clamp(k * 2) * (o.alpha ?? 1) }); x.restore(); }
const lab = (s, px, py, k, col = C.muted, o = {}) => txt(s, px, py, { fam: 'mono', size: 26, weight: 600, color: col, ls: 2, alpha: oC(clamp(k)), ...o });
/* etichetta d'onestà tratteggiata (come «secondo alcuni economisti» in p10) */
function honestTag(cx, cy, label, t, t0, col = C.amber) { const k = oC(seg(t, t0, t0 + 0.35)); if (k <= 0) return; const s = typed(label, t, t0 + 0.1, 40), w = tw(label, 28, 600, 'mono', 3) + 70;
  x.save(); x.globalAlpha = k; x.strokeStyle = col; x.lineWidth = 3; x.setLineDash([10, 7]); rr(cx - w / 2, cy - 32, w * lerp(0.6, 1, k), 64, 32); x.stroke(); x.setLineDash([]);
  txt(s, cx - w / 2 + 35, cy + 1, { fam: 'mono', size: 28, weight: 600, color: col, align: 'left', ls: 3 }); x.restore(); }
/* stroke di una curva colorata per pendenza: sale = lime (espansione), scende = rosso (contrazione) */
function slopeStroke(fy, xa, xb, w = 7, step = 3, a = 1) { if (xb <= xa) return; x.save(); x.globalAlpha *= a; x.lineWidth = w; x.lineCap = 'round'; x.lineJoin = 'round';
  let up = null; x.beginPath(); x.moveTo(xa, fy(xa));
  for (let xx = xa; xx < xb; xx += step) { const x2 = Math.min(xb, xx + step), u = fy(x2) < fy(xx);
    if (up !== null && u !== up) { x.strokeStyle = up ? C.lime : C.red; x.stroke(); x.beginPath(); x.moveTo(xx, fy(xx)); }
    up = u; x.lineTo(x2, fy(x2)); }
  x.strokeStyle = up ? C.lime : C.red; x.stroke(); x.restore(); }
function plainStroke(fy, xa, xb, col, w = 4, step = 4) { if (xb <= xa) return; x.save(); x.strokeStyle = col; x.lineWidth = w; x.lineCap = 'round'; x.lineJoin = 'round'; x.beginPath(); x.moveTo(xa, fy(xa)); for (let xx = xa + step; xx < xb + step; xx += step) x.lineTo(Math.min(xx, xb), fy(Math.min(xx, xb))); x.stroke(); x.restore(); }

/* ================= IL FRIGORIFERO (gancio e scena «frigo») ================= */
function fridge(cx, by, w, h, o = {}) { const { k = 1, ghost = 0, light = 0, tag = 0, t = 0 } = o; if (k <= 0) return;
  const x0 = cx - w / 2, y0 = by - h, sp = y0 + h * 0.32, s = lerp(0.85, 1, oB(clamp(k)));
  x.save(); x.translate(cx, by); x.scale(s, s); x.translate(-cx, -by); x.globalAlpha *= clamp(k * 2);
  if (light > 0) glow(cx, by - h * 0.45, w * 1.4, '200,250,114', 0.16 * light * (1 - ghost));
  x.save(); x.globalAlpha *= 1 - 0.7 * ghost;
  x.fillStyle = metal(x0, 0, x0 + w, 0, true); rr(x0, y0, w, h, 24); x.fill();
  x.strokeStyle = 'rgba(241,244,238,0.28)'; x.lineWidth = 2.5; rr(x0, y0, w, h, 24); x.stroke();
  x.fillStyle = '#050607'; x.fillRect(x0 + 4, sp - 3, w - 8, 6);
  x.fillStyle = 'rgba(233,236,230,0.6)'; rr(x0 + w - 38, y0 + 36, 12, sp - y0 - 72, 6); x.fill(); rr(x0 + w - 38, sp + 36, 12, (by - sp) * 0.42, 6); x.fill();
  x.fillStyle = 'rgba(200,250,114,0.4)'; x.fillRect(x0 + 10, y0 + 28, 5, h - 56);
  x.fillStyle = '#0a0c0b'; x.fillRect(x0 + 22, by, 34, 10); x.fillRect(x0 + w - 56, by, 34, 10);
  if (light > 0) { x.fillStyle = `rgba(233,236,230,${0.9 * light})`; x.fillRect(x0 + w - 3, sp + 14, 5, by - sp - 34); glow(x0 + w + 4, (sp + by) / 2, 150, '233,236,230', 0.22 * light); }
  x.restore();
  if (ghost > 0) { x.save(); x.globalAlpha *= ghost; x.strokeStyle = C.amber; x.lineWidth = 3; x.setLineDash([12, 10]); rr(x0 - 12, y0 - 12, w + 24, h + 24, 30); x.stroke(); x.restore(); }
  /* cartellino «NUOVO» appeso alla maniglia del freezer, oscilla */
  if (tag > 0) { const ax = x0 + w - 32, ay = y0 + 46, kk = clamp(oB(clamp(tag)), 0, 1.2), sw = 0.1 * Math.sin(t * 2.6);
    x.save(); x.translate(ax, ay); x.rotate(sw); x.scale(kk, kk);
    x.strokeStyle = 'rgba(241,244,238,0.7)'; x.lineWidth = 2; x.beginPath(); x.moveTo(0, 0); x.lineTo(68, 50); x.stroke();
    x.translate(136, 64); x.rotate(0.16); rr(-74, -28, 148, 56, 12); x.fillStyle = C.lime; x.fill();
    x.fillStyle = '#050607'; x.beginPath(); x.arc(-58, 0, 5, 0, 7); x.fill();
    txt('NUOVO', 12, 2, { size: 26, weight: 800, color: '#15200C', ls: 2 }); x.restore(); }
  x.restore(); }
/* ================= HOOK: anche il frigo nuovo che compri fa parte del PIL, che sale e scende col ciclo ================= */
function sHook(t, a, b) { bg('30,44,26'); x.save(); zoom(t, a, b, 1.05);
  const tFr = WT('hook', 'frigorifero', 1, 0.6), tCo = WT('hook', 'compri', 1, 1.84), tPa = WT('hook', 'parte', 1, 2.43), tPr = WT('hook', 'prodotto', 1, 3.03),
    tSa = WT('hook', 'sale', 1, 4.61), tSc = WT('hook', 'scende', 1, 5.06), tCi = WT('hook', 'ciclo', 1, 5.9);
  phrase(t, a + 0.03, [['Anche il frigo', C.ink]], 345, { size: 92, st: 0.1 });
  phrase(t, tPa - 0.1, [['fa parte del PIL.', C.lime]], Y2, { size: 92 });
  const FR = { cx: 540, by: 1130, w: 280, h: 500 };
  fridge(FR.cx, FR.by, FR.w, FR.h, { k: seg(t, a, a + 0.4), light: oC(seg(t, a + 0.1, a + 0.6)), tag: seg(t, tFr - 0.05, tFr + 0.4), t });
  tap(FR.cx + FR.w / 2 - 26, FR.by - FR.h * 0.5, t, tCo);
  /* la scatola del PIL: un cubetto parte dal frigo e ci entra */
  const kB = oC(seg(t, tPa - 0.3, tPa + 0.2)), kC = seg(t, tPr - 0.45, tPr + 0.15), hit = Math.sin(Math.PI * seg(t, tPr + 0.1, tPr + 0.8));
  if (kB > 0) { if (hit > 0) glow(540, 1258, 240, '200,250,114', 0.35 * hit); glass(540, 1258, 380, 96, 48, kB);
    if (hit > 0) { x.save(); x.globalAlpha = hit; x.strokeStyle = C.lime; x.lineWidth = 4; rr(350, 1210, 380, 96, 48); x.stroke(); x.restore(); }
    txt('PIL', 540, 1260, { size: 48, weight: 800, color: hit > 0.3 ? C.lime : C.ink, alpha: kB, ls: 2 }); }
  if (kC > 0 && kC < 1) { const u = ioC(kC), cx = lerp(FR.cx + 90, 640, u), cy = lerp(FR.by - 260, 1212, u) - Math.sin(Math.PI * u) * 120, s = lerp(1, 0.6, u);
    glow(cx, cy, 50, '200,250,114', 0.4); x.save(); x.translate(cx, cy); x.rotate(u * 2.5); x.scale(s, s); rr(-18, -18, 36, 36, 7); x.fillStyle = C.lime; x.fill(); x.restore(); }
  /* l'onda del ciclo: sale (lime) e scende (rosso) sulle parole */
  const kW = ioC(seg(t, tSa - 0.25, Math.max(tCi + 0.4, tSc + 0.8))); if (kW > 0) { const fy = (xx) => 1395 + 30 * Math.cos((xx - 140) / 200 * Math.PI * 2), xe = lerp(140, 940, kW);
    slopeStroke(fy, 140, xe, 5, 3); dot(xe, fy(xe), 10, C.ink, kW, '200,250,114'); }
  x.restore(); finish(t); }

/* ================= FASI: la linea retta che comincia a respirare ================= */
const FW = { x0: 130, x1: 900, cy: 975, A: 170, xp: 330, L: 560, rise: 40 }; /* tendenza quasi piatta: illustrazione, non l'Italia */
const fTr = (xx) => FW.cy + FW.rise / 2 - FW.rise * (xx - FW.x0) / (FW.x1 - FW.x0);
const fWv = (xx, m = 1) => fTr(xx) - FW.A * m * Math.sin(Math.PI / 2 + (xx - FW.xp) / FW.L * Math.PI * 2);
const FX = { peak: FW.xp, trough: FW.xp + FW.L / 2 };
function keyX(t, K) { if (t <= K[0][0]) return K[0][1]; for (let i = 0; i < K.length - 1; i++) { const [ta, xa] = K[i], [tb, xb] = K[i + 1]; if (t <= tb) return lerp(xa, xb, ioC(seg(t, ta, tb))); } return K[K.length - 1][1]; }
function sFasi(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04);
  const tLi = WT('fasi', 'linea', 1, 1.67), tRs = WT('fasi', 'respira', 1, 2.57), tSa = WT('fasi', 'sale', 1, 3.19), tEs = WA('fasi', ['espansione', 'nellespansione'], 1, 3.75),
    tPi = WT('fasi', 'picco', 1, 4.95), tCo = WT('fasi', 'contrazione', 1, 6.01), tMi = WT('fasi', 'minimo', 1, 7.21), tRp = WT('fasi', 'riparte', 1, 7.76);
  phrase(t, a + 0.05, [['Non in linea retta:', C.ink]], 345, { size: 92 });
  phrase(t, tRs - 0.1, [['respira.', C.lime]], Y2, { size: 92 });
  const kL = ioC(seg(t, a + 0.15, Math.max(a + 0.9, tLi + 0.3))), m = ioC(seg(t, tRs - 0.2, tRs + 0.6)), xe = lerp(FW.x0, FW.x1, kL);
  /* tendenza tratteggiata (resta quando la linea diventa onda) */
  if (m > 0) dashLine(FW.x0, fTr(FW.x0), FW.x1, fTr(FW.x1), 'rgba(241,244,238,0.45)', 3, [12, 10], m);
  /* la linea: prima retta, poi onda */
  plainStroke((xx) => fWv(xx, m), FW.x0, xe, m < 0.05 ? 'rgba(241,244,238,0.9)' : 'rgba(241,244,238,0.4)', m < 0.05 ? 7 : 5);
  if (m < 0.3 && kL > 0.05) { const ex = xe, ey = fWv(ex, m), al = 1 - m / 0.3; x.save(); x.globalAlpha = al; x.fillStyle = C.ink; x.beginPath(); x.moveTo(ex + 22, ey); x.lineTo(ex - 6, ey - 16); x.lineTo(ex - 6, ey + 16); x.closePath(); x.fill(); x.restore(); }
  /* il punto «economia» percorre l'onda sulle parole: sale → picco → scende → minimo → riparte */
  const kD = seg(t, tSa - 0.35, tSa - 0.1);
  if (kD > 0) { const px = keyX(t, [[tSa - 0.2, FW.x0], [tPi, FX.peak], [tMi, FX.trough], [Math.max(tRp + 0.9, tMi + 1.2), 880]]);
    slopeStroke((xx) => fWv(xx, m), FW.x0, px, 8, 3); dot(px, fWv(px, m), 13, C.ink, kD, '241,244,238'); }
  /* svolte: picco e minimo */
  const kP = seg(t, tPi - 0.1, tPi + 0.35), kM = seg(t, tMi - 0.1, tMi + 0.35);
  if (kP > 0) { dot(FX.peak, fWv(FX.peak), 15, C.amber, kP, '245,165,36'); popTxt('PICCO', FX.peak, fWv(FX.peak) - 50, kP, { fam: 'mono', size: 30, weight: 600, color: C.amber, ls: 3 }); }
  if (kM > 0) { dot(FX.trough, fWv(FX.trough), 15, C.amber, kM, '245,165,36'); popTxt('MINIMO', FX.trough, fWv(FX.trough) + 50, kM, { fam: 'mono', size: 30, weight: 600, color: C.amber, ls: 3 }); }
  /* le fasi, in riga sotto l'onda */
  popTxt('ESPANSIONE', 230, 1255, seg(t, tEs - 0.1, tEs + 0.35), { fam: 'mono', size: 28, weight: 600, color: C.lime, ls: 2 });
  popTxt('CONTRAZIONE', 470, 1255, seg(t, tCo - 0.1, tCo + 0.35), { fam: 'mono', size: 28, weight: 600, color: C.red, ls: 2 });
  popTxt('RIPARTE', 770, 1255, seg(t, tRp - 0.1, tRp + 0.35), { fam: 'mono', size: 28, weight: 600, color: C.lime, ls: 2 });
  if (m > 0) { const lw = tw('TENDENZA', 24, 600, 'mono', 2), lx = 540 - (lw + 70) / 2; dashLine(lx, 1330, lx + 50, 1330, 'rgba(241,244,238,0.6)', 3, [10, 8], m); lab('TENDENZA', lx + 70, 1331, m, C.muted, { size: 24, align: 'left' }); }
  mono('ESEMPIO · NON IN SCALA', 540, 1420, t, a + 0.5, { size: 24, ls: 2 });
  x.restore(); finish(t); }

/* ================= TRIMESTRI: 106 trimestri dal 2000, quelli in calo in rosso ================= */
const GDP = [431.1, 433.9, 437.8, 442.0, 445.9, 445.3, 443.4, 442.7, 443.3, 445.0, 445.4, 448.0, 446.2, 445.1, 444.2, 448.7,
  450.2, 451.6, 452.1, 453.0, 452.4, 456.0, 458.4, 460.7, 462.1, 463.4, 464.9, 471.5, 471.1, 471.9, 471.9, 471.1,
  476.1, 471.6, 464.4, 453.8, 442.7, 439.9, 441.5, 442.5, 444.1, 447.1, 448.7, 452.8, 454.7, 454.0, 452.0, 447.9,
  442.9, 439.2, 436.5, 434.0, 430.1, 430.6, 432.2, 431.7, 431.3, 431.4, 431.5, 431.2, 432.6, 434.7, 435.5, 438.2,
  438.8, 440.4, 443.8, 445.5, 447.6, 449.4, 450.2, 453.0, 452.2, 453.5, 454.0, 456.0, 456.6, 458.5, 456.3, 454.4,
  429.8, 375.6, 428.7, 431.0, 437.9, 449.3, 460.9, 468.3, 471.4, 478.8, 479.6, 478.4, 481.3, 481.2, 482.0, 484.6,
  485.3, 486.5, 486.8, 487.3, 489.3, 489.1, 490.2, 491.7, 493.3, 494.1]; /* appendice di p11-fonti.md, mld concatenati 2020: solo per il disegno */
const NEG = GDP.map((v, i) => i > 0 && (v < GDP[i - 1] || i === 30)); /* i = 30 è il 2007-III: pari all'arrotondamento, calo nella serie completa */
const QG = { x0: 214, y0: 640, p: 60, gap: 10, c: 52, rp: 62 };
const qPos = (i) => { const r = Math.floor(i / 12), c = i % 12; return [QG.x0 + c * QG.p + Math.floor(c / 4) * QG.gap + QG.c / 2, QG.y0 + r * QG.rp + QG.c / 2]; };
function sTrimestri(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.03);
  const tCi = WT('trimestri', 'circa', 1, 1.65), tSc = WT('trimestri', 'sceso', 1, 4.85), tRi = WT('trimestri', 'rispetto', 1, 5.2);
  phrase(t, a + 0.05, [['In Italia, dal 2000,', C.ink]], 345, { size: 92 });
  phrase(t, tCi - 0.1, [['circa 1 su 3 in calo.', C.red]], Y2, { size: 92 }); /* il numero sulla parola */
  const tS = a + 0.3, D = Math.max(1.6, tCi + 0.9 - tS), kIn = oC(seg(t, a, a + 0.5));
  for (let r = 0; r < 9; r++) txt(String(2000 + r * 3), QG.x0 - 18, QG.y0 + r * QG.rp + QG.c / 2, { fam: 'mono', size: 24, weight: 600, color: C.muted, align: 'right', alpha: clamp(kIn * 2 - r * 0.12) });
  const pul = Math.sin(Math.PI * seg(t, tSc - 0.1, tSc + 0.8));
  for (let i = 0; i < GDP.length; i++) { const [cx, cy] = qPos(i), tf = tS + D * i / GDP.length, u = seg(t, tf, tf + 0.28), ki = clamp(kIn * 2 - i / 140);
    if (ki <= 0) continue; const shown = u >= 0.5, red = NEG[i], sx = Math.max(0.06, Math.abs(Math.cos(Math.PI * u))), sc = shown && red ? 1 + 0.06 * pul : 1; /* 52 × 1,06 = 55: restano 4 px d'aria tra le tessere */
    if (shown && red && pul > 0) glow(cx, cy, 60, '255,90,78', 0.35 * pul);
    x.save(); x.globalAlpha *= ki; x.translate(cx, cy); x.scale(sx * sc, sc);
    rr(-QG.c / 2, -QG.c / 2, QG.c, QG.c, 10);
    if (!shown) { x.fillStyle = '#101512'; x.fill(); x.strokeStyle = 'rgba(241,244,238,0.18)'; x.lineWidth = 2; x.stroke(); }
    else { x.fillStyle = red ? rgba(RGB.red, 0.92) : rgba(RGB.lime, 0.22); x.fill(); x.strokeStyle = red ? C.red : 'rgba(200,250,114,0.45)'; x.lineWidth = 2; x.stroke(); }
    x.restore(); }
  /* legenda */
  const kLg = oC(seg(t, a + 0.6, a + 1.0)); if (kLg > 0) { const w1 = tw('IN CALO', 24, 600, 'mono', 2), w2 = tw('IN CRESCITA', 24, 600, 'mono', 2), tot = 34 + w1 + 70 + 34 + w2, lx = 540 - tot / 2;
    x.save(); x.globalAlpha = kLg; rr(lx, 1232, 24, 24, 6); x.fillStyle = rgba(RGB.red, 0.92); x.fill(); lab('IN CALO', lx + 34, 1245, 1, C.ink, { size: 24, align: 'left' });
    const l2 = lx + 34 + w1 + 70; rr(l2, 1232, 24, 24, 6); x.fillStyle = rgba(RGB.lime, 0.22); x.fill(); x.strokeStyle = 'rgba(200,250,114,0.45)'; x.lineWidth = 2; x.stroke(); lab('IN CRESCITA', l2 + 34, 1245, 1, C.ink, { size: 24, align: 'left' }); x.restore(); }
  mono('RISPETTO AL TRIMESTRE PRIMA', 540, 1300, t, tRi - 0.1, { size: 24, color: C.ink, ls: 2 });
  x.restore(); finish(t); }

/* ================= CALI + 2020: la linea vera del Pil (indice 2000 = 100), i tre cali in rosso ================= */
const IDX = GDP.map((v) => v / GDP[0] * 100), LX = (i) => 170 + i * 7.33, LY = (v) => 1300 - (v - 85) * 19;
const DR = [[32, 37], [44, 52], [77, 81]];
const DM = [{ ax: LX(37), lx: LX(37), ly: 762, ly2: 716, al: 'center', v: '−7,6%', yr: '2008–09' },
  { ax: LX(52), lx: LX(52), ly: 1076, ly2: 1120, al: 'center', v: '−5,4%', yr: '2011–13' },
  { ax: 840, lx: 735, ly: 1190, ly2: 1238, al: 'right', v: '−18,1%', yr: '2019–20' }];
function gdpAxes(kIn) { if (kIn <= 0) return; x.save(); x.globalAlpha *= kIn;
  x.strokeStyle = 'rgba(241,244,238,0.3)'; x.lineWidth = 3; x.beginPath(); x.moveTo(160, 1300); x.lineTo(950, 1300); x.stroke();
  dashLine(160, LY(100), 950, LY(100), 'rgba(241,244,238,0.2)', 2, [6, 8]);
  txt('100', 146, LY(100), { fam: 'mono', size: 24, weight: 600, color: C.muted, align: 'right' });
  for (const [yr, i] of [[2000, 0], [2010, 40], [2020, 80]]) { x.fillStyle = 'rgba(241,244,238,0.4)'; x.fillRect(LX(i) - 1, 1294, 2, 14); txt(String(yr), LX(i), 1340, { fam: 'mono', size: 24, weight: 600, color: C.muted }); }

  PATHS.forEach((Pp, j) => { const k = ioC(seg(t, tQu - 0.4 + j * 0.15, tQu + 0.5 + j * 0.15)); if (k <= 0) return;
    const fy = (xx) => { for (let i = 0; i < Pp.length - 1; i++) { const [xa, ya] = Pp[i], [xb, yb] = Pp[i + 1]; if (xx <= xb) { const u = clamp((xx - xa) / (xb - xa)); return ya + (yb - ya) * (1 - Math.cos(Math.PI * u)) / 2; } } return Pp[Pp.length - 1][1]; };
    const xe = lerp(XO1, 935, k); x.save(); x.setLineDash([10, 9]); x.lineDashOffset = -t * 30; plainStroke(fy, XO1, xe, 'rgba(245,165,36,0.75)', 4, 4); x.restore();
    if (k > 0.9) popTxt('?', 952, fy(935), seg(t, tQu + 0.4 + j * 0.15, tQu + 0.8 + j * 0.15), { size: 40, color: C.amber }); });
  const kq = Math.sin(Math.PI * seg(t, tPr - 0.1, tPr + 0.9)); if (kq > 0) glow(830, 900, 220, '245,165,36', 0.25 * kq);
  mono('ESEMPIO · NON IN SCALA', 540, 1420, t, a - 9, { size: 24, ls: 2 });
  x.restore(); finish(t); }

/* ================= CASA: l'economia va a onde; un dato solo è una finestrella sull'onda ================= */

  const kQ = seg(t, tPu - 0.15, tPu + 0.25); if (kQ > 0) { const s = Math.sin(ph), c = Math.cos(ph), L = s > 0.75 ? 'IN CIMA?' : s < -0.75 ? 'IN FONDO?' : c > 0 ? 'IN SALITA?' : 'IN DISCESA?';
    popTxt(L, 540, CY + 262, kQ, { fam: 'mono', size: 32, weight: 600, color: C.amber, ls: 3 }); }
  mono('ESEMPIO · NON IN SCALA', 540, 1420, t, tOn, { size: 24, ls: 2 });
  x.restore(); finish(t); }
