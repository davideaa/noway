<script>
/* Puntata 12 — «La recessione». Numeri SOLO da p12-fonti.md:
   Italia 2018, III e IV trimestre, Pil sul trimestre precedente: −0,1 e −0,1 nei dati di allora (il −0,1 del III: Istat, conti trimestrali III trim. 2018 del 30/11/2018, verificato in p12-fonti.md) (Istat 13/03/2019: «secondo trimestre
   consecutivo», il III solo implicito → a schermo nessuna data del comunicato), oggi +0,1 e +0,4 (Eurostat namq_10_gdp, 15/10/2026).
   Le barre dei due pannelli sono nella STESSA scala: 75 px per 0,1 punti (−0,1 = 75 px giù, +0,4 = 300 px su).
   Area euro (EA20): IV trim. 2022 −0,1, I trim. 2023 −0,2 (Eurostat); comitato CEPR 30/06/2023: «premature». Scala 240 px per punto,
   con le righe a ±1% per far vedere quanto sono piccoli. Il comitato europeo data SOLO l'area euro (mai l'Italia).
   Stati Uniti: comitato NBER (a schermo solo «istituto di ricerca», senza sigla); indicatori: occupazione, redditi, consumi (+ Pil).
   2001: recessione senza due trimestri di calo di fila (NBER FAQ). 2020: picco febbraio, minimo aprile, 2 mesi (marzo e aprile),
   «la più breve registrata dal comitato americano» (mai «di sempre»); la linea dei mesi è uno SCHEMA senza scala (nessun numero).
   Criteri NBER: profondità, diffusione, durata (FAQ, «somewhat interchangeable»): barre qualitative, senza numeri.
   Disoccupazione Italia, media annua 15–74 (Eurostat une_rt_a, 10/09/2026): 2011 8,5 · 2012 10,9 · 2013 12,4 · 2014 12,9 · 2015 12,0;
   barre da zero in scala (42 px per punto). Minimo del Pil trimestrale: I trim. 2013. Niente «recessione tecnica», niente tassi USA annualizzati.
   CAP 0 = capitolo 1. DAY 1 = martedì, lezione 2 di 5. */
const ORDER = ['num', 'hook', 'allora', 'rivisti', 'comitato', 'europa', 'bastano', 'duemilauno', 'breve', 'profonda', 'disoccupazione', 'casa', 'fine', 'cta', 'end'];
const Y2 = 345 + 92 * 1.12; /* seconda riga del titolo */
const WA = (k, ws, n, ris) => { for (const w of ws) { const v = WT(k, w, n, NaN); if (!isNaN(v)) return v; } return S(k) + ris; };
const it = (v) => (v < -0.001 ? '−' : v > 0.001 ? '+' : '') + Math.abs(v).toFixed(1).replace('.', ',');
const c1 = (v) => v.toFixed(1).replace('.', ',');
/* zoom lento centrato sul titolo: il titolo resta fermo, il resto si assesta */
const zm = (t, a, b, z0 = 1.03) => { const z = lerp(z0, 1, oC(seg(t, a, b))); x.translate(540, 345); x.scale(z, z); x.translate(-540, -345); };

/* ================= oggetti ================= */
/* timbro che cade e si stampa */
function stamp(cx, cy, label, col, rgb, k, rot = -0.1, size = 46) { if (k <= 0) return; const s = lerp(1.7, 1, oC(clamp(k))), w = tw(label, size, 800, 'Manrope', 4) + 56;
  x.save(); x.translate(cx, cy); x.rotate(rot); x.scale(s, s); x.globalAlpha *= clamp(k * 2.5);
  if (k > 0.35) glow(0, 0, w * 0.7, rgb, 0.18 * (1 - seg(k, 0.6, 1) * 0.5));
  x.fillStyle = 'rgba(5,6,7,0.78)'; rr(-w / 2, -size * 0.9, w, size * 1.8, 14); x.fill(); x.strokeStyle = col; x.lineWidth = 6; x.stroke();
  txt(label, 0, 2, { size, weight: 800, color: col, ls: 4 }); x.restore(); }
/* comitato: cinque teste a semicerchio (entrano una alla volta da t0) */
function heads(cx, cy, s, col, k, t, t0) { const n = 5;
  for (let i = 0; i < n; i++) { const u = i / (n - 1), px = cx + (u - 0.5) * 300 * s, py = cy - Math.sin(u * Math.PI) * 30 * s;
    const ki = t0 === undefined ? 1 : oB(seg(t, t0 + i * 0.08, t0 + 0.4 + i * 0.08)); if (ki <= 0) continue;
    x.save(); x.globalAlpha *= clamp(k); x.translate(px, py); x.scale(s * clamp(ki, 0, 1.2), s * clamp(ki, 0, 1.2));
    x.fillStyle = col; x.beginPath(); x.arc(0, -34, 20, 0, 7); x.fill(); x.beginPath(); x.arc(0, 26, 34, Math.PI, 0); x.closePath(); x.fill(); x.restore(); } }
/* giornale: carta chiara, testo scuro (contrasto alto) */
function paper(cx, cy, w, h, k, head, hcol = '#b8322a', rot = -0.02, extra = null) { if (k <= 0) return; x.save(); x.globalAlpha *= clamp(k); x.translate(cx, cy); x.rotate(rot);
  x.fillStyle = '#E4E7E1'; x.shadowColor = 'rgba(0,0,0,0.6)'; x.shadowBlur = 40; rr(-w / 2, -h / 2, w, h, 14); x.fill(); x.shadowBlur = 0;
  x.fillStyle = '#0b0d0c'; x.fillRect(-w / 2 + 30, -h / 2 + 30, w - 60, 16); x.fillStyle = 'rgba(11,13,12,0.4)'; x.fillRect(-w / 2 + 30, -h / 2 + 58, w - 60, 3);
  let hs = 66; while (hs > 30 && tw('RECESSIONE', hs) > w - 110) hs -= 2;
  if (head) txt(head, -tw('RECESSIONE', hs) / 2, -h / 2 + 122, { size: hs, weight: 800, color: hcol, align: 'left' }); /* da sinistra: il titolo che si scrive non si sposta */
  if (extra) extra(tw('RECESSIONE', hs), -h / 2 + 122, hs);
  const cw = (w - 84) / 2; x.fillStyle = 'rgba(11,13,12,0.18)';
  for (let c = 0; c < 2; c++) for (let yy = -h / 2 + 190; yy < h / 2 - 30; yy += 30) x.fillRect(-w / 2 + 30 + c * (cw + 24), yy, cw * (((yy * 7 + c * 13) % 5) === 0 ? 0.6 : 1), 10);
  x.restore(); }
function downArrow(cx, cy, s, col, k) { if (k <= 0) return; x.save(); x.globalAlpha *= clamp(k); x.translate(cx, cy - (1 - oC(k)) * 30); x.strokeStyle = col; x.lineWidth = 9 * s; x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath(); x.moveTo(0, -40 * s); x.lineTo(0, 40 * s); x.moveTo(-26 * s, 14 * s); x.lineTo(0, 40 * s); x.lineTo(26 * s, 14 * s); x.stroke(); x.restore(); }
function chevron(cx, cy, s, col, k) { if (k <= 0) return; x.save(); x.globalAlpha *= clamp(k); x.strokeStyle = col; x.lineWidth = 7; x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath(); x.moveTo(cx - 10 * s, cy - 20 * s); x.lineTo(cx + 10 * s, cy); x.lineTo(cx - 10 * s, cy + 20 * s); x.stroke(); x.restore(); }

/* ================= HOOK: il timbro «RECESSIONE» del 2019 cancellato dalla revisione ================= */
const SPK = Array.from({ length: 70 }, (_, i) => { const r = (n) => ((Math.sin(i * 12.9898 + n * 78.233) * 43758.5453) % 1 + 1) % 1; return [r(1), r(2), r(3), r(4)]; });
function sHook(t, a, b) { bg('50,24,22', 0.7); x.save(); zm(t, a, b);
  const tN = WT('hook', 'nel', 1, 0.0), tR = WA('hook', ['sembrava', 'recess'], 1, 1.0) + 0.1, tO = WT('hook', 'oggi', 1, 2.4), tV = WT('hook', 'rivisti', 1, 3.4), tS = WT('hook', 'sparita', 1, 4.8);
  phrase(t, a + 0.05, [['La recessione', C.ink]], 345, { size: 92 });
  phrase(t, tS - 0.1, [['che è sparita.', C.lime]], Y2, { size: 92 });
  const CX = 540, CY = 930, CW = 680, CH = 560, top = CY - CH / 2;
  const kc = oB(seg(t, tN - 0.1, tN + 0.45)); if (kc <= 0) { x.restore(); finish(t); return; }
  x.save(); x.translate(CX, CY); x.scale(lerp(0.9, 1, clamp(kc)), lerp(0.9, 1, clamp(kc))); x.translate(-CX, -CY);
  glass(CX, CY, CW, CH, 30, clamp(kc));
  txt('ITALIA · FINE 2018', CX, top + 52, { fam: 'mono', size: 30, weight: 600, color: C.ink, ls: 4, alpha: clamp(kc) });
  x.save(); x.globalAlpha = clamp(kc); x.fillStyle = 'rgba(241,244,238,0.16)'; [0.82, 0.64, 0.74].forEach((f, i) => { rr(CX - CW / 2 + 60, top + 108 + i * 34, (CW - 120) * f, 12, 6); x.fill(); }); x.restore();
  /* scansione «dati rivisti»: dall'alto al basso tra «oggi» e «rivisti» */
  const SY = CY + 50, ks = ioC(seg(t, tO, tV + 0.5)), scanY = lerp(top + 120, top + CH - 92, ks), scanOn = ks > 0 && ks < 1 ? 1 : 0;
  const kSt = seg(t, tR - 0.05, tR + 0.3);
  /* il timbro: rimane solo sotto la linea di scansione */
  if (kSt > 0) { x.save(); if (ks > 0) { x.beginPath(); x.rect(0, scanY, W, H); x.clip(); } stamp(CX, SY, 'RECESSIONE', C.red, '255,90,78', kSt, -0.08, 66); x.restore(); }
  /* frammenti rossi che volano via dove passa la scansione */
  if (ks > 0) SPK.forEach(([r1, r2, r3, r4]) => { const py0 = SY - 70 + r2 * 140, tc = lerp(tO, tV + 0.5, ioC(clamp((py0 - top - 120) / (CH - 212)))), k = seg(t, tc, tc + 1.1 + r3 * 0.6); if (k <= 0 || k >= 1) return;
    const px = CX - 260 + r1 * 520 + (r4 - 0.5) * 160 * oC(k), py = py0 - 180 * oC(k) * (0.5 + r3); x.fillStyle = `rgba(255,90,78,${0.9 * (1 - k)})`; x.fillRect(px, py, 6 + r4 * 8, 6 + r4 * 8); });
  /* il segno del timbro sparito: contorno tratteggiato */
  const kg = oC(seg(t, tV + 0.6, tS + 0.2)); if (kg > 0) { x.save(); x.globalAlpha = 0.6 * kg; x.translate(CX, SY); x.rotate(-0.08); const w = tw('RECESSIONE', 66, 800, 'Manrope', 4) + 56;
    x.strokeStyle = 'rgba(241,244,238,0.7)'; x.lineWidth = 3; x.setLineDash([10, 10]); rr(-w / 2, -66 * 0.9, w, 66 * 1.8, 14); x.stroke(); x.restore(); }
  if (scanOn) { x.save(); glow(CX, scanY, 260, '200,250,114', 0.16); x.fillStyle = C.lime; x.fillRect(CX - CW / 2 + 16, scanY - 2, CW - 32, 4);
    const lw = tw('DATI RIVISTI', 24, 600, 'mono', 3) + 28; x.fillStyle = 'rgba(5,6,7,0.9)'; rr(CX + CW / 2 - 24 - lw, scanY - 46, lw, 36, 18); x.fill(); x.strokeStyle = C.lime; x.lineWidth = 2; x.stroke();
    txt('DATI RIVISTI', CX + CW / 2 - 24 - lw / 2, scanY - 28, { fam: 'mono', size: 24, weight: 600, color: C.lime, ls: 3 }); x.restore(); }
  txt('NEI DATI DI OGGI', CX, top + CH - 50, { fam: 'mono', size: 26, weight: 600, color: C.lime, ls: 3, alpha: oC(seg(t, tV + 0.6, tV + 1.0)) });
  x.restore(); x.restore(); finish(t); }

/* ================= ALLORA + RIVISTI: due pannelli nella stessa scala, prima e dopo ================= */
const IZ = 1000, IU = 75, PL = 292, PR = 788; /* zero, px per 0,1 punti, centri dei pannelli */
function itPanel(cx, k, head, col) { if (k <= 0) return; glass(cx, 915, 445, 710, 28, k);
  txt(head, cx, 600, { fam: 'mono', size: 24, weight: 600, color: col, ls: 2, alpha: k });
  x.save(); x.globalAlpha *= k; x.strokeStyle = 'rgba(241,244,238,0.55)'; x.lineWidth = 3; x.beginPath(); x.moveTo(cx - 200, IZ); x.lineTo(cx + 200, IZ); x.stroke(); x.restore();
  txt('III TRIM.', cx - 90, 1185, { fam: 'mono', size: 24, weight: 600, color: C.muted, ls: 1, alpha: k });
  txt('IV TRIM.', cx + 90, 1185, { fam: 'mono', size: 24, weight: 600, color: C.muted, ls: 1, alpha: k });
  txt('2018', cx, 1228, { fam: 'mono', size: 24, weight: 600, color: C.muted, ls: 3, alpha: k }); }
/* barra trimestrale: v in punti percentuali; kk = crescita (il numero conta insieme alla barra) */
function qbar(cx, v, kk, col, rgb) { if (kk <= 0) return; const h = (v / 0.1) * IU * oC(kk), y0 = Math.min(IZ, IZ - h);
  x.save(); x.globalAlpha *= clamp(kk * 3); x.fillStyle = `rgba(${rgb},0.85)`; rr(cx - 55, y0, 110, Math.abs(h), v < 0 ? [0, 0, 12, 12] : [12, 12, 0, 0]); x.fill(); x.restore();
  const shown = Math.round(v * oC(kk) * 10) / 10, ly = v < 0 ? IZ + Math.abs(h) + 40 : IZ - Math.abs(h) - 40;
  txt(it(shown) + '%', cx, ly, { size: 44, weight: 800, color: col, alpha: clamp(kk * 3) }); }
/* tessera della regola pratica: «LA REGOLA DEI 2 TRIMESTRI» (due frecce giù, simboliche) = «RECESSIONE?» */
function ruleCard(cx, k, kE, kR) { if (k <= 0) return; const s = lerp(0.9, 1, oB(clamp(k))); x.save(); x.translate(cx, 905); x.scale(s, s); x.translate(-cx, -905);
  glass(cx, 905, 400, 580, 28, clamp(k)); txt('LA REGOLA DEI', cx, 668, { fam: 'mono', size: 28, weight: 600, color: C.amber, ls: 2, alpha: clamp(k) });
  txt('2 TRIMESTRI', cx, 708, { fam: 'mono', size: 28, weight: 600, color: C.amber, ls: 2, alpha: clamp(k) });
  downArrow(cx - 60, 812, 0.9, C.red, clamp(k * 1.5)); downArrow(cx + 60, 812, 0.9, C.red, clamp(k * 1.5 - 0.3));
  txt('IN CALO', cx, 888, { fam: 'mono', size: 26, weight: 600, color: C.red, ls: 3, alpha: clamp(k) });
  if (kE > 0) { x.save(); x.translate(cx, 948); x.scale(clamp(oB(kE), 0, 1.2), clamp(oB(kE), 0, 1.2)); txt('=', 0, 0, { size: 76, weight: 800, color: C.ink }); x.restore(); }
  let rs = 56; while (rs > 30 && tw('RECESSIONE?', rs) > 350) rs -= 2;
  if (kR > 0) txt('RECESSIONE?', cx, 1020 + (1 - oC(kR)) * 30, { size: rs, weight: 800, color: C.red, alpha: oC(kR), blur: (1 - oC(kR)) * 10 });
  x.restore(); }
function sAllora(t, a, b) { bg(); x.save();
  const tT = WT('allora', 'trimestri', 1, 2.1), tP = WT('allora', 'prodotto', 1, 4.1), tG = WT('allora', 'regola', 1, 5.9), tC = WT('allora', 'citata', 1, 6.6), tR = WT('allora', 'recess', 1, 7.2);
  phrase(t, a + 0.05, [['Nei dati di allora:', C.ink]], 345, { size: 92 });
  phrase(t, tT - 0.4, [['due cali di fila.', C.red]], Y2, { size: 92 }); /* «due» sulla parola */
  const kp = oC(seg(t, a + 0.15, a + 0.6)); itPanel(PL, kp, 'NEI DATI DI ALLORA', C.ink);
  qbar(PL - 90, -0.1, seg(t, tT - 0.3, tT + 0.3), C.red, '255,90,78'); qbar(PL + 90, -0.1, seg(t, tT + 0.1, tT + 0.7), C.red, '255,90,78');
  mono('PIL ITALIA · VARIAZIONE SUL TRIMESTRE PRECEDENTE', 540, 1320, t, tP - 0.1, { size: 22, color: C.muted, ls: 2 });
  /* la regola molto citata: entra su «regola», «=» su «citata», «RECESSIONE?» su «recessione» */
  const kg = oC(seg(t, tG - 0.3, tG + 0.3)); if (kg > 0) { x.save(); x.translate(0, -(1 - kg) * 90); ruleCard(PR, kg, seg(t, tC - 0.1, tC + 0.3), seg(t, tR - 0.1, tR + 0.35)); x.restore(); }
  if (tR > tG) glow(PR, 1020, 200, '255,90,78', 0.12 * oC(seg(t, tR - 0.1, tR + 0.4)));
  x.restore(); finish(t); }
function sRivisti(t, a, b) { bg(); x.save();
  const tU = WT('rivisti', 'ufficiale', 1, 2.4), tRf = WT('rivisti', 'rifatti', 1, 3.1), tDi = WT('rivisti', 'diventati', 1, 5.5), tCr = WT('rivisti', 'crescite', 1, 6.2); /* non «cali»: la voce lo dice «cadi» */
  phrase(t, a + 0.05, [['Una regola pratica,', C.amber]], 345, { size: 92, out: tRf - 0.45 });
  phrase(t, tU - 0.35, [['non ufficiale.', C.ink]], Y2, { size: 92, out: tRf - 0.45 });
  phrase(t, tRf - 0.1, [['Rifatti i conti:', C.ink]], 345, { size: 92 });
  phrase(t, tDi - 0.1, [['piccole crescite.', C.lime]], Y2, { size: 92 });
  itPanel(PL, 1, 'NEI DATI DI ALLORA', C.ink); qbar(PL - 90, -0.1, 1, C.red, '255,90,78'); qbar(PL + 90, -0.1, 1, C.red, '255,90,78');
  mono('PIL ITALIA · VARIAZIONE SUL TRIMESTRE PRECEDENTE', 540, 1320, t, -9, { size: 22, color: C.muted, ls: 2 });
  /* la regola riceve il timbro «NON UFFICIALE», poi esce a destra */
  const kx = ioC(seg(t, tRf - 0.2, tRf + 0.35));
  if (kx < 1) { x.save(); x.globalAlpha = 1 - kx; x.translate(320 * kx, 0); ruleCard(PR, 1, 1, 1);
    stamp(PR, 1128, 'NON UFFICIALE', C.amber, '245,165,36', seg(t, tU - 0.05, tU + 0.3), -0.08, 30); x.restore(); }
  /* pannello «dati rivisti»: stessi trimestri, stessa scala */
  const kp = oC(seg(t, tRf + 0.05, tRf + 0.5)); itPanel(PR, kp, 'NEI DATI RIVISTI', C.lime);
  if (kp > 0) { x.save(); x.globalAlpha = 0.55 * kp; x.strokeStyle = C.red; x.lineWidth = 2; x.setLineDash([6, 6]); [PR - 90, PR + 90].forEach((cx) => { rr(cx - 55, IZ, 110, IU, [0, 0, 12, 12]); x.stroke(); }); x.restore(); }
  chevron(540, 915, 1, C.lime, kp);
  qbar(PR - 90, 0.1, seg(t, tDi - 0.3, tDi + 0.4), C.lime, '200,250,114'); qbar(PR + 90, 0.4, seg(t, tDi + 0.1, tCr + 0.5), C.lime, '200,250,114');
  x.restore(); finish(t); }

/* ================= COMITATO: negli Stati Uniti un comitato guarda più indicatori ================= */
function icoPil(cx, cy, col) { x.save(); x.fillStyle = col; [[-34, 26], [-6, 44], [22, 62]].forEach(([dx, h]) => x.fillRect(cx + dx, cy + 30 - h, 20, h)); x.fillRect(cx - 44, cy + 32, 96, 4); x.restore(); }
function icoWork(cx, cy, col) { x.save(); x.fillStyle = col; x.strokeStyle = col; x.lineWidth = 5; x.beginPath(); x.arc(cx - 10, cy - 18, 15, 0, 7); x.fill();
  x.beginPath(); x.arc(cx - 10, cy + 34, 30, Math.PI, 0); x.closePath(); x.fill(); x.lineJoin = 'round'; rr(cx + 14, cy + 6, 36, 28, 5); x.fillStyle = '#0d110f'; x.fill(); x.stroke(); x.beginPath(); x.moveTo(cx + 24, cy + 6); x.lineTo(cx + 24, cy - 2); x.lineTo(cx + 40, cy - 2); x.lineTo(cx + 40, cy + 6); x.stroke(); x.restore(); }
function icoMoney(cx, cy, col) { x.save(); x.strokeStyle = col; x.lineWidth = 5; x.lineJoin = 'round'; rr(cx - 46, cy - 26, 92, 54, 8); x.stroke(); x.beginPath(); x.arc(cx, cy + 1, 13, 0, 7); x.stroke();
  x.fillStyle = col; x.fillRect(cx - 36, cy - 4, 8, 8); x.fillRect(cx + 28, cy - 4, 8, 8); x.restore(); }
function icoCart(cx, cy, col) { x.save(); x.strokeStyle = col; x.lineWidth = 5; x.lineJoin = 'round'; x.lineCap = 'round'; x.beginPath(); x.moveTo(cx - 48, cy - 30); x.lineTo(cx - 34, cy - 30); x.lineTo(cx - 22, cy + 14); x.lineTo(cx + 34, cy + 14); x.lineTo(cx + 44, cy - 18); x.lineTo(cx - 28, cy - 18); x.stroke();
  x.fillStyle = col; x.beginPath(); x.arc(cx - 14, cy + 30, 7, 0, 7); x.fill(); x.beginPath(); x.arc(cx + 28, cy + 30, 7, 0, 7); x.fill(); x.restore(); }
const TL = [['PIL', 'guarda', icoPil, 5.5], ['OCCUPAZIONE', 'occupazione', icoWork, 6.2], ['REDDITI', 'redditi', icoMoney, 6.6], ['CONSUMI', 'consumi', icoCart, 7.2]];
function sComitato(t, a, b) { bg(); x.save(); zm(t, a, b);
  const tC = WT('comitato', 'comitato', 1, 3.1), tI = WT('comitato', 'istituto', 1, 4.1);
  phrase(t, a + 0.05, [['Negli Stati Uniti', C.ink]], 345, { size: 92 });
  phrase(t, tC - 0.1, [['le data un comitato.', C.lime]], Y2, { size: 92 });
  const kp = oC(seg(t, tC - 0.35, tC + 0.15)); glass(540, 745, 720, 310, 30, kp);
  if (kp > 0) { heads(540, 760, 1, C.ink, kp, t, tC - 0.1);
    x.save(); x.globalAlpha = kp; x.fillStyle = metal(280, 0, 800, 0, true); x.beginPath(); x.ellipse(540, 800, 280, 44, 0, 0, 7); x.fill(); x.strokeStyle = 'rgba(200,250,114,0.6)'; x.lineWidth = 3; x.stroke(); x.restore(); }
  mono('UN ISTITUTO DI RICERCA', 540, 870, t, tI - 0.1, { size: 24, color: C.lime });
  TL.forEach(([lab, w, ico, r], i) => { const cx = 177.5 + i * 235, cy = 1180, tw0 = WT('comitato', w, 1, r), k = oB(seg(t, tw0 - 0.25, tw0 + 0.3)); if (k <= 0) return;
    const hot = i > 0 ? seg(t, tw0, tw0 + 0.2) : 0, col = i === 0 ? C.ink : C.lime;
    /* filo verso il tavolo, con un punto che sale */
    const q = { p0: [cx, 1072], c: [cx, 960], p1: [lerp(cx, 540, 0.75), 896] };
    x.save(); x.globalAlpha = clamp(k); x.strokeStyle = i === 0 ? 'rgba(241,244,238,0.45)' : 'rgba(200,250,114,0.6)'; x.lineWidth = 3; x.setLineDash([2, 10]); x.lineCap = 'round';
    x.beginPath(); x.moveTo(...q.p0); x.quadraticCurveTo(...q.c, ...q.p1); x.stroke(); x.setLineDash([]);

function euroPill(k) { if (k <= 0) return; const s = lerp(0.85, 1, oB(clamp(k))); x.save(); x.translate(540, 600); x.scale(s, s); x.translate(-540, -600);

/* ================= BREVE: 2020, picco a febbraio, minimo ad aprile, due mesi ================= */
const MESI = ['GEN', 'FEB', 'MAR', 'APR', 'MAG', 'GIU'], MX = (i) => 185 + i * 142;
const LINE = [[0, 770], [1, 770], [2, 900], [3, 1012], [4, 945], [5, 900]];

/* ================= DISOCCUPAZIONE: Italia 2011–2015, barre in scala da zero ================= */

  [A, B].forEach((lab, i) => { const y = top + 108 + i * 80, on = seg(t, [tA, tB][i], [tA, tB][i] + 0.15), w = 340;
    x.save(); x.globalAlpha = k; x.fillStyle = on > 0.5 ? 'rgba(200,250,114,0.14)' : 'rgba(241,244,238,0.06)'; rr(cx - w / 2, y - 30, w, 60, 30); x.fill();
