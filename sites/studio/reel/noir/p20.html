function dot(cx, cy, r, col, k = 1, g = null) { if (k <= 0) return; if (g) glow(cx, cy, r * 5, g, 0.35 * k); x.save(); x.globalAlpha *= clamp(k); x.fillStyle = col; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); x.strokeStyle = '#050607'; x.lineWidth = 3; x.stroke(); x.restore(); }
function polyTo(PT, k) { x.beginPath(); x.moveTo(...PT[0]); const n = Math.floor(k); for (let i = 1; i <= n && i < PT.length; i++) x.lineTo(...PT[i]);
  if (n < PT.length - 1 && k > n) { const [ax, ay] = PT[n], [bx, by] = PT[n + 1], f = k - n; x.lineTo(lerp(ax, bx, f), lerp(ay, by, f)); } }

function ring(cx, cy, r0, t, t0, rgb = '200,250,114', d = 0.6, gr = 60) { const k = seg(t, t0, t0 + d); if (k <= 0 || k >= 1) return; x.save(); x.strokeStyle = `rgba(${rgb},${1 - k})`; x.lineWidth = 4; x.beginPath(); x.arc(cx, cy, r0 + gr * oC(k), 0, 7); x.stroke(); x.restore(); }

const RANK = [211.6, 180.0, 176.4, 166.8, 147.6, 138.2, 123.8, 109.3, 108.2, 98.0, 86.5, 67.9, 64.9, 58.3, 32.5, 28.1, 27.1, 26.1, 26.0, 23.2, 22.2, 22.0, 20.3, 20.0, 19.8, 14.5, 8.6]; /* crescita % 2000→2025, Italia ultima */

  const fx = lerp(hkX(0), hkX(26), sw);

    x.beginPath(); x.moveTo(fx - 8, 560); x.lineTo(fx + 8, 560); x.lineTo(fx + 34, HK.by); x.lineTo(fx - 34, HK.by); x.closePath(); x.fill();

function chart(t, o = {}) { const { kIn = 1, n = {}, lab = {}, tolti = 0 } = o; if (kIn <= 0) return;

  /* le linee: prima le altre, l'Italia sopra; l'ultimo tratto (2025, provvisorio) tratteggiato */
  for (const c of ['fr', 'es', 'de', 'it']) { const k = n[c] || 0; if (k <= 0) continue; const [col, rgb, lw] = LN[c], PT = SER[c].map((v, i) => [GX(2000 + i), GY(v)]);

function sNove(t, a, b) { bg('52,26,24', 0.45); x.save();

/* ================= ORE × VALORE (produttivita, ore): il PIL come rettangolo di mattonelle, in scala ================= */
const RB = { x0: 120, y0: 1240, u: 56, c0: 10, r0: 8, cIt: 10 * 1.105, rIt: 8 * 1.032, cEa: 10 * 1.133, rEa: 8 * 1.22 };
/* ore: Italia 0,4% annuo (+10,5% in 25 anni), area euro 0,5% (+13,3%); valore per ora: Italia +3,2%, area euro +22% (Banca d'Italia) */
function tiles(t, o = {}) { const { k = 1, cols = RB.c0, rows = RB.r0, wave = 0, ea = 0, eaC = RB.c0, eaR = RB.r0, hiR = 0, hiC = 0, dimH = 0, lblO = 1, lblV = 1, pil = 1 } = o; if (k <= 0) return;
  const w = cols * RB.u, h = rows * RB.u, X0 = RB.x0, Y0 = RB.y0;
  x.save(); x.globalAlpha *= clamp(k * 1.5);
  /* area euro: contorno tratteggiato */
  if (ea > 0) { const we = eaC * RB.u, he = eaR * RB.u; x.save(); x.globalAlpha *= ea; x.strokeStyle = 'rgba(241,244,238,0.7)'; x.lineWidth = 3; x.setLineDash([12, 10]); x.strokeRect(X0, Y0 - he, we, he); x.setLineDash([]); x.restore();
    txt('AREA EURO', X0 + we, Y0 - he - 24, { fam: 'mono', size: 22, weight: 600, color: C.ink, align: 'right', ls: 2, alpha: ea }); }
  /* le mattonelle: ogni colonna un pezzo di ore, ogni riga un pezzo di valore per ora */
  const nc = Math.ceil(cols - 1e-6), nr = Math.ceil(rows - 1e-6), bw = k * w;
  for (let r = 0; r < nr; r++) for (let c = 0; c < nc; c++) { const cw = Math.min(1, cols - c) * RB.u, rh = Math.min(1, rows - r) * RB.u; if (c * RB.u > bw) continue;
    const px = X0 + c * RB.u, py = Y0 - r * RB.u - rh, lit = clamp(wave * (nr + 2) - r), newC = c >= RB.c0, newR = r >= RB.r0;
    let fill = `rgba(200,250,114,${0.10 + 0.16 * lit})`; if (newC) fill = `rgba(200,250,114,${0.10 + 0.25 * hiC})`; if (newR) fill = `rgba(255,90,78,${0.35 + 0.4 * hiR})`;
    x.fillStyle = fill; x.fillRect(px + 2, py + 2, Math.max(0, cw - 4), Math.max(0, rh - 4)); }
  x.strokeStyle = C.lime; x.lineWidth = 4; x.strokeRect(X0, Y0 - h, Math.min(w, bw), h);
  txt('PIL', X0 + w / 2, Y0 - h / 2 - 22, { size: 96, weight: 800, color: C.ink, alpha: pil });
  txt('= ORE × VALORE DI OGNI ORA', X0 + w / 2, Y0 - h / 2 + 50, { fam: 'mono', size: 22, weight: 600, color: C.ink, ls: 1, alpha: pil });
  txt('ITALIA', X0 + 16, Y0 - h + 26, { fam: 'mono', size: 22, weight: 600, color: C.ink, align: 'left', ls: 2, alpha: pil });
  x.restore();
  /* misure: in basso le ore, a destra il valore di ogni ora */
  const ax = X0 + Math.max(w, ea > 0 ? eaC * RB.u : 0) + 22;
  if (lblO > 0) { x.save(); x.globalAlpha = lblO * k; x.strokeStyle = C.ink; x.lineWidth = 3; x.beginPath(); x.moveTo(X0, Y0 + 22); x.lineTo(X0 + w, Y0 + 22); x.moveTo(X0, Y0 + 12); x.lineTo(X0, Y0 + 32); x.moveTo(X0 + w, Y0 + 12); x.lineTo(X0 + w, Y0 + 32); x.stroke(); x.restore();
    txt('ORE LAVORATE', X0 + w / 2, Y0 + 60, { fam: 'mono', size: 24, weight: 600, color: C.ink, ls: 2, alpha: lblO * k }); }
  if (lblV > 0) { const col = dimH > 0.5 ? C.lime : C.ink; x.save(); x.globalAlpha = lblV * k; x.strokeStyle = col; x.lineWidth = 3; x.beginPath(); x.moveTo(ax, Y0); x.lineTo(ax, Y0 - h); x.moveTo(ax - 10, Y0); x.lineTo(ax + 10, Y0); x.moveTo(ax - 10, Y0 - h); x.lineTo(ax + 10, Y0 - h); x.stroke(); x.restore();
    txt('VALORE', ax + 18, Y0 - h / 2 - 18, { fam: 'mono', size: 24, weight: 600, color: col, align: 'left', ls: 2, alpha: lblV * k });
    txt('DI OGNI ORA', ax + 18, Y0 - h / 2 + 16, { fam: 'mono', size: 24, weight: 600, color: col, align: 'left', ls: 1, alpha: lblV * k }); }
}
function sProduttivita(t, a, b) { bg('30,44,26'); x.save(); zoom(t, a, b, 1.04);

function sOre(t, a, b) { bg('30,44,26'); x.save();

  const kC = oC(seg(t, tSt - 0.3, tSt + 0.3)), ans = oC(seg(t, tOr - 0.05, tOr + 0.35));

    txt('€', CX, CY - 12, { size: 96, weight: 800, color: C.lime, alpha: ans }); txt('ALL’ORA', CX, CY + 58, { fam: 'mono', size: 24, weight: 600, color: C.lime, ls: 2, alpha: ans }); }
  ring(CX, CY, R, t, tOr, '200,250,114', 0.8, 60);

  x.restore(); finish(t); }
