<script>const P = { EP: 43, DAY: 2, CAP: 2, NEXT: ['Il potere', 'd’acquisto'] };</script>
<script src="serie.js"></script>
<script>
/* Puntata 43 — «Inflazione generale e core» (mercoledì, lezione 3 di 5, capitolo 3). Numeri SOLO da p43-fonti.md (ISTAT, definitivi 2022–2023):
   NIC (generale) e fondo (core) mensili gen 2022 – dic 2023, tabella B; picchi: generale 11,8 (ott–nov 2022), core 6,3 (feb–mar 2023); dic 2023: 0,6 e 3,1;
   settembre 2026: 4,2 e 1,6 (definitivi); paniere 2026: energetici 10,5% + alimentari non lavorati 7,0% (meno di un quinto); energetici media 2022 +50,9%.
   A schermo (arrotondati, già detti a voce): quasi 12 · circa 6 · sotto 1 · sopra 3 · sopra 4 · sotto 2 · più del 50 · meno di un quinto. Niente righe di fonte nel video. */
const ORDER = ['num', 'hook', 'def', 'pesano', 'picchi', 'tendenza', 'capovolge', 'oggi', 'casa', 'fine', 'cta', 'end'];
const Y2 = 345 + 92 * 1.12; /* seconda riga del titolo a size 92 */
const NIC = [4.8, 5.7, 6.5, 6.0, 6.8, 8.0, 7.9, 8.4, 8.9, 11.8, 11.8, 11.6, 10.0, 9.1, 7.6, 8.2, 7.6, 6.4, 5.9, 5.4, 5.3, 1.7, 0.7, 0.6];
const CORE = [1.5, 1.7, 1.9, 2.4, 3.2, 3.8, 4.1, 4.4, 5.0, 5.3, 5.6, 5.8, 6.0, 6.3, 6.3, 6.2, 6.0, 5.6, 5.2, 4.8, 4.6, 4.2, 3.6, 3.1];

/* WA: secondo in cui la voce dice la n-esima parola della scena che inizia con UNA delle alternative (lettere E cifre; sui decimali anche la parte intera).
   Senza voce (anteprima) usa la frazione f della scena. */
const WA = (k, ws, n = 1, f = 0.5) => { (window.ANCH = window.ANCH || {})[k + '|' + ws.join('/') + '|' + n] = [k, ws, n];
  const L = ((window.WORDS || {})[k]) || [];
  for (const w of ws) { let c = 0; for (const [p, t] of L) if (_nw(p).startsWith(_nw(w)) && ++c === n) return t; }
  return S(k) + f * Math.max(1, E(k) - S(k)); };
const lab = (t, s, px, py, a0, o = {}) => txt(s, px, py, { fam: 'mono', size: 26, weight: 600, color: C.muted, ls: 2, alpha: oC(seg(t, a0, a0 + 0.35)), ...o });
function dash(x0, y0, x1, y1, col, w = 3, d = [10, 10], a = 1) { if (a <= 0) return; x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.lineWidth = w; x.setLineDash(d); x.lineCap = 'round'; x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); x.restore(); }
function pop(cx, cy, k, fn) { if (k <= 0) return; x.save(); x.globalAlpha *= clamp(k); const s = clamp(k, 0, 1.15); x.translate(cx, cy); x.scale(s, s); x.translate(-cx, -cy); fn(); x.restore(); }
/* il testo scritto non scende mai sotto 0,85: «si accende» = cambia colore, non opacità */
const big = (t, s, px, py, a0, o = {}) => { const k = oC(seg(t, a0, a0 + 0.4)); txt(s, px, py, { size: 62, weight: 800, ls: -1, alpha: k, blur: (1 - k) * 10, ...o }); };

/* ================= HOOK: due termometri di vetro: la generale sale fino a «quasi 12», la core si ferma a meno della metà ================= */
function tube(cx, BASE, TH, k) { glass(cx, BASE - TH / 2, 150, TH, 36, k); }
function sHook(t, a, b) { bg('52,34,28', 0.6); x.save(); zoom(t, a, b, 1.04);
  const tAnn = WA('hook', ['duemilaventidue', '2022', '2'], 1, 0.1), tDod = WA('hook', ['dodici', '12'], 1, 0.4), tTog = WA('hook', ['togliendo'], 1, 0.55), tMeta = WA('hook', ['meta'], 1, 0.9);
  phrase(t, a + 0.05, [['Prezzi in Italia,', C.ink]], 345, { size: 92 });
  phrase(t, tDod - 0.12, [['quasi 12%', C.red]], Y2, { size: 92 });
  const LX = 300, RX = 780, BASE = 1250, TH = 624, SC = 52, ke = oB(seg(t, a + 0.1, a + 0.6));
  lab(t, 'AUTUNNO 2022', 540, 585, tAnn - 0.1, { color: C.ink, size: 26, ls: 3 });
  [LX, RX].forEach((cx) => pop(cx, BASE - TH / 2, ke, () => tube(cx, BASE, TH, 1)));
  /* generale: si riempie subito, fino a 11,8 */
  const hR = 11.8 * SC * ioC(seg(t, a + 0.3, a + 1.9)), hL = 5.6 * SC;
  x.save(); rr(LX - 75, BASE - TH, 150, TH, 36); x.clip(); x.fillStyle = C.red; x.globalAlpha = 0.9; x.fillRect(LX - 75, BASE - hR, 150, hR); x.globalAlpha = 1; x.fillStyle = 'rgba(255,255,255,0.55)'; x.fillRect(LX - 75, BASE - hR, 150, 5); x.restore();
  glow(LX, BASE - hR, 150, '255,90,78', 0.28);
  /* core: sagoma tratteggiata subito, si riempie su «togliendo» */
  x.save(); x.globalAlpha = oC(seg(t, a + 0.3, a + 0.8)) * 0.5; x.setLineDash([10, 9]); x.strokeStyle = C.lime; x.lineWidth = 3; rr(RX - 62, BASE - hL, 124, hL - 8, 14); x.stroke(); x.restore();
  const p2 = ioC(seg(t, tTog - 0.1, Math.max(tTog + 1.1, tMeta - 0.2))), h2 = hL * p2;
  x.save(); rr(RX - 75, BASE - TH, 150, TH, 36); x.clip(); x.fillStyle = C.lime; x.globalAlpha = 0.9; x.fillRect(RX - 75, BASE - h2, 150, h2); x.globalAlpha = 1; x.fillStyle = 'rgba(255,255,255,0.55)'; if (h2 > 2) x.fillRect(RX - 75, BASE - h2, 150, 5); x.restore();
  if (h2 > 4) glow(RX, BASE - h2, 130, '200,250,114', 0.22);
  /* la metà: riga tratteggiata dalla generale alla core */
  const yM = BASE - 11.8 / 2 * SC, kM = oC(seg(t, a + 0.5, a + 1.0));
  dash(LX + 85, yM, RX - 85, yM, C.ink, 3, [10, 9], kM * 0.7);
  lab(t, 'METÀ', 540, yM - 30, tMeta - 0.15, { color: C.ink, size: 26, ls: 4 });
  lab(t, 'GENERALE', LX, 1305, a + 0.5, { color: C.red, weight: 700, size: 28, ls: 3 }); lab(t, 'TUTTI I PREZZI', LX, 1343, a + 0.6, { color: C.ink, size: 22, ls: 1 });
  lab(t, 'DI FONDO', RX, 1305, a + 0.5, { color: C.lime, weight: 700, size: 28, ls: 3 }); lab(t, 'SENZA ENERGIA E CIBO FRESCO', RX, 1343, a + 0.6, { color: C.ink, size: 22, ls: 1 });
  x.restore(); finish(t); }

/* ================= DEF: il paniere è una scatola di vetro con 50 prezzi; energia e alimentari freschi escono, restano quelli del fondo ================= */
const DOTS = (() => { const L = []; const R = new Set(['0,1', '1,7', '2,3', '3,9', '4,5']), A = new Set(['0,6', '2,8', '3,2', '4,0']);
  for (let r = 0; r < 5; r++) for (let c = 0; c < 10; c++) { const k = r + ',' + c; L.push({ r, c, ty: R.has(k) ? 'e' : A.has(k) ? 'a' : 'n', x: 180 + c * 80, y: 740 + r * 80 }); }
  let ie = 0, ia = 0; L.forEach((d) => { if (d.ty === 'e') d.ix = ie++; if (d.ty === 'a') d.ix = ia++; }); return L; })();
function sDef(t, a, b) { bg('30,44,26'); x.save(); zoom(t, a, b, 1.04);
  const tGen = WA('def', ['generale'], 1, 0.12), tPan = WA('def', ['paniere'], 1, 0.3), tFon = WA('def', ['fondo'], 1, 0.45), tLas = WA('def', ['lascia'], 1, 0.62), tEne = WA('def', ['energia'], 1, 0.72), tAli = WA('def', ['alimentari'], 1, 0.85);
  phrase(t, a + 0.05, [['Generale: tutto', C.ink]], 345, { size: 92 });
  phrase(t, tLas - 0.1, [['Core: tolte due voci', C.lime]], Y2, { size: 92 });
  const kb = oB(seg(t, a + 0.1, a + 0.6)); pop(540, 900, kb, () => glass(540, 900, 880, 470, 40, 1));
  lab(t, 'IL PANIERE', 540, 628, tPan - 0.1, { color: C.ink, size: 26, ls: 4 });
  DOTS.forEach((d, i) => { const k = oB(seg(t, a + 0.15 + i * 0.012, a + 0.55 + i * 0.012)); if (k <= 0) return;
    let px = d.x, py = d.y, col = 'rgba(241,244,238,0.80)';
    if (d.ty === 'n') { if (t >= tFon - 0.1) col = C.lime; }
    else { const te = d.ty === 'e' ? tEne : tAli, u = ioC(seg(t, te - 0.1, te + 0.7));
      if (t >= tLas - 0.1) col = d.ty === 'e' ? C.red : C.amber;
      const gx = d.ty === 'e' ? 300 + (d.ix - 2) * 56 : 770 + (d.ix - 1.5) * 56; px = lerp(d.x, gx, u); py = lerp(d.y, 1240, u) - Math.sin(Math.PI * u) * 70; }
    x.save(); x.globalAlpha = clamp(k); x.fillStyle = col; x.beginPath(); x.arc(px, py, 22 * clamp(k, 0, 1.15), 0, 7); x.fill(); x.restore(); });
  glow(540, 900, 380, '200,250,114', 0.10 * oC(seg(t, tFon - 0.1, tFon + 0.5)));
  lab(t, 'ENERGIA', 300, 1305, tEne - 0.1, { color: C.red, weight: 700, size: 26, ls: 3 });
  lab(t, 'ALIMENTARI FRESCHI', 770, 1305, tAli - 0.1, { color: C.amber, weight: 700, size: 24, ls: 2 });
  x.restore(); finish(t); }

/* ================= PESANO: ciambella del paniere con due fette piccole (meno di un quinto); sotto la barra dell'energia +50% ================= */
function arcSlice(cx, cy, R, a0, a1, col, w, al = 1) { x.save(); x.globalAlpha *= al; x.strokeStyle = col; x.lineWidth = w; x.lineCap = 'butt'; x.beginPath(); x.arc(cx, cy, R, a0, a1); x.stroke(); x.restore(); }
function sPesano(t, a, b) { bg('52,44,20', 0.5); x.save(); zoom(t, a, b, 1.03);
  const tMen = WA('pesano', ['meno'], 1, 0.12), tEne = WA('pesano', ['energia'], 1, 0.62), tCin = WA('pesano', ['cinquanta', '50', 'cinquant'], 1, 0.85);
  phrase(t, a + 0.05, [['Pesano poco,', C.ink], ['spostano tutto', C.lime]], 345, { size: 92 });
  const CX = 400, CY = 830, R = 160, SW = 64, A0 = -Math.PI / 2, d1 = 10.5 / 100 * Math.PI * 2, d2 = 7.0 / 100 * Math.PI * 2, kr = oC(seg(t, a + 0.1, a + 0.7));
  arcSlice(CX, CY, R, 0, Math.PI * 2, 'rgba(241,244,238,0.26)', SW, kr);
  const g1 = oC(seg(t, a + 0.3, a + 1.1)), g2 = oC(seg(t, a + 0.5, a + 1.3)), lit = oC(seg(t, tMen - 0.1, tMen + 0.4));
  arcSlice(CX, CY, R, A0, A0 + d1 * g1, C.red, SW, 0.55 + 0.45 * lit); arcSlice(CX, CY, R, A0 + d1, A0 + d1 + d2 * g2, C.amber, SW, 0.55 + 0.45 * lit);
  glow(CX + Math.cos(A0 + 0.5 * (d1 + d2)) * R, CY + Math.sin(A0 + 0.5 * (d1 + d2)) * R, 150, '245,165,36', 0.25 * lit);
  txt('MENO DI', CX, CY - 16, { fam: 'mono', size: 24, weight: 600, color: C.ink, ls: 2, alpha: oC(seg(t, tMen - 0.05, tMen + 0.3)) });
  txt('UN QUINTO', CX, CY + 18, { fam: 'mono', size: 24, weight: 600, color: C.ink, ls: 2, alpha: oC(seg(t, tMen + 0.05, tMen + 0.4)) });
  /* legenda a destra della ciambella */
  const kl = oC(seg(t, a + 0.5, a + 0.9));
  x.save(); x.globalAlpha = kl; x.fillStyle = C.red; x.beginPath(); x.arc(660, 760, 14, 0, 7); x.fill(); x.fillStyle = C.amber; x.beginPath(); x.arc(660, 830, 14, 0, 7); x.fill(); x.restore();
  txt('ENERGIA', 688, 760, { fam: 'mono', size: 26, weight: 600, color: C.red, ls: 2, align: 'left', alpha: kl });
  txt('ALIMENTARI FRESCHI', 688, 830, { fam: 'mono', size: 22, weight: 600, color: C.amber, ls: 1, align: 'left', alpha: kl });
  /* barra dell'energia: binario tratteggiato subito, si riempie dopo «energia» fino a «cinquanta» */
  const TX0 = 130, TX1 = 950, TY = 1250, PX = (TX1 - TX0) / 60, kt = oC(seg(t, a + 0.4, a + 0.9));
  x.save(); x.globalAlpha = kt * 0.6; x.setLineDash([10, 8]); x.strokeStyle = C.red; x.lineWidth = 3; rr(TX0, TY - 22, TX1 - TX0, 44, 22); x.stroke(); x.restore();
  const pf = ioC(seg(t, tEne - 0.1, Math.max(tEne + 1.2, tCin + 0.2))), wF = 50 * PX * pf;
  if (wF > 4) { x.save(); x.fillStyle = C.red; rr(TX0, TY - 22, Math.max(wF, 44), 44, 22); x.fill(); x.restore(); glow(TX0 + wF, TY, 110, '255,90,78', 0.3); }
  lab(t, 'ENERGIA · MEDIA 2022', TX0, 1130, a + 0.5, { align: 'left', size: 24, color: C.ink });
  big(t, 'più del 50%', TX1, 1135, tCin - 0.1, { color: C.red, align: 'right' });
  x.restore(); finish(t); }

/* ================= PICCHI: le due linee VERE (tabella ISTAT 2022–2023); la rossa sale in autunno, la lime arriva al suo picco mesi dopo ================= */
function sPicchi(t, a, b) { bg('30,44,26'); x.save(); zoom(t, a, b, 1.03);
  const tAut = WA('picchi', ['autunno'], 1, 0.18), tCor = WA('picchi', ['core'], 1, 0.42), tSei = WA('picchi', ['sei', '6'], 1, 0.62), tFeb = WA('picchi', ['febbraio'], 1, 0.8);
  phrase(t, a + 0.05, [['Due picchi,', C.ink], ['mesi di distanza', C.lime]], 345, { size: 92 });
  const XL = 110, XR = 970, YB = 1290, SC = 58, xm = (i) => XL + i / 23 * (XR - XL), ym = (v) => YB - v * SC;
  x.save(); x.globalAlpha = oC(seg(t, a + 0.1, a + 0.6)); x.strokeStyle = 'rgba(241,244,238,0.55)'; x.lineWidth = 3; x.beginPath(); x.moveTo(XL - 20, YB); x.lineTo(XR + 20, YB); x.stroke();
  x.strokeStyle = 'rgba(241,244,238,0.14)'; x.lineWidth = 2; for (const v of [3, 6, 9, 12]) { x.beginPath(); x.moveTo(XL - 20, ym(v)); x.lineTo(XR + 20, ym(v)); x.stroke(); } x.restore();
  const path = (A) => { x.beginPath(); A.forEach((v, i) => (i ? x.lineTo(xm(i), ym(v)) : x.moveTo(xm(i), ym(v)))); };
  /* ghost della core: sagoma tratteggiata, c'è fin dall'inizio */
  x.save(); x.globalAlpha = oC(seg(t, a + 0.3, a + 0.8)) * 0.45; x.setLineDash([10, 10]); x.strokeStyle = C.lime; x.lineWidth = 6; x.lineJoin = 'round'; path(CORE); x.stroke(); x.restore();
  const drawL = (A, col, p) => { if (p <= 0) return; const HX = XL + p * (XR - XL); x.save(); x.beginPath(); x.rect(0, 0, HX, H); x.clip(); x.strokeStyle = col; x.lineWidth = 9; x.lineJoin = 'round'; x.lineCap = 'round'; path(A); x.stroke(); x.restore();
    const f = p * 23, i0 = Math.min(22, Math.floor(f)), y = lerp(ym(A[i0]), ym(A[i0 + 1]), f - i0); if (p < 1) { glow(HX, y, 70, col === C.red ? '255,90,78' : '200,250,114', 0.55); x.fillStyle = C.ink; x.beginPath(); x.arc(HX, y, 12, 0, 7); x.fill(); } };
  drawL(NIC, C.red, ioC(seg(t, a + 0.2, Math.max(a + 2.2, tAut + 0.9))));
  drawL(CORE, C.lime, ioC(seg(t, tCor - 0.1, Math.max(tCor + 1.9, tSei + 0.5))));
  /* i due picchi */
  const kR = oB(seg(t, tAut, tAut + 0.4)), kL = oB(seg(t, tFeb - 0.1, tFeb + 0.3));
  pop(xm(9.5), ym(11.8), kR, () => { glow(xm(9.5), ym(11.8), 70, '255,90,78', 0.5); x.fillStyle = C.red; x.beginPath(); x.arc(xm(9.5), ym(11.8), 16, 0, 7); x.fill(); x.strokeStyle = C.ink; x.lineWidth = 4; x.stroke(); });
  pop(xm(13.5), ym(6.3), kL, () => { glow(xm(13.5), ym(6.3), 70, '200,250,114', 0.5); x.fillStyle = C.lime; x.beginPath(); x.arc(xm(13.5), ym(6.3), 16, 0, 7); x.fill(); x.strokeStyle = C.ink; x.lineWidth = 4; x.stroke(); });
  lab(t, 'AUTUNNO 2022', xm(9.5), 566, tAut - 0.1, { color: C.red, weight: 700, size: 26, ls: 3 });
  lab(t, 'FEB–MAR 2023', xm(13.5), 1140, tFeb - 0.1, { color: C.lime, weight: 700, size: 26, ls: 2 });
  big(t, 'circa 6%', xm(13.5), 1075, tSei - 0.1, { color: C.lime });
  lab(t, 'GENERALE', XL, 1062, a + 0.6, { align: 'left', size: 24, color: C.red, weight: 700, ls: 2 }); lab(t, 'CORE', XL, 1252, a + 0.6, { align: 'left', size: 24, color: C.lime, weight: 700, ls: 2 });
  lab(t, 'GEN 2022', XL, 1335, a + 0.5, { align: 'left', size: 24 }); lab(t, 'DIC 2023', XR, 1335, a + 0.5, { align: 'right', size: 24 });
  x.restore(); finish(t); }

/* ================= TENDENZA: una griglia di prezzi; la core è il tassello al centro, se sale il rincaro si allarga a onda ================= */
function sTendenza(t, a, b) { bg('52,34,28', 0.6); x.save(); zoom(t, a, b, 1.04);
  const tBan = WA('tendenza', ['banca', 'bce'], 1, 0.12), tPer = WA('tendenza', ['persistenti', 'persist'], 1, 0.3), tSal = WA('tendenza', ['sale'], 1, 0.58), tAll = WA('tendenza', ['allargando', 'allarga'], 1, 0.85);
  phrase(t, a + 0.05, [['La core cerca', C.ink], ['i rincari persistenti', C.lime]], 345, { size: 92 });
  lab(t, 'PER LA BCE', 540, 595, tBan - 0.1, { color: C.ink, size: 26, ls: 4 });
  const TS = 104, GP = 12, X0 = (1080 - (7 * TS + 6 * GP)) / 2, Y0 = 665, cc = 3, cr = 2, tS = Math.max(tSal - 0.1, a + 1.0);
  for (let r = 0; r < 5; r++) for (let c = 0; c < 7; c++) { const cx = X0 + c * (TS + GP) + TS / 2, cy = Y0 + r * (TS + GP) + TS / 2, d = Math.hypot(c - cc, (r - cr) * 1.2), isC = c === cc && r === cr;
    const k = oB(seg(t, a + 0.1 + (c + r) * 0.04, a + 0.5 + (c + r) * 0.04)); if (k <= 0) continue;
    const u = isC ? oC(seg(t, tS, tS + 0.4)) : oC(seg(t, tS + 0.25 + d * 0.3, tS + 0.65 + d * 0.3)), pr = oC(seg(t, tPer - 0.1, tPer + 0.4)) * (isC ? 1 : 0);
    const col = isC ? C.lime : C.red;
    pop(cx, cy, k, () => { glass(cx, cy, TS, TS, 22, 1); x.save(); x.globalAlpha = u * 0.4; x.fillStyle = col; rr(cx - TS / 2, cy - TS / 2, TS, TS, 22); x.fill(); x.restore();
      x.save(); x.strokeStyle = u > 0.05 ? col : pr > 0 ? C.amber : 'rgba(241,244,238,0.30)'; x.lineWidth = u > 0.05 || pr > 0 ? 4 : 2.5; x.globalAlpha = Math.max(0.5, u, pr); rr(cx - TS / 2, cy - TS / 2, TS, TS, 22); x.stroke(); x.restore(); });
    if (u > 0.05 && u < 1) glow(cx, cy, 90, isC ? '200,250,114' : '255,90,78', 0.3 * (1 - u)); if (isC) txt('CORE', cx, cy, { fam: 'mono', size: 26, weight: 700, color: C.ink, ls: 1, alpha: k }); }
  lab(t, 'SE SALE ANCHE LEI: SI ALLARGA', 540, 1300, tAll - 0.2, { color: C.red, weight: 700, size: 26, ls: 2 });
  x.restore(); finish(t); }

/* ================= CAPOVOLGE: un'altalena; a sinistra la generale, a destra la core; il lato basso (più alto) si ribalta ================= */
function sCapovolge(t, a, b) { bg('52,34,28', 0.6); x.save(); zoom(t, a, b, 1.04);
  const tCap = WA('capovolge', ['capovolge', 'capovol'], 1, 0.18), tDic = WA('capovolge', ['dicembre'], 1, 0.3), tSot = WA('capovolge', ['sotto'], 1, 0.42), tEne = WA('capovolge', ['energia'], 1, 0.62), tSop = WA('capovolge', ['sopra'], 1, 0.82);
  phrase(t, a + 0.05, [['Il rapporto', C.ink], ['si capovolge', C.lime]], 345, { size: 92 });
  const PX = 540, PY = 1100, L = 390, ph = -0.2 + 0.4 * oB(seg(t, tCap - 0.15, tCap + 0.75), 1.4) + 0.012 * Math.sin(t * 2.2) * (1 - seg(t, tCap - 0.15, tCap + 0.4));
  const ks = oB(seg(t, a + 0.1, a + 0.6));
  /* appoggio e terra */
  dash(140, 1240, 940, 1240, 'rgba(241,244,238,0.4)', 3, [], ks);
  x.save(); x.globalAlpha = ks; x.fillStyle = 'rgba(241,244,238,0.16)'; x.strokeStyle = 'rgba(241,244,238,0.7)'; x.lineWidth = 3; x.beginPath(); x.moveTo(PX, PY + 6); x.lineTo(PX - 85, 1240); x.lineTo(PX + 85, 1240); x.closePath(); x.fill(); x.stroke(); x.restore();
  /* asse */
  x.save(); x.translate(PX, PY); x.rotate(ph); x.globalAlpha = ks;
  glass(0, -13, 2 * L, 26, 13, 1);

/* ================= OGGI: due quadranti; la generale a settembre 2026 sopra il 4, la core sotto il 2; la spinta sembra l'energia ================= */
function sOggi(t, a, b) { bg('30,44,26'); x.save(); zoom(t, a, b, 1.03);
  const tAnn = WA('oggi', ['duemilaventisei', '2026', '2'], 1, 0.12), tSop = WA('oggi', ['sopra'], 1, 0.34), tSot = WA('oggi', ['sotto'], 1, 0.55), tSpi = WA('oggi', ['spingere', 'spinger'], 1, 0.74), tEne = WA('oggi', ['energia'], 1, 0.86);
  phrase(t, a + 0.05, [['Settembre', C.ink]], 345, { size: 92 });

  const CY = 900, GR = 150, pg = ioC(seg(t, a + 0.2, a + 1.6)), kg = oB(seg(t, a + 0.1, a + 0.6));
  glow(280, CY, 240, '255,90,78', 0.10 * kg); glow(800, CY, 240, '200,250,114', 0.08 * kg);

  lab(t, 'GENERALE', 280, 1172, a + 0.4, { color: C.red, weight: 700, size: 26, ls: 3 }); lab(t, 'CORE', 800, 1172, a + 0.4, { color: C.lime, weight: 700, size: 26, ls: 3 });
  lab(t, 'A SPINGERE SEMBRA', 540, 1250, tSpi - 0.1, { color: C.ink, size: 24, ls: 3 });

/* ================= CASA: due pannelli di vetro; la generale dice quanto sale tutto (scala che sale), la core aiuta a leggere il picco (lampo breve o gradino che resta) ================= */
function poly(P, p, col, w) { if (p <= 0) return; const tot = P[P.length - 1][0] - P[0][0], lim = P[0][0] + tot * p; x.save(); x.beginPath(); x.rect(P[0][0] - 20, 0, lim - P[0][0] + 20, H); x.clip(); x.strokeStyle = col; x.lineWidth = w; x.lineJoin = 'round'; x.lineCap = 'round'; x.beginPath(); P.forEach(([px, py], i) => (i ? x.lineTo(px, py) : x.moveTo(px, py))); x.stroke(); x.restore(); }
function sCasa(t, a, b) { bg('30,44,26'); x.save(); zoom(t, a, b, 1.04);
  const tGen = WA('casa', ['generale'], 1, 0.12), tSal = WA('casa', ['sale'], 1, 0.28), tCor = WA('casa', ['core'], 1, 0.42), tPas = WA('casa', ['passeggero'], 1, 0.7), tDur = WA('casa', ['duraturo'], 1, 0.88);
  phrase(t, a + 0.05, [['Cosa ti porti', C.ink], ['a casa?', C.lime]], 345, { size: 92 });
  const k1 = oB(seg(t, a + 0.1, a + 0.6)), k2 = oB(seg(t, a + 0.25, a + 0.75));
  pop(540, 780, k1, () => glass(540, 780, 860, 300, 40, 1)); pop(540, 1135, k2, () => glass(540, 1135, 860, 340, 40, 1));
  /* pannello 1: generale = quanto sale tutto */
  txt('GENERALE', 150, 735, { size: 48, weight: 800, color: C.red, align: 'left', ls: -1, alpha: oC(seg(t, a + 0.3, a + 0.7)) });
  lab(t, 'DICE QUANTO SALE TUTTO', 150, 800, a + 0.5, { align: 'left', size: 24, color: C.ink, ls: 2 });
  const ls1 = oC(seg(t, tSal - 0.1, tSal + 0.8));
  for (let i = 0; i < 6; i++) { const h = 40 + i * 32, bx = 600 + i * 48, k = oC(seg(t, a + 0.4 + i * 0.05, a + 0.8 + i * 0.05)), on = ls1 > i / 6;
    x.save(); x.globalAlpha = k * (on ? 1 : 0.5); x.fillStyle = on ? C.red : 'rgba(241,244,238,0.45)'; rr(bx, 905 - h * k, 36, h * k, 6); x.fill(); x.restore(); }
  /* pannello 2: core = leggere il picco */
  txt('CORE', 150, 1040, { size: 48, weight: 800, color: C.lime, align: 'left', ls: -1, alpha: oC(seg(t, a + 0.35, a + 0.75)) });
  lab(t, 'AIUTA A CAPIRE IL PICCO', 150, 1105, a + 0.6, { align: 'left', size: 24, color: C.ink, ls: 2 });
  const YB = 1195, sp = [[560, YB], [610, YB], [640, YB - 90], [670, YB], [720, YB]], st = [[770, YB], [820, YB], [850, YB - 90], [940, YB - 90]];
  x.save(); x.globalAlpha = oC(seg(t, a + 0.5, a + 1.0)) * 0.4; x.setLineDash([8, 8]); x.strokeStyle = C.amber; x.lineWidth = 5; x.beginPath(); sp.forEach(([px, py], i) => (i ? x.lineTo(px, py) : x.moveTo(px, py))); x.stroke(); x.strokeStyle = C.red; x.beginPath(); st.forEach(([px, py], i) => (i ? x.lineTo(px, py) : x.moveTo(px, py))); x.stroke(); x.restore();
  poly(sp, ioC(seg(t, tPas - 0.1, tPas + 0.8)), C.amber, 7); poly(st, ioC(seg(t, tDur - 0.1, tDur + 0.8)), C.red, 7);
  lab(t, 'PASSEGGERO', 640, 1255, tPas - 0.1, { color: C.amber, weight: 700, size: 22, ls: 1 }); lab(t, 'DURATURO', 855, 1255, tDur - 0.1, { color: C.red, weight: 700, size: 22, ls: 1 });
  x.restore(); finish(t); }
