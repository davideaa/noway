<script>const P = { EP: 19, DAY: 3, CAP: 0, NEXT: ['Perché l’Italia', 'cresce poco'], FONTE: 'DATI: ISTAT · BANCA D’ITALIA (non scritta nel video dal 16/10/2026)' };</script>
<script src="serie.js"></script>
<script>
/* Puntata 19 — «La demografia». Numeri SOLO da p19-fonti.md:
   over 65 ogni 10 persone di 15–64 anni: 39,8 per 100 al 1/1/2026 (14.821 / 37.270 mila, calcolo nostro su Istat) → 3,98 sagome;
   2050: 62,4 per 100 (34,5 / 55,3, proiezione Istat base 1/1/2025, calcolo nostro) → 6,24 sagome («più di sei»);
   nati: 576.659 (2008) → 355.772 (2025) = 61,7 ogni 100 → 6,17 culle da 10; fecondità 1,18 (2024) → 1,14 (2025, STIMA), «nuovo minimo storico» (Istat, solo per la fecondità);
   quote al 1/1/2026: 0–14 11,6% · 15–64 63,2% · 65+ 25,1% (la piramide qui sotto è un modello illustrativo tarato su queste quote: 11,6 / 63,2 / 25,1);
   15–64 anni: 37,3 milioni (2025) → quasi 7 milioni in meno nel 2050 (proiezione Istat): colonna in scala, 17,2 px per milione;
   proiezione 2030: saldo migratorio +247 mila contro saldo naturale −353 mila (Istat, Previsioni 31/08/2026, p. 3): barre in scala, 1,8 px per mille;
   Banca d'Italia (30/09/2026): più partecipazione «potrà al più compensare» il calo; «solo un recupero sostenuto della produttività può sostenere la crescita».
   Il muro di mattoni (lavoro, produttivita) è un'illustrazione. Niente righe di fonte a schermo (Davide, 16/10/2026). */
const ORDER = ['num', 'hook', 'proiezione', 'culle', 'figli', 'quindici', 'bebibum', 'settemilioni', 'immigrazione', 'lavoro', 'produttivita', 'casa', 'fine', 'cta', 'end'];
const Y2 = 345 + 92 * 1.12; /* seconda riga del titolo */
/* parola con più grafie possibili (Whisper: «bebi bum» / «baby boom», apostrofi): prova in ordine, poi la riserva */
const WA = (k, ws, n, ris) => { for (const w of ws) { const v = WT(k, w, n, NaN); if (!isNaN(v)) return v; } return S(k) + ris; };
const lab = (s, px, py, k, col = C.muted, size = 26, o = {}) => txt(s, px, py, { fam: 'mono', size, weight: 600, color: col, alpha: k, ls: 2, ...o });
const swapK = (t, t0) => [1 - oC(seg(t, t0 - 0.3, t0 - 0.05)), oC(seg(t, t0, t0 + 0.3))];
/* etichetta di onestà: pillola tratteggiata ambra */
function honest(s, k, y = 1425, cx = 540) { if (k <= 0) return; const ww = tw(s, 22, 600, 'mono', 3) + 44; x.save(); x.globalAlpha *= k; x.strokeStyle = 'rgba(245,165,36,0.8)'; x.lineWidth = 2; x.setLineDash([6, 6]); rr(cx - ww / 2, y - 25, ww, 50, 25); x.stroke(); x.setLineDash([]); x.restore();
  txt(s, cx, y, { fam: 'mono', size: 22, weight: 600, color: C.amber, alpha: k, ls: 3 }); }
function ring(cx, cy, r0, t, t0, rgb = '200,250,114', d = 0.6, gr = 60) { const k = seg(t, t0, t0 + d); if (k <= 0 || k >= 1) return; x.save(); x.strokeStyle = `rgba(${rgb},${1 - k})`; x.lineWidth = 4; x.beginPath(); x.arc(cx, cy, r0 + gr * oC(k), 0, 7); x.stroke(); x.restore(); }
function dashLine(x0, y0, x1, y1, col, w = 3, dash = [10, 10], a = 1) { if (a <= 0) return; x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.lineWidth = w; x.setLineDash(dash); x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); x.restore(); }

/* ================= SAGOMA stilizzata (nessuna persona reale): by = piedi, h = altezza, fill = quanto è piena dal basso ================= */
function person(cx, by, h, o = {}) {
  const { col = C.lime, rgb = '200,250,114', fill = 1, k = 1, old = false, dress = false, dash = false, kid = 0, hrk = null, bwk = 0.42 } = o;
  if (k <= 0) return; const s = clamp(oB(clamp(k)), 0, 1.15);
  x.save(); x.translate(cx, by); x.scale(s, s); x.globalAlpha *= clamp(k * 2); if (old) x.rotate(0.06);
  const hr = h * (hrk ?? lerp(0.135, 0.2, kid)), hx = old ? h * 0.05 : 0, hy = -h + hr, sy = -h + 2 * hr + h * 0.035, bw = h * bwk;
  const path = () => { x.beginPath(); x.arc(hx, hy, hr, 0, 7);
    if (dress) { x.moveTo(-bw * 0.3, sy + bw * 0.08); x.quadraticCurveTo(0, sy - bw * 0.2, bw * 0.3, sy + bw * 0.08); x.lineTo(bw * 0.6, -2); x.quadraticCurveTo(0, 4, -bw * 0.6, -2); x.closePath(); }
    else x.roundRect(-bw / 2, sy, bw, -sy, [bw / 2, bw / 2, h * 0.05, h * 0.05]); };
  path(); x.fillStyle = `rgba(${rgb},0.10)`; x.fill();
  if (fill > 0) { x.save(); x.beginPath(); x.rect(-h, -h * fill - 1, 2 * h, h * fill + 3); x.clip(); path();
    const g = x.createLinearGradient(0, -h, 0, 0); g.addColorStop(0, `rgba(${rgb},0.98)`); g.addColorStop(1, `rgba(${rgb},0.72)`); x.fillStyle = g; x.fill(); x.restore(); }
  path(); x.strokeStyle = col; x.lineWidth = Math.max(2.5, h * 0.022); if (dash) x.setLineDash([h * 0.05, h * 0.04]); x.stroke(); x.setLineDash([]);
  if (old) { x.strokeStyle = col; x.lineWidth = Math.max(3, h * 0.03); x.lineCap = 'round'; const cx0 = bw / 2 + h * 0.1;
    x.beginPath(); x.moveTo(cx0 + h * 0.03, 0); x.lineTo(cx0, sy + h * 0.16); x.arc(cx0 - h * 0.05, sy + h * 0.16, h * 0.05, 0, Math.PI, true); x.stroke(); }
  x.restore(); }

/* ================= HOOK + PROIEZIONE: due gruppi separati, sopra gli over 65, sotto 10 persone di 15–64 anni ================= */
const GT = { cy: 745, by: 840, h: 160, dx: 120 }, GB = { cy: 1085, by: 1180, h: 150, dx: 84 };
function groups(t, o = {}) { const { kP = 1, n15 = 10, n65 = 0, dashFrom = 99, hot = 0 } = o; if (kP <= 0) return;
  lab('65 ANNI E PIÙ', 540, 600, kP, C.amber);
  if (hot > 0) glow(540, GT.cy, 480, '245,165,36', 0.16 * hot);
  glass(540, GT.cy, 900, 230, 36, kP);
  for (let i = 0; i < 7; i++) { const f = clamp(n65 - i); if (f <= 0) continue; const bob = Math.sin(t * 2.2 + i * 1.3) * 2;
    person(540 + (i - 3) * GT.dx, GT.by + bob, GT.h, { col: C.amber, rgb: '245,165,36', fill: f, k: clamp((n65 - i) * 8), old: true, dash: i >= dashFrom }); }
  /* il rapporto: due gruppi, non uno dentro l'altro */
  const kO = kP * clamp(n15 / 3); lab('PER OGNI', 540, 915, kO, C.ink);
  dashLine(250, 915, 410, 915, 'rgba(241,244,238,0.35)', 2, [4, 8], kO); dashLine(670, 915, 830, 915, 'rgba(241,244,238,0.35)', 2, [4, 8], kO);
  glass(540, GB.cy, 900, 230, 36, kP);
  for (let i = 0; i < 10; i++) { const ki = clamp(n15 - i); if (ki <= 0) continue; const bob = Math.sin(t * 2.6 + i * 0.9) * 2;
    person(540 + (i - 4.5) * GB.dx, GB.by + bob, GB.h, { col: C.lime, rgb: '200,250,114', fill: 1, k: ki }); }
  lab('10 PERSONE TRA 15 E 64 ANNI', 540, 1240, kP * clamp(n15 - 9), C.lime); }
function sHook(t, a, b) { bg('48,40,22', 0.6); x.save(); zoom(t, a, b, 1.04);
  const tOg = WT('hook', 'ogni', 1, 0.3), tPe = WT('hook', 'persone', 1, 1.0), tLa = WT('hook', 'lavoro', 1, 2.4), tOd = WT('hook', 'oggi', 1, 3.4), tQu = WT('hook', 'quasi', 1, 4.8), tAn = WT('hook', 'anni', 1, 6.9);
  phrase(t, Math.max(a + 0.02, tOg - 0.12), [['Ogni 10 in età da lavoro,', C.ink]], 345, { size: 84 });
  phrase(t, tQu - 0.1, [['quasi 4 over 65.', C.amber]], 345 + 84 * 1.12, { size: 84 });
  const kP = oC(seg(t, a, a + 0.45));
  groups(t, { kP, n15: 10 * seg(t, Math.min(tPe - 0.25, a + 0.4), tLa + 0.2), n65: 3.98 * ioC(seg(t, tQu - 0.05, tAn + 0.25)), hot: oC(seg(t, tQu, tAn)) });
  glassPill(540, 1335, 'OGGI', oC(seg(t, tOd - 0.1, tOd + 0.3)), C.ink, 34);
  x.restore(); finish(t); }
function sProiezione(t, a, b) { bg('48,40,22', 0.6); x.save();
  const tNe = WT('proiezione', 'nel', 1, 0.3), tPr = WT('proiezione', 'proiezioni', 1, 1.7), tPi = WT('proiezione', 'piu', 1, 3.1);
  phrase(t, Math.max(a + 0.02, tNe - 0.1), [['Nel 2050,', C.ink]], 345, { size: 84 });
  phrase(t, tPi - 0.1, [['più di 6.', C.amber]], 345 + 84 * 1.12, { size: 84 });
  groups(t, { n65: 3.98 + 2.26 * ioC(seg(t, tPi - 0.15, tPi + 1.0)), dashFrom: 4, hot: 1 });
  const [o1, i2] = swapK(t, tNe + 0.1);
  glassPill(540, 1335, 'OGGI', o1, C.ink, 34); glassPill(540, 1335, 'NEL 2050', i2, C.amber, 34);
  honest('PROIEZIONE ISTAT', oC(seg(t, tPr - 0.1, tPr + 0.3)), 1428);
  x.restore(); finish(t); }

/* ================= CULLE: ogni culla = 10 nati; 2008 dieci culle, 2025 sei e un sesto (61,7) ================= */
function cradle(cx, by, o = {}) { const { k = 1, rock = 0, part = 1, rgb = '233,236,230', ghost = 0 } = o; if (k <= 0 && ghost <= 0) return;
  const shape = () => { x.beginPath(); x.roundRect(-36, -54, 72, 34, [6, 6, 18, 18]); x.moveTo(-36, -50); x.quadraticCurveTo(-36, -84, -4, -84); x.lineTo(-4, -54); x.lineTo(-36, -54); x.closePath(); };
  const frame = () => { x.beginPath(); x.moveTo(-42, -6); x.quadraticCurveTo(0, 14, 42, -6); x.moveTo(-24, -22); x.lineTo(-28, 0); x.moveTo(24, -22); x.lineTo(28, 0); };
  x.save(); x.translate(cx, by); x.rotate(rock); x.lineCap = 'round'; x.lineJoin = 'round';
  if (ghost > 0) { x.save(); x.globalAlpha *= ghost; x.strokeStyle = 'rgba(255,90,78,0.85)'; x.lineWidth = 3; x.setLineDash([6, 6]); shape(); x.stroke(); frame(); x.stroke(); x.restore(); }
  if (k > 0 && part > 0) { const s = clamp(oB(clamp(k)), 0, 1.15); x.save(); x.scale(s, s); x.globalAlpha *= clamp(k * 2);
    x.beginPath(); x.rect(-46, -95, 92 * part, 115); x.clip();
    shape(); x.fillStyle = `rgba(${rgb},0.9)`; x.fill(); x.strokeStyle = `rgb(${rgb})`; x.lineWidth = 5; frame(); x.stroke();
    x.fillStyle = '#050607'; x.beginPath(); x.arc(14, -60, 10, 0, 7); x.fill(); x.fillStyle = `rgb(${rgb})`; x.beginPath(); x.arc(14, -60, 7, 0, 7); x.fill();
    x.fillStyle = 'rgba(5,6,7,0.35)'; x.fillRect(-30, -40, 60, 3); x.restore(); }
  x.restore(); }
function sCulle(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04);
  const tCu = WT('culle', 'culle', 1, 0.7), tBa = WT('culle', 'bambini', 1, 2.1), tN2 = WT('culle', 'nel', 2, 3.4), tCi = WT('culle', 'circa', 1, 5.2);
  phrase(t, a + 0.02, [['Pensa alle culle:', C.ink]], 345, { size: 92 });
  phrase(t, tCi - 0.1, [['da 100 a circa 62.', C.amber]], Y2, { size: 92 });
  const XC = (i) => 540 + (i - 4.5) * 88, rock = (i, r) => 0.07 * Math.sin(t * 3.1 + i * 0.7 + r);
  /* 2008 */
  const n08 = 10 * seg(t, Math.min(tBa - 0.5, tCu + 0.2), tBa + 0.6), kL1 = oC(seg(t, tCu - 0.1, tCu + 0.3));
  lab('2008', 144, 720, kL1, C.ink, 30, { align: 'left' });
  lab(`${Math.round(10 * Math.floor(n08 + 1e-6))} NATI`, 936, 720, kL1 * clamp(n08), C.ink, 26, { align: 'right' });
  for (let i = 0; i < 10; i++) cradle(XC(i), 862, { k: clamp(n08 - i), rock: rock(i, 0) });
  /* 2025: sei culle piene e una per un sesto; le altre restano vuote, tratteggiate */
  const n25 = 6.17 * seg(t, tN2 - 0.2, tCi + 0.3), kL2 = oC(seg(t, tN2 - 0.2, tN2 + 0.2)), kG = oC(seg(t, tCi + 0.1, tCi + 0.6));
  lab('2025', 144, 1020, kL2, C.amber, 30, { align: 'left' });
  lab('CIRCA 62 NATI', 936, 1020, oC(seg(t, tCi + 0.1, tCi + 0.5)), C.amber, 26, { align: 'right' });
  for (let i = 0; i < 10; i++) { const f = clamp(n25 - i); cradle(XC(i), 1162, { k: f > 0 ? 1 : 0, part: f, rgb: '245,165,36', rock: rock(i, 2) * (f >= 1 ? 1 : 0), ghost: i >= 6 ? kG : 0 }); }
  lab('OGNI CULLA = 10 NATI', 540, 1265, oC(seg(t, tBa, tBa + 0.4)), C.muted, 24);
  x.restore(); finish(t); }

/* ================= FIGLI: numero medio di figli per donna, 1,18 → 1,14 (stima): una sagoma piena e il 14% della seconda ================= */
function odo(v, px, py, size, col, alpha) { /* contatore che rotola sull'ultima cifra: v in centesimi */
  const c = Math.floor(v + 1e-6), f = v - c, base = `${Math.floor(c / 100)},${Math.floor((c % 100) / 10)}`;
  const wB = tw(base, size), wD = tw('8', size), x0 = px - (wB + wD) / 2;
  txt(base, x0 + wB / 2, py, { size, weight: 800, color: col, alpha, ls: -2 });
  x.save(); x.beginPath(); x.rect(x0 + wB - 4, py - size * 0.62, wD + 16, size * 1.24); x.clip();
  const d0 = c % 10, d1 = (c + 1) % 10, sh = size * 1.05 * f; /* scende: la cifra più alta esce in basso */
  txt(String(d0), x0 + wB + wD / 2 + 4, py - sh, { size, weight: 800, color: col, alpha, ls: -2 });
  if (f > 0.001) txt(String(d1), x0 + wB + wD / 2 + 4, py - sh + size * 1.05, { size, weight: 800, color: col, alpha, ls: -2 });
  x.restore(); }
function sFigli(t, a, b) { bg('52,26,24', 0.45); x.save(); zoom(t, a, b, 1.04);
  const tFi = WT('figli', 'figli', 1, 1.7), tDo = WT('figli', 'donna', 1, 2.4), tSt = WT('figli', 'stime', 1, 3.4), tSc = WT('figli', 'sceso', 1, 4.5), tNu = WT('figli', 'nuovo', 1, 6.6);
  phrase(t, tFi - 0.15, [['Figli per donna:', C.ink]], 345, { size: 92 });
  phrase(t, tNu - 0.1, [['nuovo minimo storico.', C.red]], Y2, { size: 92 });
  const kW = oC(seg(t, Math.min(tDo - 0.3, a + 0.6), tDo + 0.2)), kC1 = oC(seg(t, tFi - 0.1, tFi + 0.4));
  const roll = ioC(seg(t, tSc + 0.1, tNu - 0.15)), v = lerp(118, 114, roll), f2 = (v - 100) / 100;
  person(330, 1105, 400, { col: C.ink, rgb: '233,236,230', dress: true, k: kW, fill: 1 });
  person(570, 1105, 210, { col: C.lime, rgb: '200,250,114', kid: 0.6, k: kC1, fill: 1 });
  person(740, 1105, 210, { col: C.lime, rgb: '200,250,114', kid: 0.6, k: oC(seg(t, tSc - 0.2, tSc + 0.2)), fill: f2, dash: true });
  lab('NUMERO MEDIO, PER DONNA', 540, 1165, oC(seg(t, tDo, tDo + 0.4)), C.muted, 24);
  const kN = oC(seg(t, tSc - 0.1, tSc + 0.3));
  if (kN > 0) { const hot = seg(t, tNu - 0.1, tNu + 0.3); if (hot > 0) glow(450, 1290, 260, '255,90,78', 0.22 * hot);
    odo(v, 450, 1290, 150, hot > 0.5 ? C.red : C.ink, kN); }
  honest('STIMA', oC(seg(t, tSt - 0.1, tSt + 0.3)), 1290, 820);
  lab('ERA 1,18 NEL 2024', 540, 1415, oC(seg(t, tNu + 0.2, tNu + 0.6)), C.muted, 24);
  x.restore(); finish(t); }

/* ================= QUINDICI: lo stipite con i segni dell'altezza, dal 2025 al 2040 ================= */
const HCM = [[0, 50], [2, 87], [5, 110], [10, 138], [15, 170]];
const hcm = (age) => { for (let i = 1; i < HCM.length; i++) if (age <= HCM[i][0]) { const [a0, h0] = HCM[i - 1], [a1, h1] = HCM[i]; return lerp(h0, h1, (age - a0) / (a1 - a0)); } return 170; };
const FLOOR = 1390, PXC = 3.6;
function sQuindici(t, a, b) { bg('30,44,26', 0.8); x.save(); zoom(t, a, b, 1.04);
  const tNa = WT('quindici', 'nato', 1, 1.0), tCo = WT('quindici', 'compira', 1, 2.1), tNe = WT('quindici', 'nel', 1, 3.4);
  phrase(t, Math.max(a + 0.02, tNa - 0.3), [['Nato l’anno scorso?', C.ink]], 345, { size: 92 });
  phrase(t, tCo - 0.05, [['15 anni nel 2040.', C.lime]], Y2, { size: 92 });
  const kD = oC(seg(t, a, a + 0.5));
  /* pavimento e stipite */
  x.save(); x.globalAlpha = kD; x.strokeStyle = 'rgba(241,244,238,0.45)'; x.lineWidth = 4; x.beginPath(); x.moveTo(150, FLOOR); x.lineTo(930, FLOOR); x.stroke();
  const g = x.createLinearGradient(616, 0, 664, 0); g.addColorStop(0, '#1d231f'); g.addColorStop(0.5, '#2a312c'); g.addColorStop(1, '#141916'); x.fillStyle = g; rr(616, 640, 48, FLOOR - 640, 6); x.fill();
  x.strokeStyle = 'rgba(241,244,238,0.25)'; x.lineWidth = 2; rr(616, 640, 48, FLOOR - 640, 6); x.stroke(); x.restore();
  const age = 15 * ioC(seg(t, tCo - 0.25, tNe + 0.6)), hpx = hcm(age) * PXC, adult = seg(age, 14.2, 15);
  /* segni sullo stipite: anno e età */
  [[0, '2025 · 0 ANNI'], [5, '2030 · 5 ANNI'], [10, '2035 · 10 ANNI'], [15, '2040 · 15 ANNI']].forEach(([ag, s], i) => {
    const km = i === 0 ? oC(seg(t, tNa - 0.1, tNa + 0.3)) : oC(seg(age, ag - 0.6, ag)); if (km <= 0) return; const yy = FLOOR - hcm(ag) * PXC, on = ag === 15;
    x.save(); x.globalAlpha = km; x.strokeStyle = on ? C.lime : C.ink; x.lineWidth = on ? 5 : 3; x.beginPath(); x.moveTo(606, yy); x.lineTo(lerp(606, 674, km), yy); x.stroke(); x.restore();
    lab(s, 692, yy, km, on ? C.lime : C.ink, on ? 30 : 26, { align: 'left' }); });
  /* il bambino che cresce: diventa lime quando entra nell'età da lavoro */
  if (kD > 0) { glow(450, FLOOR - hpx / 2, hpx * 0.8, adult > 0.5 ? '200,250,114' : '241,244,238', 0.12 + 0.12 * adult);
    person(450, FLOOR, hpx, { col: adult > 0.5 ? C.lime : C.ink, rgb: adult > 0.5 ? '200,250,114' : '233,236,230', hrk: lerp(0.2, 0.1, clamp(age / 15)), bwk: lerp(0.5, 0.25, clamp(age / 15)), k: kD, fill: 1 }); }
  const yT = FLOOR - 170 * PXC; glassPill(830, yT - 84, 'ETÀ DA LAVORO', oC(seg(t, tNe + 0.55, tNe + 0.95)), C.lime, 30);
  tap(640, yT, t, tNe + 0.7);
  x.restore(); finish(t); }

/* ================= BEBIBUM: la piramide (modello tarato sulle quote vere del 1/1/2026: 11,6 / 63,2 / 25,1) che invecchia ================= */
const PB = [[1915, 950], [1920, 1100], [1930, 1000], [1940, 1000], [1944, 800], [1946, 1030], [1950, 900], [1955, 870], [1964, 1030], [1970, 900], [1975, 830], [1980, 640], [1985, 580], [1990, 570], [1995, 525], [2000, 545], [2008, 577], [2010, 562], [2012, 534], [2014, 502], [2016, 473], [2018, 440], [2020, 405], [2022, 393], [2024, 370], [2025, 356], [2030, 355], [2045, 340], [2060, 330]];
const births = (y) => { if (y <= PB[0][0]) return PB[0][1]; for (let i = 1; i < PB.length; i++) if (y <= PB[i][0]) { const [a0, v0] = PB[i - 1], [a1, v1] = PB[i]; return lerp(v0, v1, (y - a0) / (a1 - a0)); } return PB[PB.length - 1][1]; };
const surv = (a) => 1 / (1 + Math.exp((a - 81) / 6.5)), migr = (a) => 1 + 0.4 * Math.exp(-(((a - 36) / 13) ** 2)) + 0.1 * (a < 15 ? 1 : 0);
const pw = (Y, a) => births(Y - a) * surv(a) * migr(a);
window.QUOTE = (Y = 2026) => { let g = 0, w = 0, o = 0; for (let a = 0; a <= 100; a++) { const v = pw(Y, a); if (a < 15) g += v; else if (a < 65) w += v; else o += v; } const T = g + w + o; return [g / T * 100, w / T * 100, o / T * 100]; };
const PY = { by: 1390, dy: 7.2, cx: 540, sx: 0.285 };
const ageY = (a) => PY.by - a * PY.dy;
function pyramid(t, Y, o = {}) { const { k = 1, hlBoom = 0, hlKids = 0 } = o; if (k <= 0) return;
  x.save(); x.globalAlpha *= k;
  for (let a = 0; a <= 100; a++) { const hw = pw(Y, a) * PY.sx, born = Y - a, boom = born >= 1956 && born <= 1970 ? hlBoom : 0;
