<script>const P = { EP: 15, DAY: 4, CAP: 0, NEXT: ['La disoccupazione'], QUANDO: 'LUNEDÌ', FONTE: 'DATI: ISTAT · BANCA D’ITALIA · BIS (non scritta nel video dal 16/10/2026)' };</script>

<script>
/* Puntata 15 — CASO REALE «2008 e 2020, due crisi diverse». Numeri SOLO da p15-fonti.md:
   PIL trimestrale Istat (IstatData 163_184_DF_DCCN_PILQ_1, ed. 2026M10, valori concatenati 2020, destag.):
   2008: picco I trim. 2008 → minimo II trim. 2009 −7,6% → I trim. 2011 (95,5) → minimo I trim. 2013 −9,7% (90,3) → livello 2008 di nuovo nel 2022;
   2020: IV trim. 2019 → II trim. 2020 −17,3% (82,7) → III trim. 2020 94,4 → III trim. 2021 101,4 (livello di fine 2019 ripreso).
   Le serie qui sotto sono i livelli trimestrali letti alla fonte (stessa chiave e edizione citate in p15-fonti.md, tabella 2);
   i punti chiave coincidono con la tabella «Esempi didattici» di p15-fonti.md (92,4 · 95,5 · 90,3 · 82,7 · 94,4 · 101,4).
   Annuali: PIL 2009 «oltre −5%» (−5,31, senza decimali); 2020 «quasi −9%» (−8,72); livello 2008 ripreso nel 2022 (14 anni).
   Componenti in volume, Istat ed. 2026M9: 2009 export −17,8 · investimenti −10,4 · spesa famiglie −1,5; 2020 export −13,5 · investimenti −6,9 · spesa famiglie −10,6.
   Lehman Brothers fallisce il 15 settembre 2008 (BIS). Giudizi della Banca d'Italia scritti come tali («per la Banca d'Italia»).
   Le fosse di «eppure» e «casa» sono un'illustrazione: forma inventata, profondità (−17,3 / −9,7) e durata (7 / 57 trimestri) in scala. */
const ORDER = ['num', 'hook', 'eppure', 'mutui', 'export', 'duemilanove', 'consumi', 'finanza', 'vu', 'doppiavu', 'ritorno', 'casa', 'fine', 'cta', 'end'];
const Y2 = 345 + 92 * 1.12; /* seconda riga del titolo */
const WA = (k, ws, n, ris) => { for (const w of ws) { const v = WT(k, w, n, NaN); if (!isNaN(v)) return v; } return S(k) + ris; };
const RGB = { lime: [200, 250, 114], red: [255, 90, 78], grey: [139, 149, 143], amber: [245, 165, 36], ink: [241, 244, 238] };
const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function dashLine(x0, y0, x1, y1, col, w = 3, dash = [10, 10], a = 1) { if (a <= 0) return; x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.lineWidth = w; x.setLineDash(dash); x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); x.restore(); }
function dot(cx, cy, r, col, k = 1, g = null) { if (k <= 0) return; if (g) glow(cx, cy, r * 5, g, 0.35 * k); x.save(); x.globalAlpha *= clamp(k); x.fillStyle = col; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); x.strokeStyle = '#050607'; x.lineWidth = 3; x.stroke(); x.restore(); }
function polyTo(P2, k) { x.beginPath(); x.moveTo(...P2[0]); const n = Math.floor(k); for (let i = 1; i <= n && i < P2.length; i++) x.lineTo(...P2[i]);
  if (n < P2.length - 1 && k > n) { const [ax, ay] = P2[n], [bx, by] = P2[n + 1], f = k - n; x.lineTo(lerp(ax, bx, f), lerp(ay, by, f)); } }
const tip = (P2, k) => { const n = Math.min(Math.floor(k), P2.length - 1), f = k - n; if (n >= P2.length - 1) return P2[P2.length - 1]; return [lerp(P2[n][0], P2[n + 1][0], f), lerp(P2[n][1], P2[n + 1][1], f)]; };
function popTxt(s, px, py, k, o = {}) { if (k <= 0) return; x.save(); const sc = lerp(0.7, 1, oB(clamp(k))); x.translate(px, py); x.scale(sc, sc); txt(s, 0, 0, { size: 50, weight: 800, ...o, alpha: clamp(k * 2) * (o.alpha ?? 1) }); x.restore(); }
function ring(cx, cy, r0, t, t0, rgb = '200,250,114', d = 0.6, gr = 60) { const k = seg(t, t0, t0 + d); if (k <= 0 || k >= 1) return; x.save(); x.strokeStyle = `rgba(${rgb},${1 - k})`; x.lineWidth = 4; x.beginPath(); x.arc(cx, cy, r0 + gr * oC(k), 0, 7); x.stroke(); x.restore(); }
/* passaggio a due tempi tra due scritte nello stesso punto: la prima esce, poi entra la seconda (mai sovrapposte) */
const swapK = (t, t0) => [1 - oC(seg(t, t0 - 0.3, t0 - 0.05)), oC(seg(t, t0, t0 + 0.3))];

/* ================= HOOK: la torta con le candeline, un anno per candela fino a 14 ================= */
function cake(t, k, n) { if (k <= 0) return; const cx = 540, top = 790, bot = 1000, w = 560;
  x.save(); x.globalAlpha *= clamp(k * 1.5); x.translate(0, (1 - oC(k)) * 60);
  /* piatto */
  x.fillStyle = '#121714'; x.beginPath(); x.ellipse(cx, bot + 14, w / 2 + 50, 26, 0, 0, 7); x.fill(); x.strokeStyle = 'rgba(241,244,238,0.35)'; x.lineWidth = 2; x.stroke();
  /* corpo a due piani */
  x.fillStyle = metal(cx - w / 2, 0, cx + w / 2, 0, true); rr(cx - w / 2, top, w, bot - top, 26); x.fill();
  x.strokeStyle = 'rgba(241,244,238,0.18)'; x.lineWidth = 2; rr(cx - w / 2, top, w, bot - top, 26); x.stroke();
  x.fillStyle = 'rgba(241,244,238,0.08)'; x.fillRect(cx - w / 2 + 4, top + 118, w - 8, 6);
  /* glassa che cola */
  x.fillStyle = 'rgba(200,250,114,0.85)'; x.beginPath(); x.moveTo(cx - w / 2 + 6, top + 8);
  for (let i = 0; i <= 14; i++) { const px = cx - w / 2 + 6 + i * (w - 12) / 14, dr = 22 + 18 * Math.abs(Math.sin(i * 1.7)); x.quadraticCurveTo(px - (w - 12) / 28, top + dr * 1.6, px, top + 14); }
  x.lineTo(cx + w / 2 - 6, top + 4); x.lineTo(cx - w / 2 + 6, top + 4); x.closePath(); x.fill();
  rr(cx - w / 2, top - 6, w, 22, 11); x.fill();
  /* 14 candeline */
  for (let i = 0; i < 14; i++) { const px = 300 + i * 37, kc = clamp(k * 3 - i * 0.12), lit = clamp(n - i); if (kc <= 0) continue;
    x.fillStyle = lit > 0 ? '#E9ECE6' : '#59615C'; rr(px - 7, top - 64 * kc, 14, 64 * kc, 4); x.fill();
    x.fillStyle = 'rgba(5,6,7,0.35)'; for (let s = 0; s < 3; s++) x.fillRect(px - 7, top - 54 + s * 18, 14, 5);
    if (lit > 0) { const fl = 1 + 0.12 * Math.sin(t * 19 + i * 2.1), s = oB(clamp(lit)); glow(px, top - 84, 46, '245,165,36', 0.5 * clamp(lit));

      x.fillStyle = '#FFE7B0'; x.beginPath(); x.ellipse(0, 2, 3.5, 6, 0, 0, 7); x.fill(); x.restore(); } }
  x.restore(); }
function sHook(t, a, b) { bg('48,40,22', 0.7); x.save(); zoom(t, a, b, 1.05);
  const tSe = WT('hook', 'sei', 1, 0.05), tIt = WA('hook', ['litalia', 'italia'], 1, 1.4), tAv = WT('hook', 'avevi', 1, 6.1), t14 = WA('hook', ['14', 'quattordici'], 1, 6.9);
  phrase(t, Math.max(a + 0.02, tSe - 0.08), [['Sei nato nel 2008?', C.ink]], 345, { size: 92 });
  phrase(t, tAv - 0.1, [['Ne avevi già 14.', C.lime]], Y2, { size: 92 });
  const n = 14 * ioC(seg(t, tIt, t14 + 0.15)), kC = oC(seg(t, a, a + 0.45));
  if (kC > 0) glow(540, 820, 420, '245,165,36', 0.12 * kC + 0.1 * clamp(n / 14));
  cake(t, kC, n);
  /* contatore: anno e età */
  const kP = oC(seg(t, tSe + 0.3, tSe + 0.8)), done = seg(t, t14 + 0.1, t14 + 0.4);
  if (kP > 0) { glass(540, 1150, 560, 150, 32, kP);
    if (done > 0) { x.save(); x.globalAlpha = done; x.strokeStyle = C.lime; x.lineWidth = 4; rr(260, 1075, 560, 150, 32); x.stroke(); x.restore(); glow(540, 1150, 330, '200,250,114', 0.18 * done); }
    txt(String(2008 + Math.floor(n + 1e-6)), 420, 1154, { size: 104, weight: 800, color: done > 0.5 ? C.lime : C.ink, alpha: kP, ls: -2 });
    txt('ETÀ', 700, 1112, { fam: 'mono', size: 24, weight: 600, color: C.muted, ls: 3, alpha: kP });
    txt(String(Math.floor(n + 1e-6)), 700, 1170, { size: 66, weight: 800, color: done > 0.5 ? C.lime : C.amber, alpha: kP }); }
  const [o1, i2] = swapK(t, t14 + 0.15);
  txt('L’ITALIA PRODUCE MENO CHE NEL 2008', 540, 1305, { fam: 'mono', size: 26, weight: 600, color: C.amber, ls: 1, alpha: oC(seg(t, tIt, tIt + 0.4)) * o1 });
  txt('PRODUCE DI NUOVO COME NEL 2008', 540, 1305, { fam: 'mono', size: 26, weight: 600, color: C.lime, ls: 1, alpha: i2 });
  x.restore(); finish(t); }

/* ================= FOSSE (eppure, casa): profondità e durata in scala, forma illustrativa ================= */
const TR = { x0: 180, dpp: 22, qpx: 13, g20: 660, g08: 1110, d20: 17.3, d08: 9.7, w20: 7, w08: 57 };
const trBz = (yG, w, d) => [[TR.x0, yG], [TR.x0, yG + d * 4 / 3], [TR.x0 + w, yG + d * 4 / 3], [TR.x0 + w, yG]];
const bzP = (B, u) => { const m = 1 - u; return [0, 1].map((j) => m * m * m * B[0][j] + 3 * m * m * u * B[1][j] + 3 * m * u * u * B[2][j] + u * u * u * B[3][j]); };
function trench(yG, w, d, k, rgb, lab, labK) { if (k <= 0) return; const B = trBz(yG, w * k, d);
  x.save(); x.globalAlpha *= clamp(k * 2);
  /* terreno */
  x.strokeStyle = 'rgba(241,244,238,0.45)'; x.lineWidth = 4; x.lineCap = 'round';
  x.beginPath(); x.moveTo(110, yG); x.lineTo(TR.x0, yG); x.moveTo(TR.x0 + w * k, yG); x.lineTo(lerp(TR.x0 + w * k, 970, k), yG); x.stroke();
  /* la fossa */
  x.beginPath(); x.moveTo(...B[0]); x.bezierCurveTo(...B[1], ...B[2], ...B[3]); x.closePath();
  const g = x.createLinearGradient(0, yG, 0, yG + d); g.addColorStop(0, `rgba(${rgb},0.05)`); g.addColorStop(1, `rgba(${rgb},0.30)`); x.fillStyle = g; x.fill();
  x.beginPath(); x.moveTo(...B[0]); x.bezierCurveTo(...B[1], ...B[2], ...B[3]); x.strokeStyle = `rgb(${rgb})`; x.lineWidth = 6; x.stroke();
  x.restore();
  txt(lab, 950, yG - 30, { size: 40, weight: 800, color: `rgb(${rgb})`, align: 'right', alpha: labK }); }
function ball(B, u, rgb, k = 1) { if (k <= 0) return; const [px, py] = bzP(B, clamp(u)); glow(px, py - 14, 60, rgb, 0.4 * k); x.save(); x.globalAlpha *= k; x.fillStyle = `rgb(${rgb})`; x.beginPath(); x.arc(px, py - 14, 14, 0, 7); x.fill(); x.restore(); }
function sEppure(t, a, b) { bg(); x.save();
  const tC = WT('eppure', 'crisi', 1, 0.6), tPi = WT('eppure', 'piu', 1, 1.6), tR = WT('eppure', 'riassorbita', 1, 2.7), tM = WT('eppure', 'meno', 1, 3.9);
  phrase(t, tPi - 0.1, [['Più profonda,', C.red]], 345, { size: 84 });
  phrase(t, tR - 0.05, [['ma riassorbita', C.ink], ['in meno di 2 anni.', C.lime]], 345 + 84 * 1.12, { size: 84 });
  const k20 = oC(seg(t, a + 0.05, a + 0.6)), k08 = oC(seg(t, a + 0.25, a + 0.9));
  trench(TR.g20, TR.w20 * TR.qpx, TR.d20 * TR.dpp * oC(seg(t, tPi - 0.2, tPi + 0.5)) + 6, k20, '255,90,78', '2020', oC(seg(t, tC, tC + 0.4)));
  trench(TR.g08, TR.w08 * TR.qpx, TR.d08 * TR.dpp, k08, '245,165,36', '2008', k08);
  /* la palla del 2020 cade e risale in fretta; quella del 2008 è ancora lì */
  const B20 = trBz(TR.g20, TR.w20 * TR.qpx, TR.d20 * TR.dpp), B08 = trBz(TR.g08, TR.w08 * TR.qpx, TR.d08 * TR.dpp);
  const u20 = seg(t, tPi - 0.1, tM + 0.3), roll = seg(t, tM + 0.3, tM + 1.3);
  if (roll <= 0) ball(B20, u20, '255,90,78', oC(seg(t, tPi - 0.3, tPi)));
  else { const px = lerp(TR.x0 + TR.w20 * TR.qpx, 700, oC(roll)); glow(px, TR.g20 - 14, 60, '255,90,78', 0.4); x.fillStyle = C.red; x.beginPath(); x.arc(px, TR.g20 - 14, 14, 0, 7); x.fill(); }
  ball(B08, 0.62 * seg(t, a + 0.6, b + 2.5), '245,165,36', oC(seg(t, a + 0.6, a + 0.9)));
  /* misure */
  const kD = oC(seg(t, tPi + 0.3, tPi + 0.7)); if (kD > 0) { const yb = TR.g20 + TR.d20 * TR.dpp; dashLine(236, yb, lerp(236, 288, kD), yb, 'rgba(255,90,78,0.8)', 3, [6, 6], 1);
    txt('PIÙ PROFONDA', 300, yb, { fam: 'mono', size: 26, weight: 600, color: C.red, align: 'left', ls: 2, alpha: kD }); }
  const kW = oC(seg(t, tM - 0.1, tM + 0.3)); if (kW > 0) { x.save(); x.globalAlpha = kW; x.strokeStyle = C.lime; x.lineWidth = 4; x.lineCap = 'round'; const yy = 616, x1 = TR.x0 + TR.w20 * TR.qpx;
    x.beginPath(); x.moveTo(TR.x0, yy + 14); x.lineTo(TR.x0, yy); x.lineTo(x1, yy); x.lineTo(x1, yy + 14); x.stroke(); x.restore();
    txt('MENO DI 2 ANNI', 300, 614, { fam: 'mono', size: 26, weight: 600, color: C.lime, align: 'left', ls: 2, alpha: kW }); }
  mono('ILLUSTRAZIONE · PROFONDITÀ E DURATA IN SCALA', 540, 1420, t, a + 0.6, { size: 22 });
  x.restore(); finish(t); }

/* ================= MUTUI: case con mutui a rischio, i fogli volano alla banca, la torre crolla ================= */
function house(cx, by, k, risk, t) { if (k <= 0) return; const s = clamp(oB(clamp(k)), 0, 1.2), col = risk > 0.5 ? C.amber : C.ink;
  x.save(); x.translate(cx, by); x.scale(s, s); x.globalAlpha *= clamp(k * 2);
  if (risk > 0) glow(0, -50, 90, '245,165,36', 0.3 * risk);
  x.beginPath(); x.moveTo(-46, -66); x.lineTo(0, -108); x.lineTo(46, -66); x.lineTo(46, 0); x.lineTo(-46, 0); x.closePath();
  x.fillStyle = 'rgba(241,244,238,0.06)'; x.fill(); x.strokeStyle = col; x.lineWidth = 5; x.lineJoin = 'round'; x.stroke();
  rr(-12, -36, 24, 36, 4); x.stroke();
  if (risk > 0) { const wob = Math.sin(t * 14 + cx) * 0.06 * risk; x.save(); x.translate(30, -96); x.rotate(wob); x.globalAlpha *= risk;
    x.fillStyle = C.amber; x.beginPath(); x.moveTo(0, -22); x.lineTo(20, 14); x.lineTo(-20, 14); x.closePath(); x.fill(); txt('!', 0, 2, { size: 26, weight: 800, color: '#050607' }); x.restore(); }
  x.restore(); }
function paper(px, py, rot, k) { if (k <= 0) return; x.save(); x.translate(px, py); x.rotate(rot); x.globalAlpha *= k; x.fillStyle = '#E9ECE6'; rr(-13, -17, 26, 34, 3); x.fill();
  x.fillStyle = 'rgba(5,6,7,0.45)'; for (let i = 0; i < 4; i++) x.fillRect(-8, -10 + i * 7, i === 3 ? 10 : 16, 2.5); x.restore(); }
function tower(t, k, fall) { if (k <= 0) return; const cx = 800, by = 1240, w = 190, h = 540;
  const sink = h * 1.05 * ioC(clamp(fall)), rot = 0.16 * oC(clamp(fall * 1.4)), red = clamp(fall * 3);
  x.save(); x.globalAlpha *= clamp(k * 2); x.beginPath(); x.rect(0, 0, W, by); x.clip();
  x.translate(cx + w / 2, by + sink); x.rotate(rot); x.translate(-(cx + w / 2), -by);
  x.fillStyle = metal(cx - w / 2, 0, cx + w / 2, 0, true); rr(cx - w / 2, by - h, w, h, 8); x.fill();
  x.strokeStyle = red > 0 ? `rgba(255,90,78,${0.4 + 0.5 * red})` : 'rgba(241,244,238,0.3)'; x.lineWidth = 3; rr(cx - w / 2, by - h, w, h, 8); x.stroke();
  for (let r = 0; r < 11; r++) for (let c = 0; c < 4; c++) { const on = ((r * 7 + c * 3) % 5) !== 0, off = clamp(fall * 2 - ((r * 4 + c) % 9) / 9);
    if (!on) continue; x.fillStyle = off > 0.5 ? `rgba(255,90,78,${0.5 * (1 - off)})` : 'rgba(200,250,114,0.42)'; x.fillRect(cx - w / 2 + 22 + c * 40, by - h + 30 + r * 46, 26, 26); }
  /* crepa */
  if (fall > 0) { x.strokeStyle = C.red; x.lineWidth = 5; x.lineJoin = 'round'; x.beginPath(); const cy0 = by - h * 0.62; x.moveTo(cx - w / 2, cy0);
    [[-50, 22], [-12, -14], [26, 30], [62, 4], [w / 2, 40]].forEach(([dx, dy]) => x.lineTo(cx + dx * clamp(fall * 4), cy0 + dy)); x.stroke(); }
  x.restore();
  /* polvere alla base */
  const kd = Math.sin(Math.PI * clamp(fall * 1.2)); if (kd > 0) { glow(cx, by - 20, 260, '255,90,78', 0.28 * kd); for (let i = 0; i < 9; i++) { const ang = Math.PI + i / 8 * Math.PI, r = 50 + 90 * clamp(fall * 1.5);
    x.fillStyle = `rgba(139,149,143,${0.35 * kd})`; x.beginPath(); x.arc(cx + Math.cos(ang) * r, by - 10 + Math.sin(ang) * r * 0.35, 22 + 10 * Math.sin(i), 0, 7); x.fill(); } }
  /* macerie: quello che resta della banca */
  const kr = oC(seg(fall, 0.55, 0.9)); if (kr > 0) { x.save(); x.globalAlpha = kr; x.fillStyle = '#151a17'; x.beginPath(); x.moveTo(690, by); [[715, by - 34], [748, by - 22], [772, by - 52], [806, by - 30], [838, by - 46], [872, by - 18], [905, by]].forEach((q) => x.lineTo(...q)); x.closePath(); x.fill(); x.strokeStyle = 'rgba(255,90,78,0.8)'; x.lineWidth = 3; x.stroke(); x.restore(); }
  x.strokeStyle = 'rgba(241,244,238,0.4)'; x.lineWidth = 4; x.beginPath(); x.moveTo(110, by); x.lineTo(970, by); x.stroke(); }
const HX = [190, 310, 430, 550];
function sMutui(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04);
  const tDu = WT('mutui', 'del', 1, 0.4), tMu = WT('mutui', 'mutui', 1, 1.5), tRi = WT('mutui', 'rischio', 1, 2.8), tPr = WT('mutui', 'precipita', 1, 3.4), tF = WT('mutui', 'fallisce', 1, 4.3);
  phrase(t, tDu - 0.05, [['Il 2008 parte', C.ink]], 345, { size: 92, out: tF - 0.35 });
  phrase(t, tMu - 0.1, [['dai mutui USA.', C.amber]], Y2, { size: 92, out: tF - 0.35 });
  phrase(t, tF - 0.05, [['Poi fallisce', C.ink], ['Lehman Brothers.', C.red]], 345, { size: 92 });
  HX.forEach((hx, i) => house(hx, 1240, seg(t, tMu - 0.2 + i * 0.1, tMu + 0.3 + i * 0.1), oC(seg(t, tRi - 0.1 + i * 0.08, tRi + 0.3 + i * 0.08)), t));
  txt('MUTUI AD ALTO RISCHIO', 370, 1300, { fam: 'mono', size: 24, weight: 600, color: C.amber, ls: 2, alpha: oC(seg(t, tRi, tRi + 0.4)) });
  const fall = seg(t, tF - 0.05, tF + 1.4);
  tower(t, oC(seg(t, a + 0.1, a + 0.6)), fall);
  /* fogli dei mutui che volano verso la banca, fino al crollo */
  const fly0 = tRi + 0.2; for (let j = 0; j < 8; j++) { const st = fly0 + j * 0.28; const u = seg(t, st, st + 1.0); if (u <= 0 || u >= 1) continue; if (st > tF) continue;
    const hx = HX[j % 4], p0 = [hx, 1120], p1 = [800, 900 + (j % 3) * 60], c = [(hx + 800) / 2, 760 - (j % 2) * 40], m = 1 - oC(u);
    const px = m * m * p0[0] + 2 * m * (1 - m) * c[0] + (1 - m) * (1 - m) * p1[0], py = m * m * p0[1] + 2 * m * (1 - m) * c[1] + (1 - m) * (1 - m) * p1[1];
    paper(px, py, u * 3 + j, clamp((1 - u) * 4) * (1 - clamp(fall * 3))); }
  glassPill(800, 1330, '15 SETTEMBRE 2008', seg(t, tF + 0.5, tF + 0.9), C.ink, 30);
  x.restore(); finish(t); }

/* ================= BANCHE: la rete della fiducia (export, finanza) ================= */
const BK = [[-1, -1], [1, -1], [-1, 1], [1, 1]], LK = [[0, 1], [2, 3], [0, 2], [1, 3], [0, 3], [1, 2]];
function bankNet(t, cx, cy, s, o = {}) { const { k = 1, broken = 0, flow = 1, hot = 0, rgb = '200,250,114' } = o; if (k <= 0) return;
  const P2 = BK.map(([dx, dy]) => [cx + dx * 170 * s, cy + dy * 150 * s]), r = 62 * s;

function arrowV(px, y0, y1, k, col) { if (k <= 0) return; const y = lerp(y0, y1, oC(k)); x.save(); x.strokeStyle = col; x.fillStyle = col; x.lineWidth = 4; x.beginPath(); x.moveTo(px, y0); x.lineTo(px, y); x.stroke();
  x.beginPath(); x.moveTo(px, y + 2); x.lineTo(px - 10, y - 14); x.lineTo(px + 10, y - 14); x.closePath(); x.fill(); x.fillRect(px - 12, y0 - 2, 24, 4); x.restore(); }
function arrowH(x0, x1, py, k, col) { if (k <= 0) return; const xx = lerp(x0, x1, oC(k)); x.save(); x.strokeStyle = col; x.fillStyle = col; x.lineWidth = 4; x.beginPath(); x.moveTo(x0, py); x.lineTo(xx, py); x.stroke();
  x.beginPath(); x.moveTo(xx + 2, py); x.lineTo(xx - 14, py - 10); x.lineTo(xx - 14, py + 10); x.closePath(); x.fill(); x.fillRect(x0 - 2, py - 12, 4, 24); x.restore(); }
function sCasa(t, a, b) { bg('30,44,26'); x.save(); const g08 = 1180; /* in casa la fossa 2008 scende: la freccia dei 14 anni resta sotto la fossa 2020 */
  const tMi = WT('casa', 'misura', 1, 3.0), tCa = WT('casa', 'cadi', 1, 3.9), tMe = WT('casa', 'metti', 1, 5.6), tTo = WT('casa', 'tornare', 1, 6.1);
  phrase(t, a + 0.05, [['Cosa ti porti a casa?', C.muted]], 345, { size: 70, out: tMi - 0.4 });
  phrase(t, tCa - 0.3, [['Quanto cadi', C.red]], 345, { size: 92 });
  phrase(t, tMe - 0.3, [['e quanto ci metti.', C.lime]], Y2, { size: 92 });
  const kT = oC(seg(t, a + 0.2, a + 0.8));
  trench(TR.g20, TR.w20 * TR.qpx, TR.d20 * TR.dpp, kT, '255,90,78', '2020', kT);
  trench(g08, TR.w08 * TR.qpx, TR.d08 * TR.dpp, kT, '245,165,36', '2008', kT);
  /* quanto cadi: frecce verticali */
  const kD = seg(t, tCa - 0.2, tCa + 0.4), kD2 = seg(t, tCa, tCa + 0.6);
  arrowV(TR.x0 + TR.w20 * TR.qpx / 2, TR.g20 + 4, TR.g20 + TR.d20 * TR.dpp - 8, kD, C.red);
  arrowV(TR.x0 + TR.w08 * TR.qpx / 2, g08 + 4, g08 + TR.d08 * TR.dpp - 8, kD2, C.red);
  txt('−17,3%', 300, TR.g20 + TR.d20 * TR.dpp * 0.55, { size: 40, weight: 800, color: C.red, align: 'left', alpha: oC(seg(t, tCa + 0.2, tCa + 0.5)) });
  txt('−9,7%', TR.x0 + TR.w08 * TR.qpx / 2 + 24, g08 + TR.d08 * TR.dpp * 0.5, { size: 40, weight: 800, color: C.red, align: 'left', alpha: oC(seg(t, tCa + 0.4, tCa + 0.7)) });
  /* quanto ci metti: frecce orizzontali sopra le fosse */
  const kW = seg(t, tMe - 0.2, tMe + 0.4), kW2 = seg(t, tMe, tTo + 0.6);
  arrowH(TR.x0, TR.x0 + TR.w20 * TR.qpx, 616, kW, C.lime);
  arrowH(TR.x0, TR.x0 + TR.w08 * TR.qpx, g08 - 74, kW2, C.lime);
  txt('MENO DI 2 ANNI', 300, 614, { fam: 'mono', size: 26, weight: 600, color: C.lime, align: 'left', ls: 2, alpha: oC(seg(t, tMe + 0.1, tMe + 0.5)) });
  txt('14 ANNI', TR.x0 + TR.w08 * TR.qpx / 2, g08 - 110, { size: 40, weight: 800, color: C.lime, alpha: oC(seg(t, tTo + 0.3, tTo + 0.7)) });
  mono('ILLUSTRAZIONE · PROFONDITÀ E DURATA IN SCALA', 540, 1420, t, a + 0.8, { size: 22 });
  x.restore(); finish(t); }
