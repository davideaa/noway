<script>const P = { EP: 4, DAY: 3, CAP: 0, NEXT: ['Il 2020:', 'crollo e rimbalzo'], FONTE: 'DATI: ISTAT CONTI NAZIONALI 2025 (SETT. 2026) · EUROSTAT' };</script>
<script src="serie.js"></script>
<script>
/* Puntata 4 — «PIL nominale e PIL reale». Numeri a schermo da p4-fonti.md:
   2025 nominale +2,5%, reale +0,6%, deflatore +1,8% (Istat 22/09/2026); 2023 nominale +7,2% (Eurostat, calcolato), reale +1,0% (Istat).
   Pizzeria e gancio +10%: cifre illustrative, non dati. */
const ORDER = ['num', 'hook', 'ieri', 'pizze', 'prezzo', 'incasso', 'nominale', 'reale', 'tg', 'italia', 'deflatore', 'ventitre', 'domanda', 'casa', 'fine', 'cta', 'end'];

/* numero all'italiana: 1.000 · 2,5 */
const fi = (n, d = 0) => { const s = Math.abs(n).toFixed(d).split('.'); s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (n < 0 ? '−' : '') + s.join(','); };
/* quante parole che iniziano così ha detto la voce nella scena (0 in anteprima) */
const WN = (k, w) => (((window.WORDS || {})[k]) || []).filter(([p]) => _nw(p).startsWith(_nw(w))).length;
const AMB = '245,165,36', LIM = '200,250,114', RED = '255,90,78';

/* ---------------- oggetti ---------------- */
function pizza(cx, cy, r, k = 1, rot = 0, sy = 1) { if (k <= 0) return; x.save(); x.translate(cx, cy); x.scale(1, sy); x.rotate(rot); x.globalAlpha *= clamp(k);
  const g = x.createRadialGradient(0, 0, r * 0.6, 0, 0, r); g.addColorStop(0, '#f0c27a'); g.addColorStop(1, '#a8642a');
  x.fillStyle = g; x.beginPath(); x.arc(0, 0, r, 0, 7); x.fill();
  x.fillStyle = '#b8392a'; x.beginPath(); x.arc(0, 0, r * 0.8, 0, 7); x.fill();
  x.fillStyle = 'rgba(246,232,190,0.95)'; for (const [a, d, s] of [[0.3, 0.45, 0.2], [1.6, 0.5, 0.18], [2.7, 0.4, 0.22], [3.9, 0.55, 0.17], [5.1, 0.42, 0.2], [0, 0, 0.16]]) { x.beginPath(); x.ellipse(Math.cos(a) * d * r, Math.sin(a) * d * r, s * r, s * r * 0.8, a, 0, 7); x.fill(); }
  x.fillStyle = '#4f9a3c'; for (const a of [0.9, 2.2, 4.4]) { x.beginPath(); x.ellipse(Math.cos(a) * 0.62 * r, Math.sin(a) * 0.62 * r, r * 0.1, r * 0.05, a + 0.6, 0, 7); x.fill(); }
  x.restore(); }
function oven(cx, by, s, heat = 0.5, k = 1) { if (k <= 0) return; x.save(); x.translate(cx, by); x.scale(s, s); x.globalAlpha *= clamp(k);
  x.fillStyle = metal(-170, 0, 170, 0, true); x.beginPath(); x.moveTo(-170, 0); x.lineTo(-170, -150); x.arc(0, -150, 170, Math.PI, 0); x.lineTo(170, 0); x.closePath(); x.fill();
  x.strokeStyle = 'rgba(241,244,238,0.12)'; x.lineWidth = 2; for (const r of [120, 145]) { x.beginPath(); x.arc(0, -150, r, Math.PI * 1.08, Math.PI * 1.92); x.stroke(); }
  x.fillStyle = metal(-30, 0, 30, 0, true); x.fillRect(60, -380, 46, 90);
  const m = x.createRadialGradient(0, -60, 10, 0, -60, 120); m.addColorStop(0, `rgba(255,200,90,${0.55 + 0.45 * heat})`); m.addColorStop(0.6, `rgba(255,90,40,${0.35 + 0.4 * heat})`); m.addColorStop(1, 'rgba(40,10,5,0.9)');
  x.fillStyle = m; x.beginPath(); x.moveTo(-95, -10); x.lineTo(-95, -100); x.arc(0, -100, 95, Math.PI, 0); x.lineTo(95, -10); x.closePath(); x.fill();
  x.strokeStyle = `rgba(${AMB},0.6)`; x.lineWidth = 3; x.stroke();
  x.fillStyle = '#0d100e'; x.fillRect(-195, -6, 390, 26);
  x.restore(); glow(cx, by - 70 * s, 230 * s, AMB, 0.22 * heat * k); }
/* cartellino del prezzo appeso a un filo: top = chiodo, ang = oscillazione */
function tag(cx, top, label, k, ang, col = C.amber, rgb = AMB, strike = 0) { if (k <= 0) return; x.save(); x.translate(cx, top); x.rotate(ang); x.globalAlpha *= clamp(k);
  x.strokeStyle = 'rgba(241,244,238,0.5)'; x.lineWidth = 3; x.beginPath(); x.moveTo(0, 0); x.lineTo(0, 70); x.stroke();
  x.fillStyle = C.ink; x.beginPath(); x.arc(0, 0, 7, 0, 7); x.fill();
  x.beginPath(); x.moveTo(0, 60); x.lineTo(100, 100); x.lineTo(100, 220); x.lineTo(-100, 220); x.lineTo(-100, 100); x.closePath();
  x.fillStyle = '#121613'; x.fill(); x.strokeStyle = col; x.lineWidth = 4; x.stroke();
  x.fillStyle = C.bg; x.beginPath(); x.arc(0, 88, 9, 0, 7); x.fill(); x.strokeStyle = col; x.lineWidth = 2; x.stroke();
  glow(0, 160, 120, rgb, 0.15);
  txt(label, 0, 162, { size: 70, weight: 800, color: col });
  if (strike > 0) { x.strokeStyle = C.red; x.lineWidth = 9; x.lineCap = 'round'; x.beginPath(); x.moveTo(-70, 190); x.lineTo(-70 + 140 * oC(strike), 190 - 60 * oC(strike)); x.stroke(); }
  x.restore(); }
function crate(cx, by, w, h, k = 1) { if (k <= 0) return; x.save(); x.globalAlpha *= clamp(k);
  const g = x.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0); g.addColorStop(0, '#8c6a3a'); g.addColorStop(0.5, '#c39a5c'); g.addColorStop(1, '#7d5e33');
  x.fillStyle = g; rr(cx - w / 2, by - h, w, h, 8); x.fill(); x.strokeStyle = 'rgba(30,20,8,0.6)'; x.lineWidth = 3; x.stroke();
  x.beginPath(); x.moveTo(cx - w / 2 + 6, by - h / 2); x.lineTo(cx + w / 2 - 6, by - h / 2); x.moveTo(cx - w / 2 + 8, by - h + 8); x.lineTo(cx + w / 2 - 8, by - 8); x.stroke();
  x.restore(); }
function lock(cx, cy, s, k, open = 0, col = C.amber) { if (k <= 0) return; x.save(); x.translate(cx, cy); x.scale(s, s); x.globalAlpha *= clamp(k);
  x.strokeStyle = col; x.lineWidth = 11; x.lineCap = 'round'; const lift = 22 * open;
  x.beginPath(); x.moveTo(-28, -10 - lift); x.lineTo(-28, -38 - lift); x.arc(0, -38 - lift, 28, Math.PI, 0); x.lineTo(28, -10 - lift + (open > 0.5 ? -12 : 0)); x.stroke();
  rr(-46, -14, 92, 74, 14); x.fillStyle = '#16130c'; x.fill(); x.strokeStyle = col; x.lineWidth = 4; x.stroke();
  x.fillStyle = col; x.beginPath(); x.arc(0, 16, 9, 0, 7); x.fill(); x.fillRect(-3, 18, 6, 20);
  x.restore(); }
function arrow(x0, y0, x1, y1, k, col = C.lime, wdt = 5) { if (k <= 0) return; const ex = lerp(x0, x1, k), ey = lerp(y0, y1, k), ang = Math.atan2(y1 - y0, x1 - x0);
  x.save(); x.strokeStyle = col; x.fillStyle = col; x.lineWidth = wdt; x.lineCap = 'round'; x.beginPath(); x.moveTo(x0, y0); x.lineTo(ex, ey); x.stroke();
  x.beginPath(); x.moveTo(ex + Math.cos(ang) * 16, ey + Math.sin(ang) * 16); x.lineTo(ex + Math.cos(ang + 2.4) * 20, ey + Math.sin(ang + 2.4) * 20); x.lineTo(ex + Math.cos(ang - 2.4) * 20, ey + Math.sin(ang - 2.4) * 20); x.closePath(); x.fill(); x.restore(); }

/* colonna di vetro: strato «quantità» (lime) + strato «prezzi» (ambra). s = scala, le scritte restano ≥ 22 px */
function column(cx, base, s, qH, pH, k, label, o = {}) { if (k <= 0) return; const { lab = C.lime, hot = 0, bub = 0, t = 0, inner = true, bulge = 0 } = o;
  const w = 240 * s * (1 + bulge * 0.08), h = (qH + pH) * s, eh = h + 40 * s, top = base - eh;
  if (hot > 0) glow(cx, base - eh / 2, 300 * s, LIM, 0.25 * hot);
  glass(cx, base - eh / 2, w, eh, 34 * s, k);
  x.save(); x.globalAlpha *= clamp(k); x.beginPath(); x.roundRect(cx - w / 2 + 6, top + 6, w - 12, eh - 12, 30 * s); x.clip();
  const qTop = base - 6 - qH * s, g1 = x.createLinearGradient(0, qTop, 0, base); g1.addColorStop(0, 'rgba(200,250,114,0.85)'); g1.addColorStop(1, 'rgba(200,250,114,0.35)');
  x.fillStyle = g1; x.fillRect(cx - w / 2, qTop, w, qH * s + 6);
  if (pH > 0.5) { const pTop = qTop - pH * s, g2 = x.createLinearGradient(0, pTop, 0, qTop); g2.addColorStop(0, 'rgba(245,165,36,0.9)'); g2.addColorStop(1, 'rgba(245,165,36,0.45)');
    x.fillStyle = g2; x.fillRect(cx - w / 2, pTop, w, pH * s); x.fillStyle = 'rgba(255,255,255,0.25)'; x.fillRect(cx - w / 2, pTop, w, 3);
    if (bub > 0) for (let i = 0; i < 6; i++) { const u = ((t * 0.5 + i / 6) % 1), bx = cx + (i % 2 ? 1 : -1) * (w / 2 - 28 * s), byy = qTop - u * pH * s;
      txt('€', bx, byy, { size: Math.max(22, 30 * s), weight: 800, color: 'rgba(43,24,6,0.55)', alpha: bub * Math.sin(Math.PI * u) }); }
    if (inner && pH * s > 70) txt('prezzi', cx, pTop + pH * s / 2, { fam: 'mono', size: Math.max(22, 28 * s), weight: 600, color: '#2b1806', ls: 1 }); }
  if (inner && qH * s > 70) txt('quantità', cx, qTop + qH * s / 2, { fam: 'mono', size: Math.max(22, 28 * s), weight: 600, color: '#15200C', ls: 1 });
  x.restore();
  txt(label, cx, base + 44, { fam: 'mono', size: Math.max(24, 30 * s), weight: 600, color: lab, alpha: clamp(k), ls: 3 });
  return top; }

/* ---------------- scene ---------------- */
function sHook(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.06);
  const tP = WT('hook', 'prezzi', 1, 0.7), tS = WT('hook', 'sale', 1, 2.8), tM = WT('hook', 'ma', 1, 4.8), tN = WT('hook', 'niente', 1, 6.2);
  phrase(t, tP - 0.25, [['Prezzi +10%:', C.ink]], 345, { size: 92, out: tM - 0.1 });
  phrase(t, tS - 0.1, [['PIL +10%.', C.lime]], 448, { size: 92, out: tM - 0.1 });
  phrase(t, tM, [['Prodotto in più:', C.ink], ['zero.', C.red]], 345, { size: 92 });
  /* sinistra: colonna PIL che sale del 10% */
  const kc = oC(seg(t, a + 0.2, a + 0.7)), kr = ioC(seg(t, tS, tS + 1.3)), H0 = 420, h = H0 * (1 + 0.1 * kr), base = 1250, cx = 290;
  if (kc > 0) { glow(cx, base - h / 2, 260, LIM, 0.18 * kc * (0.5 + kr));
    glass(cx, base - (H0 * 1.1 + 40) / 2, 200, H0 * 1.1 + 40, 30, kc);
    x.save(); x.globalAlpha = kc; const g = x.createLinearGradient(0, base - h, 0, base); g.addColorStop(0, 'rgba(200,250,114,0.9)'); g.addColorStop(1, 'rgba(200,250,114,0.3)');
    x.fillStyle = g; rr(cx - 88, base - 8 - h, 176, h, 20); x.fill();
    x.strokeStyle = 'rgba(241,244,238,0.55)'; x.lineWidth = 3; x.setLineDash([8, 8]); x.beginPath(); x.moveTo(cx - 120, base - 8 - H0); x.lineTo(cx + 120, base - 8 - H0); x.stroke(); x.setLineDash([]); x.restore();
    txt('PIL', cx, base + 44, { fam: 'mono', size: 30, weight: 600, color: C.lime, alpha: kc, ls: 4 });
    txt('+' + fi(10 * kr) + '%', cx, base - 8 - H0 * 1.1 - 120, { size: 84, weight: 800, color: C.lime, alpha: kc * clamp(kr * 4) }); }
  /* destra: la pila di casse che non cambia */
  const sx = 790, sb = 1250; for (let i = 0; i < 6; i++) { const r = Math.floor(i / 2), c = i % 2, ki = oB(seg(t, a + 0.3 + i * 0.12, a + 0.75 + i * 0.12)); if (ki <= 0) continue;
    const drop = (1 - clamp(ki)) * -160; crate(sx - 77 + c * 154, sb - r * 112 + drop, 148, 106, clamp(ki * 2)); }
  const kt = seg(t, tP, tP + 0.5); if (kt > 0) { const sw = Math.sin((t - tP) * 6) * 0.35 * Math.exp(-(t - tP) * 2.2); tag(sx, 600, '+10%', oC(kt), sw); }
  const kn = oB(seg(t, tN - 0.1, tN + 0.35)); if (kn > 0) { x.save(); x.globalAlpha = clamp(kn); x.strokeStyle = C.red; x.lineWidth = 4; x.setLineDash([10, 8]);
    x.beginPath(); x.moveTo(sx - 180, sb - 3 * 112 - 6); x.lineTo(sx + 180, sb - 3 * 112 - 6); x.stroke(); x.setLineDash([]); x.restore();
    x.save(); x.translate(sx, sb + 50); x.scale(clamp(kn, 0, 1.2), clamp(kn, 0, 1.2)); txt('+0 prodotti', 0, 0, { size: 50, weight: 800, color: C.red }); x.restore(); }
  else txt('prodotti', sx, sb + 44, { fam: 'mono', size: 30, weight: 600, color: C.muted, alpha: oC(seg(t, a + 0.8, a + 1.2)), ls: 3 });
  x.restore(); finish(t); }

function sIeri(t, a, b) { bg(); x.save(); const tO = WT('ieri', 'oggi', 1, 3.1), tL = WT('ieri', 'inganna', 1, 4.1), ko = ioC(seg(t, tO - 0.2, tO + 0.5));
  phrase(t, a + 0.05, [['Ieri: cosa', C.muted], ['non misura.', C.muted]], 345, { size: 92, out: tO - 0.15 });
  phrase(t, tO, [['Oggi: come ti', C.ink], ['inganna.', C.red]], 345, { size: 92 });
  /* le cose di ieri, fuori dal PIL: sfocate, poi se ne vanno */
  const FUORI = [['lavoro di casa', 210, 640], ['cura', 880, 650], ['benessere', 190, 1010], ['ponte perso', 880, 1000], ['disuguaglianza', 260, 1350], ['ambiente', 840, 1360]];
  FUORI.forEach(([s, px, py], i) => { const ki = oC(seg(t, a + 0.3 + i * 0.12, a + 0.8 + i * 0.12)) * (1 - ko); if (ki <= 0) return; const dr = Math.sin(t * 1.3 + i) * 8;
    txt(s, px + (px < 540 ? -1 : 1) * ko * 120, py + dr, { fam: 'mono', size: 30, weight: 600, color: C.muted, alpha: ki * 0.8, blur: 3 + 4 * (0.5 + 0.5 * Math.sin(t * 2 + i)) }); });
  /* la scheda PIL */
  const kc = oB(seg(t, a + 0.2, a + 0.8)); if (kc > 0) { x.save(); x.translate(540, 820); x.scale(clamp(kc, 0, 1.15), clamp(kc, 0, 1.15)); glow(0, 0, 340, LIM, 0.2);
    glass(0, 0, 420, 260, 40, 1); txt('PIL', 0, -18, { size: 150, weight: 800, color: C.lime, ls: -6 }); txt('il numero', 0, 88, { fam: 'mono', size: 26, weight: 600, color: C.muted, ls: 2 }); x.restore(); }
  /* dentro il numero: cose o prezzi? riga di gettoni, la lente la ingrandisce */
  const kr = oC(seg(t, tO, tO + 0.5)), RY = 1180, TOK = ['c', 'p', 'c', 'c', 'p', 'c', 'p', 'c'];
  const tokens = (sc, col) => TOK.forEach((q, i) => { const tx = 540 + (i - 3.5) * 62; if (q === 'c') crate(tx, RY + 20 * sc, 44 * sc, 36 * sc, 1);
    else { x.save(); x.translate(tx, RY); x.scale(sc, sc); x.fillStyle = col ? 'rgba(245,165,36,0.9)' : 'rgba(139,149,143,0.7)'; x.beginPath(); x.moveTo(0, -20); x.lineTo(18, -8); x.lineTo(18, 20); x.lineTo(-18, 20); x.lineTo(-18, -8); x.closePath(); x.fill(); x.restore(); } });
  if (kr > 0) { x.save(); x.globalAlpha = kr; tokens(1, false); x.restore();
    txt('dentro: cose o prezzi?', 540, 1440, { fam: 'mono', size: 28, weight: 600, color: C.amber, alpha: oC(seg(t, tL + 0.4, tL + 0.8)), ls: 1 }); }
  const kl = oC(seg(t, tL - 0.2, tL + 0.6)); if (kl > 0) { const lx = lerp(1000, 540 + Math.sin(t * 1.4) * 40, kl), ly = RY, R = 120;
    x.save(); x.beginPath(); x.arc(lx, ly, R, 0, 7); x.clip(); x.fillStyle = 'rgba(5,6,7,0.92)'; x.fillRect(lx - R, ly - R, 2 * R, 2 * R);
    x.translate(lx, ly); x.scale(2.1, 2.1); x.translate(-lx, -ly); tokens(1, true); x.restore();
    glow(lx, ly, R + 40, AMB, 0.12); x.save(); x.strokeStyle = C.ink; x.lineWidth = 8; x.beginPath(); x.arc(lx, ly, R, 0, 7); x.stroke();
    x.lineWidth = 16; x.lineCap = 'round'; x.beginPath(); x.moveTo(lx + R * 0.72, ly + R * 0.72); x.lineTo(lx + R * 1.25, ly + R * 1.2); x.stroke(); x.restore(); }
  x.restore(); finish(t); }

/* la pizzeria: forno, pila di cartoni, cartellino, cassa. Si arricchisce da «pizze» a «incasso» */
const PZ = { ox: 255, base: 1000, sx: 590, tx: 868, ttop: 590, ry: 1290 };
function pizzeria(t, o) { const { kIn = 1, nBox = 7, count = 1000, kCount = 1, heat = 0.5, tagK = 1, tagSw = 0, tagLab = '8 €', strike = 0, flip = null, cash = 0, cashK = 1, cashCol = C.lime, dimCash = 0, zero = 0, same = 0 } = o;
  /* bancone */
  x.save(); x.globalAlpha = kIn; x.fillStyle = 'rgba(241,244,238,0.10)'; rr(80, PZ.base, 920, 22, 8); x.fill(); x.fillStyle = 'rgba(241,244,238,0.35)'; x.fillRect(90, PZ.base, 900, 2); x.restore();
  oven(PZ.ox, PZ.base, 0.78, heat, kIn);
  /* pila di cartoni */
  for (let i = 0; i < nBox; i++) { const y = PZ.base - 6 - i * 34; x.save(); x.globalAlpha = kIn; const g = x.createLinearGradient(PZ.sx - 115, 0, PZ.sx + 115, 0); g.addColorStop(0, '#9c7a46'); g.addColorStop(0.5, '#d2ad70'); g.addColorStop(1, '#8a6a3b');
    x.fillStyle = g; rr(PZ.sx - 115, y - 30, 230, 30, 5); x.fill(); x.strokeStyle = 'rgba(40,25,8,0.6)'; x.lineWidth = 2; x.stroke(); x.restore(); }
  if (nBox > 0) pizza(PZ.sx, PZ.base - 6 - nBox * 34 - 26, 100, kIn, 0.4, 0.34);
  if (same > 0) { x.save(); x.globalAlpha = same; x.strokeStyle = C.lime; x.lineWidth = 4; rr(PZ.sx - 135, PZ.base - 6 - nBox * 34 - 70, 270, nBox * 34 + 76, 18); x.stroke(); x.restore(); }
  /* quante pizze */
  const cl = fi(Math.round(count)) + ' pizze', cw = tw(cl, 48); txt(cl, PZ.sx, PZ.base + 66, { size: 48, weight: 800, color: same > 0.5 ? C.lime : C.ink, alpha: kCount });
  if (zero > 0) { const s = clamp(oB(zero), 0, 1.2); x.save(); x.translate(PZ.sx + cw / 2 + 70, PZ.base + 66); x.scale(s, s); txt('+0', 0, 0, { size: 52, weight: 800, color: C.red }); x.restore(); }
  /* cartellino (flip = [kFlip, nuovo]) */
  if (flip && flip[0] > 0) { const kf = flip[0], sxF = Math.abs(Math.cos(Math.PI * kf)); x.save(); x.translate(PZ.tx, 0); x.scale(Math.max(0.02, sxF), 1); x.translate(-PZ.tx, 0);
    if (kf < 0.5) tag(PZ.tx, PZ.ttop, tagLab, tagK, tagSw, C.ink, '241,244,238', strike); else tag(PZ.tx, PZ.ttop, flip[1], tagK, tagSw, C.amber, AMB); x.restore(); }
  else tag(PZ.tx, PZ.ttop, tagLab, tagK, tagSw, flip ? C.ink : C.amber, flip ? '241,244,238' : AMB, strike);
  /* cassa */
  if (cashK > 0) { glass(540, PZ.ry, 860, 200, 36, cashK); x.save(); x.globalAlpha = cashK * (1 - 0.6 * dimCash);
    txt('INCASSO', 160, PZ.ry - 52, { fam: 'mono', size: 26, weight: 600, color: C.muted, align: 'left', ls: 3 });
    txt(fi(Math.round(cash)) + ' €', 160, PZ.ry + 28, { size: 96, weight: 800, color: cashCol, align: 'left', ls: -2 }); x.restore(); }
}
function swing(t, t0) { return t < t0 ? 0 : Math.sin((t - t0) * 5.5) * 0.4 * Math.exp(-(t - t0) * 1.8); }
function sPizze(t, a, b) { bg('52,36,20', 0.8); x.save(); zoom(t, a, b, 1.05);
  const tZ = WT('pizze', 'pizzeria', 1, 0.7), tN = WT('pizze', 'pizze', 2, 2.1), tC = WT('pizze', 'incassa', 1, 3.8);
  const tE = WN('pizze', 'euro') >= 2 ? WT('pizze', 'euro', 1) - 0.35 : tN + 0.55; /* cartellino su «otto euro» (riserva se Whisper scrive «8€») */
  phrase(t, a + 0.05, [['Una pizzeria:', C.ink]], 345, { size: 92 });
  phrase(t, tN - 0.1, [['1.000 pizze a 8 €', C.lime]], 448, { size: 92 });
  const kIn = oC(seg(t, a + 0.15, a + 0.6)), kn = ioC(seg(t, tN - 0.2, tN + 0.9)), nBox = Math.min(7, Math.floor(1 + kn * 6.99));
  /* pizze che escono dal forno verso la pila */
  for (let i = 0; i < 6; i++) { const t0 = tZ + i * 0.22 + (i ? tN - tZ - 0.4 : 0), u = seg(t, t0, t0 + 0.5); if (u <= 0 || u >= 1) continue;

  card(790, tP, 'solo prezzi?', C.amber, AMB, (cx) => { x.save(); x.translate(cx, 1178); x.rotate(-0.2); x.fillStyle = C.amber; x.beginPath(); x.moveTo(0, -36); x.lineTo(30, -14); x.lineTo(30, 32); x.lineTo(-30, 32); x.lineTo(-30, -14); x.closePath(); x.fill(); x.fillStyle = C.bg; x.beginPath(); x.arc(0, -12, 7, 0, 7); x.fill(); x.restore(); }, 'sale solo il nominale');
  x.restore(); finish(t); }

function sCasa(t, a, b) { bg('30,44,26'); x.save(); const d = b - a;
  const tP = WT('casa', 'per', 1, 2.1), tC = WT('casa', 'crollo', 1, 3.4), tR = WT('casa', 'reale', 1, 4.5);
  phrase(t, a + 0.05, [['Cosa ti porti a casa?', C.muted]], 330, { size: 70, out: tP - 0.25 });
  phrase(t, tP - 0.05, [['Per leggere un crollo:', C.ink]], 345, { size: 92 });
  phrase(t, tR - 0.1, [['il reale.', C.lime]], 448, { size: 92 });
  /* grafico: le due linee, il crollo si vede davvero solo nel reale */
  const kp = oC(seg(t, a + 0.3, a + 0.8)); glass(365, 930, 560, 560, 36, kp);
  const NP = 24, nom = (i) => 900 - i * 3 - (i > 12 && i < 17 ? 50 * Math.sin(Math.PI * (i - 12) / 4) : 0), rea = (i) => 935 - i * 1.5 + (i > 11 ? 185 * Math.min(1, (i - 11) / 3) - 110 * clamp((i - 14) / 8) : 0);
  const u = clamp(lerp(0, 0.5, seg(t, a + 0.4, tC)) + lerp(0, 0.5, seg(t, tC, tC + 1.3))), n = u * NP;
  const line = (f, col, wdt, dash) => { x.save(); x.strokeStyle = col; x.lineWidth = wdt; x.lineJoin = 'round'; x.setLineDash(dash); x.beginPath();
    for (let i = 0; i <= Math.floor(n); i++) { const px = 120 + i * 20; i ? x.lineTo(px, f(i)) : x.moveTo(px, f(i)); }
    if (n % 1 > 0 && n < NP) { const i = Math.floor(n); x.lineTo(120 + n * 20, lerp(f(i), f(i + 1), n % 1)); } x.stroke(); x.restore(); };
  if (kp > 0) { x.save(); x.globalAlpha = kp; line(nom, 'rgba(245,165,36,0.75)', 5, [12, 10]); line(rea, C.lime, 8, []); x.restore();
    const ke = clamp((n - NP + 0.5) * 2); txt('nominale', 600, nom(NP) - 40, { fam: 'mono', size: 26, weight: 600, color: C.amber, align: 'right', alpha: ke });
    txt('reale', 600, rea(NP) + 80, { fam: 'mono', size: 26, weight: 600, color: C.lime, align: 'right', alpha: ke });
    const kd = oC(seg(t, tC + 0.6, tC + 1.1)); if (kd > 0) { glow(120 + 14 * 20, rea(14), 90, RED, 0.35 * kd); txt('crollo', 120 + 14 * 20, rea(14) + 52, { fam: 'mono', size: 26, weight: 600, color: C.red, alpha: kd, ls: 2 }); } }
  /* la colonna REALE viene in primo piano */
  const kr = oC(seg(t, a + 0.4, a + 0.9)), kz = oB(seg(t, tR - 0.1, tR + 0.5)), s = lerp(0.8, 1, clamp(kz));
  column(850, 1260, s, 300, 0, kr, 'REALE', { hot: clamp(kz) });
  lock(850, 1260 - (340 * s) - 70 * s, s, kr, 0);
  x.restore(); finish(t); }

serie({ hook: sHook, ieri: sIeri, pizze: sPizze, prezzo: sPrezzo, incasso: sIncasso, nominale: sNominale, reale: sReale, tg: sTg,
  italia: sItalia, deflatore: sDeflatore, ventitre: sVentitre, domanda: sDomanda, casa: sCasa }, ORDER, ['hook', 'pizze', 'nominale', 'italia', 'casa']);
