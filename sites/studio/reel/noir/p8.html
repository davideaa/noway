  let prev = null, xh = X0, yh = 900; for (let px = X0; px <= lerp(X0, X1, head); px += 5) { const th = lerp(t0, t1, (px - X0) / (X1 - X0)), py = yAt(th);
    if (prev) { const kr = clamp((py - 905) / 120); x.strokeStyle = `rgb(${Math.round(lerp(200, 255, kr))},${Math.round(lerp(250, 90, kr))},${Math.round(lerp(114, 78, kr))})`; x.lineWidth = 7; x.lineCap = 'round'; x.beginPath(); x.moveTo(...prev); x.lineTo(px, py); x.stroke(); }
    prev = [px, py]; xh = px; yh = py; }
  if (head > 0) { const kr = clamp((yh - 905) / 120); glow(xh, yh, 60, kr > 0.5 ? '255,90,78' : '200,250,114', 0.5); x.fillStyle = kr > 0.5 ? C.red : C.lime; x.beginPath(); x.arc(xh, yh, 11, 0, 7); x.fill(); }
  const xd = lerp(X0, X1, seg(tCr + 0.9, t0, t1)), kd = seg(t, tCr + 0.6, tCr + 1.0);
  txt('CRISI', xd, 1140, { fam: 'mono', size: 24, weight: 600, color: C.red, alpha: kd, ls: 3 });
  txt('ESEMPIO ILLUSTRATIVO', (X0 + X1) / 2, 1218, { fam: 'mono', size: 22, weight: 600, color: C.muted, ls: 2 });
  x.restore();
  glassPill(540, 1352, 'POLITICA FISCALE', seg(t, tPo - 0.15, tPo + 0.35), C.lime, 46);
  x.restore(); finish(t); }
