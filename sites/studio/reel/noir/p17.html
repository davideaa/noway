<script>const P = { EP: 17, DAY: 1, CAP: 0, NEXT: ['Da dove viene', 'la crescita'], QUANDO: 'PROSSIMA LEZIONE', FONTE: 'DATI: OCSE · BANCA D’ITALIA (non scritta nel video dal 16/10/2026)' };</script>
<script src="serie.js"></script>
<script>
/* Puntata 17 — «Salari e produttività» (martedì 27/10/2026, lezione 2 di 5). Numeri SOLO da p17-fonti.md:
   salario medio annuo 2025 a parità di potere d'acquisto (OCSE AV_AN_WAGE): Italia/Germania = 0,71 → «quasi −30%»
   (carrelli: 7 pezzi contro 10, in scala); ore medie per occupato 2025 (OCSE PDB HRSAV): Italia 1.715,7 · Germania 1.336,4
   → a schermo 1.716 e 1.336, differenza 379 → «circa 380»; barre a 0,45 px per ora (in scala).
   Dal 2000 al 2025 (indice 2000 = 100, 13 px per punto, solo primo e ultimo anno, nessun percorso inventato):
   produttività oraria Italia −0,3% (OCSE) → «quasi ferma» (mai «zero»); salario medio reale Italia −2,9% → «circa −3%»;
   Germania produttività +21,9%, salario +19,1% → «circa +20%», «entrambi».
   Banca d'Italia (30/05/2025): salari reali «in linea con la stagnazione della produttività», detto come giudizio suo.
   Panificio 20 → 40 kg l'ora: esempio inventato, sempre con «ESEMPIO · CIFRE INVENTATE»; mai «stesso lavoro»,
   mai che il singolo lavoratore produce meno. Pagnotte con area in scala (raggio ×√2), mucchio sulla bilancia 1,9 px per kg.
   Niente righe di fonte a schermo (Davide, 16/10/2026). Niente persone: mani stilizzate, nessun volto. */
const ORDER = ['num', 'hook', 'ore', 'def', 'mano', 'impastatrice', 'dividere', 'conti', 'ferma', 'sceso', 'germania', 'bancaditalia', 'casa', 'fine', 'cta', 'end'];
const Y2 = 345 + 92 * 1.12; /* seconda riga del titolo */
/* parola con più grafie (apostrofi: Whisper scrive «l», «'Ocse» oppure «l'OCSE»): prova in ordine, poi la riserva */
const WA = (k, ws, n, ris) => { for (const w of ws) { const v = WT(k, w, n, NaN); if (!isNaN(v)) return v; } return S(k) + ris; };
/* ultima parola della scena che inizia così (per «impasta» dopo «impastatrice») */
const WL = (k, w, ris) => { const L = ((window.WORDS || {})[k]) || []; let r = NaN; for (const [p, tt] of L) if (_nw(p).startsWith(_nw(w))) r = tt; return isNaN(r) ? S(k) + ris : r; };
const lab = (s, px, py, k, col = C.muted, size = 26, o = {}) => txt(s, px, py, { fam: 'mono', size, weight: 600, color: col, alpha: k, ls: 2, ...o });
function honest(s, k, y = 1419) { if (k <= 0) return; const ww = tw(s, 22, 600, 'mono', 3) + 44; x.save(); x.globalAlpha *= k; x.strokeStyle = 'rgba(245,165,36,0.8)'; x.lineWidth = 2; x.setLineDash([6, 6]); rr(540 - ww / 2, y - 25, ww, 50, 25); x.stroke(); x.setLineDash([]); x.restore();
  txt(s, 540, y, { fam: 'mono', size: 22, weight: 600, color: C.amber, alpha: k, ls: 3 }); }
const ESEMPIO = 'ESEMPIO · CIFRE INVENTATE';
function dashLine(x0, y0, x1, y1, col, w = 3, dash = [10, 10], a = 1) { if (a <= 0) return; x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.lineWidth = w; x.setLineDash(dash); x.lineCap = 'round'; x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); x.restore(); }
function dot(cx, cy, r, col, k = 1, g = null) { if (k <= 0) return; if (g) glow(cx, cy, r * 5, g, 0.35 * clamp(k)); x.save(); x.globalAlpha *= clamp(k); x.fillStyle = col; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); x.strokeStyle = '#050607'; x.lineWidth = 3; x.stroke(); x.restore(); }
function ring(cx, cy, r0, t, t0, rgb = '200,250,114', d = 0.6, gr = 60) { const k = seg(t, t0, t0 + d); if (k <= 0 || k >= 1) return; x.save(); x.strokeStyle = `rgba(${rgb},${1 - k})`; x.lineWidth = 4; x.beginPath(); x.arc(cx, cy, r0 + gr * oC(k), 0, 7); x.stroke(); x.restore(); }

/* contatore a rulli: ogni cifra scorre in verticale, come un contachilometri (le cifre alte girano solo quando le basse passano da 9 a 0) */
function rollNum(v, px, py, size, col, a = 1, nd = 4) { if (a <= 0) return; v = Math.max(0, v);
  const cw = tw('0', size, 800) * 1.04, dw = tw('.', size, 800) * 1.2, cells = []; let xr = px;
  for (let i = 0; i < nd; i++) { if (i === 3) { cells.push({ dot: true, cx: xr - dw / 2 }); xr -= dw; } cells.push({ i, cx: xr - cw / 2 }); xr -= cw; }
  x.save(); x.beginPath(); x.rect(xr - 8, py - size * 0.6, px - xr + 16, size * 1.2); x.clip();
  for (const c of cells) { if (c.dot) { if (v >= 1000) txt('.', c.cx, py, { size, weight: 800, color: col, alpha: a }); continue; }
    const p = Math.pow(10, c.i); if (c.i > 0 && v < p) continue;
    const d = Math.floor(v / p) % 10, rem = v - Math.floor(v / p) * p, r = c.i === 0 ? v - Math.floor(v) : clamp(rem - (p - 1)), off = r * size * 1.1;
    txt(String(d), c.cx, py - off, { size, weight: 800, color: col, alpha: a }); if (r > 0.001) txt(String((d + 1) % 10), c.cx, py - off + size * 1.1, { size, weight: 800, color: col, alpha: a }); }
  x.restore(); }

/* ================= HOOK: due carrelli della spesa, quello che lo stipendio medio compra (10 pezzi contro 7) ================= */
const CRT = { by: 1180, it: 300, de: 780 };
const ITC = ['245,165,36', '200,250,114', '233,236,230', '120,190,230', '139,149,143']; /* niente rosso: il rosso è il buco */
const slot = (cx, i) => [cx - 112 + (i % 5) * 56, CRT.by - 134 - Math.floor(i / 5) * 80];
function item(px, py, i, a) { if (a <= 0) return; const c = ITC[(i * 3 + 1) % 5], kind = (i * 7) % 3; x.save(); x.globalAlpha *= clamp(a); x.fillStyle = `rgba(${c},0.85)`;
  if (kind === 0) { rr(px - 24, py - 36, 48, 72, 8); x.fill(); x.fillStyle = 'rgba(5,6,7,0.3)'; x.fillRect(px - 24, py - 8, 48, 14); }
  else if (kind === 1) { rr(px - 15, py - 18, 30, 54, 9); x.fill(); rr(px - 7, py - 36, 14, 20, 4); x.fill(); x.fillStyle = 'rgba(5,6,7,0.3)'; x.fillRect(px - 15, py + 2, 30, 12); }
  else { rr(px - 22, py - 28, 44, 64, 12); x.fill(); x.fillStyle = 'rgba(5,6,7,0.3)'; x.fillRect(px - 22, py - 14, 44, 5); x.fillRect(px - 22, py + 18, 44, 5); }
  x.restore(); }
function cart(cx, k, hot) { if (k <= 0) return; const by = CRT.by, top = by - 300, bot = by - 90, col = hot > 0.5 ? C.lime : 'rgba(241,244,238,0.85)';
  x.save(); x.globalAlpha *= clamp(k); x.lineJoin = 'round'; x.lineCap = 'round';
  if (hot > 0) glow(cx, by - 190, 300, '200,250,114', 0.16 * hot);
  x.strokeStyle = 'rgba(241,244,238,0.16)'; x.lineWidth = 2;
  for (let i = 1; i < 6; i++) { const u = i / 6; x.beginPath(); x.moveTo(lerp(cx - 180, cx + 180, u), top); x.lineTo(lerp(cx - 150, cx + 150, u), bot); x.stroke(); }
  x.beginPath(); x.moveTo(cx - 165, (top + bot) / 2); x.lineTo(cx + 165, (top + bot) / 2); x.stroke();
  x.strokeStyle = col; x.lineWidth = 6;
  x.beginPath(); x.moveTo(cx - 180, top); x.lineTo(cx + 180, top); x.lineTo(cx + 150, bot); x.lineTo(cx - 150, bot); x.closePath(); x.stroke();
  x.beginPath(); x.moveTo(cx - 180, top); x.lineTo(cx - 205, top - 40); x.lineTo(cx - 240, top - 40); x.stroke();
  x.beginPath(); x.moveTo(cx - 150, bot); x.lineTo(cx - 140, by - 48); x.lineTo(cx + 150, by - 48); x.stroke();
  for (const dx of [-118, 120]) { x.fillStyle = '#0a0c0b'; x.beginPath(); x.arc(cx + dx, by - 20, 18, 0, 7); x.fill(); x.strokeStyle = col; x.lineWidth = 5; x.stroke(); }
  x.restore(); }
function sHook(t, a, b) { bg('48,40,22', 0.6); x.save(); zoom(t, a, b, 1.03);
  const tCo = WT('hook', 'contando', 1, 1.4), tQ = WT('hook', 'quasi', 1, 3.4), tTe = WT('hook', 'tedesco', 1, 5.8);
  phrase(t, a + 0.05, [['Stipendio italiano:', C.ink]], 345, { size: 92 });
  phrase(t, tQ - 0.1, [['quasi −30%.', C.red]], Y2, { size: 92 });
  const kIt = oC(seg(t, a, a + 0.55)), kDe = oC(seg(t, a + 0.1, a + 0.65)), hot = oC(seg(t, tTe - 0.1, tTe + 0.3));
  x.save(); x.translate(-160 * (1 - kIt), 0); cart(CRT.it, kIt, 0); x.restore();
  x.save(); x.translate(160 * (1 - kDe), 0); cart(CRT.de, kDe, hot); x.restore();
  /* la spesa entra pezzo per pezzo, stesso ritmo nei due carrelli: l'italiano si ferma a 7 */
  for (let i = 0; i < 10; i++) { const t0 = tCo - 0.2 + i * 0.16, k = seg(t, t0, t0 + 0.45); if (k <= 0) continue; const kk = oB(k, 1.3);
    for (const [cx, n] of [[CRT.de, 10], [CRT.it, 7]]) { if (i >= n) continue; const [px, py] = slot(cx, i); item(px, py - 260 * (1 - kk), i, clamp(k * 3)); } }
  /* il buco: tre posti vuoti, tratteggiati in rosso */
  const kM = oC(seg(t, tQ + 0.1, tQ + 0.5)); if (kM > 0) for (let i = 7; i < 10; i++) { const [px, py] = slot(CRT.it, i); x.save(); x.globalAlpha = kM; x.strokeStyle = C.red; x.lineWidth = 3; x.setLineDash([7, 6]); rr(px - 24, py - 36, 48, 72, 8); x.stroke(); x.restore(); }
  lab('ITALIA', CRT.it, 1240, kIt, C.ink, 30, { ls: 4 });
  lab('GERMANIA', CRT.de, 1240, kDe, hot > 0.5 ? C.lime : C.ink, 30, { ls: 4 });
  mono('SALARIO MEDIO · A PARITÀ DI POTERE D’ACQUISTO', 540, 1330, t, tCo - 0.3, { size: 22 });
  x.restore(); finish(t); }

/* ================= ORE: le ore dell'anno si riempiono allo stesso ritmo, l'Italia va avanti di 380 ================= */
const OR = { x0: 160, u: 0.45, it: 1715.7, de: 1336.4, yIt: 750, yDe: 960, h: 60 };
function hourBar(y, hours, rgb, a) { if (a <= 0 || hours <= 0) return; const w = hours * OR.u; x.save(); x.globalAlpha *= a;
  const g = x.createLinearGradient(OR.x0, 0, OR.x0 + w, 0); g.addColorStop(0, `rgba(${rgb},0.45)`); g.addColorStop(1, `rgba(${rgb},0.95)`);
  x.fillStyle = g; rr(OR.x0, y, w, OR.h, 8); x.fill();
  x.fillStyle = '#050607'; for (let h = 100; h < hours; h += 100) x.fillRect(OR.x0 + h * OR.u - 1.5, y, 3, OR.h); /* una tacca ogni 100 ore */
  x.restore(); }
function sOre(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.03);
  const tLa = WT('ore', 'lavora', 1, 1.0), tCi = WT('ore', 'circa', 1, 3.0), tPi = WA('ore', ['piu'], 1, 4.6);
  phrase(t, a + 0.05, [['Non si lavora meno:', C.ink]], 345, { size: 92 });
  phrase(t, tCi + 0.1, [['circa 380 ore in più.', C.amber]], Y2, { size: 92 });
  const kIn = oC(seg(t, a + 0.1, a + 0.5)), rate = OR.it / 1.9, t0 = tLa - 0.1;
  const hIt = Math.min(OR.it, rate * Math.max(0, t - t0)), hDe = Math.min(OR.de, rate * Math.max(0, t - t0));
  const fIt = hIt >= OR.it ? 1715.7 : hIt, vIt = hIt >= OR.it ? 1716 : hIt, vDe = hDe >= OR.de ? 1336 : hDe;
  lab('ITALIA', OR.x0, OR.yIt - 36, kIn, C.amber, 28, { align: 'left', ls: 4 });
  lab('GERMANIA', OR.x0, OR.yDe - 36, kIn, C.ink, 28, { align: 'left', ls: 4 });
  x.save(); x.globalAlpha = kIn; x.fillStyle = 'rgba(241,244,238,0.06)'; rr(OR.x0, OR.yIt, OR.it * OR.u, OR.h, 8); x.fill(); rr(OR.x0, OR.yDe, OR.it * OR.u, OR.h, 8); x.fill(); x.restore();
  hourBar(OR.yIt, fIt, '245,165,36', kIn); hourBar(OR.yDe, hDe, '233,236,230', kIn);
  rollNum(vIt, OR.x0 + OR.it * OR.u, OR.yIt - 40, 52, C.amber, kIn * seg(t, t0, t0 + 0.2));
  rollNum(vDe, OR.x0 + OR.de * OR.u, OR.yDe - 40, 52, C.ink, kIn * seg(t, t0, t0 + 0.2));
  /* la differenza: lo spazio che manca alla Germania */
  const kG = oC(seg(t, tPi - 0.25, tPi + 0.2)), gx0 = OR.x0 + OR.de * OR.u, gx1 = OR.x0 + OR.it * OR.u;
  if (kG > 0) { x.save(); x.globalAlpha = kG; glow((gx0 + gx1) / 2, OR.yDe + 30, 170, '245,165,36', 0.22); x.strokeStyle = C.amber; x.lineWidth = 3; x.setLineDash([8, 6]); rr(gx0 + 4, OR.yDe, gx1 - gx0 - 4, OR.h, 8); x.stroke(); x.restore();
    x.save(); x.translate((gx0 + gx1) / 2, 1080); const s = lerp(0.7, 1, oB(kG)); x.scale(s, s); txt('+380 ORE', 0, 0, { size: 44, weight: 800, color: C.amber, alpha: kG }); x.restore(); }
  mono('ORE LAVORATE IN UN ANNO · PER OCCUPATO', 540, 1190, t, a + 0.4, { size: 24 });
  x.restore(); finish(t); }

/* ================= DEF: la clessidra delle ore, i mattoni del valore ================= */
function hourglass(cx, cy, hh, w, sand, k) { if (k <= 0) return; const top = cy - hh / 2, bot = cy + hh / 2;
  const path = () => { x.beginPath(); x.moveTo(cx - w / 2, top); x.lineTo(cx + w / 2, top); x.quadraticCurveTo(cx + w / 2, cy - 60, cx + 14, cy); x.quadraticCurveTo(cx + w / 2, cy + 60, cx + w / 2, bot);
    x.lineTo(cx - w / 2, bot); x.quadraticCurveTo(cx - w / 2, cy + 60, cx - 14, cy); x.quadraticCurveTo(cx - w / 2, cy - 60, cx - w / 2, top); x.closePath(); };
  x.save(); x.globalAlpha *= clamp(k); path(); x.fillStyle = 'rgba(241,244,238,0.05)'; x.fill();
  x.save(); path(); x.clip(); x.fillStyle = '#D9A55A';
  const ys = lerp(top + 26, cy, sand); x.fillRect(cx - w / 2, ys, w, cy - ys);
  const ph = (hh / 2 - 16) * sand; x.beginPath(); x.moveTo(cx - w / 2, bot); x.lineTo(cx - w / 2, bot - ph * 0.3); x.quadraticCurveTo(cx, bot - ph * 1.3, cx + w / 2, bot - ph * 0.3); x.lineTo(cx + w / 2, bot); x.closePath(); x.fill();
  if (sand > 0.002 && sand < 0.998) x.fillRect(cx - 3, cy, 6, bot - cy - ph * 0.75);
  x.restore();
  path(); x.strokeStyle = 'rgba(241,244,238,0.6)'; x.lineWidth = 4; x.stroke();
  for (const py of [top - 22, bot]) { x.fillStyle = metal(cx - w / 2 - 30, 0, cx + w / 2 + 30, 0, true); rr(cx - w / 2 - 30, py, w + 60, 22, 8); x.fill(); x.strokeStyle = 'rgba(241,244,238,0.3)'; x.lineWidth = 2; rr(cx - w / 2 - 30, py, w + 60, 22, 8); x.stroke(); }
  x.restore(); }
function sDef(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04);
  const tVa = WT('def', 'valore', 1, 1.0), tOg = WT('def', 'ogni', 1, 1.7), tLa = WT('def', 'lavoro', 1, 2.4), tPr = WT('def', 'produttivita', 1, 3.8);
  phrase(t, a + 0.05, [['Conta il valore', C.ink]], 345, { size: 92 });
  phrase(t, tOg - 0.1, [['di ogni ora.', C.lime]], Y2, { size: 92 });
  const kIn = oC(seg(t, a, a + 0.5)), sand = ioC(seg(t, tVa - 0.2, tPr + 0.2)), n = sand * 10;
  hourglass(300, 920, 420, 240, sand, kIn);
  /* dal fondo della clessidra il valore va nella colonna */
  if (sand > 0 && sand < 1) for (let j = 0; j < 4; j++) { const u = ((t - tVa) * 1.1 + j / 4) % 1, px = lerp(450, 650, u), py = 1060 - Math.sin(Math.PI * u) * 80;
    glow(px, py, 26, '200,250,114', 0.3); x.fillStyle = C.lime; x.beginPath(); x.arc(px, py, 7, 0, 7); x.fill(); }
  for (let i = 0; i < 10; i++) { const ki = clamp(n - i); if (ki <= 0) continue; const y = 1150 - (i + 1) * 42 - (1 - oC(ki)) * 70;
    x.save(); x.globalAlpha = clamp(ki * 2); x.fillStyle = 'rgba(200,250,114,0.85)'; rr(670, y, 220, 36, 8); x.fill(); x.fillStyle = 'rgba(255,255,255,0.25)'; x.fillRect(676, y + 3, 208, 3); x.restore(); }
  x.save(); x.globalAlpha = kIn; x.strokeStyle = 'rgba(241,244,238,0.4)'; x.lineWidth = 3; x.beginPath(); x.moveTo(640, 1152); x.lineTo(920, 1152); x.stroke(); x.restore();
  lab('ORE DI LAVORO', 300, 1205, kIn, C.ink, 26);
  lab('VALORE PRODOTTO', 780, 1205, oC(seg(t, tVa, tVa + 0.4)), C.lime, 26);
  glassPill(540, 1320, 'cioè la produttività', oC(seg(t, tPr - 0.15, tPr + 0.3)), C.lime, 40);
  x.restore(); finish(t); }

/* ================= PANIFICIO (mano, impastatrice): bancone, bilancia con contatore, orologio dell'ora ================= */
const BK = { bench: 1160, bowl: 790, disp: 915, clk: [790, 705] };
function bench(k) { if (k <= 0) return; x.save(); x.globalAlpha *= clamp(k); x.fillStyle = '#1a120a'; x.fillRect(176, BK.bench + 40, 24, 150); x.fillRect(880, BK.bench + 40, 24, 150);
  const g = x.createLinearGradient(0, BK.bench, 0, BK.bench + 40); g.addColorStop(0, '#4a3520'); g.addColorStop(1, '#1f160d'); x.fillStyle = g; rr(130, BK.bench, 820, 40, 10); x.fill();
  x.fillStyle = 'rgba(245,165,36,0.4)'; x.fillRect(140, BK.bench, 800, 3); x.restore(); }
function doughBlob(cx, rx, ry, sq, k) { if (k <= 0) return; const w = rx * (1 + 0.08 * sq), h = ry * (1 - 0.16 * sq), cy = BK.bench - h;
  x.save(); x.globalAlpha *= clamp(k); const g = x.createRadialGradient(cx - w * 0.3, cy - h * 0.5, 4, cx, cy, w); g.addColorStop(0, '#f6ecd6'); g.addColorStop(1, '#c4ab80');
  x.fillStyle = g; x.beginPath(); x.ellipse(cx, cy, w, h, 0, Math.PI, 0); x.lineTo(cx + w, BK.bench); x.lineTo(cx - w, BK.bench); x.closePath(); x.fill(); x.restore(); return BK.bench - 2 * h; }
function mitt(cx, cy, flip, k) { if (k <= 0) return; x.save(); x.globalAlpha *= clamp(k); x.fillStyle = '#2b322e'; x.strokeStyle = 'rgba(241,244,238,0.75)'; x.lineWidth = 4; x.lineJoin = 'round';
  /* avambraccio che sale verso l'esterno, palmo appoggiato sulla pasta, dita verso il centro (mano stilizzata, nessuna persona) */
  x.save(); x.translate(cx - flip * 20, cy - 20); x.rotate(flip * 0.55); rr(-26, -150, 52, 140, 22); x.fill(); x.stroke(); x.restore();
  rr(cx - 62, cy - 46, 124, 48, 24); x.fill(); x.stroke();
  x.strokeStyle = 'rgba(241,244,238,0.45)'; x.lineWidth = 3; x.lineCap = 'round';
  for (let j = 0; j < 3; j++) { const fx = cx + flip * (30 + j * 10); x.beginPath(); x.moveTo(fx, cy - 40); x.lineTo(fx, cy - 14); x.stroke(); }
  x.restore(); }
function scale(t, kg, k, ghost = 0) { if (k <= 0) return; const cx = BK.bowl; x.save(); x.globalAlpha *= clamp(k);
  x.fillStyle = metal(cx - 110, 0, cx + 110, 0, true); rr(cx - 8, 995, 16, 100, 4); x.fill();
  /* mucchio di pasta: altezza in scala, 1,9 px per kg */
  const h = kg * 1.9; if (h > 0.5) { const g = x.createRadialGradient(cx - 30, 1092 - h * 0.6, 4, cx, 1092, 100); g.addColorStop(0, '#f6ecd6'); g.addColorStop(1, '#c4ab80'); x.fillStyle = g; x.beginPath(); x.ellipse(cx, 1092, 64 + kg * 0.7, h, 0, Math.PI, 0); x.closePath(); x.fill(); }
  if (ghost > 0) { x.save(); x.globalAlpha *= ghost; x.strokeStyle = C.amber; x.lineWidth = 3; x.setLineDash([7, 6]); x.beginPath(); x.ellipse(cx, 1092, 64 + 20 * 0.7, 20 * 1.9, 0, Math.PI, 0); x.stroke(); x.restore(); }
  x.fillStyle = metal(cx - 110, 0, cx + 110, 0); x.beginPath(); x.moveTo(cx - 108, 1092); x.quadraticCurveTo(cx, 1150, cx + 108, 1092); x.closePath(); x.fill();
  x.fillStyle = metal(cx - 110, 0, cx + 110, 0, true); rr(cx - 110, 1124, 220, 36, 10); x.fill(); x.strokeStyle = 'rgba(241,244,238,0.25)'; x.lineWidth = 2; rr(cx - 110, 1124, 220, 36, 10); x.stroke();
  x.restore(); }
function display(t, kg, col, k, tick) { if (k <= 0) return; const cx = BK.bowl, cy = BK.disp; glass(cx, cy, 280, 160, 26, k);
  x.save(); x.globalAlpha *= clamp(k); const s = 1 + 0.06 * Math.sin(Math.PI * clamp(tick)); x.translate(820, cy - 20); x.scale(s, s);

  prodChart(t, { pIt: 1, sIt: ioC(seg(t, tTo - 0.2, tSc + 0.3)), l1: 1, l2: oC(seg(t, tCi, tCi + 0.4)), g1: 1, g2: oC(seg(t, tSt - 0.1, tSt + 0.3)), hotIt: 1 });
  x.restore(); finish(t); }
function sGermania(t, a, b) { bg(); x.save();
  const tGe = WT('germania', 'germania', 1, 0.5), tPr = WT('germania', 'produttivita', 1, 1.0), tSt = WT('germania', 'stipendio', 1, 1.9), tCi = WT('germania', 'circa', 1, 3.5);
  phrase(t, a - 10, [['Stipendio reale:', C.amber]], 345, { size: 92, out: tGe - 0.4 });
  phrase(t, a - 10, [['circa −3%.', C.amber]], Y2, { size: 92, out: tGe - 0.4 });
  phrase(t, tGe - 0.1, [['In Germania', C.ink]], 345, { size: 92 });

  PC.t0 = -10; const kDe = oC(seg(t, tGe - 0.3, tGe + 0.2));
  prodChart(t, { kIt: lerp(1, 0.7, kDe), pIt: 1, sIt: 1, l1: lerp(1, 0.75, kDe), l2: lerp(1, 0.75, kDe), kDe, pDe: ioC(seg(t, tPr - 0.15, tPr + 0.9)), sDe: ioC(seg(t, tSt - 0.15, tSt + 0.9)),
    lD: oC(seg(t, tCi, tCi + 0.4)), g1: 1, g2: 1, hotDe: kDe });
  ring(PC.de[1], pcy(PC.deP), 10, t, tCi + 0.05, '200,250,114', 0.7, 40);
  x.restore(); finish(t); }

/* ================= BANCA D'ITALIA: due corsie, produttività e salari fermi quasi alla partenza, allineati ================= */
function miniGlass(cx, cy, col) { x.save(); x.strokeStyle = col; x.lineWidth = 4; x.lineJoin = 'round'; x.beginPath(); x.moveTo(cx - 13, cy - 17); x.lineTo(cx + 13, cy - 17); x.lineTo(cx - 13, cy + 17); x.lineTo(cx + 13, cy + 17); x.closePath(); x.stroke(); x.restore(); }
function miniEnv(cx, cy, col) { x.save(); x.strokeStyle = col; x.lineWidth = 4; x.lineJoin = 'round'; rr(cx - 19, cy - 13, 38, 26, 4); x.stroke(); x.beginPath(); x.moveTo(cx - 17, cy - 11); x.lineTo(cx, cy + 2); x.lineTo(cx + 17, cy - 11); x.stroke(); x.restore(); }
function lane(y, name, col, rgb, px, k, ico, shake) { if (k <= 0) return; x.save(); x.globalAlpha *= clamp(k);
  x.fillStyle = 'rgba(241,244,238,0.12)'; rr(170, y - 8, 760, 16, 8); x.fill();
  for (let i = 1; i < 10; i++) { x.fillStyle = 'rgba(241,244,238,0.25)'; x.fillRect(170 + i * 76 - 1, y - 16, 2, 32); }
  x.fillStyle = `rgba(${rgb},0.85)`; rr(170, y - 8, Math.max(16, px - 170), 16, 8); x.fill(); x.restore();
  lab(name, 930, y - 62, k, col, 28, { align: 'right', ls: 3 });
  const sx = px + Math.sin(shake * 40) * 3 * Math.sin(Math.PI * clamp(shake)); glow(sx, y, 120, rgb, 0.3 * k); glass(sx, y, 96, 96, 48, k);
  x.save(); x.globalAlpha *= clamp(k); x.translate(sx, y); x.scale(1.3, 1.3); ico(0, 0, col); x.restore(); }
function sBanca(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.03);
  const tSa = WT('bancaditalia', 'salari', 1, 1.3), tIn = WT('bancaditalia', 'indietro', 1, 2.4), tLi = WT('bancaditalia', 'linea', 1, 3.0), tPr = WT('bancaditalia', 'produttivita', 1, 4.6);
  phrase(t, a + 0.05, [['Per la Banca d’Italia:', C.muted]], 345, { size: 70 });
  phrase(t, tSa - 0.1, [['salari indietro,', C.amber]], 345 + 70 * 1.12 + 10, { size: 84 });
  phrase(t, tPr - 0.3, [['produttività ferma.', C.lime]], 345 + 70 * 1.12 + 10 + 84 * 1.12, { size: 84 });
  const kL = oC(seg(t, a + 0.2, a + 0.6)), mv = ioC(seg(t, tSa - 0.2, tIn + 0.2)), px = lerp(220, 300, mv), sh = seg(t, tIn + 0.2, tIn + 0.9);
  lane(850, 'PRODUTTIVITÀ', C.lime, '200,250,114', px, kL, miniGlass, sh);
  lane(1070, 'SALARI', C.amber, '245,165,36', px, kL, miniEnv, sh);
  const kA = oC(seg(t, tLi - 0.15, tLi + 0.3)); if (kA > 0) { dashLine(px, 850 + 58, px, 850 + 58 + (1070 - 850 - 116) * kA, 'rgba(241,244,238,0.85)', 3, [6, 7], 1);
    lab('IN LINEA', px + 34, 960, kA, C.ink, 28, { align: 'left', ls: 3 }); }
  x.restore(); finish(t); }

/* ================= CASA: l'ora sale nel tempo e la busta paga le va dietro, con un po' di ritardo ================= */
const CB = [[190, 1090], [520, 1100], [640, 730], [880, 700]];
const cbz = (u, dy = 0) => { const m = 1 - u; return [0, 1].map((j) => m * m * m * CB[0][j] + 3 * m * m * u * CB[1][j] + 3 * m * u * u * CB[2][j] + u * u * u * CB[3][j] + (j ? dy : 0)); };
function trail(u, dy, col, dash, w = 5) { if (u <= 0) return; x.save(); x.strokeStyle = col; x.lineWidth = w; x.lineCap = 'round'; if (dash) x.setLineDash(dash); x.beginPath();
  for (let i = 0; i <= 60; i++) { const q = cbz(u * i / 60, dy); i ? x.lineTo(...q) : x.moveTo(...q); } x.stroke(); x.restore(); }
function sCasa(t, a, b) { bg('30,44,26'); x.save();
  const tTe = WT('casa', 'tempo', 1, 1.9), tSt = WT('casa', 'stipendio', 1, 2.9), tSe = WT('casa', 'segue', 1, 3.6), tVa = WT('casa', 'vale', 1, 4.4);
  phrase(t, a + 0.05, [['Cosa ti porti a casa?', C.muted]], 345, { size: 70, out: tSt - 0.4 });
  phrase(t, tSt - 0.1, [['Lo stipendio segue', C.ink]], 345, { size: 92 });
  phrase(t, tVa - 0.15, [['quanto vale un’ora.', C.lime]], Y2, { size: 92 });
  const kIn = oC(seg(t, a + 0.2, a + 0.7)), u1 = ioC(seg(t, tTe - 0.2, tVa + 1.0)), u2 = ioC(seg(t, tSe - 0.3, tVa + 1.6)), DY = 110;
  trail(u1, 0, 'rgba(200,250,114,0.85)', null, 6); trail(u2, DY, 'rgba(245,165,36,0.85)', [14, 10], 6);
  const p1 = cbz(u1), p2 = cbz(u2, DY);
  glow(...p1, 120, '200,250,114', 0.25 * kIn); glass(...p1, 92, 92, 46, kIn);
  x.save(); x.globalAlpha = kIn; const an = t * 3; x.strokeStyle = C.lime; x.lineWidth = 5; x.lineCap = 'round'; x.beginPath(); x.moveTo(...p1); x.lineTo(p1[0] + Math.cos(an) * 26, p1[1] + Math.sin(an) * 26); x.moveTo(...p1); x.lineTo(p1[0], p1[1] - 18); x.stroke(); x.restore();
  glow(...p2, 110, '245,165,36', 0.22 * kIn); glass(...p2, 110, 74, 14, kIn); x.save(); x.globalAlpha = kIn; x.scale(1, 1); miniEnv(p2[0], p2[1], C.amber); x.restore();
  const lg = (y, col, dash, txt0, k) => { if (k <= 0) return; x.save(); x.globalAlpha *= k; x.strokeStyle = col; x.lineWidth = 6; x.lineCap = 'round'; if (dash) x.setLineDash([14, 10]); x.beginPath(); x.moveTo(330, y); x.lineTo(390, y); x.stroke(); x.restore(); lab(txt0, 412, y, k, C.ink, 24, { align: 'left' }); };
  lg(1300, C.lime, false, 'QUANTO VALE UN’ORA', kIn); lg(1345, C.amber, true, 'STIPENDIO', oC(seg(t, tSe - 0.3, tSe + 0.1)));
  mono('NEL TEMPO · IN GENERE', 540, 1415, t, tTe - 0.1, { size: 24, color: C.ink });
  x.restore(); finish(t); }

serie({ hook: sHook, ore: sOre, def: sDef, mano: sMano, impastatrice: sImpasta, dividere: sDividere, conti: sConti,
  ferma: sFerma, sceso: sSceso, germania: sGermania, bancaditalia: sBanca, casa: sCasa }, ORDER, ['hook', 'def', 'ferma', 'casa']);
