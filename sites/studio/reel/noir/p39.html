<script>const P = { EP: 39, DAY: 3, CAP: 1, NEXT: ['Le rate dei mutui', 'nel 2022–2023'] };</script>

<script>
/* PROVA SETTIMANA 8: la scena d'apertura (hook) RISPETTA la regola: dal primo fotogramma due torri di mattoncini (a sinistra la base cambia altezza a scatti ogni 0,4 s, a destra oscilla finche' un lucchetto si chiude sulla parola «firma» e resta ferma), con lo stesso blocco ambra «MARGINE» in cima; nessun numero, nessun contatore; il titolo entra sulla parola «tasso» (circa 3 s). */
/* Puntata 39 — «Euribor e IRS» (giovedi 26/11/2026, lezione 4 di 5, capitolo 2). Numeri SOLO da p39-fonti.md (sezioni A e B):
   20 banche (EMMI) · Euribor a 3 mesi, media mensile sotto zero per 42 mesi fino a giugno 2022 · «quasi 4 %» (nov 2023: 3,9716) · «circa 2,6 %» (ott 2026, media mensile: 2,6347).
   Per l'IRS NESSUN numero (solo il contratto di scambio). Nessuna previsione: la linea si ferma a ottobre. Niente riga di fonte nel video. Nessun nome di banca ne' simbolo ®.
   Palette: lime = variabile / Euribor · bianco = fisso / IRS · ambra = margine (spread) · rosso = sotto zero. Dove il fondo e' lime o ambra il testo e' #0B0D0C. */
const LIME = '200,250,114', RED = '255,90,78', AMB = '245,165,36', INK = '241,244,238', DK = '#0B0D0C';
const ORDER = ['num', 'hook', 'somma', 'euribor', 'ente', 'sottozero', 'salita', 'irs', 'fissi', 'bce', 'casa', 'fine', 'cta', 'end'];
const Y2 = 345 + 92 * 1.12; /* seconda riga del titolo a size 92 */

/* WA: secondo in cui la voce dice la n-esima parola che inizia con UNA delle alternative (lettere E cifre: Whisper scrive «42», «20», «3», «2 ,6»).
   Senza voce (anteprima) usa la frazione f della scena. Ogni aggancio e' registrato in window.ANCH per il controllo sui cues veri. */
const WA = (k, ws, n = 1, f = 0.5) => { (window.ANCH = window.ANCH || {})[k + '|' + ws.join('/') + '|' + n] = [k, ws, n];
  const L = ((window.WORDS || {})[k]) || [];
  for (const w of ws) { let c = 0; for (const [p, t] of L) if (_nw(p).startsWith(_nw(w)) && ++c === n) return t; }
  return S(k) + f * Math.max(1, E(k) - S(k)); };
const lab = (t, s, px, py, a0, o = {}) => txt(s, px, py, { fam: 'mono', size: 26, weight: 600, color: C.muted, ls: 2, alpha: oC(seg(t, a0, a0 + 0.35)), ...o });
/* etichetta che entra subito attenuata (dim) e si accende sulla parola tL */
const labd = (t, s, px, py, aIn, tL, o = {}) => { const { dim = 0.4, ...r } = o; txt(s, px, py, { fam: 'mono', size: 26, weight: 600, color: C.muted, ls: 2, ...r, alpha: oC(seg(t, aIn, aIn + 0.35)) * lerp(dim, 1, oC(seg(t, tL - 0.1, tL + 0.3))) }); };
function pop(cx, cy, k, fn) { if (k <= 0) return; x.save(); x.globalAlpha *= clamp(k); const s = clamp(k, 0, 1.15); x.translate(cx, cy); x.scale(s, s); x.translate(-cx, -cy); fn(); x.restore(); }
function dash(x0, y0, x1, y1, col, w = 3, d = [10, 10], a = 1) { if (a <= 0) return; x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.lineWidth = w; x.setLineDash(d); x.lineCap = 'round'; x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); x.restore(); }
const hs = (i) => { const v = Math.sin(i * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
const bez = (p0, c1, c2, p1, u) => { const v = 1 - u; return [v * v * v * p0[0] + 3 * v * v * u * c1[0] + 3 * v * u * u * c2[0] + u * u * u * p1[0], v * v * v * p0[1] + 3 * v * v * u * c1[1] + 3 * v * u * u * c2[1] + u * u * u * p1[1]]; };
const qpt = (p0, c, p1, u) => [(1 - u) * (1 - u) * p0[0] + 2 * (1 - u) * u * c[0] + u * u * p1[0], (1 - u) * (1 - u) * p0[1] + 2 * (1 - u) * u * c[1] + u * u * p1[1]];
function pillAt(t, s, cx, cy, t0, col, size = 34) { const k = seg(t, t0, t0 + 0.45); if (k > 0) glassPill(cx, cy, s, k, col, size); }

/* ---- icone disegnate a mano ---- */
function bankI(cx, cy, s, col, a = 1) { x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.lineWidth = 4; x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath(); x.moveTo(cx - s * 0.55, cy - s * 0.12); x.lineTo(cx, cy - s * 0.52); x.lineTo(cx + s * 0.55, cy - s * 0.12); x.closePath(); x.stroke();
  for (const dx of [-0.34, 0, 0.34]) { x.beginPath(); x.moveTo(cx + dx * s, cy - s * 0.02); x.lineTo(cx + dx * s, cy + s * 0.28); x.stroke(); }
  x.beginPath(); x.moveTo(cx - s * 0.55, cy + s * 0.42); x.lineTo(cx + s * 0.55, cy + s * 0.42); x.stroke(); x.restore(); }
/* lucchetto: k 0 = aperto (archetto sollevato e girato), 1 = chiuso */
function lockI(cx, cy, s, col, k, a = 1) { x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.lineWidth = 6; x.lineCap = 'round'; x.lineJoin = 'round';
  const lift = (1 - clamp(k)) * s * 0.42, r = s * 0.36;
  x.beginPath(); x.moveTo(cx - r, cy - s * 0.08 - (k < 0.5 ? lift * 0.4 : 0)); x.lineTo(cx - r, cy - s * 0.32 - lift); x.arc(cx, cy - s * 0.32 - lift, r, Math.PI, 0); x.lineTo(cx + r, cy - s * 0.08 - lift * (k < 0.5 ? 1 : 0)); x.stroke();
  rr(cx - s * 0.55, cy - s * 0.1, s * 1.1, s * 0.85, 10); x.fillStyle = 'rgba(5,6,7,0.8)'; x.fill(); x.stroke();
  x.fillStyle = col; x.beginPath(); x.arc(cx, cy + s * 0.28, s * 0.11, 0, 7); x.fill(); x.restore(); }

/* ---- torre: base di mattoncini (nb mattoncini, anche frazionario) + blocco ambra «MARGINE» in cima ---- */
function stepV(t, seed, lo, span, rate = 2.4) { const u = t * rate, i = Math.floor(u), f = u - i, v = (j) => lo + Math.floor(hs(j + seed) * span); return lerp(v(i - 1), v(i), oC(seg(f, 0, 0.3))); }
function tower(cx, bottom, w, nb, col, rgb, o = {}) { const { brick = 64, glowK = 0 } = o, h = nb * brick, top = bottom - h;
  if (glowK > 0) glow(cx, bottom - h / 2, 260, rgb, 0.18 * glowK);
  const g = x.createLinearGradient(0, top, 0, bottom); g.addColorStop(0, `rgba(${rgb},0.34)`); g.addColorStop(1, `rgba(${rgb},0.10)`);
  x.fillStyle = g; rr(cx - w / 2, top, w, h, 10); x.fill(); x.strokeStyle = col; x.lineWidth = 3; x.stroke();
  x.save(); x.strokeStyle = `rgba(${rgb},0.5)`; x.lineWidth = 2; for (let y = bottom - brick; y > top + 4; y -= brick) { x.beginPath(); x.moveTo(cx - w / 2 + 6, y); x.lineTo(cx + w / 2 - 6, y); x.stroke(); } x.restore();
  const bh = 96, by = top - bh - 4; glow(cx, by + bh / 2, 170, AMB, 0.22);
  x.fillStyle = C.amber; rr(cx - w / 2 - 10, by, w + 20, bh, 16); x.fill();
  txt('MARGINE', cx, by + bh / 2 + 1, { fam: 'mono', size: 30, weight: 700, color: DK, ls: 3 }); return top; }
/* sale dal basso (scala dal piede) */
function rise(cx, by, k, fn) { if (k <= 0) return; x.save(); x.globalAlpha *= clamp(k * 1.6); const s = lerp(0.88, 1, clamp(k, 0, 1.08)); x.translate(cx, by); x.scale(s, s); x.translate(-cx, -by); fn(); x.restore(); }

/* ================= HOOK: due torri, stesso blocco «margine»; la base di sinistra scatta ogni giorno, quella di destra si ferma dopo la firma ================= */
function sHook(t, a, b) { bg('42,50,45', 0.6); x.save(); zoom(t, a, b, 1.04);
  const tTas = WA('hook', ['tasso'], 1, 0.36), tGio = WA('hook', ['giorno'], 1, 0.56), tFir = WA('hook', ['firma'], 1, 0.86);
  phrase(t, Math.max(tTas - 0.1, a + 0.4), [['Stesso margine,', C.ink], ['base diversa', C.lime]], 345, { size: 92 });
  const BOT = 1330, TW = 280, k1 = oB(seg(t, a, a + 0.55)), k2 = oB(seg(t, a + 0.1, a + 0.65)), kg = oC(seg(t, a + 0.1, a + 0.6));
  dash(100, BOT + 6, 980, BOT + 6, 'rgba(241,244,238,0.35)', 3, [2, 12], kg);
  const nbL = stepV(t, 3, 3, 5), kF = oC(seg(t, tFir - 0.05, tFir + 0.3)), nbR = lerp(stepV(t, 31, 4, 3), 5, kF), kL = oC(seg(t, tFir - 0.05, tFir + 0.35));
  rise(300, BOT, k1, () => { tower(300, BOT, TW, nbL, C.lime, LIME, { glowK: 0.7 }); });
  rise(780, BOT, k2, () => { tower(780, BOT, TW, nbR, C.ink, INK, { glowK: kF }); lockI(780, BOT - 32, 44, kL > 0.5 ? C.ink : 'rgba(241,244,238,0.6)', kL, 0.95); });
  if (kL > 0 && kL < 1) { x.save(); x.strokeStyle = `rgba(241,244,238,${0.6 * (1 - kL)})`; x.lineWidth = 4; x.beginPath(); x.arc(780, BOT - 32, 40 + 60 * kL, 0, 7); x.stroke(); x.restore(); }
  labd(t, 'CAMBIA OGNI GIORNO', 300, 1395, a + 0.6, tGio, { color: C.lime, size: 28, dim: 0.0 });
  labd(t, 'FERMO DOPO LA FIRMA', 780, 1395, a + 0.6, tFir, { color: C.ink, size: 28, dim: 0.0 });
  x.restore(); finish(t); }

/* ================= SOMMA: due pezzi (base + margine) cadono nella barra «tasso del variabile» ================= */
function sSomma(t, a, b) { bg('30,40,46', 0.7); x.save(); zoom(t, a, b, 1.04);
  const tBan = WA('somma', ['banca', 'banc'], 1, 0.09), tSom = WA('somma', ['somma', 'somm'], 1, 0.43), tBas = WA('somma', ['base'], 1, 0.65), tMar = WA('somma', ['margine', 'margin'], 1, 0.8), tSpr = WA('somma', ['spread', 'sprea'], 1, 0.95), tVar = WA('somma', ['variabile', 'variabil'], 1, 0.26);
  phrase(t, a + 0.05, [['Il tasso è', C.ink], ['una somma', C.lime]], 345, { size: 92 });
  pillAt(t, 'BANCA D’ITALIA', 540, 625, Math.min(tBan - 0.1, a + 0.3), C.ink, 32);
  /* i due pezzi in alto: bozza tratteggiata subito, si accendono sulla parola */
  const KG = oC(seg(t, a + 0.25, a + 0.8));
  const piece = (cx, w, name, tw0, col) => { const kf = oC(seg(t, tw0 - 0.1, tw0 + 0.4)), bump = 1 + 0.07 * Math.sin(Math.PI * kf);
    x.save(); x.translate(cx, 810); x.scale(bump, bump); x.translate(-cx, -810);
    x.save(); x.globalAlpha *= KG * (1 - kf); x.strokeStyle = col; x.lineWidth = 4; x.setLineDash([10, 10]); rr(cx - w / 2, 750, w, 120, 18); x.stroke(); x.restore();
    if (kf > 0) { x.save(); x.globalAlpha *= kf; glow(cx, 810, 200, col === C.lime ? LIME : AMB, 0.25); x.fillStyle = col; rr(cx - w / 2, 750, w, 120, 18); x.fill(); x.restore(); }
    txt(name, cx, 811, { fam: 'mono', size: 32, weight: 700, color: kf > 0.5 ? DK : col, ls: 3, alpha: KG }); x.restore(); };
  piece(280, 340, 'BASE', tBas, C.lime); piece(800, 340, 'MARGINE', tMar, C.amber);
  const kp = oB(seg(t, tSom - 0.1, tSom + 0.4)); txt('+', 540, 806, { size: 100, weight: 800, color: C.ink, alpha: 0.35 * KG + 0.65 * clamp(kp) });
  txt('=', 540, 955, { size: 100, weight: 800, color: C.ink, alpha: 0.35 * KG + 0.65 * clamp(kp) });
  /* la barra del tasso: bozza subito; i pezzi ci scendono sopra */
  const BY = 1090, BH = 130, BX = 100, BW = 880, LW = 540;
  x.save(); x.globalAlpha *= KG; x.strokeStyle = 'rgba(241,244,238,0.45)'; x.lineWidth = 4; x.setLineDash([10, 10]); rr(BX, BY - BH / 2, BW, BH, 22); x.stroke(); x.restore();
  const fly = (t0, from, to, col, rgb) => { const k = ioC(seg(t, t0 - 0.05, t0 + 0.75)); if (k <= 0) return; const r = (i) => lerp(from[i], to[i], k);
    x.save(); glow(r(0), r(1), 180, rgb, 0.22 * Math.sin(Math.PI * k)); x.fillStyle = col; rr(r(0) - r(2) / 2, r(1) - r(3) / 2, r(2), r(3), lerp(18, 22, k)); x.fill(); x.restore(); };
  fly(tBas, [280, 810, 340, 120], [BX + LW / 2, BY, LW - 4, BH], C.lime, LIME); fly(tMar, [800, 810, 340, 120], [BX + LW + (BW - LW) / 2 + 2, BY, BW - LW - 4, BH], C.amber, AMB);
  const kT = oC(seg(t, tMar + 0.3, tMar + 0.8)); lab(t, 'TASSO DEL VARIABILE', 540, 1200, a + 0.4, { color: C.ink, size: 28, ls: 3, alpha: oC(seg(t, a + 0.4, a + 0.75)) * (0.45 + 0.55 * oC(seg(t, tVar - 0.1, tVar + 0.3))) * (1 + 0 * kT) });
  pillAt(t, 'SPREAD = MARGINE DELLA BANCA', 540, 1320, tSpr - 0.1, C.amber, 34);
  x.restore(); finish(t); }

/* ================= EURIBOR: una vasca di denaro, il livello e' il «costo»; l'indicatore lo misura; cinque grandi banche ne prendono ================= */
function sEuribor(t, a, b) { bg('34,40,30', 0.6); x.save(); zoom(t, a, b, 1.03);
  const tSol = WA('euribor', ['solito', 'solit'], 1, 0.05), tMis = WA('euribor', ['misura', 'misur'], 1, 0.5), tCos = WA('euribor', ['costo', 'cost'], 1, 0.64), tBan = WA('euribor', ['banche', 'banch'], 1, 0.77), tPro = WA('euribor', ['procurarsi', 'procur'], 1, 0.9);
  phrase(t, a + 0.05, [['EURIBOR', C.lime], ['base dei variabili', C.ink]], 345, { size: 92 });
  lab(t, 'DI SOLITO', 540, 580, Math.min(tSol - 0.1, a + 0.3), { color: C.amber, size: 28, ls: 4 });
  const CX = 540, TW = 340, TT = 680, TH = 520, TB = TT + TH, kT = oB(seg(t, a + 0.2, a + 0.8));
  const lvl = 0.55 + 0.07 * Math.sin(t * 1.3) + 0.03 * Math.sin(t * 3.1 + 1), ySurf = TB - 12 - lvl * (TH - 30);
  pop(CX, 940, kT, () => {
    x.save(); rr(CX - TW / 2 + 8, TT + 8, TW - 16, TH - 16, 30); x.clip();
    const g = x.createLinearGradient(0, ySurf, 0, TB); g.addColorStop(0, 'rgba(200,250,114,0.62)'); g.addColorStop(1, 'rgba(200,250,114,0.18)'); x.fillStyle = g;
    x.beginPath(); x.moveTo(CX - TW / 2, TB); for (let i = 0; i <= 34; i++) { const px = CX - TW / 2 + i * (TW / 34); x.lineTo(px, ySurf + Math.sin(i * 0.6 + t * 3.2) * 7); } x.lineTo(CX + TW / 2, TB); x.closePath(); x.fill();
    x.strokeStyle = C.lime; x.lineWidth = 4; x.beginPath(); for (let i = 0; i <= 34; i++) { const px = CX - TW / 2 + i * (TW / 34), py = ySurf + Math.sin(i * 0.6 + t * 3.2) * 7; i ? x.lineTo(px, py) : x.moveTo(px, py); } x.stroke(); x.restore();
    glass(CX, 940, TW, TH, 36, 1); });
  /* tacche della scala + indicatore (si accende su «misura») */
  const kS = oC(seg(t, a + 0.4, a + 0.9));
  for (let i = 0; i < 9; i++) dash(CX + TW / 2 + 6, TT + 40 + i * 55, CX + TW / 2 + 26, TT + 40 + i * 55, 'rgba(241,244,238,0.5)', 3, [], kS);
  const kM = oC(seg(t, tMis - 0.1, tMis + 0.4));
  dash(CX + TW / 2 + 6, ySurf, 770, ySurf, C.lime, 4, [3, 9], 0.35 + 0.65 * kM);
  x.save(); x.globalAlpha *= 0.35 + 0.65 * kM; glow(770, ySurf, 50, LIME, 0.5 * kM); x.fillStyle = C.lime; x.beginPath(); x.arc(770, ySurf, 10, 0, 7); x.fill(); x.restore();
  txt('EURIBOR', 790, ySurf, { fam: 'mono', size: 30, weight: 700, color: C.lime, ls: 2, align: 'left', alpha: oC(seg(t, a + 0.5, a + 0.85)) * (0.4 + 0.6 * kM) });
  /* cinque banche: contorni subito, si accendono sulla parola «banche», il denaro scorre su «procurarsi» */
  const BX = [170, 355, 540, 725, 910], BYb = 1350, kB = oC(seg(t, a + 0.3, a + 0.9));
  BX.forEach((bx, i) => { const kL = oB(seg(t, tBan - 0.05 + i * 0.09, tBan + 0.4 + i * 0.09)), q = clamp(kL);
    x.save(); x.globalAlpha *= kB * (0.35 + 0.65 * q); x.translate(bx, BYb); const sc = 1 + 0.12 * Math.sin(Math.PI * clamp(kL)); x.scale(sc, sc); x.translate(-bx, -BYb);
    if (q > 0.5) glow(bx, BYb, 70, LIME, 0.25); bankI(bx, BYb, 92, q > 0.5 ? C.lime : 'rgba(241,244,238,0.7)'); x.restore();
    const P0 = [CX + (bx - CX) * 0.25, TB + 6], C1 = [bx, TB + 40], P1 = [bx, BYb - 62], kd = oC(seg(t, a + 0.5 + i * 0.05, a + 1.1 + i * 0.05));
    x.save(); x.globalAlpha *= kd * 0.5; x.strokeStyle = 'rgba(241,244,238,0.6)'; x.lineWidth = 3; x.setLineDash([2, 9]); x.beginPath(); x.moveTo(...P0); for (let j = 1; j <= 20; j++) x.lineTo(...qpt(P0, C1, P1, j / 20)); x.stroke(); x.restore();
    const kf = seg(t, tPro - 0.1, tPro + 0.3); if (kf > 0) for (let c = 0; c < 2; c++) { const u = ((t - tPro) * 0.55 + c * 0.5 + i * 0.13) % 1; if (u < 0) continue; const [px, py] = qpt(P0, C1, P1, u); x.save(); x.globalAlpha *= clamp(kf); glow(px, py, 26, LIME, 0.4); x.fillStyle = C.lime; x.beginPath(); x.arc(px, py, 9, 0, 7); x.fill(); x.restore(); } });
  labd(t, 'GRANDI BANCHE EUROPEE', 540, 1430, a + 0.5, tBan, { color: C.ink, size: 26 });
  x.restore(); finish(t); }

/* ================= ENTE: cinque giorni si accendono (ogni giorno), venti banche si accendono (20) ================= */
function sEnte(t, a, b) { bg('30,44,34', 0.7); x.save(); zoom(t, a, b, 1.04);
  const tCal = WA('ente', ['calcola', 'calcol'], 1, 0.27), tGio = WA('ente', ['giorno', 'giorn'], 1, 0.58), tVen = WA('ente', ['venti', '20', 'vent'], 1, 0.85);
  phrase(t, a + 0.05, [['Lo calcola', C.ink], ['un ente', C.lime]], 345, { size: 92 });
  /* griglia di 20 chip: bozza subito, si accendono a ondate su «venti» */
  const kG = oC(seg(t, a + 0.25, a + 0.85));
  for (let i = 0; i < 20; i++) { const c = i % 5, r = Math.floor(i / 5), cx = 200 + c * 170, cy = 610 + r * 90, kl = oB(seg(t, tVen - 0.15 + (c + r) * 0.05, tVen + 0.3 + (c + r) * 0.05)), q = clamp(kl);
    x.save(); x.globalAlpha *= kG; x.translate(cx, cy); const sc = lerp(0.8, 1, oC(seg(t, a + 0.25 + i * 0.012, a + 0.6 + i * 0.012))) * (1 + 0.1 * Math.sin(Math.PI * q)); x.scale(sc, sc);
    x.fillStyle = `rgba(${LIME},${0.04 + 0.18 * q})`; rr(-60, -37, 120, 74, 16); x.fill(); x.strokeStyle = q > 0.5 ? C.lime : 'rgba(241,244,238,0.4)'; x.lineWidth = 3; if (q <= 0.5) x.setLineDash([8, 8]); rr(-60, -37, 120, 74, 16); x.stroke(); x.setLineDash([]);
    bankI(0, 2, 56, q > 0.5 ? C.lime : 'rgba(241,244,238,0.5)'); x.restore(); }
  const kV = oB(seg(t, tVen - 0.1, tVen + 0.4)); if (kV > 0) pop(540, 965, kV, () => txt('20 BANCHE', 540, 965, { fam: 'mono', size: 32, weight: 700, color: C.lime, ls: 4 }));
  /* l'ente: scatola di vetro con il bagliore che pulsa quando le banche sono accese */
  const kE = oB(seg(t, a + 0.3, a + 0.9)); pop(540, 1085, kE, () => { glow(540, 1085, 340, LIME, 0.18 * oC(seg(t, tVen, tVen + 0.6))); glass(540, 1085, 600, 110, 30, 1); txt('L’ENTE CHE LO CALCOLA', 540, 1086, { fam: 'mono', size: 28, weight: 700, color: C.ink, ls: 3 }); });
  /* cinque giorni: bozza subito, si spuntano a catena su «giorno» (e poi ripassano) */
  for (let i = 0; i < 5; i++) { const cx = 190 + i * 175, kb = oB(seg(t, a + 0.35 + i * 0.07, a + 0.85 + i * 0.07)), kt = oB(seg(t, tGio - 0.05 + i * 0.16, tGio + 0.35 + i * 0.16)), q = clamp(kt); if (kb <= 0) continue;
    x.save(); x.translate(cx, 1260); x.scale(clamp(kb, 0, 1.1), clamp(kb, 0, 1.1)); x.globalAlpha *= clamp(kb);
