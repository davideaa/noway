<script>
/* «How can you beat it?» — storia Instagram di 60 s, 1080×1920, 60 fps. Un solo file, solo codice: nessuna immagine, nessun video.
   Scritto da Claude Fable 5.2 nella sessione dell'11/11/2026, su richiesta di Davide. render(t) è funzione pura del tempo.
   Musica (non nel repository): 144 BPM, battito k al secondo OB + k·PB. Struttura in battiti:
   0–20 prompt e piano · 20–24 carica · 24 DROP · 24–48 calcoli (valore attuale, frattale) · 48–52 titolo · 52–72 finanza (serie, Monte Carlo,
   frontiera) · 72–84 report · 84–96 sito · 96–100 titolo · 100–108 forme · 108–120 3D · 120–136 frasi · 136–fine chiusura.
   Ogni numero a schermo è calcolato qui dentro: serie e portafogli sono SIMULATI (seme fisso) e dichiarati tali. */
const W = 1080, H = 1920, cv = document.getElementById('c'), x = cv.getContext('2d');
window.DUR = 60;
const LINES = 427, MINUTES = 0;   // riempiti a fine lavoro: righe di questo file, minuti dalla richiesta al video
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), seg = (t, a, b) => clamp((t - a) / (b - a)), lerp = (a, b, k) => a + (b - a) * k;
const oC = (k) => 1 - Math.pow(1 - k, 3), ioC = (k) => (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const oB = (k, s = 1.7) => (k <= 0 ? 0 : k >= 1 ? 1 : 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2));
const PB = 0.41672, OB = 0.354, B = (k) => OB + k * PB, bp = (t) => (t - OB) / PB, sb = (t, a, b) => seg(t, B(a), B(b));
const pulse = (t, d = 5) => { const f = bp(t); return f < 0 ? 0 : Math.exp(-(f - Math.floor(f)) * d); };
const C = { bg: '#040506', ink: '#F1F4EE', muted: '#8B958F', lime: '#C8FA72', cyan: '#5CE1E6', vio: '#9B8CFF', amber: '#F5A524', red: '#FF5A4E', gold: '#F2C14E', dark: '#0B0D0C' };
const RGB = { lime: '200,250,114', cyan: '92,225,230', vio: '155,140,255', amber: '245,165,36', red: '255,90,78', ink: '241,244,238', gold: '242,193,78' };
const F = (w, s, m) => `${w} ${s}px ${m ? '"IBM Plex Mono"' : 'Manrope'}`;
function txt(s, px, py, o = {}) {
  const { size = 40, weight = 800, color = C.ink, align = 'center', mono = false, alpha = 1, blur = 0, ls = 0, sh = 0 } = o;
  if (alpha <= 0.003 || s === '' || s == null) return;
  x.save(); x.globalAlpha *= alpha; x.font = F(weight, size, mono); x.letterSpacing = ls + 'px'; x.textAlign = align; x.textBaseline = 'middle';
  x.fillStyle = color; if (blur > 0.3) x.filter = `blur(${blur}px)`; if (sh) { x.shadowColor = 'rgba(0,0,0,0.95)'; x.shadowBlur = sh; x.fillText(s, px, py); } x.fillText(s, px, py); x.restore();
}
function tw(s, size, weight = 800, mono = false, ls = 0) { x.save(); x.font = F(weight, size, mono); x.letterSpacing = ls + 'px'; const w = x.measureText(s).width; x.restore(); return w; }
const rr = (a, b, w, h, r) => { x.beginPath(); x.roundRect(a, b, w, h, r); };
function glow(cx, cy, r, rgb, a) { if (a <= 0) return; const g = x.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`); x.fillStyle = g; x.fillRect(cx - r, cy - r, 2 * r, 2 * r); }
function mul(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let v = Math.imul(a ^ a >>> 15, 1 | a); v = v + Math.imul(v ^ v >>> 7, 61 | v) ^ v; return ((v ^ v >>> 14) >>> 0) / 4294967296; }; }
const gauss = (r) => { let u = 0; while (u === 0) u = r(); const v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const fmt = (v, d = 0) => { const s = Math.abs(v).toFixed(d).split('.'); s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ','); return (v < 0 ? '−' : '') + s.join('.'); };
const hash = (a, b, c) => { const s = Math.sin(a * 12.9898 + b * 78.233 + c * 37.719) * 43758.5453; return s - Math.floor(s); };
const mixc = (a, b, k) => `rgb(${a.split(',').map((v, i) => Math.round(lerp(+v, +b.split(',')[i], k))).join(',')})`;
function panel(a, b, w, h, r, o = {}) {
  const { fill = 'rgba(255,255,255,0.045)', stroke = 'rgba(255,255,255,0.14)', lw = 2, alpha = 1 } = o;
  x.save(); x.globalAlpha *= alpha; rr(a, b, w, h, r); x.fillStyle = fill; x.fill();
  x.save(); rr(a, b, w, h, r); x.clip(); const g = x.createLinearGradient(0, b, 0, b + Math.min(h, 260)); g.addColorStop(0, 'rgba(255,255,255,0.07)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(a, b, w, Math.min(h, 260)); x.restore();

}
function tag(cx, cy, label, k, col = C.ink, size = 24, align = 'center') {

  x.save(); x.globalAlpha *= clamp(k * 2); const s = lerp(0.8, 1, oB(clamp(k))); x.translate(x0 + w / 2, cy); x.scale(s, s); x.translate(-(x0 + w / 2), -cy);
  rr(x0, cy - size * 0.95, w, size * 1.9, size); x.fillStyle = 'rgba(4,5,6,0.6)'; x.fill(); x.strokeStyle = col; x.lineWidth = 2; x.stroke();

/* didascalia social: una riga grande, parole che entrano sfalsate dal basso */
function cap(t, b0, b1, words, y, o = {}) {
  let { size = 76, col = C.ink, hi = {}, st = 0.07, sh = 0 } = o; const full = words.join(' '), wd = tw(full, size, 800, false, -2); if (wd > 960) size = Math.floor(size * 960 / wd);
  const sp = tw(' ', size, 800, false, -2); let cx = 540 - tw(full, size, 800, false, -2) / 2; const ko = seg(t, B(b1) - 0.14, B(b1));
  words.forEach((w, i) => { const k = oC(seg(t, B(b0) + i * st, B(b0) + i * st + 0.3)), ww = tw(w, size, 800, false, -2);
    txt(w, cx + ww / 2, y + (1 - k) * 46 - ko * 30, { size, color: hi[i] || col, alpha: k * (1 - ko), blur: (1 - k) * 12 + ko * 8, ls: -2, sh }); cx += ww + sp; });
}
const grain = (() => { const g = document.createElement('canvas'); g.width = 540; g.height = 960; const gx = g.getContext('2d'), id = gx.createImageData(540, 960), r = mul(7);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } gx.putImageData(id, 0, 0); return g; })();
function bg(t, a = 1) {
  x.fillStyle = C.bg; x.fillRect(0, 0, W, H); const p = 0.75 + 0.45 * pulse(t, 3);
  [[RGB.lime, 0.085, 0.13, 0.7], [RGB.cyan, 0.07, 0.17, 2.1], [RGB.vio, 0.09, 0.11, 4.2]].forEach(([rgb, al, sp, ph]) =>
    glow(540 + Math.sin(t * sp + ph) * 430, 820 + Math.cos(t * sp * 1.3 + ph * 2) * 640, 900, rgb, al * a * p));
}

  const v = x.createRadialGradient(540, 960, 520, 540, 960, 1260); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)'); x.fillStyle = v; x.fillRect(0, 0, W, H);
  const f = Math.floor(t * 60); x.save(); x.globalAlpha = 0.055; x.globalCompositeOperation = 'overlay'; x.drawImage(grain, -(f * 37) % 540, -(f * 61) % 960, 2160, 3840); x.restore();
}
const SEC = [[0, '00', 'PROMPT'], [24, '01', 'MATH'], [48, '02', 'FINANCE'], [72, '03', 'REPORT'], [84, '04', 'WEB'], [96, '05', 'MOTION'], [120, '', ''], [999, '', '']];
function hud(t) {
  const b = bp(t), a = 0.9 * oC(seg(t, 0.1, 0.7)) * (1 - seg(t, B(134), B(136))); if (a <= 0) return; let s = 0; while (SEC[s + 1][0] <= b) s++;

  txt('FABLE 5.2', 98, 293, { mono: true, size: 22, weight: 600, align: 'left', ls: 4 });
  if (SEC[s][1]) txt(`${SEC[s][1]} / 05  ${SEC[s][2]}`, 1004, 293, { mono: true, size: 22, weight: 600, color: C.muted, align: 'right', ls: 3 });
  x.fillStyle = 'rgba(255,255,255,0.14)'; x.fillRect(70, 321, 940, 3); x.fillStyle = C.lime; x.fillRect(70, 321, 940 * clamp(t / 60), 3);
  SEC.slice(1, 7).forEach(([bb]) => { x.fillStyle = 'rgba(255,255,255,0.5)'; x.fillRect(70 + 940 * B(bb) / 60 - 1, 316, 2, 13); }); x.restore();

/* titolo di sezione: lettere che cadono al loro posto, sdoppiamento cromatico, sottotitolo battuto a macchina */

  const ko = seg(t, B(b1) - 0.16, B(b1)), zs = 1 + ko * ko * 2.4; x.save(); x.translate(540, 960); x.scale(zs, zs); x.translate(-540, -960); x.globalAlpha *= 1 - ko;
  txt(num, 540, 770, { mono: true, size: 38, weight: 600, color: col, ls: 12, alpha: oC(seg(t, t0, t0 + 0.25)) });
  let cx = 540 - tw(word, size, 800, false, -6) / 2; const gh = (1 - oC(seg(t, t0, t0 + 0.5))) * 16;
  for (let i = 0; i < word.length; i++) { const ch = word[i], w = tw(ch, size, 800, false, -6), k = seg(t, t0 + i * 0.03, t0 + i * 0.03 + 0.28), e = oB(k, 2.4);
    if (k > 0) { x.save(); x.translate(cx + w / 2, 940 + (1 - e) * 150); x.rotate((1 - e) * 0.25 * (i % 2 ? 1 : -1));
      if (gh > 0.5) { x.globalCompositeOperation = 'lighter'; txt(ch, -gh, 0, { size, color: 'rgba(92,225,230,0.65)' }); txt(ch, gh, 0, { size, color: 'rgba(255,90,78,0.65)' }); x.globalCompositeOperation = 'source-over'; }
      txt(ch, 0, 0, { size, alpha: clamp(k * 3), blur: (1 - k) * 12 }); x.restore(); } cx += w; }
  const ku = oC(seg(t, t0 + 0.15, t0 + 0.6)); x.fillStyle = col; rr(540 - 270 * ku, 1072, 540 * ku, 8, 4); x.fill();
  txt(sub.slice(0, Math.floor(seg(t, t0 + 0.3, t0 + 1.0) * sub.length)), 540, 1136, { mono: true, size: 30, weight: 500, color: C.muted, ls: 2 }); x.restore();
}

/* ================= 0 · PROMPT E PIANO ================= */
function terminal(t) {

  x.save(); x.globalAlpha *= kin; x.translate(0, (1 - kin) * 60); glow(540, y0 + hh / 2, 760, RGB.lime, 0.06);

}
function sCharge(t) {

/* ================= 1 · CALCOLI ================= */
function matrix(t, a) { for (let i = 0; i < 18; i++) for (let j = 0; j < 27; j++) { const n = Math.floor(t * 9 + hash(i, j, 1) * 9), h = hash(i, j, n);

  x.fillStyle = 'rgba(255,255,255,0.25)'; x.fillRect(90, base + 6, 900, 2);
  txt('YEAR 0', 100, base + 34, { mono: true, size: 20, weight: 500, color: C.muted, align: 'left', alpha: kh }); txt('YEAR 29', 980, base + 34, { mono: true, size: 20, weight: 500, color: C.muted, align: 'right', alpha: kh });
  const k2 = oC(sb(t, 32, 32.6));
