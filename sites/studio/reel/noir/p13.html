<script>const P = { EP: 13, DAY: 2, CAP: 0, NEXT: ['Shock di domanda', 'e di offerta'] }; /* dal 16/10/2026 niente riga delle fonti nel video (Davide): P.FONTE non serve più */</script>
<script src="serie.js"></script>
<script>
/* Puntata 13 — «Domanda e offerta aggregata». Numeri SOLO da p13-fonti.md:
   Italia 2019→2025 (Eurostat nama_10_gdp, agg. 15/10/2026; 2025 provvisorio): Pil reale +7,4% (1.960.421,0 / 1.825.154,3),
   deflatore del Pil +17,1% (115,537 / 98,637). Nel grafico «dati» i due spostamenti sono in scala: 26 px per punto di indice
   su entrambi gli assi (2019 = 100), cioè 192 px a destra contro 445 px in alto (rapporto 2,3 a 1, come 17,1 / 7,4).
   Le curve sono TEORIA (OpenStax cap. 11): disegno di manuale senza numeri, etichetta «nel modello»; non passano mai sul punto
   vero dell'Italia («Italia · dati»), che compare solo dopo che le curve sono sparite.
   Le quattro voci della domanda aggregata (consumi, investimenti, spesa pubblica, export netto) senza percentuali:
   il 18,1% Istat è solo consumi delle AP e NON è «la spesa pubblica» (p13-fonti, «Cosa NON si può dire»).
   Assi: «PIL reale» in orizzontale, «livello dei prezzi» in verticale. Mai la sigla AD-AS a schermo.
   CAP 0 = capitolo 1 (ottobre 2026, lezioni 1–20). DAY 2 = mercoledì, lezione 3 di 5. */
const ORDER = ['num', 'hook', 'simile', 'orizzontale', 'verticale', 'domanda', 'scende', 'offerta', 'equilibrio', 'realta', 'destra', 'alto', 'casa', 'fine', 'cta', 'end'];
const Y2 = 345 + 92 * 1.12; /* seconda riga del titolo */
const WA = (k, ws, n, ris) => { for (const w of ws) { const v = WT(k, w, n, NaN); if (!isNaN(v)) return v; } return S(k) + ris; };

const it = (v, d = 1) => v.toFixed(d).replace('.', ',');
function dashLine(x0, y0, x1, y1, col, w = 3, dash = [10, 10], a = 1) { if (a <= 0) return; x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.lineWidth = w; x.setLineDash(dash); x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); x.restore(); }
function dot(cx, cy, r, col, k = 1, g = null) { if (k <= 0) return; if (g) glow(cx, cy, r * 5, g, 0.35 * clamp(k)); x.save(); x.globalAlpha *= clamp(k); x.fillStyle = col; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); x.strokeStyle = '#050607'; x.lineWidth = 3; x.stroke(); x.restore(); }
/* testo che entra con un piccolo rimbalzo */
function popTxt(s, px, py, k, o = {}) { if (k <= 0) return; x.save(); const sc = lerp(0.7, 1, oB(clamp(k))); x.translate(px, py); x.scale(sc, sc); txt(s, 0, 0, { size: 50, weight: 800, ...o, alpha: clamp(k * 2) * (o.alpha ?? 1) }); x.restore(); }
function head(px, py, ang, col, sz = 18) { x.save(); x.fillStyle = col; x.translate(px, py); x.rotate(ang); x.beginPath(); x.moveTo(0, 0); x.lineTo(-sz, -sz * 0.62); x.lineTo(-sz, sz * 0.62); x.closePath(); x.fill(); x.restore(); }
/* freccia (anche tratteggiata) che cresce da (x0,y0) verso (x1,y1) */
function arrow(x0, y0, x1, y1, col, w, k, dash = null, a = 1) { if (k <= 0 || a <= 0) return; const xe = lerp(x0, x1, k), ye = lerp(y0, y1, k), an = Math.atan2(y1 - y0, x1 - x0), L = Math.hypot(xe - x0, ye - y0);
  x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.lineWidth = w; x.lineCap = 'round'; if (dash) x.setLineDash(dash);
  if (L > 20) { x.beginPath(); x.moveTo(x0, y0); x.lineTo(xe - Math.cos(an) * 14, ye - Math.sin(an) * 14); x.stroke(); }
  x.setLineDash([]); head(xe, ye, an, col, w * 3.4); x.restore(); }

/* ================= IL GRAFICO (assi comuni a quasi tutte le scene) ================= */
const G = { x0: 190, y0: 1290, x1: 930, yt: 630 };
function axes(o = {}) { const { kx = 1, ky = 1, lx = 0, ly = 0, cx = C.ink, cy = C.ink, a = 1 } = o; if (a <= 0) return;
  const col = 'rgba(241,244,238,0.6)';
  x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.lineWidth = 4; x.lineCap = 'round';
  if (kx > 0) { const xe = lerp(G.x0, G.x1, oC(kx)); x.beginPath(); x.moveTo(G.x0, G.y0); x.lineTo(xe - 10, G.y0); x.stroke(); head(xe, G.y0, 0, col, 18); }
  if (ky > 0) { const ye = lerp(G.y0, G.yt, oC(ky)); x.beginPath(); x.moveTo(G.x0, G.y0); x.lineTo(G.x0, ye + 10); x.stroke(); head(G.x0, ye, -Math.PI / 2, col, 18); }
  x.restore();
  txt('PIL REALE', G.x1, G.y0 + 46, { fam: 'mono', size: 26, weight: 600, color: cx, align: 'right', ls: 2, alpha: lx * a });
  txt('LIVELLO DEI PREZZI', G.x0 - 14, G.yt - 40, { fam: 'mono', size: 26, weight: 600, color: cy, align: 'left', ls: 2, alpha: ly * a });
}
/* curve del modello: domanda (lime) e offerta (ambra), speculari attorno a y = 950 */
const QD = { p0: [290, 690], c: [620, 1080], p1: [910, 1190] }, QS = { p0: [290, 1210], c: [620, 820], p1: [910, 710] };
const qb = (q, u) => [(1 - u) * (1 - u) * q.p0[0] + 2 * u * (1 - u) * q.c[0] + u * u * q.p1[0], (1 - u) * (1 - u) * q.p0[1] + 2 * u * (1 - u) * q.c[1] + u * u * q.p1[1]];
function drawQ(q, k, col, w = 7, dash = null, a = 1) { if (k <= 0 || a <= 0) return; x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.lineWidth = w; x.lineCap = 'round'; if (dash) x.setLineDash(dash);
  x.beginPath(); x.moveTo(...q.p0); for (let u = 0.02; u < k; u += 0.02) x.lineTo(...qb(q, u)); x.lineTo(...qb(q, k)); x.stroke(); x.restore(); }
const uE = (() => { let lo = 0, hi = 1; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (qb(QD, m)[1] < 950) lo = m; else hi = m; } return (lo + hi) / 2; })();
const E0 = qb(QD, uE); /* incrocio del modello, circa (540, 950) */
const labD = (a) => txt('DOMANDA', 912, 1238, { fam: 'mono', size: 26, weight: 600, color: C.lime, align: 'right', ls: 2, alpha: a });
const labS = (a) => txt('OFFERTA', 912, 664, { fam: 'mono', size: 26, weight: 600, color: C.amber, align: 'right', ls: 2, alpha: a });
/* i dati veri: indici 2019 = 100, stessa scala sui due assi (26 px per punto) */
const SC = 26, rxv = (v) => 400 + (v - 100) * SC, ryv = (v) => 1150 - (v - 100) * SC;
const PT19 = [rxv(100), ryv(100)], PT25 = [rxv(107.4), ryv(117.1)];
function ticks(k) { if (k <= 0) return; x.save(); x.globalAlpha *= k; x.fillStyle = 'rgba(241,244,238,0.6)';
  for (const v of [100, 105, 110, 115, 120]) { x.fillRect(G.x0 - 10, ryv(v) - 1.5, 10, 3); txt(String(v), G.x0 - 20, ryv(v), { fam: 'mono', size: 24, weight: 600, color: C.muted, align: 'right' }); }
  for (const v of [100, 105, 110]) { x.fillRect(rxv(v) - 1.5, G.y0, 3, 10); txt(String(v), rxv(v), G.y0 + 36, { fam: 'mono', size: 24, weight: 600, color: C.muted }); }
  x.restore(); }

/* ================= OGGETTI ================= */
function cup(cx, cy, s, k, t, st = 1) { if (k <= 0) return; x.save(); x.translate(cx, cy); x.scale(s, s); x.globalAlpha *= clamp(k);
  let g = x.createLinearGradient(-200, 0, 200, 0); g.addColorStop(0, '#7c837e'); g.addColorStop(0.5, '#eef1ec'); g.addColorStop(1, '#6f7771');
  x.fillStyle = g; x.beginPath(); x.ellipse(0, 112, 200, 40, 0, 0, 7); x.fill();
  x.fillStyle = 'rgba(0,0,0,0.28)'; x.beginPath(); x.ellipse(6, 106, 128, 18, 0, 0, 7); x.fill();
  x.strokeStyle = '#c9cfca'; x.lineWidth = 20; x.lineCap = 'round'; x.beginPath(); x.arc(130, -4, 46, -1.25, 1.35); x.stroke();
  g = x.createLinearGradient(-135, 0, 135, 0); g.addColorStop(0, '#8f9791'); g.addColorStop(0.32, '#f4f6f2'); g.addColorStop(0.7, '#d2d7d1'); g.addColorStop(1, '#79817b');
  x.fillStyle = g; x.beginPath(); x.moveTo(-135, -62); x.lineTo(135, -62); x.bezierCurveTo(132, 50, 95, 102, 0, 102); x.bezierCurveTo(-95, 102, -132, 50, -135, -62); x.closePath(); x.fill();
  x.fillStyle = '#e9ece6'; x.beginPath(); x.ellipse(0, -62, 135, 26, 0, 0, 7); x.fill();
  g = x.createRadialGradient(-24, -64, 4, 0, -60, 120); g.addColorStop(0, '#c99052'); g.addColorStop(0.5, '#7a4a22'); g.addColorStop(1, '#2a160a');
  x.fillStyle = g; x.beginPath(); x.ellipse(0, -60, 118, 20, 0, 0, 7); x.fill();
  x.strokeStyle = 'rgba(255,255,255,0.55)'; x.lineWidth = 8; x.beginPath(); x.moveTo(-96, -30); x.quadraticCurveTo(-98, 30, -66, 66); x.stroke();
  if (st > 0) { x.lineWidth = 7; for (let i = 0; i < 3; i++) { const bx = -45 + 45 * i; x.beginPath();
      for (let yy = -95; yy >= -260; yy -= 5) { const xx = bx + Math.sin(yy * 0.045 + t * 2.6 + i * 1.7) * 12 * (1 + (-yy - 95) / 165); if (yy === -95) x.moveTo(xx, yy); else x.lineTo(xx, yy); }
      const sg = x.createLinearGradient(0, -95, 0, -260); sg.addColorStop(0, `rgba(241,244,238,${0.42 * st})`); sg.addColorStop(1, 'rgba(241,244,238,0)'); x.strokeStyle = sg; x.stroke(); } }
  x.restore(); }
function crate(cx, by, s, col, k = 1) { if (k <= 0) return; x.save(); x.translate(cx, by); x.scale(s, s); x.globalAlpha *= clamp(k);
  rr(-30, -60, 60, 60, 6); x.fillStyle = '#121714'; x.fill(); x.strokeStyle = col; x.lineWidth = 4; x.stroke();
  x.lineWidth = 3; x.beginPath(); x.moveTo(-30, -44); x.lineTo(30, -44); x.moveTo(-30, -16); x.lineTo(30, -16); x.moveTo(-22, -16); x.lineTo(22, -44); x.stroke(); x.restore(); }
function tag(cx, cy, s, k, col = 'rgba(241,244,238,0.75)') { if (k <= 0) return; x.save(); x.translate(cx, cy); x.scale(s, s); x.globalAlpha *= clamp(k);
  x.beginPath(); x.moveTo(-30, -18); x.lineTo(20, -18); x.lineTo(32, 0); x.lineTo(20, 18); x.lineTo(-30, 18); x.closePath(); x.fillStyle = '#121714'; x.fill(); x.strokeStyle = col; x.lineWidth = 3; x.stroke();
  x.beginPath(); x.arc(20, 0, 4, 0, 7); x.stroke(); txt('€', -6, 1, { size: 24, weight: 800, color: C.ink }); x.restore(); }
function bag(cx, cy, col) { x.save(); x.strokeStyle = col; x.lineWidth = 5; x.lineJoin = 'round'; x.lineCap = 'round';
  x.beginPath(); x.moveTo(cx - 30, cy - 14); x.lineTo(cx + 30, cy - 14); x.lineTo(cx + 36, cy + 34); x.lineTo(cx - 36, cy + 34); x.closePath(); x.stroke();
  x.beginPath(); x.arc(cx, cy - 14, 15, Math.PI, 0); x.stroke(); x.restore(); }
function lock(cx, cy, col, k) { if (k <= 0) return; x.save(); x.globalAlpha *= clamp(k * 2); const s = lerp(0.6, 1, oB(clamp(k))); x.translate(cx, cy); x.scale(s, s);
  x.strokeStyle = col; x.lineWidth = 6; x.beginPath(); x.arc(0, -10, 15, Math.PI, 0); x.lineTo(15, 2); x.moveTo(-15, 2); x.lineTo(-15, -10); x.stroke();
  rr(-24, 0, 48, 36, 8); x.fillStyle = col; x.fill(); x.fillStyle = '#050607'; x.beginPath(); x.arc(0, 15, 5, 0, 7); x.fill(); x.restore(); }
/* mirino: quattro angoli che si chiudono attorno a un punto */
function brackets(cx, cy, r, col, a) { if (a <= 0) return; x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.lineWidth = 6; x.lineCap = 'round'; const l = 26;
  for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { x.beginPath(); x.moveTo(cx + sx * r, cy + sy * (r - l)); x.lineTo(cx + sx * r, cy + sy * r); x.lineTo(cx + sx * (r - l), cy + sy * r); x.stroke(); }
  x.restore(); }

/* ================= HOOK: il caffè diventa un punto del grafico ================= */
function sHook(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.05);
  const tPa = WT('hook', 'pagato', 1, 1.38), tG = WT('hook', 'grafico', 1, 3.10), tI = WA('hook', ['litalia', 'italia'], 1, 4.14), tPu = WT('hook', 'punto', 1, 5.17);
  phrase(t, a + 0.02, [['Il caffè di stamattina', C.ink]], 345, { size: 92, st: 0.1 });
  phrase(t, tI - 0.1, [['e l’Italia in un punto.', C.lime]], Y2, { size: 92 });
  const kIn = oC(seg(t, a, a + 0.3)), kS = ioC(seg(t, tG - 0.05, tPu - 0.1)), kD = seg(t, tPu - 0.3, tPu + 0.15);
  axes({ kx: seg(t, tG - 0.2, tG + 0.5), ky: seg(t, tG - 0.2, tG + 0.5) });
  /* la moneta pagata: cade sul tavolo accanto al piattino */
  const kc = seg(t, tPa - 0.35, tPa), kb = seg(t, tPa, tPa + 0.35), cOut = 1 - clamp(kS * 3);
  if (kc > 0 && cOut > 0) { const cy = lerp(620, 1050, kc * kc) - Math.sin(Math.PI * kb) * 26 * (1 - kb);
    if (kb > 0 && kb < 1) { x.save(); x.strokeStyle = `rgba(200,250,114,${0.8 * (1 - kb)})`; x.lineWidth = 3; x.beginPath(); x.ellipse(250, 1052, 50 + 50 * oC(kb), 16 + 16 * oC(kb), 0, 0, 7); x.stroke(); x.restore(); }
    coin(250, cy, 52, clamp(kc * 3) * cOut, '200,250,114', '€'); }
  /* la tazzina si rimpicciolisce fino al punto del grafico */
  const s = lerp(1, 0.2, kS), cx = lerp(540, E0[0], kS), cy = lerp(915, E0[1] - 6, kS);
  cup(cx, cy, s * lerp(0.92, 1, kIn), kIn * (1 - oC(kD)), t, 1 - clamp(kS * 1.5));
  if (kD > 0) { glow(E0[0], E0[1], 150, '200,250,114', 0.4 * clamp(kD)); dot(E0[0], E0[1], 16, C.lime, oB(kD));
    const kr = seg(t, tPu, tPu + 0.6); if (kr > 0 && kr < 1) { x.save(); x.strokeStyle = `rgba(200,250,114,${1 - kr})`; x.lineWidth = 4; x.beginPath(); x.arc(E0[0], E0[1], 22 + 70 * oC(kr), 0, 7); x.stroke(); x.restore(); } }
  txt('ITALIA', E0[0] + 70, E0[1] + 2, { fam: 'mono', size: 28, weight: 600, color: C.lime, align: 'left', ls: 3, alpha: oC(seg(t, tI, tI + 0.35)) });
  x.restore(); finish(t); }

/* ================= SIMILE: due grafici gemelli, stesso disegno, significato diverso ================= */
const MCY = 880;
function miniChart(cx, k, labs, hot) { if (k <= 0) return; const cy = MCY, s = lerp(0.9, 1, oB(clamp(k)));
  x.save(); x.translate(cx, cy); x.scale(s, s); x.translate(-cx, -cy);
  glass(cx, cy, 380, 420, 30, clamp(k * 2));
  const ox = cx - 150, oy = cy + 140, ex = cx + 160, ty = cy - 140, kk = clamp(k * 1.5 - 0.3);
  x.save(); x.globalAlpha *= clamp(k * 2); x.strokeStyle = 'rgba(241,244,238,0.6)'; x.lineWidth = 3; x.beginPath(); x.moveTo(ox, ty); x.lineTo(ox, oy); x.lineTo(ex, oy); x.stroke(); x.restore();
  const qd = { p0: [ox + 30, ty + 26], c: [cx + 10, cy + 70], p1: [ex - 14, oy - 24] }, qs = { p0: [ox + 30, oy - 24], c: [cx + 10, cy - 50], p1: [ex - 14, ty + 26] };
  drawQ(qd, kk, C.lime, 6); drawQ(qs, kk, C.amber, 6);
  const lc = hot > 0.5 ? C.amber : C.ink;
  txt(labs[0], ox - 10, ty - 34, { fam: 'mono', size: 22, weight: 600, color: lc, align: 'left', ls: 1, alpha: clamp(k * 2) });
  txt(labs[1], ex + 10, oy + 32, { fam: 'mono', size: 22, weight: 600, color: lc, align: 'right', ls: 1, alpha: clamp(k * 2) });
  x.restore(); }
function sSimile(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04);
  const tD = WT('simile', 'domanda', 1, 0.69), tAg = WT('simile', 'aggregata', 1, 1.72), tSo = WT('simile', 'somiglia', 1, 2.76), tM = WT('simile', 'mercato', 1, 4.48), tSi = WT('simile', 'significato', 1, 5.52);
  phrase(t, Math.min(a + 0.05, tD - 0.15), [['Domanda e offerta', C.ink]], 345, { size: 92 });
  phrase(t, tAg - 0.1, [['aggregata.', C.lime]], Y2, { size: 92 });
  const kR = seg(t, a + 0.3, a + 0.9), kL = seg(t, tSo - 0.25, tSo + 0.35), hot = oC(seg(t, tSi - 0.05, tSi + 0.3));
  miniChart(780, kR, ['LIVELLO DEI PREZZI', 'PIL REALE'], hot);
  miniChart(300, kL, ['PREZZO DEL CAFFÈ', 'TAZZINE'], 0);
  txt('TUTTA L’ECONOMIA', 780, 1140, { fam: 'mono', size: 26, weight: 600, color: hot > 0.5 ? C.amber : C.ink, ls: 2, alpha: oC(seg(t, a + 0.6, a + 1.0)) });
  txt('UN MERCATO', 300, 1140, { fam: 'mono', size: 26, weight: 600, color: C.ink, ls: 2, alpha: oC(seg(t, tM - 0.1, tM + 0.3)) });
  /* ≈ che diventa ≠ */
  const kq = seg(t, tM - 0.15, tM + 0.25); if (kq > 0) popTxt('≈', 540, MCY, kq, { size: 96, color: hot > 0.5 ? C.red : C.lime });
  const kx = seg(t, tSi - 0.1, tSi + 0.25); if (kx > 0) { x.save(); x.strokeStyle = C.red; x.lineWidth = 9; x.lineCap = 'round'; x.beginPath(); x.moveTo(518, MCY + 42); x.lineTo(lerp(518, 562, oC(kx)), lerp(MCY + 42, MCY - 42, oC(kx))); x.stroke(); x.restore(); }
  glassPill(540, 1300, 'simile il disegno, non il significato', seg(t, tSi + 0.1, tSi + 0.5), C.amber, 34);
  x.restore(); finish(t); }

/* ================= ORIZZONTALE: l'asse del PIL reale si riempie di casse ================= */
function crateRow(t, t0, a = 1) { for (let i = 0; i < 7; i++) { const k = seg(t, t0 + i * 0.13, t0 + 0.35 + i * 0.13); if (k <= 0) continue;
    const cx = 270 + i * 95, by = G.y0 - 4 - (1 - oB(k)) * 110; crate(cx, by, 1, C.lime, clamp(k * 3) * a); } }
function sOrizz(t, a, b) { bg(); x.save();
  const tO = WT('orizzontale', 'orizzontale', 1, 0.69), tP = WT('orizzontale', 'prodotto', 1, 1.72), tQ = WT('orizzontale', 'quanto', 1, 3.10);
  phrase(t, a + 0.05, [['In orizzontale:', C.ink]], 345, { size: 92 });
  phrase(t, tP - 0.1, [['il PIL reale.', C.lime]], Y2, { size: 92 });
  const kx = seg(t, Math.min(a + 0.1, tO - 0.3), tO + 0.5);
  axes({ kx, ky: 0, lx: oC(seg(t, tP, tP + 0.4)), cx: C.lime });
  /* freccia che scorre sull'asse: più a destra, più produzione */
  if (kx >= 1) { const u = ((t - a) * 0.5) % 1; glow(lerp(G.x0 + 40, G.x1 - 40, u), G.y0, 60, '200,250,114', 0.35 * Math.sin(Math.PI * u)); }
  crateRow(t, tQ - 0.15);
  glassPill(540, 1110, 'quanto si produce', seg(t, tQ - 0.1, tQ + 0.35), C.lime, 40);
  x.restore(); finish(t); }

/* ================= VERTICALE: non il prezzo del caffè, ma la media di tutti i prezzi ================= */
const TGX = [300, 370, 440, 510, 580, 650, 720, 790, 860], TGD = [-210, 150, -90, 210, -40, 120, -180, 60, -130];
function sVert(t, a, b) { bg(); x.save();
  const tV = WT('verticale', 'verticale', 1, 0.69), tCa = WT('verticale', 'caffe', 1, 2.41), tL = WT('verticale', 'livello', 1, 3.45), tMe = WT('verticale', 'medio', 1, 3.79), tPz = WT('verticale', 'prezzi', 1, 4.48);
  phrase(t, a + 0.05, [['In verticale:', C.ink]], 345, { size: 92 });
  phrase(t, tL - 0.1, [['il livello dei prezzi.', C.lime]], Y2, { size: 92 });
  axes({ kx: 1, ky: seg(t, Math.min(a + 0.1, tV - 0.3), tV + 0.5), lx: 1, ly: oC(seg(t, tL, tL + 0.4)), cy: C.lime });
  crateRow(t, a - 9, 1 - seg(t, a, a + 0.6));
  /* il caffè: compare e viene barrato */
  const kc = oC(seg(t, tCa - 0.35, tCa + 0.05)), out = oC(seg(t, tL - 0.35, tL + 0.05));
