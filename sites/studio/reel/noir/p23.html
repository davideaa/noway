   Il 1% e' sempre «di una parte» e mai la cassa della banca. Niente «cento volte». Esempio dei mille clienti = cifre inventate. */
const ORDER = ['num', 'hook', 'riserva', 'dimezzata', 'liquidita', 'investito', 'manuale', 'esempio', 'corsa', 'casa', 'fine', 'cta', 'end'];

/* secondo in cui la voce dice la n-esima parola che inizia con una delle alternative (Whisper scrive a volte le cifre); senza voce: frazione f della scena */
const WX = (k, alts, n = 1, f = 0.5) => { const L = ((window.WORDS || {})[k]) || []; let c = 0;
  for (const [p, t] of L) { const q = _nw(p); if (alts.some((w) => q.startsWith(_nw(w))) && ++c === n) return t; }
  return S(k) + f * Math.max(1, E(k) - S(k)); };
const lab = (t, s, px, py, a0, o = {}) => txt(s, px, py, { fam: 'mono', size: 26, weight: 600, color: C.muted, ls: 2, alpha: oC(seg(t, a0, a0 + 0.35)), ...o });
const bz = (p0, c1, c2, p1, u) => { const v = 1 - u; return [v * v * v * p0[0] + 3 * v * v * u * c1[0] + 3 * v * u * u * c2[0] + u * u * u * p1[0], v * v * v * p0[1] + 3 * v * v * u * c1[1] + 3 * v * u * u * c2[1] + u * u * u * p1[1]]; };

/* porta di cassaforte */
function vault(cx, cy, s, k, spin) { x.save(); x.translate(cx, cy); x.scale(s, s); x.globalAlpha *= k;
  x.fillStyle = metal(-260, -260, 260, 260, true); rr(-260, -260, 520, 520, 44); x.fill();
  x.strokeStyle = 'rgba(241,244,238,0.35)'; x.lineWidth = 5; rr(-260, -260, 520, 520, 44); x.stroke();
  x.strokeStyle = 'rgba(241,244,238,0.12)'; x.lineWidth = 3; rr(-215, -215, 430, 430, 30); x.stroke();
  for (const [bx, by] of [[-232, -232], [232, -232], [-232, 232], [232, 232]]) { x.fillStyle = '#0c0f0d'; x.beginPath(); x.arc(bx, by, 10, 0, 7); x.fill(); }
  x.fillStyle = '#0e1210'; x.beginPath(); x.arc(0, 0, 165, 0, 7); x.fill(); x.strokeStyle = 'rgba(241,244,238,0.4)'; x.lineWidth = 4; x.stroke();
  x.fillStyle = '#1a201c'; for (const hy of [-150, 150]) { rr(-282, hy - 30, 34, 60, 8); x.fill(); x.strokeStyle = 'rgba(241,244,238,0.3)'; x.lineWidth = 3; rr(-282, hy - 30, 34, 60, 8); x.stroke(); }
  x.strokeStyle = 'rgba(241,244,238,0.22)'; x.lineWidth = 3; x.beginPath(); x.arc(0, 0, 128, 0, 7); x.stroke();
  x.save(); x.rotate(spin * 0.6); x.strokeStyle = '#b4bbb5'; x.lineWidth = 16; x.lineCap = 'round';
  for (let i = 0; i < 4; i++) { const an = i * Math.PI / 2; x.beginPath(); x.moveTo(0, 0); x.lineTo(Math.cos(an) * 108, Math.sin(an) * 108); x.stroke(); x.fillStyle = '#d9ded8'; x.beginPath(); x.arc(Math.cos(an) * 118, Math.sin(an) * 118, 20, 0, 7); x.fill(); }
  x.fillStyle = '#e8ece6'; x.beginPath(); x.arc(0, 0, 34, 0, 7); x.fill(); x.fillStyle = C.lime; x.beginPath(); x.arc(0, 0, 12, 0, 7); x.fill(); x.restore();
  x.restore(); }

function sHook(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.06);

  x.save(); x.globalAlpha = 1 - 0.55 * dim; vault(540, 960, 0.92 * lerp(0.9, 1, oC(seg(t, a + 0.25, a + 0.9))), kv, 4.2 * (1 - oC(seg(t, a + 0.25, tc))) + 0.2); x.restore();
  cross(540, 960, 150, seg(t, tc - 0.05, tc + 0.5));
  const kp = seg(t, tk, tk + 0.45); if (kp > 0) glassPill(540, 1390, 'il tuo conto', kp, C.lime, 40);
  x.restore(); finish(t); }

function sRiserva(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04);
  const tCen = WX('riserva', ['cento', '1'], 1, 0.5), tBan = WX('riserva', ['centrale'], 1, 0.35), tDep = WX('riserva', ['depositi'], 1, 0.8), tPar = WX('riserva', ['parte'], 1, 0.7);

  const kT = oB(seg(t, tBan, tBan + 0.5)); if (kT > 0) { x.save(); x.translate(384, 1040); x.scale(clamp(kT, 0, 1.1), clamp(kT, 0, 1.1)); x.translate(-384, -1040);
    glass(384, 1040, 552, 170, 34, 1); x.strokeStyle = 'rgba(0,0,0,0.6)'; x.lineWidth = 1; rr(139, 975, 26, 130, 8); x.fillStyle = 'rgba(5,6,7,0.75)'; x.fill();
    if (kd >= 1) { glow(150, 1040, 150, '200,250,114', 0.3 * oC(seg(t, tCen + 0.95, tCen + 1.4))); x.strokeStyle = C.lime; x.lineWidth = 3; rr(110, 957, 548, 166, 34); x.stroke(); }
    txt('BANCA CENTRALE', 200, 1040, { size: 38, weight: 800, align: 'left' }); x.restore(); }

  txt('→', 540, 1250, { size: 100, weight: 800, color: C.ink, alpha: oC(seg(t, tCut + 0.2, tCut + 0.6)) });
  const k1 = oB(seg(t, tCut + 0.4, tCut + 0.9)); if (k1 > 0) { x.save(); x.translate(780, 1250); x.scale(clamp(k1, 0, 1.15), clamp(k1, 0, 1.15)); glow(0, 0, 200, '200,250,114', 0.25); txt('1%', 0, 0, { size: 150, weight: 800, color: C.lime, ls: -4 }); x.restore(); }
  x.restore(); finish(t); }

function sLiquidita(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04);
  const tLiq = WX('liquidita', ['liquidit'], 1, 0.3), tTri = WX('liquidita', ['trimestre'], 1, 0.15), tCir = WX('liquidita', ['circa'], 1, 0.45), tUsc = WX('liquidita', ['uscite'], 1, 0.7);

  const TX = 300, TW = 320, TY = 620, TH = 780, TB = TY + TH, PX = TH / 180, kt = oC(seg(t, a + 0.4, a + 0.9));

  x.restore();
  x.save(); x.globalAlpha = kt; x.strokeStyle = 'rgba(241,244,238,0.55)'; x.lineWidth = 3; rr(TX, TY, TW, TH, 36); x.stroke(); x.fillStyle = 'rgba(255,255,255,0.16)'; x.fillRect(TX + 20, TY + 40, 7, TH - 80); x.restore();

    txt('100%', 285, yL - 98, { fam: 'mono', size: 30, weight: 600, align: 'right', alpha: ku }); txt('USCITE PREVISTE', 285, yL - 62, { fam: 'mono', size: 22, weight: 600, color: C.muted, align: 'right', ls: 1, alpha: ku }); txt('IN 30 GIORNI', 285, yL - 34, { fam: 'mono', size: 22, weight: 600, color: C.muted, align: 'right', ls: 1, alpha: ku }); }

function person(cx, cy, s, col, k = 1) { x.save(); x.globalAlpha *= k; x.fillStyle = col; x.beginPath(); x.arc(cx, cy - 16 * s, 15 * s, 0, 7); x.fill(); x.beginPath(); x.arc(cx, cy + 30 * s, 30 * s, Math.PI, 0); x.fill(); x.restore(); }
function pipe(t, p0, c1, c2, p1, st) { const k = oC(seg(t, st, st + 0.5)); if (k <= 0) return;
  x.save(); x.globalAlpha = k; x.lineCap = 'round'; x.strokeStyle = 'rgba(241,244,238,0.10)'; x.lineWidth = 34; x.beginPath(); x.moveTo(...p0); x.bezierCurveTo(...c1, ...c2, ...p1); x.stroke();
  x.strokeStyle = 'rgba(241,244,238,0.30)'; x.lineWidth = 3; x.stroke();
  for (let j = 0; j < 5; j++) { const u = ((t - st) * 0.55 + j / 5) % 1, [px, py] = bz(p0, c1, c2, p1, u); glow(px, py, 34, '200,250,114', 0.4); x.fillStyle = C.lime; x.beginPath(); x.arc(px, py, 9, 0, 7); x.fill(); }

function sInvestito(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04);

    if (on) glow(cx, 1245, 70, '200,250,114', 0.35 * Math.sin(Math.PI * h));
    person(cx, 1245, 1.0, on ? C.lime : 'rgba(241,244,238,0.72)', kc);
    if (on) { x.save(); x.globalAlpha = Math.sin(Math.PI * h); coin(cx, 1245 - 70 - 60 * oC(h), 26, 1, '200,250,114', '€'); x.restore(); } }

function dcard(cx, cy, word, col, k) { glass(cx, cy, 360, 190, 36, k); txt(word, cx, cy, { size: 54, weight: 800, color: col, alpha: clamp(k) }); }
function sManuale(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04);

  phrase(t, a + 0.05, [['Non è il moltiplicatore', C.ink], ['da manuale.', C.red]], 345, { size: 92, out: tIng - 0.1 });
  phrase(t, tIng + 0.05, [['Il prestito', C.ink], ['crea il deposito.', C.lime]], 345, { size: 92 });
  const kc = oC(seg(t, a + 0.5, a + 1.0)), sw = ioC(seg(t, tIng + 0.3, tIng + 1.2)), s = Math.sin(Math.PI * sw), CY = 1010;

  x.beginPath(); x.moveTo(472, CY); x.lineTo(596, CY); x.stroke(); x.beginPath(); x.moveTo(612, CY); x.lineTo(588, CY - 20); x.lineTo(588, CY + 20); x.closePath(); x.fill(); x.restore();

function sEsempio(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.03);
  const tMi = WX('esempio', ['mille', '1000', '1.000'], 1, 0.12), tMi2 = WX('esempio', ['mille', '1000', '1.000'], 2, 0.3), tCen = WX('esempio', ['cento', '100'], 1, 0.55), tReg = WX('esempio', ['regge'], 1, 0.7),
