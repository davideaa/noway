<script>
/* PROVA SETTIMANA 8: rispettata — nei primi secondi dopo il numero ci sono due pile di banconote (sagome generiche) da confrontare, FISSO ferma e VARIABILE che cresce a scatti, già in onda dal primo fotogramma, nessuna cifra (solo l'etichetta piccola «2022 → 2023», sulla parola «tra»). */
/* Puntata 40 — «Le rate dei mutui nel 2022–2023» (venerdi 27/11/2026, lezione 5 di 5, capitolo 2). Numeri SOLO da p40-fonti.md:
   BCE: 10 rialzi dal 27/07/2022 al 20/09/2023, tasso sui depositi da −0,50% a 4,00% (gradini 0 · 0,75 · 1,5 · 2 · 2,5 · 3 · 3,25 · 3,5 · 3,75 · 4) ·
   Euribor a 3 mesi (medie mensili, BCE Data Portal): dic 2021 −0,582 · giu 2022 −0,239 · lug 2022 0,037 · dic 2022 2,063 · mar 2023 2,911 · giu 2023 3,536 · set 2023 3,880 · ott 2023 3,968 ·
   ESEMPIO (CIFRE INVENTATE, EURIBOR VERO): 150.000 € · 25 anni · Euribor + 1,5 · rata 559,76 → 918,27 (+358,51 al mese; 4.302 l'anno; a voce «circa 560», «circa 920», «più di 350», «oltre 4.000») ·
   STIMA Banca d'Italia (RA 2023 p. 78-79): circa 256.000 famiglie con rata salita di oltre il 30% · famiglia mediana di quel gruppo da circa 600 a circa 780 € al mese.
   Pile di monete dell'esempio e barre della stima: scene diverse, mai confrontate. Niente marchi, niente righe di fonte, nessuna freccia verso oggi o il futuro.
   Scala delle monete: 1 moneta = 20 € (28 monete = 560, 46 = 920). Barre della stima: 1 px = 1 €. Colonne delle famiglie: base 200 px = 100%, linea a +30% = +60 px. */
const ORDER = ['num', 'hook', 'bce', 'euribor', 'sale', 'esempio', 'prima', 'dopo', 'famiglie', 'mediana', 'casa', 'fine', 'cta', 'end'];
const Y2 = 345 + 92 * 1.12; /* seconda riga del titolo a size 92 */
const PAPER = '#ECE8DA';

/* WA: secondo in cui la voce dice la n-esima parola della scena che inizia con UNA delle alternative (lettere E cifre; sui decimali anche la parte intera).
   Senza voce (anteprima) usa la frazione f della scena. */
const WA = (k, ws, n = 1, f = 0.5) => { (window.ANCH = window.ANCH || {})[k + '|' + ws.join('/') + '|' + n] = [k, ws, n];
  const L = ((window.WORDS || {})[k]) || [];
  for (const w of ws) { let c = 0; for (const [p, t] of L) if (_nw(p).startsWith(_nw(w)) && ++c === n) return t; }
  return S(k) + f * Math.max(1, E(k) - S(k)); };
const lab = (t, s, px, py, a0, o = {}) => txt(s, px, py, { fam: 'mono', size: 26, weight: 600, color: C.muted, ls: 2, alpha: oC(seg(t, a0, a0 + 0.35)), ...o });
function dash(x0, y0, x1, y1, col, w = 3, d = [10, 10], a = 1) { if (a <= 0) return; x.save(); x.globalAlpha *= a; x.strokeStyle = col; x.lineWidth = w; x.setLineDash(d); x.lineCap = 'round'; x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); x.restore(); }
function pop(cx, cy, k, fn) { if (k <= 0) return; x.save(); x.globalAlpha *= clamp(k); const s = clamp(k, 0, 1.15); x.translate(cx, cy); x.scale(s, s); x.translate(-cx, -cy); fn(); x.restore(); }
const stamp = (t, a0, label, cy, col = C.amber) => { const ke = oC(seg(t, a0, a0 + 0.4)), lw = tw(label, 26, 600, 'mono', 2) + 64;
  x.save(); x.globalAlpha = ke; x.strokeStyle = col; x.lineWidth = 3; rr(540 - lw / 2, cy - 30, lw, 60, 30); x.stroke(); x.fillStyle = 'rgba(245,165,36,0.10)'; x.fill(); x.restore();
  txt(label, 540, cy + 1, { fam: 'mono', size: 26, weight: 600, color: col, ls: 2, alpha: ke }); };
const EX = 'ESEMPIO · CIFRE INVENTATE, EURIBOR VERO';

/* ================= HOOK: due pile di banconote (sagome); FISSO resta ferma, VARIABILE cresce a scatti; nessuna cifra ================= */
const HK = { BASE: 1340, LH: 36, LX: 300, RX: 780, W: 300 };
function note(cx, y, h, col, rgb, al) { x.save(); x.globalAlpha *= al; const g = x.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, `rgba(${rgb},0.34)`); g.addColorStop(1, `rgba(${rgb},0.14)`);
  rr(cx - HK.W / 2, y, HK.W, h, 7); x.fillStyle = g; x.fill(); x.strokeStyle = col; x.lineWidth = 2.5; x.stroke();
  x.strokeStyle = 'rgba(241,244,238,0.30)'; x.lineWidth = 2; rr(cx - HK.W / 2 + 12, y + 5, HK.W - 24, h - 10, 4); x.stroke(); x.beginPath(); x.arc(cx, y + h / 2, h * 0.26, 0, 7); x.stroke(); x.restore(); }
function sHook(t, a, b) { bg('30,44,26', 0.8); x.save(); zoom(t, a, b, 1.04);
  const tFis = WA('hook', ['fisso'], 1, 0.2), tVar = WA('hook', ['variabile'], 1, 0.42), tCre = WA('hook', ['crescere', 'cresce'], 1, 0.55), tSca = WA('hook', ['scatti'], 1, 0.65), tTra = WA('hook', ['tra'], 1, 0.78);
  phrase(t, a + 0.05, [['Una resta ferma,', C.ink]], 345, { size: 92 });
  phrase(t, tCre - 0.1, [['una sale a scatti', C.red]], Y2, { size: 92 });
  const { BASE, LH, LX, RX } = HK, N0 = 11, NX = 7;
  x.save(); x.strokeStyle = 'rgba(241,244,238,0.22)'; x.lineWidth = 3; x.beginPath(); x.moveTo(90, BASE + 4); x.lineTo(990, BASE + 4); x.stroke(); x.restore();
  /* i salti della pila variabile: irregolari, a scatti; i primi due partono subito */
  const t0 = a + 1.2, t1 = Math.max(t0 + 3.2, tSca + 0.8), fr = [0, 0.16, 0.3, 0.5, 0.64, 0.82, 1], tj = fr.map((f) => t0 + (t1 - t0) * f);
  let nR = N0; tj.forEach((q) => { if (t >= q + 0.1) nR++; });
  /* pila ferma: 11 banconote, in onda dal primo fotogramma (cadono in 0,5 s) */
  glow(LX, BASE - 11 * LH, 260, '200,250,114', 0.10);
  for (let i = 0; i < N0; i++) { const k = oB(seg(t, a - 0.1 + i * 0.03, a + 0.3 + i * 0.03)); note(LX, BASE - (i + 1) * LH - (1 - clamp(k)) * 120, LH - 4, C.lime, '200,250,114', clamp(k * 3)); }
  for (let i = 0; i < N0; i++) { const k = oB(seg(t, a - 0.1 + i * 0.03, a + 0.3 + i * 0.03)); note(RX, BASE - (i + 1) * LH - (1 - clamp(k)) * 120, LH - 4, C.red, '255,90,78', clamp(k * 3)); }
  for (let j = 0; j < NX; j++) { const k = oB(seg(t, tj[j], tj[j] + 0.28)); if (k <= 0) continue; note(RX, BASE - (N0 + j + 1) * LH - (1 - clamp(k)) * 130, LH - 4, C.red, '255,90,78', clamp(k * 3)); }
  const topR = BASE - nR * LH; glow(RX, topR, 260, '255,90,78', 0.10 + 0.05 * (nR - N0));
  /* riga di livello: dove era la pila variabile all'inizio, alla stessa altezza di quella ferma */
  dash(LX + HK.W / 2 + 14, BASE - N0 * LH, RX - HK.W / 2 - 14, BASE - N0 * LH, C.lime, 3, [10, 8], oC(seg(t, a + 0.3, a + 0.9)));
  txt('FISSO', LX, BASE + 56, { fam: 'mono', size: 30, weight: 700, color: t >= tFis - 0.1 ? C.lime : C.muted, ls: 4, alpha: oC(seg(t, a + 0.3, a + 0.7)) });
  txt('VARIABILE', RX, BASE + 56, { fam: 'mono', size: 30, weight: 700, color: t >= tVar - 0.1 ? C.red : C.muted, ls: 4, alpha: oC(seg(t, a + 0.3, a + 0.7)) });
  lab(t, '2022 → 2023', 540, 610, tTra - 0.1, { color: C.ink, size: 28, ls: 3 });
  x.restore(); finish(t); }

/* ================= BCE: dieci gradini in scala (−0,5% → 4%); una pallina li sale uno a uno ================= */
const STEP = [-0.5, 0, 0.75, 1.5, 2, 2.5, 3, 3.25, 3.5, 3.75, 4];
function sBce(t, a, b) { bg('52,34,28', 0.6); x.save(); zoom(t, a, b, 1.03);
  const tDie = WA('bce', ['dieci', '10'], 1, 0.3), tMeno = WA('bce', ['meno'], 1, 0.62), tQua = WA('bce', ['quattro', '4'], 1, 0.86);
  phrase(t, a + 0.05, [['Tassi BCE:', C.ink]], 345, { size: 92 });
  phrase(t, tDie - 0.1, [['dieci rialzi', C.lime]], Y2, { size: 92 });
  const Y0 = 1130, U = 140, BW = 68, GP = 12, X0 = (1080 - (11 * BW + 10 * GP)) / 2, bx = (i) => X0 + i * (BW + GP);
  const HS = 0.16, tl = (i) => tDie + i * HS;   /* istante in cui la pallina atterra sul gradino i */
  /* linea dello zero e gradini: entrano subito, spenti */
  dash(X0 - 20, Y0, X0 + 11 * BW + 10 * GP + 20, Y0, 'rgba(241,244,238,0.4)', 2, [8, 8], oC(seg(t, a + 0.1, a + 0.6)));
  for (let i = 0; i <= 10; i++) { const k = oC(seg(t, a + 0.15 + i * 0.05, a + 0.65 + i * 0.05)); if (k <= 0) continue;
    const lit = i === 0 ? 0.5 : oC(seg(t, tl(i) - 0.02, tl(i) + 0.25)), v = STEP[i], h = Math.abs(v) * U * k, y0 = v >= 0 ? Y0 - h : Y0;
    if (v === 0) { x.save(); x.fillStyle = lit > 0 ? C.lime : 'rgba(241,244,238,0.4)'; rr(bx(i), Y0 - 5, BW, 5, 2); x.fill(); x.restore(); continue; }
    x.save(); x.globalAlpha = 0.38 + 0.52 * lit; x.fillStyle = i === 0 ? 'rgba(241,244,238,0.55)' : lit > 0.5 ? C.lime : 'rgba(241,244,238,0.30)'; rr(bx(i), y0, BW, h, 6); x.fill();
    x.globalAlpha = 0.6 + 0.4 * lit; x.fillStyle = 'rgba(255,255,255,0.8)'; if (v > 0) { rr(bx(i), y0, BW, 5, 2); x.fill(); } x.restore();
    if (lit > 0 && lit < 1 && v > 0) glow(bx(i) + BW / 2, y0, 120, '200,250,114', 0.4 * (1 - lit)); }
  /* pallina */
  const top = (i) => (STEP[i] >= 0 ? Y0 - STEP[i] * U : Y0) - 20; let px = bx(0) + BW / 2, py = top(0);
  for (let i = 1; i <= 10; i++) { const ta = tl(i) - HS; if (t >= ta && t <= tl(i)) { const u = (t - ta) / HS; px = lerp(bx(i - 1), bx(i), u) + BW / 2; py = lerp(top(i - 1), top(i), u) - Math.sin(Math.PI * u) * 80; } else if (t > tl(i)) { px = bx(i) + BW / 2; py = top(i); } }
  const kb = oC(seg(t, a + 0.3, a + 0.7)); if (kb > 0) { glow(px, py, 60, '200,250,114', 0.5 * kb); x.save(); x.globalAlpha = kb; x.fillStyle = C.lime; x.beginPath(); x.arc(px, py, 16, 0, 7); x.fill(); x.restore(); }
  const km = oC(seg(t, tMeno - 0.1, tMeno + 0.35)); txt('−0,5%', bx(0) + BW / 2 + 6, Y0 - 52, { size: 46, weight: 800, color: C.ink, alpha: km, blur: (1 - km) * 10, ls: -1 });
  const kq = oC(seg(t, tQua - 0.1, tQua + 0.35)); txt('4%', bx(10) + BW / 2, Y0 - 4 * U - 44, { size: 62, weight: 800, color: C.lime, alpha: kq, blur: (1 - kq) * 10, ls: -1 });
  lab(t, 'LUG 2022', X0, 1330, a + 0.5, { align: 'left', size: 24 }); lab(t, 'SET 2023', X0 + 11 * BW + 10 * GP, 1330, a + 0.5, { align: 'right', size: 24 });
  x.restore(); finish(t); }

/* ================= EURIBOR: il rialzo si trasmette giu' per una catena di tre nodi di vetro (BCE → Euribor → mutui variabili) ================= */
function houseIcon(cx, cy, col) { x.save(); x.strokeStyle = col; x.lineWidth = 5; x.lineJoin = 'round'; x.beginPath(); x.moveTo(cx - 40, cy + 4); x.lineTo(cx, cy - 34); x.lineTo(cx + 40, cy + 4); x.stroke(); x.beginPath(); x.rect(cx - 30, cy + 4, 60, 38); x.stroke(); x.restore(); }
function stairIcon(cx, cy, col) { x.save(); x.fillStyle = col; for (let i = 0; i < 4; i++) { rr(cx - 42 + i * 22, cy + 34 - (i + 1) * 17, 18, (i + 1) * 17, 3); x.fill(); } x.restore(); }
function sEuribor(t, a, b) { bg('30,44,26'); x.save(); zoom(t, a, b, 1.04);
  const tTra = WA('euribor', ['trasmesso', 'trasmess'], 1, 0.3), tRif = WA('euribor', ['riferimento'], 1, 0.62), tMut = WA('euribor', ['mutui'], 1, 0.8), tBan = WA('euribor', ['banca'], 1, 0.12);
  phrase(t, a + 0.05, [['Il rialzo', C.ink], ['si trasmette', C.lime]], 345, { size: 92 });
  const NY = [650, 940, 1230], NW = 760, NH = 180, lit = [oC(seg(t, a + 0.3, a + 0.6)), oC(seg(t, tTra + 0.45, tTra + 0.8)), oC(seg(t, Math.max(tMut - 0.1, tTra + 1.3), Math.max(tMut - 0.1, tTra + 1.3) + 0.35))];
  const t2 = Math.max(tMut - 0.9, tTra + 0.75);   /* partenza del secondo impulso */
  /* fili tratteggiati con perline che scorrono, spenti fino all'impulso */
  [[NY[0] + NH / 2, NY[1] - NH / 2, tTra, lit[1]], [NY[1] + NH / 2, NY[2] - NH / 2, t2, lit[2]]].forEach(([y0, y1, ts, kl]) => { const ka = oC(seg(t, a + 0.3, a + 0.8));
    dash(540, y0 + 6, 540, y1 - 18, kl > 0.5 ? C.lime : 'rgba(241,244,238,0.4)', 4, [3, 10], ka);
    x.save(); x.globalAlpha = ka; x.fillStyle = kl > 0.5 ? C.lime : 'rgba(241,244,238,0.4)'; x.beginPath(); x.moveTo(540, y1 - 2); x.lineTo(526, y1 - 24); x.lineTo(554, y1 - 24); x.closePath(); x.fill(); x.restore();
    for (let j = 0; j < 2; j++) { const u = ((t - a) * 0.5 + j / 2) % 1; x.save(); x.globalAlpha = ka * 0.5; x.fillStyle = C.ink; x.beginPath(); x.arc(540, lerp(y0 + 10, y1 - 24, u), 5, 0, 7); x.fill(); x.restore(); }
    const u = (t - ts) / 0.6; if (u > 0 && u < 1) { const py = lerp(y0 + 6, y1 - 6, ioC(u)); glow(540, py, 70, '200,250,114', 0.6); x.fillStyle = C.lime; x.beginPath(); x.arc(540, py, 13, 0, 7); x.fill(); } });
  const labs = [['TASSI BCE', 'IL RIALZO', stairIcon], ['EURIBOR', 'A 3 MESI · RIFERIMENTO', null], ['MUTUI VARIABILI', 'LA RATA SEGUE', houseIcon]];
  labs.forEach(([big, sub, ic], i) => { const k = oB(seg(t, a + 0.25 + i * 0.15, a + 0.75 + i * 0.15)), l = lit[i]; pop(540, NY[i], k, () => {
      if (l > 0) glow(540, NY[i], 300, '200,250,114', 0.16 * l); glass(540, NY[i], NW, NH, 40, 1);
      if (l > 0) { x.save(); x.globalAlpha = l; x.strokeStyle = C.lime; x.lineWidth = 3.5; rr(540 - NW / 2, NY[i] - NH / 2, NW, NH, 40); x.stroke(); x.restore(); }
      const al = 0.55 + 0.45 * l; if (ic) ic(250, NY[i], l > 0.5 ? C.lime : C.ink);
      txt(big, ic ? 590 : 540, NY[i] - 22, { size: 58, weight: 800, color: l > 0.5 ? C.lime : C.ink, alpha: al, ls: -1 });
      txt(sub, ic ? 590 : 540, NY[i] + 40, { fam: 'mono', size: 24, weight: 600, color: C.ink, ls: 2, alpha: al }); }); });
  const kp = seg(t, tBan - 0.1, tBan + 0.45); if (kp > 0) glassPill(540, 1405, 'BANCA D’ITALIA', kp, C.ink, 40);
  x.restore(); finish(t); }

/* ================= SALE: l'Euribor a 3 mesi (medie mensili) da sotto zero a circa 4%; la linea si disegna da sinistra ================= */
const EU = [[0, -0.582], [6, -0.239], [7, 0.037], [12, 2.063], [15, 2.911], [18, 3.536], [21, 3.880], [22, 3.968]];
function sSale(t, a, b) { bg('52,44,20', 0.5); x.save(); zoom(t, a, b, 1.03);
  const tSot = WA('sale', ['sotto'], 1, 0.12), tQua = WA('sale', ['quattro', '4'], 1, 0.78);
  phrase(t, a + 0.05, [['Da sotto zero', C.ink]], 345, { size: 92 });
  const XL = 130, XR = 950, YT = 620, SC = 630 / 5.5, ym = (v) => YT + (4.5 - v) * SC, xm = (m) => XL + m / 22 * (XR - XL), Z = ym(0), kg = oC(seg(t, a + 0.1, a + 0.6));
  /* fascia sotto zero e linee guida: subito */
  x.save(); x.globalAlpha = kg; x.fillStyle = 'rgba(255,90,78,0.13)'; x.fillRect(XL - 30, Z, XR - XL + 60, ym(-1) - Z); x.restore();
  dash(XL - 30, Z, XR + 30, Z, 'rgba(241,244,238,0.55)', 3, [], kg); dash(XL - 30, ym(4), XR + 30, ym(4), 'rgba(200,250,114,0.45)', 3, [10, 10], kg);
  lab(t, 'ZERO', XL - 30, Z - 24, a + 0.3, { align: 'left', size: 22, color: C.ink });
  lab(t, 'SOTTO ZERO', 720, Z + 62, Math.min(tSot, a + 1.2) - 0.1, { size: 26, color: C.red, ls: 4 });
  /* linea */
  const tEnd = Math.max(a + 2.1, tQua + 0.1), p = ioC(seg(t, a + 0.4, tEnd)), HX = XL + p * (XR - XL);
  x.save(); x.beginPath(); x.rect(0, 0, HX, H); x.clip(); const gr = x.createLinearGradient(0, Z - 3, 0, Z + 3); gr.addColorStop(0, C.lime); gr.addColorStop(1, C.red);
  x.strokeStyle = gr; x.lineWidth = 9; x.lineJoin = 'round'; x.lineCap = 'round'; x.beginPath(); EU.forEach(([m, v], i) => (i ? x.lineTo(xm(m), ym(v)) : x.moveTo(xm(m), ym(v)))); x.stroke();
  EU.forEach(([m, v]) => { x.fillStyle = v < 0 ? C.red : C.lime; x.beginPath(); x.arc(xm(m), ym(v), 10, 0, 7); x.fill(); }); x.restore();
  /* testa luminosa */
  let hy = ym(EU[0][1]); for (let i = 1; i < EU.length; i++) { const xa = xm(EU[i - 1][0]), xb = xm(EU[i][0]); if (HX >= xa && HX <= xb) hy = lerp(ym(EU[i - 1][1]), ym(EU[i][1]), (HX - xa) / (xb - xa)); else if (HX > xb) hy = ym(EU[i][1]); }
  if (p > 0.01) { glow(HX, hy, 80, hy > Z ? '255,90,78' : '200,250,114', 0.6); x.fillStyle = C.ink; x.beginPath(); x.arc(HX, hy, 14, 0, 7); x.fill(); }
  const kq = oC(seg(t, tQua - 0.1, tQua + 0.35)); txt('circa 4%', XR, ym(4) - 54, { size: 60, weight: 800, color: C.lime, align: 'right', alpha: kq, blur: (1 - kq) * 10, ls: -1 });
  lab(t, 'DIC 2021', XL, 1330, a + 0.5, { align: 'left', size: 24 }); lab(t, 'OTT 2023', XR, 1330, a + 0.5, { align: 'right', size: 24 });
  x.restore(); finish(t); }

/* ================= ESEMPIO: il mutuo inventato in tre pezzi: un blocco (importo), 25 tessere (anni), due blocchi (Euribor vero + spread inventato) ================= */
function sEsempio(t, a, b) { bg('52,44,20', 0.5); x.save(); zoom(t, a, b, 1.03);
  const tImp = WA('esempio', ['centocinquantamila', '150000', '150.000', '150', 'centocinquanta'], 1, 0.2), tVen = WA('esempio', ['venticinque', '25'], 1, 0.34), tTas = WA('esempio', ['tasso'], 1, 0.5), tPar = WA('esempio', ['pari'], 1, 0.55),
    tMez = WA('esempio', ['mezzo', '1,5', '1'], 1, 0.7), tVer = WA('esempio', ['vero'], 1, 0.95);
  phrase(t, a + 0.05, [['Un mutuo', C.ink], ['inventato', C.amber]], 345, { size: 92 });
  stamp(t, a + 0.3, EX, 610, C.amber);
  /* importo: blocco di vetro */
  const kI = oC(seg(t, tImp - 0.1, tImp + 0.4)), k0 = oB(seg(t, a + 0.3, a + 0.8));
  pop(540, 770, k0, () => { glass(540, 770, 860, 120, 30, 1); });
  lab(t, 'IMPORTO', 130, 770, a + 0.4, { align: 'left', size: 26, color: C.ink });
  txt('150.000 €', 940, 772, { size: 66, weight: 800, color: C.lime, align: 'right', alpha: kI, blur: (1 - kI) * 10, ls: -1 });
  /* durata: 25 tessere, una per anno */
  lab(t, 'DURATA', 130, 905, a + 0.5, { align: 'left', size: 26, color: C.ink });
  const kV = oC(seg(t, tVen - 0.1, tVen + 0.4)); txt('25 ANNI', 950, 905, { size: 52, weight: 800, color: C.lime, align: 'right', alpha: kV, blur: (1 - kV) * 10, ls: -1 });
  const TP = 860 / 25, tT0 = tVen - 0.1, tT1 = Math.max(tT0 + 0.9, tVen + 0.8);
  for (let i = 0; i < 25; i++) { const ki = oC(seg(t, a + 0.5 + i * 0.012, a + 0.9 + i * 0.012)), lt = oC(seg(t, tT0 + (tT1 - tT0) * i / 25, tT0 + (tT1 - tT0) * i / 25 + 0.2)); if (ki <= 0) continue;
    x.save(); x.globalAlpha = ki * (0.4 + 0.6 * lt); x.fillStyle = lt > 0.5 ? C.lime : 'rgba(241,244,238,0.55)'; rr(110 + i * TP, 960 - (1 - ki) * 20, TP - 6, 80, 5); x.fill(); x.restore(); }
  /* tasso: Euribor (vero, pieno) + spread (inventato, tratteggiato) */
  lab(t, 'TASSO', 130, 1150, Math.min(tTas, a + 1.4) - 0.1, { align: 'left', size: 26, color: C.ink });
  const kA = oC(seg(t, tPar - 0.05, tPar + 0.35)), kB = oC(seg(t, tMez - 0.1, tMez + 0.35)), kE = oB(seg(t, a + 0.6, a + 1.1));
  pop(330, 1235, kE, () => { glass(330, 1235, 460, 120, 30, 1); if (kA > 0) { x.save(); x.globalAlpha = kA; x.strokeStyle = C.lime; x.lineWidth = 3.5; rr(100, 1175, 460, 120, 30); x.stroke(); x.restore(); } });
  pop(810, 1235, kE, () => { x.save(); x.setLineDash([10, 8]); x.strokeStyle = kB > 0 ? C.amber : 'rgba(245,165,36,0.5)'; x.lineWidth = 3.5; rr(640, 1175, 340, 120, 30); x.stroke(); x.restore(); });
  txt('EURIBOR', 330, 1237, { size: 56, weight: 800, color: kA > 0.5 ? C.lime : C.ink, alpha: 0.6 + 0.4 * kA, ls: -1 }); txt('+', 600, 1235, { size: 56, weight: 800, color: C.ink, alpha: kE });
  txt('+ 1,5', 810, 1237, { size: 56, weight: 800, color: C.amber, alpha: kB, blur: (1 - kB) * 10, ls: -1 });
  lab(t, 'VERO', 330, 1340, tVer - 0.1, { color: C.lime, size: 28, ls: 4 }); lab(t, 'INVENTATO', 810, 1340, tMez + 0.3, { color: C.amber, size: 28, ls: 4 });
  x.restore(); finish(t); }

/* ================= PRIMA / DOPO: una sola torre di monete (1 moneta = 20 €) che continua da una scena all'altra ================= */
const TWR = { CX: 330, BASE: 1380, R: 130, P: 14 }, cy_ = (i) => TWR.BASE - i * TWR.P;
function sPrima(t, a, b) { bg('30,44,26'); x.save(); zoom(t, a, b, 1.04);
  const tFin = WA('prima', ['fine'], 1, 0.12), tSot = WA('prima', ['sotto'], 1, 0.3), tCin = WA('prima', ['cinquecentosessanta', 'cinquecento', '560', '500'], 1, 0.75);
  phrase(t, a + 0.05, [['La rata di partenza', C.ink]], 345, { size: 88 });
  lab(t, EX, 540, 570, a + 0.3, { color: C.amber, size: 22 });
  for (let i = 0; i < 28; i++) { const ti = a + 0.2 + i * 0.03, k = oB(seg(t, ti, ti + 0.3)); if (k <= 0) continue; coin(TWR.CX, cy_(i) - (1 - clamp(k)) * 160, TWR.R, clamp(k * 2), '200,250,114', '€'); }
  const kg = oC(seg(t, a + 1.0, a + 1.6)); glow(TWR.CX, cy_(27), 260, '200,250,114', 0.12 * kg);
  const kf = seg(t, tFin - 0.1, tFin + 0.45); if (kf > 0) glassPill(770, 760, 'FINE 2021', kf, C.lime, 40);
  const ks = seg(t, tSot - 0.1, tSot + 0.45); if (ks > 0) glassPill(770, 900, 'SOTTO ZERO', ks, C.red, 40);
  lab(t, 'CIRCA', 770, 1030, tCin - 0.1, { color: C.ink, size: 26, ls: 4 });
  const kn = oC(seg(t, tCin - 0.1, tCin + 0.4)); txt('560 €', 770, 1120, { size: 112, weight: 800, color: C.lime, alpha: kn, blur: (1 - kn) * 12, ls: -2 });
  lab(t, 'AL MESE', 770, 1215, tCin + 0.15, { color: C.ink, size: 28, ls: 4 });
  x.restore(); finish(t); }

function sDopo(t, a, b) { bg('52,34,28', 0.6); x.save(); zoom(t, a, b, 1.03);
  const tOtt = WA('dopo', ['ottobre'], 1, 0.12), tSal = WA('dopo', ['sale'], 1, 0.3), tNov = WA('dopo', ['novecentoventi', 'novecento', '920', '900'], 1, 0.52), tTre = WA('dopo', ['trecentocinquanta', 'trecento', '350'], 1, 0.7), tQua = WA('dopo', ['quattromila', '4000', '4.000', 'quattro'], 1, 0.9);
  phrase(t, a + 0.05, [['Dopo,', C.ink]], 345, { size: 92 });
  phrase(t, tSal - 0.1, [['la rata sale', C.red]], Y2, { size: 92 });
  lab(t, EX, 540, 570, a + 0.3, { color: C.amber, size: 22 });
  glow(TWR.CX, cy_(27), 260, '200,250,114', 0.12);
  for (let i = 0; i < 28; i++) coin(TWR.CX, cy_(i), TWR.R, 1, '200,250,114', '€');
  /* monete rosse: all'inizio solo il binario tratteggiato, poi si accendono dalla parola «sale» fino a «novecentoventi» */
  const r0 = tSal - 0.1, r1 = Math.max(r0 + 1.0, tNov + 0.3);
  for (let i = 28; i < 46; i++) { const f = (i - 28) / 17, ti = r0 + (r1 - r0) * f, k = oB(seg(t, ti, ti + 0.28)), kg = oC(seg(t, a + 0.3 + (i - 28) * 0.03, a + 0.8 + (i - 28) * 0.03));
    if (k <= 0) { x.save(); x.globalAlpha = kg * 0.45; x.setLineDash([8, 7]); x.strokeStyle = C.red; x.lineWidth = 3; x.beginPath(); x.ellipse(TWR.CX, cy_(i), TWR.R, TWR.R * 0.32, 0, 0, 7); x.stroke(); x.restore(); }
    else coin(TWR.CX, cy_(i) - (1 - clamp(k)) * 140, TWR.R, clamp(k * 2), '255,90,78', '€'); }
  /* riga del livello di prima e graffa della differenza */
  const yA = cy_(27), yB = cy_(45), kl = oC(seg(t, a + 0.5, a + 1.0)), kd = oC(seg(t, tTre - 0.1, tTre + 0.4));
  dash(TWR.CX + TWR.R + 10, yA, 500, yA, C.lime, 3, [8, 7], kl);
  x.save(); x.globalAlpha = kd; x.strokeStyle = C.red; x.lineWidth = 4; x.lineCap = 'round'; x.beginPath(); x.moveTo(488, yA); x.lineTo(500, yA); x.lineTo(500, yB); x.lineTo(488, yB); x.stroke(); x.restore();
  const ko = seg(t, tOtt - 0.1, tOtt + 0.45); if (ko > 0) glassPill(770, 660, 'OTTOBRE 2023', ko, C.red, 38);
  const kn = oC(seg(t, tNov - 0.1, tNov + 0.4)); txt('920 €', 770, 790, { size: 108, weight: 800, color: C.red, alpha: kn, blur: (1 - kn) * 12, ls: -2 }); lab(t, 'CIRCA · AL MESE', 770, 865, tNov + 0.1, { color: C.ink, size: 26, ls: 3 });
  const k3 = oC(seg(t, tTre - 0.1, tTre + 0.4)); txt('più di 350 €', 770, 990, { size: 62, weight: 800, color: C.ink, alpha: k3, blur: (1 - k3) * 10, ls: -1 }); lab(t, 'AL MESE', 770, 1045, tTre + 0.1, { color: C.ink, size: 26, ls: 4 });
  const k4 = oC(seg(t, tQua - 0.1, tQua + 0.4)); txt('oltre 4.000 €', 770, 1160, { size: 62, weight: 800, color: C.red, alpha: k4, blur: (1 - k4) * 10, ls: -1 }); lab(t, 'ALL’ANNO', 770, 1215, tQua + 0.1, { color: C.ink, size: 26, ls: 4 });
  x.restore(); finish(t); }

/* ================= FAMIGLIE: sei colonne-famiglia; la rata di prima (100%) e la parte che sale oltre la linea del +30%; STIMA ben visibile ================= */
const FG = { BASE: 1090, X0: 130, DX: 125, W: 80, B100: 200, GROW: [75, 100, 135, 85, 170, 110] };
function sFamiglie(t, a, b) { bg('52,34,28', 0.6); x.save(); zoom(t, a, b, 1.03);
  const tSti = WA('famiglie', ['stima'], 1, 0.12), tBan = WA('famiglie', ['banca'], 1, 0.2), tNum = WA('famiglie', ['duecentocinquantaseimila', '256000', '256.000', '256', 'duecento'], 1, 0.45), tSal = WA('famiglie', ['salire'], 1, 0.74), tTre = WA('famiglie', ['trenta', '30'], 1, 0.9);
  phrase(t, a + 0.05, [['Nella realtà', C.ink]], 345, { size: 92 });
  const kS = oB(seg(t, a + 0.25, a + 0.8)); pop(540, 540, kS, () => { glass(540, 540, 330, 96, 48, 1); txt('STIMA', 540, 542, { size: 52, weight: 800, color: C.amber, ls: 6 }); });
  const { BASE, X0, DX, W, B100, GROW } = FG, TH = BASE - B100 - 0.3 * B100, kb = oC(seg(t, a + 0.3, a + 0.8));
  x.save(); x.strokeStyle = 'rgba(241,244,238,0.25)'; x.lineWidth = 3; x.globalAlpha = kb; x.beginPath(); x.moveTo(90, BASE + 4); x.lineTo(990, BASE + 4); x.stroke(); x.restore();
  for (let i = 0; i < 6; i++) { const cx = X0 + i * DX, k = oC(seg(t, a + 0.3 + i * 0.07, a + 0.8 + i * 0.07)), h = B100 * k, top = BASE - B100, gy = BASE - B100 - GROW[i];
    /* base: la rata di prima (100%) */
    x.save(); x.fillStyle = 'rgba(241,244,238,0.30)'; rr(cx - W / 2, BASE - h, W, h, 6); x.fill(); x.strokeStyle = 'rgba(241,244,238,0.55)'; x.lineWidth = 2.5; rr(cx - W / 2, BASE - h, W, h, 6); x.stroke(); x.restore();
    /* aumento: binario vuoto tratteggiato, poi pieno sulla parola «salire» */
    const ts = tSal - 0.1 + i * 0.09, kf = oC(seg(t, ts, ts + 0.5)), ke = oC(seg(t, a + 0.7 + i * 0.07, a + 1.2 + i * 0.07));
    if (kf < 1) { x.save(); x.globalAlpha = ke * (1 - kf) * 0.55; x.setLineDash([8, 7]); x.strokeStyle = C.red; x.lineWidth = 3; rr(cx - W / 2, gy, W, GROW[i], 6); x.stroke(); x.restore(); }
    if (kf > 0) { const gh = GROW[i] * kf; x.save(); x.fillStyle = C.red; rr(cx - W / 2, top - gh, W, gh, 6); x.fill(); x.restore(); if (kf < 1) glow(cx, top - gh, 90, '255,90,78', 0.4); } }
  /* linea del +30%: spenta, poi accesa sulla parola «trenta» */
  const kt = oC(seg(t, tTre - 0.1, tTre + 0.3)), kl = oC(seg(t, a + 0.5, a + 1.0)); dash(90, TH, 800, TH, kt > 0.3 ? C.lime : 'rgba(241,244,238,0.4)', 3, [10, 8], kl);
  txt('+30%', 910, TH, { size: 54, weight: 800, color: C.lime, alpha: kt, blur: (1 - kt) * 10, ls: -1 });
  const kn = oC(seg(t, tNum - 0.1, tNum + 0.4)); txt('256.000', 540, 1215, { size: 120, weight: 800, color: C.red, alpha: kn, blur: (1 - kn) * 14, ls: -2 }); lab(t, 'FAMIGLIE', 540, 1295, tNum + 0.15, { color: C.ink, size: 30, ls: 6 });
  const kp = seg(t, tBan - 0.1, tBan + 0.45); if (kp > 0) glassPill(540, 1385, 'BANCA D’ITALIA', kp, C.ink, 40);
  x.restore(); finish(t); }

/* ================= MEDIANA: nove case in fila ordinate, quella di mezzo si accende; sotto due barre in scala (1 px = 1 €) ================= */
function sMediana(t, a, b) { bg('52,44,20', 0.5); x.save(); zoom(t, a, b, 1.03);
  const tMed = WA('mediana', ['mediana'], 1, 0.14), tSei = WA('mediana', ['seicento', '600', 'sei'], 1, 0.55), tSet = WA('mediana', ['settecentottanta', '780', 'settecento'], 1, 0.82);
  phrase(t, a + 0.05, [['La famiglia', C.ink], ['mediana', C.lime]], 345, { size: 92 });
  const kS = oB(seg(t, a + 0.25, a + 0.8)); pop(540, 610, kS, () => { glass(540, 610, 300, 80, 40, 1); txt('STIMA', 540, 612, { size: 44, weight: 800, color: C.amber, ls: 6 }); });
  /* le nove case: crescono da sinistra a destra, quella di mezzo e' la mediana */
  const kM = oC(seg(t, tMed - 0.1, tMed + 0.35));
  for (let i = 0; i < 9; i++) { const cx = 140 + i * 100, hh = lerp(36, 84, i / 8), k = oB(seg(t, a + 0.3 + i * 0.05, a + 0.8 + i * 0.05)), mid = i === 4;
    pop(cx, 790, k, () => { x.save(); const on = mid && kM > 0.5; x.strokeStyle = on ? C.lime : 'rgba(241,244,238,0.55)'; x.fillStyle = on ? 'rgba(200,250,114,0.25)' : 'rgba(241,244,238,0.08)'; x.lineWidth = on ? 5 : 3.5; x.lineJoin = 'round';
      const w = 30 + hh * 0.35, by = 810; x.beginPath(); x.moveTo(cx - w / 2 - 6, by - hh * 0.6); x.lineTo(cx, by - hh); x.lineTo(cx + w / 2 + 6, by - hh * 0.6); x.closePath(); x.fill(); x.stroke(); x.beginPath(); x.rect(cx - w / 2, by - hh * 0.6, w, hh * 0.6); x.fill(); x.stroke(); x.restore(); }); }
  glow(540, 780, 110, '200,250,114', 0.35 * kM);
  lab(t, 'AL CENTRO', 540, 860, tMed + 0.1, { color: C.lime, size: 26, ls: 4 });
  /* due barre: binario vuoto dall'inizio, si riempiono sulle parole */
  const BX = 120, B1 = 1020, B2 = 1200, BH = 96, k1 = oC(seg(t, tSei - 0.1, tSei + 0.7)), k2 = oC(seg(t, tSet - 0.1, tSet + 0.7)), ke = oC(seg(t, a + 0.5, a + 1.0));
  lab(t, 'LA RATA, PRIMA', BX, B1 - 66, a + 0.5, { align: 'left', size: 26, color: C.ink }); lab(t, 'LA RATA, DOPO', BX, B2 - 66, a + 0.6, { align: 'left', size: 26, color: C.ink });
  [[B1, 600, k1, C.lime], [B2, 780, k2, C.red]].forEach(([y, v, kk, col]) => { x.save(); x.globalAlpha = ke * (1 - kk) * 0.6; x.setLineDash([8, 7]); x.strokeStyle = col; x.lineWidth = 3; rr(BX, y - BH / 2, 840, BH, 14); x.stroke(); x.restore();
    if (kk > 0) { x.save(); x.fillStyle = col; rr(BX, y - BH / 2, v * kk, BH, 14); x.fill(); x.restore(); } });
  const kt1 = oC(seg(t, tSei, tSei + 0.5)), kt2 = oC(seg(t, tSet, tSet + 0.5));
  txt('circa 600 €', BX + 600 - 28, B1 + 2, { size: 52, weight: 800, color: '#15200C', align: 'right', alpha: kt1, ls: -1 }); txt('circa 780 €', BX + 780 - 28, B2 + 2, { size: 52, weight: 800, color: '#2A0806', align: 'right', alpha: kt2, ls: -1 });
  lab(t, 'AL MESE', 540, 1320, tSei + 0.3, { color: C.ink, size: 28, ls: 6 });
  x.restore(); finish(t); }

/* ================= CASA: due pannelli (FISSO / VARIABILE); il tasso si muove in entrambi, la rata segue solo nel variabile; il lucchetto si chiude nel fisso ================= */
function sCasa(t, a, b) { bg('30,44,26'); x.save(); zoom(t, a, b, 1.04);
  const tVar = WA('casa', ['variabile'], 1, 0.2), tSeg = WA('casa', ['segue'], 1, 0.34), tTas = WA('casa', ['tasso'], 1, 0.46), tFis = WA('casa', ['fisso'], 1, 0.62), tRes = WA('casa', ['resta'], 1, 0.84);
  phrase(t, a + 0.05, [['Cosa ti porti', C.ink], ['a casa?', C.lime]], 345, { size: 92 });
  const PY = 920, PH = 700, TOP = PY - PH / 2, CX = [280, 770], TRK_TOP = 700, TRK_BOT = 1200, TH_ = TRK_BOT - TRK_TOP;
  /* il tasso sale, scende un po', risale: la rata variabile lo segue; quella ferma no */
  const m0 = tSeg - 0.2, m1 = Math.max(m0 + 2.0, tTas + 0.9), kf = [[0, 0.40], [0.3, 0.72], [0.55, 0.52], [1, 0.86]];
  const pm = clamp((t - m0) / (m1 - m0)); let lv = 0.40; for (let i = 1; i < kf.length; i++) if (pm >= kf[i - 1][0] && pm <= kf[i][0]) lv = lerp(kf[i - 1][1], kf[i][1], ioC((pm - kf[i - 1][0]) / (kf[i][0] - kf[i - 1][0]))); if (pm >= 1) lv = 0.86;
  const rataFis = 0.40, rataVar = lv;
  [['FISSO', C.lime, '200,250,114', tFis, rataFis], ['VARIABILE', C.red, '255,90,78', tVar, rataVar]].forEach(([nm, col, rgb, tw_, rv], i) => { const cx = CX[i], k = oB(seg(t, a + 0.25 + i * 0.12, a + 0.8 + i * 0.12)), on = t >= tw_ - 0.1;
    pop(cx, PY, k, () => { glass(cx, PY, 400, PH, 40, 1);
      txt(nm, cx, TOP + 56, { fam: 'mono', size: 30, weight: 700, color: on ? col : C.muted, ls: 4 });
      /* due binari: TASSO (sottile, a sinistra) e RATA (largo, a destra) */
      const tx = cx - 95, rx = cx + 30, rw = 120;
      x.save(); x.strokeStyle = 'rgba(241,244,238,0.30)'; x.lineWidth = 3; rr(tx - 12, TRK_TOP, 24, TH_, 12); x.stroke(); rr(rx - rw / 2, TRK_TOP, rw, TH_, 12); x.stroke(); x.restore();
      const hy = TRK_BOT - lv * TH_, ry = TRK_BOT - rv * TH_;
      x.save(); x.fillStyle = 'rgba(241,244,238,0.85)'; rr(tx - 12, hy, 24, TRK_BOT - hy, 12); x.fill(); x.restore();
      x.save(); x.fillStyle = on ? col : 'rgba(241,244,238,0.5)'; rr(rx - rw / 2, ry, rw, TRK_BOT - ry, 12); x.fill(); x.restore();
      /* maniglia del tasso */
      x.save(); x.fillStyle = C.ink; x.beginPath(); x.arc(tx, hy, 20, 0, 7); x.fill(); x.restore();
      if (i === 1) dash(tx + 24, hy, rx - rw / 2 - 8, ry, C.lime, 3, [5, 7], oC(seg(t, tSeg - 0.1, tSeg + 0.4)));
      lab(t, 'TASSO', tx, TRK_BOT + 44, a + 0.5, { size: 22, color: C.ink, ls: 2 }); lab(t, 'RATA', rx, TRK_BOT + 44, a + 0.5, { size: 22, color: C.ink, ls: 2 });
      glow(rx, ry, 100, rgb, 0.18 * (on ? 1 : 0)); }); });
  /* lucchetto: sul pannello fisso, a destra sopra il binario della rata; si chiude sulla parola «resta» */
  const kc = oC(seg(t, tRes - 0.15, tRes + 0.4)), lx = CX[0] + 30, ly = 640;
  x.save(); x.globalAlpha = oC(seg(t, a + 0.6, a + 1.1)) * (0.5 + 0.5 * kc); x.strokeStyle = kc > 0.5 ? C.lime : 'rgba(241,244,238,0.6)'; x.fillStyle = kc > 0.5 ? 'rgba(200,250,114,0.25)' : 'rgba(241,244,238,0.1)'; x.lineWidth = 6; x.lineCap = 'round';
  const lift = 20 * (1 - kc); x.beginPath(); x.arc(lx, ly - 14 - lift, 20, Math.PI, 0); x.lineTo(lx + 20, ly - 8 - lift * 0.4); x.stroke(); rr(lx - 30, ly - 8, 60, 44, 9); x.fill(); x.stroke(); x.restore();
  x.restore(); finish(t); }

serie({ hook: sHook, bce: sBce, euribor: sEuribor, sale: sSale, esempio: sEsempio, prima: sPrima, dopo: sDopo, famiglie: sFamiglie, mediana: sMediana, casa: sCasa }, ORDER, ['hook', 'famiglie', 'casa']);
</script></body></html>
