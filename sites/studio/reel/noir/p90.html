<script>const P = { EP: '♠', DAY: 0, CAP: 10, NEXT: ['', ''], FONTE: '' };</script>
<script src="serie.js"></script>
<script>
/* REEL EXTRA p90 «Il trading è come il poker» (fuori serie). Fonti e conti: p90-fonti.md.
   Palette rosso e nero (C ridefinito sotto). Numeri a schermo solo da p90-fonti.md: ≈82% / ≈18%, 4 su 10 e doppio (ESEMPIO · CIFRE INVENTATE),
   +20 su 100 mani, ≈ 8 su 100, 1% → −9,6% (circa −10%), 10% → −65% (quasi due terzi). Le carte usano solo lettere (A K Q J).
   Niente scene num/fine/cta/end, niente firma né account: il video finisce su «casa» con la picca disegnata a mano.
   I commenti nel codice sono solo racchiusi tra asterischi e barre. */
Object.assign(C, { ink: '#F4EFE9', muted: '#9A9590', lime: '#E8C46A', amber: '#E8C46A', red: '#FF4458' }); /* palette rosso e nero: lime/amber = oro (guadagni), red = perdite e accento */
const ORDER = ['hook', 'cose', 'carte', 'tre', 'assi', 'mille', 'esempio', 'cento', 'punta', 'fila', 'uno', 'dieci', 'casa'];

/* ---------- aiuti ---------- */
const rngf = (seed) => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
const WA = (k, alts, n = 1, riserva = 0.8) => { const L = ((window.WORDS || {})[k]) || []; let c = 0;
  for (const [p, t] of L) { const w = _nw(p); if (alts.some((q) => w.startsWith(_nw(q))) && ++c === n) return t; }
  return S(k) + riserva; };
const hx = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const shade = (h, k) => { const [r, g, b] = hx(h); return `rgb(${Math.round(r * k)},${Math.round(g * k)},${Math.round(b * k)})`; };
const lab = (s, px, py, col = C.muted, size = 26, o = {}) => txt(s, px, py, { fam: 'mono', size, weight: 600, color: col, ls: 2, ...o });
const T2 = 345 + 92 * 1.12; /* y della seconda riga del titolo a size 92 */
const MINUS = '−';

/* ---------- semi disegnati a mano (nessun glifo dal font) ---------- */
const SP = {
  S: new Path2D('M0 -1 C0.15 -0.65 0.95 -0.4 0.95 0.1 C0.95 0.55 0.4 0.7 0.12 0.35 C0.12 0.6 0.2 0.85 0.4 1 L-0.4 1 C-0.2 0.85 -0.12 0.6 -0.12 0.35 C-0.4 0.7 -0.95 0.55 -0.95 0.1 C-0.95 -0.4 -0.15 -0.65 0 -1 Z'),
  H: new Path2D('M0 0.95 C-0.2 0.75 -1 0.2 -1 -0.35 C-1 -0.8 -0.65 -1 -0.4 -1 C-0.2 -1 -0.05 -0.9 0 -0.65 C0.05 -0.9 0.2 -1 0.4 -1 C0.65 -1 1 -0.8 1 -0.35 C1 0.2 0.2 0.75 0 0.95 Z'),
  D: new Path2D('M0 -1 L0.68 0 L0 1 L-0.68 0 Z') };
SP.Cc = new Path2D(); SP.Cc.moveTo(0.42, -0.5); SP.Cc.arc(0, -0.5, 0.42, 0, 7); SP.Cc.moveTo(-0.08, 0.2); SP.Cc.arc(-0.5, 0.2, 0.42, 0, 7); SP.Cc.moveTo(0.92, 0.2); SP.Cc.arc(0.5, 0.2, 0.42, 0, 7);
SP.Cs = new Path2D('M0 -0.1 L0.3 1 L-0.3 1 Z');
const RED = '#C41E34', BLK = '#0B0D0C';
function suit(s, cx, cy, r, col) { x.save(); x.translate(cx, cy); x.scale(r, r); x.fillStyle = col;
  if (s === 'C') { x.fill(SP.Cc); x.fill(SP.Cs); } else x.fill(SP[s]); x.restore(); }

/* carta: flip 0 = coperta, 1 = scoperta (si gira restringendosi in larghezza) */
function card(cx, cy, w, o = {}) { const { rot = 0, flip = 1, rank = 'A', st = 'S', alpha = 1, dim = 0, q = false } = o; if (alpha <= 0.01) return;
  const h = w * 1.4, f = clamp(flip), sx = Math.max(0.02, Math.abs(Math.cos(Math.PI * f))), face = f > 0.5, col = st === 'H' || st === 'D' ? RED : BLK;
  x.save(); x.globalAlpha *= alpha; x.translate(cx, cy); x.rotate(rot); x.scale(sx, 1);
  x.fillStyle = 'rgba(0,0,0,0.42)'; rr(-w / 2 + 5, -h / 2 + 12, w, h, w * 0.1); x.fill();
  if (face) { const g = x.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2); g.addColorStop(0, '#F4F6F1'); g.addColorStop(1, '#D9DDD6'); x.fillStyle = g; rr(-w / 2, -h / 2, w, h, w * 0.1); x.fill();
    for (const side of [0, 1]) { x.save(); if (side) x.rotate(Math.PI); txt(rank, -w * 0.27, -h * 0.34, { size: w * 0.34, weight: 800, color: col, ls: -1 }); suit(st, -w * 0.27, -h * 0.17, w * 0.1, col); x.restore(); }
    suit(st, 0, 0, w * 0.27, col); }
  else { x.fillStyle = '#3a0a14'; rr(-w / 2, -h / 2, w, h, w * 0.1); x.fill();
    x.save(); rr(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, w * 0.07); x.clip(); x.strokeStyle = 'rgba(255,68,88,0.4)'; x.lineWidth = 2;
    for (let i = -14; i <= 14; i++) { x.beginPath(); x.moveTo(-w + i * 22, -h); x.lineTo(w + i * 22, h); x.stroke(); x.beginPath(); x.moveTo(w - i * 22, -h); x.lineTo(-w - i * 22, h); x.stroke(); }
    x.restore(); x.strokeStyle = 'rgba(232,196,106,0.6)'; x.lineWidth = 3; rr(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, w * 0.07); x.stroke();
    x.fillStyle = 'rgba(232,196,106,0.85)'; x.beginPath(); x.moveTo(0, -w * 0.2); x.lineTo(w * 0.14, 0); x.lineTo(0, w * 0.2); x.lineTo(-w * 0.14, 0); x.closePath(); x.fill();
    if (q) txt('?', 0, 4, { size: w * 0.5, weight: 800, color: '#0E1411', alpha: 1 }); }
  if (dim > 0) { x.fillStyle = `rgba(5,6,7,${dim})`; rr(-w / 2, -h / 2, w, h, w * 0.1); x.fill(); }
  x.restore(); }
function pair(cx, cy, w, hnd, o = {}) { const { rot = 0, ...rest } = o;
  card(cx - w * 0.36, cy, w, { rank: hnd[0], st: hnd[1], rot: -0.11 + rot, ...rest }); card(cx + w * 0.36, cy + 8, w, { rank: hnd[2], st: hnd[3], rot: 0.11 + rot, ...rest }); }
const HANDS = [['A', 'S', 'K', 'S'], ['Q', 'H', 'J', 'H'], ['K', 'D', 'Q', 'C'], ['J', 'S', 'A', 'D'], ['K', 'H', 'Q', 'S'], ['A', 'C', 'J', 'D']];

/* tavolo visto dall'alto: bordo scuro con filo lime, feltro verde scuro, linea delle puntate */
function felt(cx, cy, w, h, k = 1) { if (k <= 0) return; const r = Math.min(w, h) / 2, m = 24;
  x.save(); x.globalAlpha *= clamp(k);
  const g0 = x.createLinearGradient(0, cy - h / 2, 0, cy + h / 2); g0.addColorStop(0, '#2b312d'); g0.addColorStop(1, '#0f1311');
  x.fillStyle = g0; rr(cx - w / 2, cy - h / 2, w, h, r); x.fill();
  x.strokeStyle = 'rgba(232,196,106,0.35)'; x.lineWidth = 2.5; rr(cx - w / 2, cy - h / 2, w, h, r); x.stroke();
  const g = x.createRadialGradient(cx, cy - h * 0.12, 20, cx, cy, w * 0.62); g.addColorStop(0, '#4a0f1c'); g.addColorStop(1, '#14050a');
  x.fillStyle = g; rr(cx - w / 2 + m, cy - h / 2 + m, w - 2 * m, h - 2 * m, r - m); x.fill();
  x.strokeStyle = 'rgba(241,244,238,0.14)'; x.lineWidth = 3; x.setLineDash([4, 14]); x.lineCap = 'round'; rr(cx - w / 2 + 70, cy - h / 2 + 70, w - 140, h - 140, r - 70); x.stroke(); x.setLineDash([]);
  x.restore(); }

/* fiches: stack = pila vista di lato (n può avere decimali), chipTop = vista dall'alto */
function stack(cx, by, n, o = {}) { const { rx = 100, ry = 28, th = 5, col = C.lime, alpha = 1, hl = 0, hlCol = C.red } = o; if (n <= 0.01) return;
  x.save(); x.globalAlpha *= alpha; const NN = Math.ceil(n - 1e-6);
  for (let i = 0; i < NN; i++) { const f = Math.min(1, n - i), yb = by - i * th, yt = yb - th * f, top = i === NN - 1, c = hl > 0 && i >= NN - hl ? hlCol : col;
    x.fillStyle = shade(c, i % 2 ? 0.6 : 0.8); x.beginPath(); x.moveTo(cx - rx, yt); x.lineTo(cx - rx, yb); x.ellipse(cx, yb, rx, ry, 0, Math.PI, 0, true); x.lineTo(cx + rx, yt); x.closePath(); x.fill();
    if (top) { x.fillStyle = shade(c, 1); x.beginPath(); x.ellipse(cx, yt, rx, ry, 0, 0, 7); x.fill(); x.strokeStyle = 'rgba(241,244,238,0.55)'; x.lineWidth = 2; x.stroke();
      x.beginPath(); x.ellipse(cx, yt, rx * 0.66, ry * 0.66, 0, 0, 7); x.strokeStyle = 'rgba(5,6,7,0.5)'; x.stroke(); } }
  x.restore(); }
function chipTop(cx, cy, r, col, o = {}) { const { sx = 1, alpha = 1, inner = '#0F1311' } = o; if (alpha <= 0.01) return;
  x.save(); x.globalAlpha *= alpha; x.translate(cx, cy); x.scale(Math.max(0.03, Math.abs(sx)), 1);
  x.fillStyle = 'rgba(0,0,0,0.45)'; x.beginPath(); x.arc(0, 8, r, 0, 7); x.fill();
  x.fillStyle = col; x.beginPath(); x.arc(0, 0, r, 0, 7); x.fill();
  for (let i = 0; i < 8; i++) { x.save(); x.rotate(i * Math.PI / 4); x.fillStyle = 'rgba(241,244,238,0.92)'; x.fillRect(-r * 0.15, -r * 0.98, r * 0.3, r * 0.2); x.restore(); }
  x.fillStyle = inner; x.beginPath(); x.arc(0, 0, r * 0.64, 0, 7); x.fill(); x.strokeStyle = col; x.lineWidth = Math.max(2, r * 0.045); x.stroke();
  x.restore(); }

/* ======================= 1. hook: il tavolo e le carte che vengono distribuite ======================= */
function sHook(t, a, b) { bg('62,12,22'); x.save(); zoom(t, a, b, 1.05);
  const tB = WT('hook', 'vince', 2, 5.0) - 0.1, kT = oC(seg(t, 0, 0.18));
  felt(540, 1010, 900, 700, kT);
  for (let i = 0; i < 3; i++) card(850 - i * 3, 790 - i * 3, 90, { flip: 0, rot: 0.08, alpha: kT });
  /* fiches: la pila a destra cresce quando la voce dice «quanto puntare» */
  const bet = 3 + 6 * oB(seg(t, tB, tB + 0.9)); glow(830, 1190, 160, '232,196,106', 0.18 * seg(t, tB, tB + 0.6));
  stack(830, 1255, bet, { rx: 56, ry: 17, th: 11, col: C.red, alpha: kT }); stack(920, 1275, 4, { rx: 48, ry: 15, th: 11, col: C.ink, alpha: kT });
  chipTop(235, 1215, 46, C.lime, { alpha: kT }); chipTop(305, 1255, 46, C.ink, { alpha: kT }); chipTop(215, 1110, 40, C.red, { alpha: kT });
  /* distribuzione: 7 carte dal mazzo, già in corso a 0,3 s (copertina) */
  const SL = [[490, 1170, 140, -0.11], [284, 945, 112, 0], [590, 1178, 140, 0.11], [412, 945, 112, 0], [540, 945, 112, 0], [668, 945, 112, 0], [796, 945, 112, 0]];
  const FLP = { 1: ['Q', 'H'], 3: ['J', 'C'], 4: ['K', 'D'] };
  SL.forEach(([tx, ty, w, rot], j) => { const td = -1.4 + j * 0.22, e = oC(seg(t, td, td + 0.5)); if (e <= 0) return; const hole = j === 0 || j === 2;
    const px = lerp(850, tx, e), py = lerp(790, ty, e) - Math.sin(Math.PI * e) * 70, ww = lerp(90, w, e);
    const fl = hole ? ioC(seg(t, -0.15 + (j ? 0.15 : 0), 0.25 + (j ? 0.15 : 0))) : FLP[j] ? ioC(seg(t, 2.3 + j * 0.12, 2.8 + j * 0.12)) : 0;
    const rk = hole ? 'A' : (FLP[j] || [])[0], st = hole ? (j ? 'H' : 'S') : (FLP[j] || [])[1];
    card(px, py + (hole ? 0 : Math.sin(t * 1.6 + j) * 3 * e), ww, { flip: fl, rank: rk, st, rot: lerp(0.6, rot, e), alpha: clamp(e * 4) }); });
  phrase(t, -0.12, [['Il trading è', C.ink], ['come il poker.', C.red]], 345, { size: 92, st: 0.04, out: tB - 0.05 });
  phrase(t, tB, [['Vince chi sa', C.ink], ['quanto puntare.', C.red]], 345, { size: 92, st: 0.14 });
  x.restore(); finish(t); }

/* ======================= 2. cose: il grafico a candele dell'oro, BUY e SELL ======================= */
const CAND = (() => { const r = rngf(9); let p = 50; const a = []; for (let i = 0; i < 28; i++) { const dir = i < 14 ? 1 : -1, o = p, c = p + dir * (2 + r() * 4.5) + (r() - 0.5) * 3; p = c; a.push([o, c, Math.max(o, c) + r() * 3.5, Math.min(o, c) - r() * 3.5]); } return a; })();
const CMIN = Math.min(...CAND.map((c) => c[3])), CMAX = Math.max(...CAND.map((c) => c[2]));
const RED2 = '#E0263C';
function candle(cx, yo, yc, yh, yl, w, up, al = 1) { const col = up ? C.lime : RED2; x.save(); x.globalAlpha *= al; x.strokeStyle = col; x.lineWidth = Math.max(3, w * 0.12); x.lineCap = 'round';
  x.beginPath(); x.moveTo(cx, yh); x.lineTo(cx, yl); x.stroke(); x.fillStyle = col; rr(cx - w / 2, Math.min(yo, yc), w, Math.max(6, Math.abs(yc - yo)), 4); x.fill(); x.restore(); }
function arrowUD(cx, cy, s, up, col) { x.save(); x.translate(cx, cy); x.scale(s, up ? -s : s); x.strokeStyle = col; x.lineWidth = 8; x.lineCap = 'round'; x.lineJoin = 'round'; x.beginPath(); x.moveTo(0, -22); x.lineTo(0, 22); x.moveTo(-15, 8); x.lineTo(0, 24); x.lineTo(15, 8); x.stroke(); x.restore(); }
function sCose(t, a, b) { bg('56,14,24'); x.save(); zoom(t, a, b, 1.04);
  const tS = WA('cose', ['vendere', 'venderlo'], 1, 4.6) - 0.2, tBuy = WA('cose', ['comprare'], 1, 1.0) - 0.1, kp = oC(seg(t, a + 0.05, a + 0.5));
  glass(540, 1010, 900, 640, 40, kp); lab('ORO', 150, 735, C.ink, 26, { align: 'left', alpha: kp }); lab('ILLUSTRAZIONE', 930, 735, C.muted, 22, { align: 'right', alpha: kp });
  const X0 = 150, X1 = 930, Y0 = 790, Y1 = 1270, ym = (v) => lerp(Y1, Y0, (v - CMIN) / (CMAX - CMIN)), cw = (X1 - X0) / 28;
  const n1 = seg(t, tBuy + 0.2, tS) * 14, n2 = seg(t, tS, tS + 3.0) * 14, n = Math.min(14, n1) + (t >= tS ? n2 : 0);
  CAND.forEach(([o, c, h, l], i) => { const k = clamp(n - i); if (k <= 0) return; const cx = X0 + cw * (i + 0.5), mid = (o + c) / 2, kk = oC(k);
    candle(cx, ym(lerp(mid, o, kk)), ym(lerp(mid, c, kk)), ym(lerp(mid, h, kk)), ym(lerp(mid, l, kk)), cw * 0.6, c >= o, clamp(k * 3)); });
  const kb = oC(seg(t, tBuy, tBuy + 0.4)), ks = oC(seg(t, tS, tS + 0.4)), onB = t < tS;
  glass(300, 1395, 280, 96, 48, kb); arrowUD(235, 1395, 0.9, true, onB ? C.lime : C.muted); txt('BUY', 340, 1397, { size: 48, weight: 800, color: onB ? C.lime : C.muted, alpha: kb });
  glass(780, 1395, 280, 96, 48, ks); arrowUD(715, 1395, 0.9, false, C.red); txt('SELL', 830, 1397, { size: 48, weight: 800, color: C.red, alpha: ks });
  phrase(t, a + 0.05, [['Comprare l’oro:', C.ink], ['speri che salga.', C.lime]], 345, { size: 92, out: tS - 0.05 });
  phrase(t, tS, [['Venderlo:', C.ink], ['speri che scenda.', C.red]], 345, { size: 92 });
  x.restore(); finish(t); }

/* ======================= 3. carte: le carte che arrivano diventano candele ======================= */
function sCarte(t, a, b) { bg('56,14,24'); x.save(); zoom(t, a, b, 1.05);
  const t0 = a + 0.15, tM = WT('carte', 'mercato', 1, 2.6) - 0.3, tN = WT('carte', 'non', 1, 3.6) - 0.1, kt = oC(seg(t, a, a + 0.4));
  felt(540, 1000, 900, 640, kt * (1 - oC(seg(t, tM + 0.5, tM + 1.2))));
  for (let i = 0; i < 3; i++) card(830 - i * 3, 780 - i * 3, 100, { flip: 0, rot: 0.1, alpha: 1 - oC(seg(t, tM + 0.4, tM + 1.0)) });
  const H5 = [140, 90, 190, 110, 160], UP = [1, 0, 1, 0, 1], CY = [1060, 1030, 1050, 1070, 1040];
  for (let i = 0; i < 5; i++) { const tt = t0 + i * 0.25, e = oC(seg(t, tt, tt + 0.55)); if (e <= 0) continue; const tx = 540 + (i - 2) * 150, mo = oC(seg(t, tM + i * 0.12, tM + i * 0.12 + 0.55));
    const px = lerp(830, tx, e), py = lerp(780, CY[i], e) - Math.sin(Math.PI * e) * 90;
    if (mo < 1) card(px, py, lerp(100, 124, e) * (1 - mo * 0.7), { flip: 0, rot: lerp(0.5, (i - 2) * 0.05, e) * (1 - mo), alpha: 1 - mo });
    if (mo > 0) { const hh = H5[i] * mo; candle(px, py - hh / 2, py + hh / 2, py - hh / 2 - 60 * mo, py + hh / 2 + 50 * mo, 70, !!UP[i], mo); } }
  const kp = oC(seg(t, tM + 0.9, tM + 1.4)); if (kp > 0) { glass(540, 1300, 640, 90, 45, kp); lab('IL PREZZO · LE CARTE', 540, 1300, C.ink, 26, { alpha: kp }); }
  tap(690, 1000, t, tN + 0.3); cross(850, 790, 30, seg(t, tN + 0.3, tN + 0.8));
  phrase(t, a + 0.05, [['Il prezzo', C.ink], ['sono le carte.', C.red]], 345, { size: 92, out: tN - 0.05 });
  phrase(t, tN, [['Tu non puoi', C.ink], ['sceglierle.', C.red]], 345, { size: 92 });
  x.restore(); finish(t); }

/* ======================= 4. tre: entrare, quanto rischiare, uscire ======================= */
function sTre(t, a, b) { bg('56,14,24'); x.save(); zoom(t, a, b, 1.04);
  const T = [WA('tre', ['entrare'], 1, 1.6) - 0.3, WA('tre', ['quanto'], 1, 2.8) - 0.3, WA('tre', ['uscire'], 1, 4.3) - 0.3];
  felt(540, 940, 940, 620, oC(seg(t, a, a + 0.4)));
  const CH = [[215, C.lime, ['ENTRARE']], [540, C.ink, ['QUANTO', 'RISCHIARE']], [865, C.red, ['USCIRE']]];
  CH.forEach(([cx, col, nm], i) => { const cy = 880, e = seg(t, T[i], T[i] + 0.7), hot = t >= T[i] && (i === 2 || t < T[i + 1]);
    x.save(); x.strokeStyle = 'rgba(244,239,233,0.22)'; x.lineWidth = 3; x.setLineDash([3, 12]); x.lineCap = 'round'; x.beginPath(); x.arc(cx, cy, 148, 0, 7); x.stroke(); x.restore();
    if (e <= 0) return; const sc = clamp(oB(oC(e), 2.2), 0, 1.15), yy = cy - (1 - oC(e)) * 80, spin = Math.cos(Math.PI * 3 * (1 - oC(e)));
    if (hot) glow(cx, cy, 230, hx2(col), 0.28);
    x.save(); x.translate(cx, yy); x.scale(sc, sc); chipTop(0, 0, 125, col, { sx: spin });
    if (e > 0.6) { x.globalAlpha = clamp((e - 0.6) * 3); x.strokeStyle = col; x.fillStyle = col; x.lineWidth = 10; x.lineCap = 'round'; x.lineJoin = 'round';
      if (i === 0) { x.beginPath(); x.moveTo(-50, 0); x.lineTo(28, 0); x.moveTo(8, -22); x.lineTo(30, 0); x.lineTo(8, 22); x.moveTo(52, -40); x.lineTo(52, 40); x.stroke(); }
      if (i === 1) { x.globalAlpha = 1; stack(0, 38, 1 + 3 * oC(seg(t, T[1] + 0.5, T[1] + 1.6)), { rx: 44, ry: 13, th: 14, col, alpha: clamp((e - 0.6) * 3) }); }
      if (i === 2) { x.beginPath(); x.moveTo(-52, -40); x.lineTo(-52, 40); x.moveTo(-28, 0); x.lineTo(50, 0); x.moveTo(30, -22); x.lineTo(52, 0); x.lineTo(30, 22); x.stroke(); } }
    x.restore();
    nm.forEach((w, q) => txt(w, cx, 1080 + q * 40 - (nm.length - 1) * 10, { fam: 'mono', size: 30, weight: 600, color: hot ? col : C.ink, ls: 2, alpha: oC(e) })); });
  phrase(t, a + 0.05, [['Tu scegli solo', C.ink], ['tre cose.', C.red]], 345, { size: 92 });
  x.restore(); finish(t); }
const hx2 = (h) => hx(h).join(',');

/* ======================= 4. assi ======================= */
function sAssi(t, a, b) { bg('56,14,24'); x.save(); zoom(t, a, b, 1.04);
  const tA = WT('assi', 'coppia', 1, 2.4) - 0.2, tK = WT('assi', 'coppia', 2, 2.6) - 0.15, tL = WT('assi', 'perde', 2, 4.4) - 0.1, tD = WA('assi', ['due', '2'], 1, 5.0) - 0.1;
