<script>const P = { EP: '♠', DAY: 0, CAP: 10, NEXT: ['', ''], FONTE: '' };</script>
<script src="serie.js"></script>
<script>
/* REEL EXTRA p90 «Il trading è come il poker» (fuori serie). Fonti e conti: p90-fonti.md.
   Numeri a schermo: ≈82% / ≈18% (assi contro re), 4 su 10 e doppio (ESEMPIO · CIFRE INVENTATE), +20 su 100 mani,
   ≈ 8 su 100 (0,6^5), 1% → −9,6% (circa −10%), 10% → −65% (quasi due terzi). Le carte usano solo lettere (A K Q J).
   Dal 27/10: niente scene num/fine/cta/end, niente firma né account: il video finisce su «casa» con il seme di picche disegnato a mano.
   I commenti nel codice sono solo /* ... */ . */
const ORDER = ['hook', 'carte', 'tre', 'assi', 'tante', 'esempio', 'cento', 'fila', 'uno', 'dieci', 'casa'];

/* ---------- aiuti ---------- */
const rngf = (seed) => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
const WA = (k, alts, n = 1, riserva = 0.8) => { const L = ((window.WORDS || {})[k]) || []; let c = 0;
  for (const [p, t] of L) { const w = _nw(p); if (alts.some((q) => w.startsWith(_nw(q))) && ++c === n) return t; }
  return S(k) + riserva; };
const hx = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const shade = (h, k) => { const [r, g, b] = hx(h); return `rgb(${Math.round(r * k)},${Math.round(g * k)},${Math.round(b * k)})`; };
const lab = (s, px, py, col = C.muted, size = 26, o = {}) => txt(s, px, py, { fam: 'mono', size, weight: 600, color: col, ls: 2, ...o });
const T2 = 345 + 92 * 1.12; /* y della seconda riga del titolo a size 92 */
const MINUS = '−';

/* ---------- semi disegnati a mano (nessun glifo dal font) ---------- */
const SP = {
  S: new Path2D('M0 -1 C0.15 -0.65 0.95 -0.4 0.95 0.1 C0.95 0.55 0.4 0.7 0.12 0.35 C0.12 0.6 0.2 0.85 0.4 1 L-0.4 1 C-0.2 0.85 -0.12 0.6 -0.12 0.35 C-0.4 0.7 -0.95 0.55 -0.95 0.1 C-0.95 -0.4 -0.15 -0.65 0 -1 Z'),
  H: new Path2D('M0 0.95 C-0.2 0.75 -1 0.2 -1 -0.35 C-1 -0.8 -0.65 -1 -0.4 -1 C-0.2 -1 -0.05 -0.9 0 -0.65 C0.05 -0.9 0.2 -1 0.4 -1 C0.65 -1 1 -0.8 1 -0.35 C1 0.2 0.2 0.75 0 0.95 Z'),
  D: new Path2D('M0 -1 L0.68 0 L0 1 L-0.68 0 Z') };
SP.Cc = new Path2D(); SP.Cc.moveTo(0.42, -0.5); SP.Cc.arc(0, -0.5, 0.42, 0, 7); SP.Cc.moveTo(-0.08, 0.2); SP.Cc.arc(-0.5, 0.2, 0.42, 0, 7); SP.Cc.moveTo(0.92, 0.2); SP.Cc.arc(0.5, 0.2, 0.42, 0, 7);
SP.Cs = new Path2D('M0 -0.1 L0.3 1 L-0.3 1 Z');
const RED = '#D0342B', BLK = '#0B0D0C';
function suit(s, cx, cy, r, col) { x.save(); x.translate(cx, cy); x.scale(r, r); x.fillStyle = col;
  if (s === 'C') { x.fill(SP.Cc); x.fill(SP.Cs); } else x.fill(SP[s]); x.restore(); }

/* carta: flip 0 = coperta, 1 = scoperta (si gira restringendosi in larghezza) */
function card(cx, cy, w, o = {}) { const { rot = 0, flip = 1, rank = 'A', st = 'S', alpha = 1, dim = 0, q = false } = o; if (alpha <= 0.01) return;
  const h = w * 1.4, f = clamp(flip), sx = Math.max(0.02, Math.abs(Math.cos(Math.PI * f))), face = f > 0.5, col = st === 'H' || st === 'D' ? RED : BLK;
  x.save(); x.globalAlpha *= alpha; x.translate(cx, cy); x.rotate(rot); x.scale(sx, 1);
  x.fillStyle = 'rgba(0,0,0,0.42)'; rr(-w / 2 + 5, -h / 2 + 12, w, h, w * 0.1); x.fill();
  if (face) { const g = x.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2); g.addColorStop(0, '#F4F6F1'); g.addColorStop(1, '#D9DDD6'); x.fillStyle = g; rr(-w / 2, -h / 2, w, h, w * 0.1); x.fill();
    for (const side of [0, 1]) { x.save(); if (side) x.rotate(Math.PI); txt(rank, -w * 0.27, -h * 0.34, { size: w * 0.34, weight: 800, color: col, ls: -1 }); suit(st, -w * 0.27, -h * 0.17, w * 0.1, col); x.restore(); }
    suit(st, 0, 0, w * 0.27, col); }
  else { x.fillStyle = '#0E1411'; rr(-w / 2, -h / 2, w, h, w * 0.1); x.fill();
    x.save(); rr(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, w * 0.07); x.clip(); x.strokeStyle = 'rgba(200,250,114,0.2)'; x.lineWidth = 2;
    for (let i = -14; i <= 14; i++) { x.beginPath(); x.moveTo(-w + i * 22, -h); x.lineTo(w + i * 22, h); x.stroke(); x.beginPath(); x.moveTo(w - i * 22, -h); x.lineTo(-w - i * 22, h); x.stroke(); }
    x.restore(); x.strokeStyle = 'rgba(200,250,114,0.6)'; x.lineWidth = 3; rr(-w / 2 + 8, -h / 2 + 8, w - 16, h - 16, w * 0.07); x.stroke();
    x.fillStyle = 'rgba(200,250,114,0.85)'; x.beginPath(); x.moveTo(0, -w * 0.2); x.lineTo(w * 0.14, 0); x.lineTo(0, w * 0.2); x.lineTo(-w * 0.14, 0); x.closePath(); x.fill();
    if (q) txt('?', 0, 4, { size: w * 0.5, weight: 800, color: '#0E1411', alpha: 1 }); }
  if (dim > 0) { x.fillStyle = `rgba(5,6,7,${dim})`; rr(-w / 2, -h / 2, w, h, w * 0.1); x.fill(); }
  x.restore(); }
function pair(cx, cy, w, hnd, o = {}) { const { rot = 0, ...rest } = o;
  card(cx - w * 0.36, cy, w, { rank: hnd[0], st: hnd[1], rot: -0.11 + rot, ...rest }); card(cx + w * 0.36, cy + 8, w, { rank: hnd[2], st: hnd[3], rot: 0.11 + rot, ...rest }); }
const HANDS = [['A', 'S', 'K', 'S'], ['Q', 'H', 'J', 'H'], ['K', 'D', 'Q', 'C'], ['J', 'S', 'A', 'D'], ['K', 'H', 'Q', 'S'], ['A', 'C', 'J', 'D']];

/* tavolo visto dall'alto: bordo scuro con filo lime, feltro verde scuro, linea delle puntate */
function felt(cx, cy, w, h, k = 1) { if (k <= 0) return; const r = Math.min(w, h) / 2, m = 24;
  x.save(); x.globalAlpha *= clamp(k);
  const g0 = x.createLinearGradient(0, cy - h / 2, 0, cy + h / 2); g0.addColorStop(0, '#2b312d'); g0.addColorStop(1, '#0f1311');
  x.fillStyle = g0; rr(cx - w / 2, cy - h / 2, w, h, r); x.fill();
  x.strokeStyle = 'rgba(200,250,114,0.35)'; x.lineWidth = 2.5; rr(cx - w / 2, cy - h / 2, w, h, r); x.stroke();
  const g = x.createRadialGradient(cx, cy - h * 0.12, 20, cx, cy, w * 0.62); g.addColorStop(0, '#1b3a27'); g.addColorStop(1, '#0a160f');
  x.fillStyle = g; rr(cx - w / 2 + m, cy - h / 2 + m, w - 2 * m, h - 2 * m, r - m); x.fill();
  x.strokeStyle = 'rgba(241,244,238,0.14)'; x.lineWidth = 3; x.setLineDash([4, 14]); x.lineCap = 'round'; rr(cx - w / 2 + 70, cy - h / 2 + 70, w - 140, h - 140, r - 70); x.stroke(); x.setLineDash([]);
  x.restore(); }

/* fiches: stack = pila vista di lato (n può avere decimali), chipTop = vista dall'alto */
function stack(cx, by, n, o = {}) { const { rx = 100, ry = 28, th = 5, col = C.lime, alpha = 1, hl = 0, hlCol = C.red } = o; if (n <= 0.01) return;
  x.save(); x.globalAlpha *= alpha; const NN = Math.ceil(n - 1e-6);
  for (let i = 0; i < NN; i++) { const f = Math.min(1, n - i), yb = by - i * th, yt = yb - th * f, top = i === NN - 1, c = hl > 0 && i >= NN - hl ? hlCol : col;
    x.fillStyle = shade(c, i % 2 ? 0.6 : 0.8); x.beginPath(); x.moveTo(cx - rx, yt); x.lineTo(cx - rx, yb); x.ellipse(cx, yb, rx, ry, 0, Math.PI, 0, true); x.lineTo(cx + rx, yt); x.closePath(); x.fill();
    if (top) { x.fillStyle = shade(c, 1); x.beginPath(); x.ellipse(cx, yt, rx, ry, 0, 0, 7); x.fill(); x.strokeStyle = 'rgba(241,244,238,0.55)'; x.lineWidth = 2; x.stroke();
      x.beginPath(); x.ellipse(cx, yt, rx * 0.66, ry * 0.66, 0, 0, 7); x.strokeStyle = 'rgba(5,6,7,0.5)'; x.stroke(); } }
  x.restore(); }
function chipTop(cx, cy, r, col, o = {}) { const { sx = 1, alpha = 1, inner = '#0F1311' } = o; if (alpha <= 0.01) return;
  x.save(); x.globalAlpha *= alpha; x.translate(cx, cy); x.scale(Math.max(0.03, Math.abs(sx)), 1);
  x.fillStyle = 'rgba(0,0,0,0.45)'; x.beginPath(); x.arc(0, 8, r, 0, 7); x.fill();
  x.fillStyle = col; x.beginPath(); x.arc(0, 0, r, 0, 7); x.fill();
  for (let i = 0; i < 8; i++) { x.save(); x.rotate(i * Math.PI / 4); x.fillStyle = 'rgba(241,244,238,0.92)'; x.fillRect(-r * 0.15, -r * 0.98, r * 0.3, r * 0.2); x.restore(); }
  x.fillStyle = inner; x.beginPath(); x.arc(0, 0, r * 0.64, 0, 7); x.fill(); x.strokeStyle = col; x.lineWidth = Math.max(2, r * 0.045); x.stroke();
  x.restore(); }

/* ======================= 1. hook ======================= */
const lem = (s, cx, cy, A) => { const d = 1 + Math.sin(s) ** 2; return [cx + A * Math.cos(s) / d, cy + A * Math.sin(s) * Math.cos(s) / d]; };
function infinity(t, t0, cx, cy, A) { const kd = seg(t, t0, t0 + 1.0); if (kd <= 0) return;
  x.save(); x.lineCap = 'round'; x.lineJoin = 'round'; x.lineWidth = 9; x.strokeStyle = 'rgba(200,250,114,0.38)'; x.beginPath();
  for (let i = 0; i <= 120 * kd; i++) { const [px, py] = lem(i / 120 * 2 * Math.PI - Math.PI / 2, cx, cy, A); i ? x.lineTo(px, py) : x.moveTo(px, py); } x.stroke();
  const sr = (t - t0) * 2.4 - Math.PI / 2; x.strokeStyle = C.lime; x.lineWidth = 12; x.beginPath();
  for (let i = 0; i <= 24; i++) { const [px, py] = lem(sr - i * 0.04, cx, cy, A); i ? x.lineTo(px, py) : x.moveTo(px, py); } x.globalAlpha = clamp(kd * 2); x.stroke();
  const [dx, dy] = lem(sr, cx, cy, A); glow(dx, dy, 60, '200,250,114', 0.6); x.fillStyle = C.ink; x.beginPath(); x.arc(dx, dy, 9, 0, 7); x.fill(); x.restore(); }
function sHook(t, a, b) { bg('30,44,26'); x.save(); zoom(t, a, b, 1.05);
  const tB = WT('hook', 'mano', 1, 4.2) - 0.12, kT = oC(seg(t, 0, 0.18));
  felt(540, 1010, 900, 700, kT);
  /* mazzo e fiches */
  for (let i = 0; i < 3; i++) card(850 - i * 3, 790 - i * 3, 90, { flip: 0, rot: 0.08, alpha: kT });
  stack(815, 1250, 7, { rx: 56, ry: 17, th: 11, col: C.amber, alpha: kT }); stack(900, 1270, 4, { rx: 50, ry: 15, th: 11, col: C.lime, alpha: kT });
  chipTop(235, 1215, 46, C.red, { alpha: kT }); chipTop(305, 1255, 46, C.lime, { alpha: kT }); chipTop(215, 1110, 40, C.ink, { alpha: kT });
  /* carte comuni: sono coperte, poi tre si scoprono */
  const FL = [['Q', 'H'], ['J', 'C'], ['K', 'D']];
  for (let i = 0; i < 5; i++) { const fl = i < 3 ? ioC(seg(t, 2.2 + i * 0.14, 2.7 + i * 0.14)) : 0;
    card(540 + (i - 2) * 128, 945 + Math.sin(t * 1.6 + i) * 3, 112, { flip: fl, rank: (FL[i] || [])[0], st: (FL[i] || [])[1], alpha: kT }); }
  infinity(t, tB + 0.3, 540, 790, 105);
  /* mano che non finisce: ogni 1,5 s le due carte escono e ne arrivano altre */
  const per = 1.5, tt = t - (tB - 0.1);
  if (tt < 0) pair(540, 1170, 140, HANDS[0], { alpha: kT });
  else { const n = Math.floor(tt / per), u = (tt - n * per) / per, prev = HANDS[n % HANDS.length], cur = HANDS[(n + 1) % HANDS.length];
    const ke = oC(seg(u, 0, 0.22)); if (ke < 1) pair(540 - 360 * ke, 1170 + 80 * ke, 140, prev, { alpha: 1 - ke, rot: -0.5 * ke });
    const ka = oC(seg(u, 0.2, 0.5)), kf = ioC(seg(u, 0.5, 0.72));
    if (ka > 0) pair(lerp(850, 540, ka), lerp(790, 1170, ka) - Math.sin(Math.PI * ka) * 60, lerp(70, 140, ka), cur, { flip: kf, alpha: clamp(ka * 3) }); }
  phrase(t, -0.12, [['Il trading è', C.ink], ['come il poker.', C.lime]], 345, { size: 92, st: 0.04, out: tB - 0.05 });
  phrase(t, tB, [['Ma la mano', C.ink], ['non finisce mai.', C.red]], 345, { size: 92, st: 0.2 });
  x.restore(); finish(t); }

/* ======================= 2. carte ======================= */
const PRICE = (() => { const r = rngf(5); let p = 0; const a = [0]; for (let i = 1; i < 90; i++) { p += (r() - 0.5) * 2 + (r() < 0.08 ? (r() - 0.5) * 5 : 0); a.push(p); }
  const mn = Math.min(...a), mx = Math.max(...a); return a.map((v) => (v - mn) / (mx - mn)); })();
function sCarte(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.05);
  const tM = WT('carte', 'mercati', 1, 3.2) - 0.15, t0 = WA('carte', ['carte'], 1, 1.4) - 0.7, kx = oC(seg(t, tM - 0.15, tM + 0.3));
  /* fase 1: carte coperte dal mazzo */
  if (kx < 1) { x.save(); x.globalAlpha = 1 - kx; felt(540, 1000, 900, 620, oC(seg(t, a, a + 0.4)));
    for (let i = 0; i < 3; i++) card(830 - i * 3, 780 - i * 3, 100, { flip: 0, rot: 0.1 });
    for (let i = 0; i < 5; i++) { const e = oC(seg(t, t0 + i * 0.3, t0 + i * 0.3 + 0.55)), tx = 540 + (i - 2) * 150, ty = 1060; if (e <= 0) continue;
      const px = lerp(830, tx, e), py = lerp(780, ty, e) - Math.sin(Math.PI * e) * 90, q = oC(seg(t, t0 + i * 0.3 + 0.55, t0 + i * 0.3 + 0.9));
      card(px, py, lerp(100, 124, e), { flip: 0, rot: lerp(0.5, (i - 2) * 0.05, e), q: false });
      txt('?', px, py + 4, { size: 70, weight: 800, color: C.lime, alpha: q }); }
    x.restore(); }
  /* fase 2: il prezzo non lo scegli */
  const kp = oC(seg(t, tM + 0.05, tM + 0.5)); if (kp > 0) { glass(540, 1010, 880, 640, 40, kp);
    lab('IL PREZZO', 150, 735, C.muted, 26, { align: 'left', alpha: kp });
    const X0 = 140, X1 = 940, Y0 = 810, Y1 = 1260; x.save(); x.globalAlpha = kp; x.strokeStyle = 'rgba(241,244,238,0.1)'; x.lineWidth = 2;
    for (let i = 0; i < 4; i++) { x.beginPath(); x.moveTo(X0, Y0 + i * (Y1 - Y0) / 3); x.lineTo(X1, Y0 + i * (Y1 - Y0) / 3); x.stroke(); }
    const pr = seg(t, tM + 0.3, tM + 3.2) * 89, pt = (q) => { const i = Math.min(88, Math.floor(q)), f = q - i; return [lerp(X0, X1, q / 89), lerp(Y1, Y0, lerp(PRICE[i], PRICE[i + 1], f))]; };
    x.strokeStyle = C.ink; x.lineWidth = 6; x.lineJoin = 'round'; x.beginPath(); for (let i = 0; i <= pr; i += 0.5) { const [px, py] = pt(i); i ? x.lineTo(px, py) : x.moveTo(px, py); } x.stroke();
    const [ex, ey] = pt(pr); glow(ex, ey, 60, '200,250,114', 0.5); x.fillStyle = C.lime; x.beginPath(); x.arc(ex, ey, 11, 0, 7); x.fill(); x.restore();
    const tt0 = tM + 1.7, [tx, ty] = pt(Math.min(89, (tt0 - tM - 0.3) / 2.9 * 89)); tap(tx, ty, t, tt0);
    cross(900, 735, 22, seg(t, tt0 + 0.3, tt0 + 0.8)); }
  phrase(t, a + 0.05, [['Le carte', C.ink], ['non le scegli.', C.lime]], 345, { size: 92, out: tM - 0.1 });
  phrase(t, tM, [['Il prezzo', C.ink], ['non lo scegli.', C.red]], 345, { size: 92 });
  x.restore(); finish(t); }

/* ======================= 3. tre ======================= */
function sTre(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04);
  const T = [WA('tre', ['quando'], 1, 1.8) - 0.3, WA('tre', ['quanto'], 1, 3.4) - 0.3, WA('tre', ['alz'], 1, 5.2) - 0.3];
  felt(540, 940, 940, 620, oC(seg(t, a, a + 0.4)));
  const CH = [[215, C.lime, 'QUANDO', 'giocare'], [540, C.amber, 'QUANTO', 'puntare'], [865, C.red, 'ALZATI', 'dal tavolo']];
  CH.forEach(([cx, col, nm, sub], i) => { const cy = 900, e = seg(t, T[i], T[i] + 0.7), hot = t >= T[i] && (i === 2 || t < T[i + 1]);
    x.save(); x.strokeStyle = 'rgba(241,244,238,0.22)'; x.lineWidth = 3; x.setLineDash([3, 12]); x.lineCap = 'round'; x.beginPath(); x.arc(cx, cy, 148, 0, 7); x.stroke(); x.restore();
    if (e <= 0) return; const sc = clamp(oB(oC(e), 2.2), 0, 1.15), yy = cy - (1 - oC(e)) * 80, spin = Math.cos(Math.PI * 3 * (1 - oC(e)));
    if (hot) glow(cx, cy, 230, hx2(col), 0.28);
    x.save(); x.translate(cx, yy); x.scale(sc, sc); chipTop(0, 0, 125, col, { sx: spin });
    if (e > 0.6) { x.globalAlpha = clamp((e - 0.6) * 3); x.strokeStyle = col; x.fillStyle = col; x.lineWidth = 9; x.lineCap = 'round'; x.lineJoin = 'round';
      if (i === 0) { x.beginPath(); x.arc(0, 0, 50, 0, 7); x.stroke(); const ang = t * 2.2; x.beginPath(); x.moveTo(0, 0); x.lineTo(Math.sin(ang) * 36, -Math.cos(ang) * 36); x.stroke(); x.beginPath(); x.moveTo(0, 0); x.lineTo(Math.sin(ang / 12) * 24, -Math.cos(ang / 12) * 24); x.stroke(); }
      if (i === 1) { x.globalAlpha = 1; stack(0, 38, 1 + 3 * oC(seg(t, T[1] + 0.5, T[1] + 1.6)), { rx: 44, ry: 13, th: 14, col, alpha: clamp((e - 0.6) * 3) }); }
      if (i === 2) { x.beginPath(); x.moveTo(0, 38); x.lineTo(0, -42); x.moveTo(-30, -12); x.lineTo(0, -42); x.lineTo(30, -12); x.stroke(); x.beginPath(); x.moveTo(-44, 52); x.lineTo(44, 52); x.stroke(); } }
    x.restore();
    txt(nm, cx, 1085, { fam: 'mono', size: 32, weight: 600, color: hot ? col : C.ink, ls: 3, alpha: oC(e) });
    txt(sub, cx, 1135, { fam: 'mono', size: 26, weight: 500, color: C.muted, ls: 1, alpha: oC(e) }); });
  phrase(t, a + 0.05, [['Scegli solo', C.ink], ['tre cose.', C.lime]], 345, { size: 92 });
  x.restore(); finish(t); }
const hx2 = (h) => hx(h).join(',');

/* ======================= 4. assi ======================= */
function sAssi(t, a, b) { bg(); x.save(); zoom(t, a, b, 1.04);
  const tA = WT('assi', 'coppia', 1, 1.0) - 0.2, tK = WT('assi', 'coppia', 2, 2.6) - 0.15, tL = WT('assi', 'perde', 1, 4.4) - 0.1, tD = WA('assi', ['due', '2'], 1, 5.0) - 0.1;
  const ka = oB(seg(t, tA, tA + 0.5)), kk = oB(seg(t, tK, tK + 0.5)), lose = oC(seg(t, tL, tL + 0.5));
  /* assi (a sinistra) e re (a destra) */
  if (ka > 0) { x.save(); x.translate(270, 790); x.scale(clamp(ka, 0, 1.15), clamp(ka, 0, 1.15)); glow(0, 0, 230, '200,250,114', 0.2 * (1 - lose));
    pair(0, 0, 150, [['A', 'S', 'A', 'H']][0], { dim: lose * 0.5 }); x.restore();
    cross(270, 790, 62, seg(t, tL + 0.1, tL + 0.6)); }
  if (kk > 0) { x.save(); x.translate(810, 790); x.scale(clamp(kk, 0, 1.15), clamp(kk, 0, 1.15)); glow(0, 0, 230, '245,165,36', 0.18);
    pair(0, 0, 150, ['K', 'C', 'K', 'D']); x.restore(); }
  txt('CONTRO', 540, 790, { fam: 'mono', size: 28, weight: 600, color: C.muted, ls: 3, alpha: oC(seg(t, tK - 0.1, tK + 0.3)) });
  /* barra 82 / 18 */
