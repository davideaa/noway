const ORDER = ['num', 'hook', 'torta', 'miliardi', 'reddito', 'risparmio', 'speso', 'prezzi', 'fiducia', 'indice', 'sotto', 'termometro', 'casa', 'fine', 'cta', 'end'];

/* ================= TORTA 3D del PIL: il carrello versa la spesa nella fetta delle famiglie ================= */
const PIE = [['fam', 57.2, RGB.lime, ''], ['inv', 22.0, [214, 220, 210], 'investimenti'], ['ap', 18.1, [112, 122, 116], 'Stato'], ['alt', 2.7, [66, 74, 69], '']];
function wedge(cx, cy, rx, ry, a0, a1) { x.save(); x.translate(cx, cy); x.scale(1, ry / rx); x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, rx, a0, a1); x.closePath(); x.restore(); }
function pieSlices() { let acc = -Math.PI / 2; return PIE.map(([k, v, c, lab]) => { const r = { k, v, c, lab, a0: acc, a1: acc + v / 100 * 2 * Math.PI }; acc = r.a1; return r; }); }
function pie3d(o) { const { cx = 540, cy = 930, rx = 330, ry = 140, dep = 64, kIn = 1, fill = 1, lift = 0, ghost = 0, labels = 1, famLab = 0, step = 2 } = o; if (kIn <= 0) return;

  x.save(); x.globalAlpha *= clamp(kIn * 1.5); x.translate(cx, cy); x.scale(s, s); x.translate(-cx, -cy);
  const draw = (sl, dx, dy, a1, top, side, edge) => { for (let d = dep; d > 0; d -= step) { wedge(cx + dx, cy + dy + d, rx, ry, sl.a0, a1); x.fillStyle = side; x.fill(); }
    wedge(cx + dx, cy + dy, rx, ry, sl.a0, a1); x.fillStyle = top; x.fill(); x.strokeStyle = edge; x.lineWidth = 3; x.stroke(); };
  glow(cx, cy + dep, rx * 1.15, '0,0,0', 0.45);
  SL.slice(1).forEach((sl) => draw(sl, 0, 0, sl.a1, rgba(mix(RGB.bg, sl.c, 0.8)), rgba(mix(RGB.bg, sl.c, 0.38)), 'rgba(5,6,7,0.9)'));
  /* sede della fetta: vuota e tratteggiata finché non si riempie o si solleva */
  wedge(cx, cy + dep, rx, ry, f.a0, f.a1); x.fillStyle = '#0a0d0b'; x.fill();
  wedge(cx, cy, rx, ry, f.a0, f.a1); x.fillStyle = rgba(mix(RGB.bg, RGB.lime, 0.08)); x.fill();
  x.save(); x.setLineDash([10, 9]); x.strokeStyle = rgba(RGB.lime, 0.55 * (1 - clamp(fill * 3 - 2))); x.lineWidth = 3; x.stroke(); x.restore();
  if (fill > 0) { const a1 = f.a0 + (f.a1 - f.a0) * fill; if (lift > 0) glow(cx + lx + Math.cos(mid) * rx * 0.4, cy + ly, rx * 0.9, '200,250,114', 0.22 * lift);
    draw(f, lx, ly, a1, rgba(mix(RGB.bg, RGB.lime, 0.92)), rgba(mix(RGB.bg, RGB.lime, 0.42)), rgba(RGB.ink, 0.55));
    if (ghost > 0) { const ae = f.a0 + 0.516 * 2 * Math.PI; x.save(); x.globalAlpha *= ghost;
      wedge(cx + lx, cy + ly, rx, ry, ae, f.a1); x.fillStyle = 'rgba(241,244,238,0.55)'; x.fill(); x.strokeStyle = C.ink; x.lineWidth = 3; x.stroke();
      x.save(); x.translate(cx + lx, cy + ly); x.scale(1, ry / rx); x.beginPath(); x.moveTo(0, 0); x.lineTo(Math.cos(ae) * rx, Math.sin(ae) * rx); x.restore(); x.setLineDash([9, 8]); x.strokeStyle = 'rgba(5,6,7,0.95)'; x.lineWidth = 4; x.stroke(); x.restore(); }
    if (famLab > 0) { const r = 0.55; txt('FAMIGLIE', cx + lx + Math.cos(mid) * rx * r, cy + ly + Math.sin(mid) * ry * r - 6, { fam: 'mono', size: Math.max(22, 26 * rx / 330), weight: 600, color: '#0b0d0c', alpha: famLab, ls: 2 }); } }
  if (labels > 0) SL.slice(1).forEach((sl) => { if (!sl.lab) return; const m = sl.k === 'inv' ? lerp(sl.a0, sl.a1, 0.75) : (sl.a0 + sl.a1) / 2, r = sl.k === 'inv' ? 0.68 : 0.6;
    txt(sl.lab, cx + Math.cos(m) * rx * r, cy + Math.sin(m) * ry * r, { fam: 'mono', size: 22, weight: 600, color: sl.k === 'inv' ? '#0b0d0c' : C.ink, alpha: labels, ls: 1 }); });
  x.restore(); }
/* carrello di lato (fronte a destra in coordinate locali; dir -1 = guarda a sinistra) */
const CI = [[-92, -196, RGB.lime], [-40, -206, RGB.amber], [12, -200, RGB.ink], [64, -208, RGB.lime], [-66, -150, RGB.amber], [-14, -156, RGB.lime], [38, -152, RGB.amber], [90, -160, RGB.ink]];
function cart2(cx, by, s, tilt, k, left = 8, wa = 0, dir = -1) { if (k <= 0) return; x.save(); x.globalAlpha *= clamp(k); x.translate(cx, by); x.scale(dir * s, s);
  x.translate(80, -12); x.rotate(tilt); x.translate(-80, 12);
  CI.forEach(([ix, iy, c], i) => { if (i >= left) return; x.fillStyle = rgba(c, 0.85); rr(ix - 23, iy - 23, 46, 46, 8); x.fill(); x.fillStyle = 'rgba(5,6,7,0.3)'; x.fillRect(ix - 23, iy - 3, 46, 6); });
  x.beginPath(); x.moveTo(-130, -170); x.lineTo(130, -170); x.lineTo(100, -50); x.lineTo(-110, -50); x.closePath(); x.fillStyle = 'rgba(241,244,238,0.08)'; x.fill();
  x.save(); x.clip(); x.strokeStyle = 'rgba(241,244,238,0.28)'; x.lineWidth = 2; for (let i = 1; i < 7; i++) { const f = i / 7; x.beginPath(); x.moveTo(lerp(-130, 130, f), -170); x.lineTo(lerp(-110, 100, f), -50); x.stroke(); }
  for (let j = 1; j < 3; j++) { x.beginPath(); x.moveTo(-140, -170 + 40 * j); x.lineTo(140, -170 + 40 * j); x.stroke(); } x.restore();
  x.strokeStyle = C.ink; x.lineWidth = 6; x.lineJoin = 'round'; x.lineCap = 'round';
  x.beginPath(); x.moveTo(-130, -170); x.lineTo(130, -170); x.lineTo(100, -50); x.lineTo(-110, -50); x.closePath(); x.stroke();
  x.beginPath(); x.moveTo(-130, -170); x.lineTo(-166, -214); x.lineTo(-206, -214); x.stroke();
  x.beginPath(); x.moveTo(-110, -50); x.lineTo(-118, -28); x.lineTo(104, -28); x.stroke();
  for (const wx of [-85, 80]) { x.fillStyle = '#0a0c0b'; x.beginPath(); x.arc(wx, -12, 15, 0, 7); x.fill(); x.strokeStyle = C.ink; x.lineWidth = 5; x.stroke();
    x.lineWidth = 3; x.beginPath(); x.moveTo(wx + Math.cos(wa) * 10, -12 + Math.sin(wa) * 10); x.lineTo(wx - Math.cos(wa) * 10, -12 - Math.sin(wa) * 10); x.stroke(); }
  x.restore(); }
function cartMouth(cx, by, s, tilt) { const c = Math.cos(tilt), sn = Math.sin(tilt), px = 80 + 50 * c + 158 * sn, py = -12 + 50 * sn - 158 * c; return [cx - s * px, by + s * py]; }
/* tempi della torta: servono anche a «miliardi», che continua lo stesso disegno */
function tortaT() { const a = S('torta'), tCo = WT('torta', 'consumi', 1, 0.6), tF = WT('torta', 'fetta', 1, 2.2), tN = WT('torta', 'circa', 1, 4.6);
  const tp0 = Math.max(tCo - 0.1, a + 0.6), tp1 = Math.max(tp0 + 1.0, tF - 0.15), tl = Math.max(tF, tp1 + 0.45);
  return { a, tp0, tp1, tl, tN }; }
const PC = [540, 930];
function tortaDraw(t, o = {}) { const T = tortaT(), { ghost = 0, famLab = 1 } = o, s = 0.8;
  const kIn = oC(seg(t, T.a + 0.05, T.a + 0.6)), N = 26;
  const fill = clamp((t - T.tp0 - 0.5) / (T.tp1 - T.tp0)), lift = oB(seg(t, T.tl, T.tl + 0.7));
  pie3d({ kIn, fill, lift, ghost, labels: kIn, famLab: oC(seg(t, T.tl + 0.3, T.tl + 0.7)) * famLab });
  /* carrello: entra, si inclina e versa, poi esce a destra */
  const kx = ioC(seg(t, T.a, T.a + 0.6)), ko = ioC(seg(t, T.tp1 + 0.25, T.tp1 + 1.1)), cx = lerp(1280, 870, kx) + 440 * ko, by = 830;
  const tilt = 0.55 * ioC(seg(t, T.tp0 - 0.3, T.tp0 + 0.05)) * (1 - ioC(seg(t, T.tp1, T.tp1 + 0.3)));
  const poured = Math.floor(clamp((t - T.tp0) / (T.tp1 - T.tp0)) * 8 + 0.0001);
  if (ko < 1) cart2(cx, by, s, tilt, kIn * (1 - ko), 8 - poured, (cx - 860) / 15);
  const [mx, my] = cartMouth(cx, by, s, tilt), f = pieSlices()[0]; /* bocca del carrello */
  for (let i = 0; i < N; i++) { const ti = T.tp0 + (i / N) * (T.tp1 - T.tp0), q = (t - ti) / 0.5; if (q <= 0 || q >= 1) continue;
    const ang = f.a0 + (f.a1 - f.a0) * ((i + 0.5) / N), rr0 = 0.35 + 0.45 * hash(i), tx = PC[0] + Math.cos(ang) * 330 * rr0, ty0 = PC[1] + Math.sin(ang) * 140 * rr0;
    const sx = mx + (hash(i + 9) - 0.5) * 30, px = lerp(sx, tx, q), py = lerp(my, ty0, q * q) - Math.sin(Math.PI * q) * 40, c = [RGB.lime, RGB.amber, RGB.ink][i % 3];
    x.save(); x.translate(px, py); x.rotate(q * 3 * (hash(i + 3) - 0.5)); x.fillStyle = rgba(c, 0.9 * (1 - seg(q, 0.85, 1))); rr(-13, -13, 26, 26, 5); x.fill(); x.restore(); }
  return T; }
function sTorta(t, a, b) { bg(); x.save();
  const T = tortaDraw(t);
  phrase(t, a + 0.05, [['I consumi: la fetta', C.ink], ['più grande del PIL', C.lime]], 345, { size: 92 });
  const kn = oB(seg(t, T.tN + 0.25, T.tN + 0.75)); if (kn > 0) { x.save(); x.translate(540, 1262); x.scale(clamp(kn, 0, 1.2), clamp(kn, 0, 1.2)); glow(0, 0, 240, '200,250,114', 0.2);
    txt('57%', 0, 0, { size: 150, weight: 800, color: C.lime, ls: -4 }); x.restore(); }
  mono('ISTAT · SPESA DELLE FAMIGLIE SUL PIL · 2025', 540, 1385, t, T.tN + 0.4, { size: 22 });
  x.restore(); finish(t); }
function sMiliardi(t, a, b) { bg(); x.save();
  const tQ = WT('miliardi', 'quasi', 1, 0.3), tE = WT('miliardi', 'euro', 1, 1.8), tQu = WT('miliardi', 'quota', 1, 3.3), tA = WA('miliardi', ['area', 'dellarea'], 1, 4.9);
  const kA = oC(seg(t, tA - 0.1, tA + 0.5)); tortaDraw(t, { ghost: kA });

/* ================= REDDITO: la barra si riempie, tasse e contributi si staccano, resta il disponibile ================= */
const BAR = { x0: 120, w: 840, y: 880, h: 140 }, CUT = [0.62, 0.82];

  const PC2 = [[0, CUT[0], null], [CUT[0], CUT[1], tT], [CUT[1], 1, tC]];
  PC2.forEach(([u0, u1, tf], i) => { const px0 = x0 + w * u0, pw = w * (u1 - u0), vis = clamp((kf * w - px0 + x0) / pw); if (vis <= 0) return;
    let dx = 0, dy = 0, rot = 0, col = mix(RGB.ink, RGB.lime, kd), al = 0.42 + 0.4 * kd;
    if (tf !== null) { const kk = ioC(seg(t, tf - 0.1, tf + 0.6)); dy = 270 * kk + (i === 2 ? 20 * kk : 0); dx = (i === 1 ? -25 : -5) * kk; rot = (i === 1 ? 0.12 : -0.1) * kk; col = mix(RGB.ink, RGB.red, Math.max(kd * 0.25, kk)); al = 0.42 + 0.4 * Math.max(kd * 0.3, kk); }
    x.save(); x.translate(px0 + pw / 2 + dx, y + dy); x.rotate(rot); x.fillStyle = rgba(col, al); rr(-pw / 2 + 4, -h / 2 + 8, pw * vis - 8, h - 16, 18); x.fill(); x.restore();
    if (tf !== null) { const kl = oC(seg(t, tf + 0.25, tf + 0.6)); txt(i === 1 ? 'TASSE' : 'CONTRIBUTI', px0 + pw / 2 + dx, y + dy + 120, { fam: 'mono', size: 24, weight: 600, color: C.red, alpha: kl, ls: 1 }); } });

  txt('REDDITO', 540, y + 2, { fam: 'mono', size: 30, weight: 600, color: '#0b0d0c', alpha: kf * (1 - kd), ls: 4 });

  phrase(t, a + 0.05, [['Sotto 100,', C.ink]], 345, { size: 92, out: tMa - 0.35 });
  phrase(t, tL - 0.1, [['la media del 2021.', C.muted]], 345 + 92 * 1.12, { size: 92, out: tMa - 0.35 }); /* «2021» sulla parola «livello» */
  phrase(t, tMa - 0.1, [['Ma il calo è', C.ink], ['in parte tecnico.', C.amber]], 345, { size: 92 });
  const kH = oC(seg(t, tTe - 0.1, tTe + 0.5)), kN = oC(seg(t, tCa - 0.2, tCa + 0.4));
  thermo(t, { val: 91.2, l100: seg(t, a + 0.1, a + 0.8), lab100: oC(seg(t, tL - 0.1, tL + 0.3)), hatch: kH });
  readouts(t, 1, 1);
  calCard(760, 760, 1 - oC(seg(t, a, a + 0.3)), 8, 'OGNI MESE · ISTAT');
  if (kN > 0) { const cx = 700, cy = 1250; x.save(); x.globalAlpha = kN; x.translate(0, (1 - kN) * 30); glass(cx, cy, 500, 170, 28, 1, '245,215,160');
    const sw = ioC(seg(t, tCa + 0.1, tCa + 0.7)); headset(505 - 40 * sw, cy + 2, C.muted, 1 - sw); headset(505 + 40 * (1 - sw), cy + 2, C.amber, sw);
    txt('CALO IN PARTE TECNICO:', 560, cy - 48, { fam: 'mono', size: 22, weight: 600, color: C.amber, align: 'left', ls: 1 });
    txt('cambio dell’operatore', 560, cy - 2, { size: 32, weight: 800, color: C.ink, align: 'left' });
    txt('di rilevazione', 560, cy + 40, { size: 32, weight: 800, color: C.ink, align: 'left' }); x.restore(); }
  mono('ISTAT · BASE 2021 = 100 · SETTEMBRE 2026', 540, 1440, t, a + 0.3, { size: 22 });
  x.restore(); finish(t); }
function sTermometro(t, a, b) { bg('34,38,44', 0.6); x.save(); zoom(t, a, b, 1.03);
  const tSv = WT('termometro', 'serve', 1, 1.8), tLe = WT('termometro', 'leggere', 1, 2.2), tM1 = WT('termometro', 'mese', 1, 3.2), tM2 = WT('termometro', 'mese', 2, 3.7);
  phrase(t, a + 0.05, [['Un termometro', C.ink], ['dell’economia.', C.amber]], 345, { size: 92 });
  const ko = oC(seg(t, a, a + 0.35));
  thermo(t, { val: 91.2, l100: 1, lab100: 1, hatch: 1 - ko, pulse: oC(seg(t, tLe - 0.2, tLe + 0.4)) });
  readouts(t, 1, 1);
  if (ko < 1) { const cx = 700, cy = 1250; x.save(); x.globalAlpha = 1 - ko; glass(cx, cy, 500, 170, 28, 1, '245,215,160'); headset(545, cy + 2, C.amber, 1);
    txt('CALO IN PARTE TECNICO:', 560, cy - 48, { fam: 'mono', size: 22, weight: 600, color: C.amber, align: 'left', ls: 1 });
    txt('cambio dell’operatore', 560, cy - 2, { size: 32, weight: 800, color: C.ink, align: 'left' }); txt('di rilevazione', 560, cy + 40, { size: 32, weight: 800, color: C.ink, align: 'left' }); x.restore(); }
  /* mese dopo mese: il calendario gira da settembre a ottobre, prossima lettura il 29 */
  const kc = oC(seg(t, tM1 - 0.4, tM1 + 0.1)), m = 8 + ioC(seg(t, tM1, tM2 + 0.2));
  calCard(700, 1225, kc, m, m >= 8.99 ? 'PROSSIMO DATO: 29/10' : 'OGNI MESE · ISTAT', m >= 8.99, 340);
  mono('ISTAT · INDAGINE PER L’ANALISI CONGIUNTURALE', 540, 1440, t, tSv, { size: 22 });
  x.restore(); finish(t); }

/* ================= CASA: tasca → carrello → metà dell'economia ================= */
function wallet(cx, cy, k) { if (k <= 0) return; x.save(); x.globalAlpha *= clamp(k); const s = lerp(0.8, 1, oB(clamp(k))); x.translate(cx, cy); x.scale(s, s);
  x.fillStyle = rgba(RGB.lime, 0.85); x.save(); x.rotate(-0.12); rr(-70, -88, 130, 70, 8); x.fill(); x.fillStyle = 'rgba(5,6,7,0.35)'; x.beginPath(); x.arc(-5, -53, 16, 0, 7); x.fill(); x.restore();
  glass(0, 0, 190, 130, 22, 1); x.strokeStyle = C.ink; x.lineWidth = 5; rr(-95, -65, 190, 130, 22); x.stroke();
  x.fillStyle = '#121714'; rr(30, -24, 75, 48, 14); x.fill(); x.strokeStyle = C.ink; x.lineWidth = 4; rr(30, -24, 75, 48, 14); x.stroke();
  x.fillStyle = C.lime; x.beginPath(); x.arc(58, 0, 8, 0, 7); x.fill(); x.restore(); }
function flow(x0, x1, y, t, k, col = '200,250,114') { if (k <= 0) return; x.save(); x.globalAlpha *= clamp(k); x.strokeStyle = `rgba(${col},0.5)`; x.lineWidth = 3; x.setLineDash([2, 10]);
  x.beginPath(); x.moveTo(x0, y); x.lineTo(x1, y); x.stroke(); x.setLineDash([]); x.fillStyle = `rgba(${col},0.9)`; x.beginPath(); x.moveTo(x1 + 12, y); x.lineTo(x1 - 6, y - 11); x.lineTo(x1 - 6, y + 11); x.closePath(); x.fill();
  for (let j = 0; j < 3; j++) { const u = (t * 0.8 + j / 3) % 1, px = lerp(x0, x1 - 10, u); x.fillStyle = `rgba(${col},${0.95 * Math.sin(Math.PI * u)})`; x.beginPath(); x.arc(px, y, 8, 0, 7); x.fill(); glow(px, y, 26, col, 0.3 * Math.sin(Math.PI * u)); }
  x.restore(); }
function sCasa(t, a, b) { bg('30,44,26'); x.save();
  const tC = WT('casa', 'che', 1, 1.5), tMe = WT('casa', 'meta', 1, 2.3), tK1 = WT('casa', 'carrello', 1, 4.15), tK2 = WT('casa', 'carrello', 2, 5.1), tT = WT('casa', 'tasca', 1, 7.35);
  phrase(t, a + 0.05, [['Cosa ti porti a casa?', C.muted]], 345, { size: 70, out: tC - 0.4 });
  phrase(t, tC - 0.15, [['Più di metà del PIL', C.ink], ['passa dal carrello.', C.lime]], 345, { size: 92 });
  const yy = 960, kP = oC(seg(t, tMe - 0.2, tMe + 0.4)), kK = oC(seg(t, tK1 - 0.3, tK1 + 0.3)), kW = oC(seg(t, tT - 0.4, tT + 0.2));
  pie3d({ cx: 850, cy: yy - 10, rx: 120, ry: 52, dep: 26, kIn: kP, fill: 1, lift: 1, labels: 0, famLab: 0, step: 1.5 });
  cart2(560, yy + 80, 0.62, 0, kK, 8, t * 2, 1);
  wallet(215, yy, kW);
  flow(640, 715, yy, t, oC(seg(t, tK1, tK1 + 0.4)));
  flow(320, 405, yy, t, oC(seg(t, tT, tT + 0.4)));
  txt('57% DEL PIL', 850, 1150, { fam: 'mono', size: 26, weight: 600, color: C.lime, alpha: kP, ls: 2 });
  txt('CARRELLO', 560, 1150, { fam: 'mono', size: 26, weight: 600, color: C.ink, alpha: kK, ls: 2 });
  txt('IN TASCA', 215, 1150, { fam: 'mono', size: 26, weight: 600, color: C.ink, alpha: kW, ls: 2 });
  const kR = oC(seg(t, tT + 0.3, tT + 0.8)); if (kR > 0) glassPill(540, 1330, 'reddito, spesa, PIL', kR, C.lime, 44);
  x.restore(); finish(t); }

serie({ hook: sHook, torta: sTorta, miliardi: sMiliardi, reddito: sReddito, risparmio: sRisparmio, speso: sSpeso, prezzi: sPrezzi,
  fiducia: sFiducia, indice: sIndice, sotto: sSotto, termometro: sTermometro, casa: sCasa }, ORDER, ['hook', 'reddito', 'fiducia', 'casa']);
