<!-- CONFRONTO prima/dopo (agente confronto): si apre con Confronto.apri(id, elemento) -->
<div class="cf" id="cf-confronto" hidden>
  <div class="cf-fantasma" id="cf-fantasma" aria-hidden="true">
    <div class="cf-fantasma-fondo"></div>
    <div class="cf-fantasma-quadro"><img class="cf-fantasma-prima" alt="" decoding="async"><img class="cf-fantasma-dopo" alt="" decoding="async"></div>
  </div>

  <div class="cf-finestra" id="cf-finestra" role="dialog" aria-modal="true" aria-labelledby="cf-titolo" aria-describedby="cf-descrizione" tabindex="-1">
    <span class="cf-sentinella" tabindex="0" data-cf-verso="fine"></span>

    <header class="cf-barra">
      <div class="cf-barra-sx">
        <button class="cf-tasto cf-esci" id="cf-chiudi" type="button" aria-keyshortcuts="Escape">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="cf-esci-testo">Vetrina</span><span class="cf-nascosto"> : torna alla vetrina</span>
        </button>
        <div class="cf-lavoro">
          <p class="cf-lavoro-nome" id="cf-titolo"></p>
          <p class="cf-lavoro-sotto" id="cf-descrizione"></p>
        </div>
        <div class="cf-lavori" id="cf-lavori" hidden>
          <button class="cf-tasto cf-tondo" id="cf-lavoro-prec" type="button"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12 5 7 10l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="cf-tasto cf-tondo" id="cf-lavoro-succ" type="button"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="m8 5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>

      <nav class="cf-pagine" aria-label="Pagine del sito">
        <button class="cf-tasto cf-tondo" id="cf-prec" type="button" aria-label="Pagina precedente"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12 5 7 10l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="cf-pagina" id="cf-pagina" type="button" aria-expanded="false" aria-controls="cf-mappa">
          <span class="cf-pagina-n" id="cf-pagina-n" aria-hidden="true"></span>
          <span class="cf-pagina-nome" id="cf-pagina-nome"></span>
          <svg class="cf-pagina-giu" viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="m5 8 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="cf-tasto cf-tondo" id="cf-succ" type="button" aria-label="Pagina successiva"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="m8 5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

        <div class="cf-mappa" id="cf-mappa" hidden>
          <p class="cf-mappa-titolo"><span>Mappa del sito</span><span id="cf-mappa-conta"></span></p>
          <ol class="cf-mappa-lista" id="cf-mappa-lista"></ol>
          <div class="cf-mappa-lavori" id="cf-mappa-lavori" hidden>
            <p class="cf-mappa-titolo"><span>Altri lavori</span></p>
            <div class="cf-mappa-lavori-tasti" id="cf-mappa-lavori-tasti"></div>
          </div>
        </div>
      </nav>

      <div class="cf-barra-dx">
        <div class="cf-modi" id="cf-modi" role="radiogroup" aria-label="Come confrontare prima e dopo">
          <button type="button" role="radio" aria-checked="false" data-modo="lente" title="Lente: il sito di prima sotto il mouse">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m12.3 12.3 4.2 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span>Lente</span></button>
          <button type="button" role="radio" aria-checked="false" data-modo="tenda" title="Tenda: a sinistra prima, a destra dopo">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2v16" stroke="currentColor" stroke-width="1.7"/><path d="M2.5 3.5h7.5v13H2.5z" fill="currentColor" opacity=".35"/></svg><span>Tenda</span></button>
          <button type="button" role="radio" aria-checked="false" data-modo="telefono" title="Telefono: i due siti come su uno smartphone">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="2" y="3" width="6.5" height="14" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="11.5" y="3" width="6.5" height="14" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Telefono</span></button>
          <button type="button" role="radio" aria-checked="false" data-modo="spento" title="Solo il sito nuovo">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 7h15" stroke="currentColor" stroke-width="1.4"/></svg><span>Solo nuovo</span></button>
        </div>
        <button class="cf-tieni" id="cf-tieni" type="button" aria-pressed="false" aria-keyshortcuts="Space">
          <span class="cf-tieni-punto" aria-hidden="true"></span>
          <span class="cf-tieni-testo"><span class="cf-tieni-lungo">Tieni premuto: </span><em>prima</em></span>
          <kbd class="cf-tasto-kbd" aria-hidden="true">Spazio</kbd>
        </button>
      </div>
      <div class="cf-avanzamento" aria-hidden="true"><span id="cf-avanzamento"></span></div>
    </header>

    <div class="cf-scena" id="cf-scena">
      <div class="cf-telefoni" id="cf-telefoni" aria-hidden="true">
        <div class="cf-telefono cf-telefono-prima">
          <p class="cf-telefono-titolo cf-titolo-prima">Prima <span>il sito di oggi</span></p>
          <div class="cf-telefono-stato"><span>9:41</span><i></i><span>●●●</span></div>
          <div class="cf-telefono-schermo" id="cf-tel-prima"></div>
        </div>
        <div class="cf-telefono cf-telefono-dopo">
          <p class="cf-telefono-titolo cf-titolo-dopo">Dopo <span>la proposta</span></p>
          <div class="cf-telefono-stato"><span>9:41</span><i></i><span>●●●</span></div>
        </div>
      </div>

      <div class="cf-schermo" id="cf-schermo"></div>

      <div class="cf-tenda" id="cf-tenda" aria-hidden="true"><div class="cf-tenda-dentro" id="cf-tenda-dentro"></div></div>
      <p class="cf-etichetta-tieni" aria-hidden="true"><em>Il sito di prima</em></p>

      <div class="cf-lente" id="cf-lente" aria-hidden="true">
        <div class="cf-lente-vetro" id="cf-lente-vetro"></div>
        <span class="cf-lente-etichetta">prima</span>
      </div>

      <div class="cf-maniglia" id="cf-maniglia">
        <span class="cf-maniglia-linea" aria-hidden="true"></span>
        <span class="cf-maniglia-zona" aria-hidden="true"></span>
        <span class="cf-maniglia-prima" aria-hidden="true">prima</span>
        <span class="cf-maniglia-dopo" aria-hidden="true">dopo</span>
        <span class="cf-maniglia-presa" id="cf-presa" role="slider" tabindex="0" aria-label="Tenda: quanto sito di prima mostrare" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 7 4 12l5 5M15 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>

      <div class="cf-scudo" id="cf-scudo"></div>
      <div class="cf-carica" id="cf-carica" aria-hidden="true"><span></span></div>
      <div class="cf-suggerimento" id="cf-suggerimento" role="status"></div>
    </div>

    <p class="cf-nascosto" id="cf-annuncio" aria-live="polite"></p>
    <span class="cf-sentinella" tabindex="0" data-cf-verso="inizio"></span>
  </div>
</div>
