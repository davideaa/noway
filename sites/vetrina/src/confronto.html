<!-- CONFRONTO prima/dopo (agente confronto): si apre con Confronto.apri(id, elemento) -->
<div class="cf" id="cf-confronto" hidden>
  <div class="cf-fantasma" id="cf-fantasma" aria-hidden="true">
    <div class="cf-fantasma-fondo"></div>
    <div class="cf-fantasma-quadro"><img class="cf-fantasma-img" alt="" decoding="async"></div>
  </div>

  <div class="cf-finestra" id="cf-finestra" role="dialog" aria-modal="true" aria-labelledby="cf-titolo" aria-describedby="cf-descrizione" tabindex="-1">
    <span class="cf-sentinella" tabindex="0" data-cf-verso="fine"></span>

    <header class="cf-barra">
      <div class="cf-barra-sx">
        <button class="cf-tasto cf-esci" id="cf-chiudi" type="button" aria-keyshortcuts="Escape">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="cf-esci-testo">Vetrina</span><span class="cf-nascosto"> : torna alla vetrina</span>
        </button>
        <div class="cf-lavoro">
          <p class="cf-lavoro-nome" id="cf-titolo"></p>
          <p class="cf-lavoro-sotto" id="cf-descrizione"></p>
        </div>
        <div class="cf-lavori" id="cf-lavori" hidden>
          <button class="cf-tasto cf-tondo" id="cf-lavoro-prec" type="button"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12 5 7 10l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="cf-tasto cf-tondo" id="cf-lavoro-succ" type="button"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="m8 5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>

      <nav class="cf-pagine" aria-label="Pagine del sito">
        <button class="cf-tasto cf-tondo cf-freccia" id="cf-prec" type="button" aria-label="Pagina precedente"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12 5 7 10l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="cf-pagina" id="cf-pagina" type="button" aria-expanded="false" aria-controls="cf-mappa">
          <span class="cf-pagina-n" id="cf-pagina-n" aria-hidden="true"></span>
          <span class="cf-pagina-nome" id="cf-pagina-nome"></span>
          <svg class="cf-pagina-giu" viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="m5 8 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="cf-tasto cf-tondo cf-freccia" id="cf-succ" type="button" aria-label="Pagina successiva"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="m8 5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

        <div class="cf-mappa" id="cf-mappa" hidden>
          <p class="cf-mappa-titolo"><span>Mappa del sito</span><span id="cf-mappa-conta"></span></p>
          <ol class="cf-mappa-lista" id="cf-mappa-lista"></ol>
          <div class="cf-mappa-frecce">
            <button class="cf-tasto" id="cf-mappa-prec" type="button">‹ Precedente</button>
            <button class="cf-tasto" id="cf-mappa-succ" type="button">Successiva ›</button>
          </div>
          <div class="cf-mappa-lavori" id="cf-mappa-lavori" hidden>
            <p class="cf-mappa-titolo"><span>Altri lavori</span></p>
            <div class="cf-mappa-lavori-tasti" id="cf-mappa-lavori-tasti"></div>
          </div>
        </div>
      </nav>

      <div class="cf-barra-dx">
        <div class="cf-modi" id="cf-modi" role="radiogroup" aria-label="Come guardare prima e dopo">
          <button type="button" role="radio" aria-checked="false" data-modo="affiancati" title="Affiancati: prima e dopo uno accanto all'altro, scorrono insieme">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="2" y="3.5" width="7" height="13" rx="1.2" fill="currentColor" opacity=".35"/><rect x="2" y="3.5" width="7" height="13" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="3.5" width="7" height="13" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span class="cf-modo-lungo">Affiancati</span></button>
          <button type="button" role="radio" aria-checked="false" data-modo="telefono" title="Telefono: i due siti come su uno smartphone" aria-label="Telefono">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="2" y="3" width="6.5" height="14" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="11.5" y="3" width="6.5" height="14" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span class="cf-modo-lungo">Telefono</span></button>
          <button type="button" role="radio" aria-checked="false" data-modo="prima" title="Solo prima: il sito di oggi a tutto schermo">
            <svg class="cf-modo-icona" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="1.5" fill="currentColor" opacity=".35"/><rect x="2.5" y="3.5" width="15" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span class="cf-modo-lungo">Solo prima</span><span class="cf-modo-corto cf-corto-prima">prima</span></button>
          <button type="button" role="radio" aria-checked="false" data-modo="dopo" title="Solo dopo: il sito nuovo, vero, da usare">
            <svg class="cf-modo-icona" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 7h15" stroke="currentColor" stroke-width="1.4"/></svg><span class="cf-modo-lungo">Solo dopo</span><span class="cf-modo-corto">Dopo</span></button>
        </div>
      </div>
      <div class="cf-avanzamento" aria-hidden="true"><span id="cf-avanzamento"></span></div>
    </header>

    <div class="cf-scena" id="cf-scena">
      <div class="cf-telefoni" id="cf-telefoni" aria-hidden="true">
        <div class="cf-telefono cf-telefono-prima">
          <p class="cf-telefono-titolo cf-titolo-prima">Prima <span>il sito di oggi</span></p>
          <div class="cf-telefono-stato"><span>9:41</span><i></i><span>●●●</span></div>
          <div class="cf-telefono-schermo" id="cf-tel-prima"></div>
        </div>
        <div class="cf-telefono cf-telefono-dopo">
          <p class="cf-telefono-titolo cf-titolo-dopo">Dopo <span>la proposta, dal vivo</span></p>
          <div class="cf-telefono-stato"><span>9:41</span><i></i><span>●●●</span></div>
        </div>
      </div>

      <div class="cf-schermo" id="cf-schermo"></div>

      <!-- foto a pagina intera che scorrono insieme: Affiancati, Solo prima, e i due telefoni su schermo stretto -->
      <div class="cf-foto" id="cf-foto">
        <div class="cf-foto-testa">
          <p class="cf-foto-et cf-et-prima"><span class="cf-et-nome">Prima</span><span class="cf-et-sotto">il sito di oggi</span></p>
          <div class="cf-foto-et cf-et-dopo">
            <p><span class="cf-et-nome">Dopo</span><span class="cf-et-sotto">la proposta</span></p>
            <button class="cf-vivo" id="cf-vivo" type="button"><span class="cf-vivo-lungo">Prova dal vivo</span><span class="cf-vivo-corto">Dal vivo</span>
              <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M4 10h11m-4.5-4.5L15 10l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
        </div>
        <div class="cf-colonne" id="cf-colonne" aria-hidden="true">
          <div class="cf-col"><div class="cf-col-slot" id="cf-col-0"></div></div>
          <div class="cf-col"><div class="cf-col-slot" id="cf-col-1"></div></div>
          <span class="cf-guida" id="cf-guida"></span>
        </div>
        <div class="cf-scorre" id="cf-scorre" tabindex="0" role="region" aria-label="Fotografie del sito di prima e di quello nuovo: scorri per vederle insieme"><div class="cf-scorre-spazio" id="cf-spazio"></div></div>
      </div>

      <div class="cf-carica" id="cf-carica" aria-hidden="true"><span></span></div>
      <div class="cf-suggerimento" id="cf-suggerimento" role="status"></div>
    </div>

    <p class="cf-nascosto" id="cf-annuncio" aria-live="polite"></p>
    <span class="cf-sentinella" tabindex="0" data-cf-verso="inizio"></span>
  </div>
</div>
